      <p class="small muted">First mark anyone who isn't at the game. Then set the batting order and positions: choose a player in any spot to swap them (bench players too), pick a position to swap positions, or use the arrows. Substitutions can also be made during the game.</p>
      <div class="cols">${side(0)}${side(1)}</div>
    </div>
    <button class="btn btn-green btn-block" data-act="sk-start" data-id="${g.id}">Start game</button>`;
}

function editLineup(el, fn) {
  const g = W.gameById[el.dataset.g];
  const setup = cloneSetup(draftSetup(g));
  fn(setup, Number(el.dataset.t), Number(el.dataset.i));
  S.lineups[g.id] = setup;
  save();
  render();
}
CHANGE["lu-player"] = (el) =>
  editLineup(el, (setup, t, i) => {
    const pid = el.value;
    const slot = setup.lineups[t][i];
    const j = setup.lineups[t].findIndex((x) => x.pid === pid);
    if (j >= 0) [setup.lineups[t][j].pid, slot.pid] = [slot.pid, pid];
    else {
      setup.bench[t] = setup.bench[t].map((b) => (b === pid ? slot.pid : b));
      slot.pid = pid;
    }
  });
CHANGE["lu-pos"] = (el) =>
  editLineup(el, (setup, t, i) => {
    const slot = setup.lineups[t][i];
    const other = setup.lineups[t].find((x) => x.pos === el.value);
    if (other) other.pos = slot.pos;
    slot.pos = el.value;
  });
ACT["lu-move"] = (el) =>
  editLineup(el, (setup, t, i) => {
    const j = i + Number(el.dataset.d);
    const l = setup.lineups[t];
    if (j < 0 || j >= l.length) return;
    [l[i], l[j]] = [l[j], l[i]];
  });
ACT["lu-absent"] = (el) => {
  const g = W.gameById[el.dataset.g];
  const t = Number(el.dataset.t);
  const pid = el.dataset.pid;
  const cur = draftSetup(g).absent || [[], []];
  const absent = [[...cur[0]], [...cur[1]]];
  absent[t] = absent[t].includes(pid) ? absent[t].filter((x) => x !== pid) : [...absent[t], pid];
  const players = playersForGame(g);
  if (players.filter((p) => p.team === (t ? g.home : g.away) && !absent[t].includes(p.id)).length < 8) return toast("A team needs at least 8 players.");
  S.lineups[g.id] = E.setupFor(g, players, absent);
  save();
  render();
};
ACT["lu-reset"] = (el) => {
  delete S.lineups[el.dataset.g];
  save();
  render();
};

const currentGame = () => {
  const g = W.gameById[parseRoute().parts[1]];
  return g ? localGame(g) : g;
};

function pushEvent(ev, msg) {
  const g = currentGame();
  if (!g) return;
  if (S.offline) {
    S.pending[g.id] = [...(S.pending[g.id] || []), ev];
    save();
    closeSheet();
    SK = null;
    render();
    toast("Saved on this phone. It will send when there's a signal.");
    return;
  }
  const wasFinal = g.status === "final";
  g.events = [...g.events, ev];
  const rep = E.replay({ setup: g.setup, events: g.events }, W.rules, W.names);
  const status = rep.status === "final" ? "final" : "live";
  saveGame(g, { events: g.events, status });
  if (status === "final" && g.type === "playoff") {
    advancePlayoffs();
    save();
    build();
  }
  closeSheet();
  SK = null;
  render();
  if (!wasFinal && status === "final") toast(g.type === "playoff" ? "Final. The bracket has been updated." : "Final. Standings and stats have been updated.");
  else if (msg) toast(msg);
}

/** Sends plays saved while there was no signal (the site retries every few seconds). */
function flushPending() {
  let sent = 0;
  for (const [gid, evs] of Object.entries(S.pending)) {
    const g = W.gameById[gid];
    if (!g || !evs.length) continue;
    const events = [...(g.events || []), ...evs];
    const rep = E.replay({ setup: g.setup, events }, W.rules, W.names);
    S.games[gid] = { setup: g.setup, events, status: rep.status === "final" ? "final" : "live", manual: null };
    sent += evs.length;
  }
  S.pending = {};
  save();
  build();
  return sent;
}
CHANGE["offline"] = (el) => {
  S.offline = el.checked;
  if (!S.offline) {
    const n = flushPending();
    render();
    toast(n ? `Back online. Sent ${n} saved play${n === 1 ? "" : "s"}.` : "Back online.");
    return;
  }
  save();
  render();
  toast("No signal. Keep scoring; plays are saved on this phone.");
};
ACT["sk-start"] = (el) => {
  const g = W.gameById[el.dataset.id];
  saveGame(g, { setup: draftSetup(g), events: [], status: "live" });
  render();
  toast("Game started.");
};
ACT["sk-pitch"] = (el) => pushEvent({ t: "pitch", r: el.dataset.r });
ACT["sk-hbp"] = () => pushEvent({ t: "hbp" });
ACT["sk-undo"] = (el) => {
  const g = W.gameById[el.dataset.id];
  if (g && S.pending[g.id]?.length) {
    S.pending[g.id] = S.pending[g.id].slice(0, -1);
    save();
    render();
    return toast("Undid the last saved play.");
  }
  if (!g || !g.events.length) return;
  const last = g.events[g.events.length - 1];
  const events = g.events.slice(0, -1);
  const rep = E.replay({ setup: g.setup, events }, W.rules, W.names);
  saveGame(g, { events, status: rep.status === "final" ? "final" : "live" });
  if (g.type === "playoff") {
    advancePlayoffs();
    save();
    build();
  }
  render();
  toast(`Undid: ${eventLabel(last)}`);
};

/* ---- ball in play: where + how → result → fielders → runners */
ACT["sk-inplay"] = () => {
  SK = { kind: "play", step: "where", loc: null, bb: null, result: null, fielders: [], moves: null };
  openSheet(inPlaySheet);
};
function inPlaySheet() {
  if (!SK) return "";
  const s = currentGame().rep;
  if (SK.step === "where") {
    const dot = SK.loc ? [{ x: SK.loc[0], y: SK.loc[1], color: "#ffc93c", r: 3 }] : [];
    return `<h2 class="h2">Where was it hit?</h2><p class="small muted" style="margin:4px 0 10px">Tap the spot on the field, then pick how ${esc(nameOf(s.batter))} hit it.</p>
      <div class="field-wrap" data-act="sk-tapfield">${fieldSvg({ dots: dot, id: "tapfield", tap: true, labels: true })}</div>
      <div class="bb-grid">${Object.entries(E.BB_TYPES).map(([k, l]) => `<button class="${SK.bb === k ? "on" : ""}" data-act="sk-bb" data-k="${k}">${l}</button>`).join("")}</div>
      <label class="switch card" style="margin-top:10px" data-tour="sk-hard"><span><b>Hard hit</b><br/><span class="small muted">Hit hard, whatever happened. Line drives are checked for you. Used for hard-hit % and quality at-bats.</span></span><input type="checkbox" data-change="sk-hh" ${SK.hh ? "checked" : ""}></label>
      <div class="row" style="margin-top:14px"><button class="btn btn-secondary" data-act="close-sheet">Cancel</button><button class="btn btn-primary grow" data-act="sk-where-next" ${SK.loc && SK.bb ? "" : "disabled"}>Next</button></div>`;
  }
  if (SK.step === "result") {
    const outCode = E.OUT_FOR[SK.bb];
    const ok = {
      DP: s.bases[0] && s.outs < 2 && SK.bb === "G",
      SF: s.bases[2] && s.outs < 2 && (SK.bb === "F" || SK.bb === "L"),
      SAC: s.bases.some(Boolean) && s.outs < 2 && SK.bb === "B",
      FC: s.bases.some(Boolean),
    };
    const btn = (k, cls = "", label = E.RESULTS[k].label) => `<button class="${cls}" data-act="sk-result" data-r="${k}" ${k in ok && !ok[k] ? "disabled" : ""}>${label}</button>`;
    return `<h2 class="h2">What happened?</h2><p class="small muted" style="margin:4px 0 12px">${E.BB_TYPES[SK.bb]} to ${E.FIELD_NAME[E.nearestFielder(...SK.loc)]}.</p>
      <p class="small bold muted">HIT</p><div class="res-grid" style="margin:6px 0 14px">${["1B", "2B", "3B", "HR"].map((k) => btn(k, "hit")).join("")}</div>
      <p class="small bold muted">OUT</p><div class="res-grid" style="margin:6px 0 14px">${btn(outCode, "out")}${btn("DP", "out")}${btn("SF", "out")}${btn("SAC", "out")}</div>
      <p class="small bold muted">SAFE ON</p><div class="res-grid" style="margin-top:6px">${btn("E")}${btn("FC")}</div>
      <div class="row" style="margin-top:14px"><button class="btn btn-secondary grow" data-act="sk-back">Back</button></div>`;
  }
  if (SK.step === "fielders") {
    const res = E.RESULTS[SK.result];
    return `<h2 class="h2">${res.label}: ${SK.result === "E" ? "E" : ""}${SK.fielders.join("-") || "?"}</h2>
      <p class="small muted" style="margin:4px 0 12px">${SK.result === "E" ? "Who made the error? " : "We guessed from where it was hit. "}${res.multi ? "Tap fielders in order to change it (e.g. SS then 1B = 6-3)." : "Tap a fielder to change it."}</p>
      <div class="pos-grid">${[7, 8, 9, 5, 6, 4, 1, 2, 3].map((n) => `<button data-act="sk-fielder" data-n="${n}" class="${SK.fielders.includes(n) ? "on" : ""}">${n}<small>${E.posOf(n)}</small></button>`).join("")}</div>
      <div class="row" style="margin-top:14px"><button class="btn btn-secondary" data-act="sk-back">Back</button>${res.multi ? `<button class="btn btn-secondary" data-act="sk-fclear">Clear</button>` : ""}<button class="btn btn-primary grow" data-act="sk-fdone" ${SK.fielders.length ? "" : "disabled"}>Next</button></div>`;
  }
  return runnerSheet();
}
ACT["sk-tapfield"] = (el, e) => {
  const svgEl = document.getElementById("tapfield");
  const r = svgEl.getBoundingClientRect();
  const x = Math.round(((e.clientX - r.left) / r.width) * 100);
  const y = Math.round(((e.clientY - r.top) / r.height) * 100);
  SK.loc = [Math.max(1, Math.min(99, x)), Math.max(1, Math.min(99, y))];
  // Guess the type from where it landed; the scorekeeper can change it.
  if (!SK.bb) {
    SK.bb = y > 52 ? "G" : y > 34 ? "L" : "F";
    SK.hh = SK.bb === "L";
  }
  paintSheet();
};
CHANGE["sk-hh"] = (el) => {
  SK.hh = el.checked;
};
ACT["sk-bb"] = (el) => {
  SK.bb = el.dataset.k;
  SK.hh = SK.bb === "L";
  paintSheet();
};
ACT["sk-where-next"] = () => {
  SK.step = "result";
  paintSheet();
};
function guessFielders(result, loc) {
  const first = E.nearestFielder(...loc);
  if (result === "GO" || result === "BO" || result === "SAC") return first === 3 ? [3] : [first, 3];
  if (result === "DP") return [first, first === 4 ? 6 : 4, 3];
  if (result === "FC") return [first, first === 6 || first === 5 ? 4 : 6];
  return [first];
}
ACT["sk-result"] = (el) => {
  SK.result = el.dataset.r;
  const res = E.RESULTS[SK.result];
  SK.fielders = guessFielders(SK.result, SK.loc);
  if (res.hit) {
    ACT["sk-fdone"]();
    return;
  }
  SK.step = "fielders";
  SK.edited = false;
  paintSheet();
};
ACT["sk-fielder"] = (el) => {
  const n = Number(el.dataset.n);
  if (!E.RESULTS[SK.result].multi) SK.fielders = [n];
  else {
    if (!SK.edited) SK.fielders = [];
    SK.fielders.push(n);
  }
  SK.edited = true;
  paintSheet();
};
ACT["sk-fclear"] = () => {
  SK.fielders = [];
  SK.edited = true;
  paintSheet();
};
ACT["sk-fdone"] = () => {
  const s = currentGame().rep;
  SK.step = "runners";
  SK.moves = E.defaultMoves(s.bases, SK.result);
  paintSheet();
};
ACT["sk-back"] = () => {
  if (SK.kind === "runner") SK.runnerKind = null;
  else if (SK.step === "runners") SK.step = E.RESULTS[SK.result].hit ? "result" : "fielders";
  else if (SK.step === "fielders") SK.step = "result";
  else if (SK.step === "result") SK.step = "where";
  SK.err = null;
  paintSheet();
};

function runnerSheet() {
  const s = currentGame().rep;
  const rows = [];
  [3, 2, 1].forEach((b) => s.bases[b - 1] && rows.push([b, s.bases[b - 1].pid]));
  if (SK.kind === "play") rows.push(["B", s.batter]);
  const label = { B: "Batter", 1: "On 1st", 2: "On 2nd", 3: "On 3rd" };
  const dests = [[1, "1st"], [2, "2nd"], [3, "3rd"], [4, "Home"], ["X", "Out"]];
  const title = SK.kind === "play" ? `${E.RESULTS[SK.result].label}${SK.fielders.length && !E.RESULTS[SK.result].hit ? ` (${SK.result === "E" ? "E" : ""}${SK.fielders.join("-")})` : ""}` : { SB: "Stolen base", CS: "Caught stealing", WP: "Wild pitch", PB: "Passed ball", PK: "Pickoff" }[SK.runnerKind];
  return `<h2 class="h2">Where did everyone end up?</h2><p class="small muted" style="margin:4px 0 8px">${esc(title)}. We filled in the usual result, so tap to change anything.</p>
    <div class="card pad" style="padding-top:4px;padding-bottom:4px">${rows
      .map(([from, pid]) => {
        const cur = SK.moves[from] ?? (from === "B" ? 1 : from);
        const min = from === "B" ? 1 : from;
        return `<div class="runner-row"><div class="row between"><b>${esc(nameOf(pid))}</b><span class="small muted">${label[from]}</span></div>
          <div class="dest">${dests.map(([d, l]) => `<button data-act="sk-move" data-from="${from}" data-to="${d}" class="${cur === d ? "on" : ""} ${d === "X" ? "out" : d === 4 ? "home" : ""}" ${d !== "X" && d < min ? "disabled" : ""}>${l}</button>`).join("")}</div></div>`;
      })
      .join("")}</div>
    ${SK.err ? `<p class="notice bad" style="margin-top:10px">${esc(SK.err)}</p>` : ""}
    <div class="row" style="margin-top:14px"><button class="btn btn-secondary" data-act="sk-back">Back</button><button class="btn btn-green grow" data-act="sk-save">Save play</button></div>`;
}
ACT["sk-move"] = (el) => {
  const from = el.dataset.from === "B" ? "B" : Number(el.dataset.from);
  const to = el.dataset.to === "X" ? "X" : Number(el.dataset.to);
  SK.moves = { ...SK.moves, [from]: to };
  SK.err = null;
  paintSheet();
};
ACT["sk-save"] = () => {
  const s = currentGame().rep;
  const occupied = {};
  const froms = [...[1, 2, 3].filter((b) => s.bases[b - 1]), ...(SK.kind === "play" ? ["B"] : [])];
  for (const f of froms) {
    const to = SK.moves[f] ?? (f === "B" ? 1 : f);
    if (to !== "X" && to !== 4) {
      if (occupied[to]) {
        SK.err = "Two runners can't be on the same base.";
        return paintSheet();
      }
      occupied[to] = true;
    }
  }
  if (SK.kind === "play") {
    const f = SK.fielders.length ? (SK.result === "E" ? "E" : "") + SK.fielders.join("-") : "";
    pushEvent({ t: "play", r: SK.result, f, m: SK.moves, bb: SK.bb, loc: SK.loc, hh: !!SK.hh });
  } else pushEvent({ t: "runner", k: SK.runnerKind, m: SK.moves });
};

/* ---- runner events between pitches */
ACT["sk-runners"] = () => {
  SK = { kind: "runner", runnerKind: null, moves: {} };
  openSheet(() => {
    if (!SK) return "";
    if (!SK.runnerKind) {
      return `<h2 class="h2">Runner play</h2><p class="small muted" style="margin:4px 0 12px">Something happened between pitches?</p>
        <div class="res-grid">${[["SB", "Stolen base"], ["WP", "Wild pitch"], ["PB", "Passed ball"], ["CS", "Caught stealing"], ["PK", "Picked off"]].map(([k, l]) => `<button data-act="sk-rkind" data-k="${k}">${l}</button>`).join("")}</div>
        <button class="btn btn-secondary btn-block" style="margin-top:14px" data-act="close-sheet">Cancel</button>`;
    }
    return runnerSheet();
  });
};
ACT["sk-rkind"] = (el) => {
  const s = currentGame().rep;
  const k = el.dataset.k;
  SK.runnerKind = k;
  const occ = [3, 2, 1].filter((b) => s.bases[b - 1]);
  const m = {};
  occ.forEach((b) => (m[b] = b));
  if (k === "WP" || k === "PB") occ.forEach((b) => (m[b] = b + 1));
  else if (k === "SB") {
    const lead = occ.find((b) => b === 3 || !s.bases[b]);
    if (lead) m[lead] = lead + 1;
  } else m[occ[0]] = "X";
  SK.moves = m;
  paintSheet();
};

/* ---- lineup, subs, pitching change */
let lineupTeam = null;
ACT["sk-lineup"] = () => {
  lineupTeam = 1 - currentGame().rep.half;
  SK = null;
  openSheet(lineupSheet);
};
function lineupSheet() {
  const g = currentGame();
  const s = g.rep;
  const t = lineupTeam;
  const team = W.teamById[t ? g.home : g.away];
  if (SK && SK.kind === "sub") {
    const slot = s.lineup[t][SK.slot];
    return `<h2 class="h2">Sub in for ${esc(nameOf(slot.pid))} (${slot.pos})</h2><p class="small muted" style="margin:4px 0 12px">The new player takes over this batting spot and position.</p>
      <div class="card list">${s.bench[t].map((pid) => `<button class="list-item" data-act="sk-dosub" data-pid="${pid}"><b class="grow">${esc(nameOf(pid))}</b><span class="small muted">${esc(posLabel(W.playerById[pid]))}</span></button>`).join("") || '<p class="pad muted">Nobody on the bench.</p>'}</div>
      <button class="btn btn-secondary btn-block" style="margin-top:12px" data-act="sk-subcancel">Back</button>`;
  }
  return `<div class="seg">${[0, 1].map((x) => `<button class="${x === t ? "on" : ""}" data-act="sk-lteam" data-t="${x}">${esc(W.teamById[x ? g.home : g.away].name)}</button>`).join("")}</div>
    <p class="small muted" style="margin:10px 0">Batting order for ${esc(team.name)}. <b>Sub</b> brings in a bench player. <b>Pitch</b> makes someone the new pitcher.</p>
    <div class="card list">${s.lineup[t]
      .map((x, i) => `<div class="list-item"><span class="small bold muted" style="width:16px">${i + 1}</span><div class="grow"><b>${esc(nameOf(x.pid))}</b><div class="tiny muted">${x.pos}${s.pit[x.pid] ? ` · ${s.pit[x.pid].P} pitches` : ""}</div></div>
        ${x.pos !== "P" ? `<button class="btn btn-sm btn-secondary" data-act="sk-makep" data-pid="${x.pid}">Pitch</button>` : '<span class="pill pill-soft">Pitcher</span>'}
        <button class="btn btn-sm btn-secondary" data-act="sk-sub" data-slot="${i}" ${s.bench[t].length ? "" : "disabled"}>Sub</button></div>`)
      .join("")}</div>
    <p class="small bold muted" style="margin-top:12px">BENCH</p><p class="small">${s.bench[t].map((pid) => esc(nameOf(pid))).join(", ") || "Nobody"}</p>
    <button class="btn btn-secondary btn-block" style="margin-top:12px" data-act="close-sheet">Done</button>`;
}
ACT["sk-lteam"] = (el) => {
  lineupTeam = Number(el.dataset.t);
  paintSheet();
};
ACT["sk-sub"] = (el) => {
  SK = { kind: "sub", slot: Number(el.dataset.slot) };
  paintSheet();
};
ACT["sk-subcancel"] = () => {
  SK = null;
  paintSheet();
};
ACT["sk-dosub"] = (el) => pushEvent({ t: "sub", team: lineupTeam, slot: SK.slot, pid: el.dataset.pid }, "Substitution made.");
ACT["sk-makep"] = (el) => pushEvent({ t: "pos", team: lineupTeam, pid: el.dataset.pid, pos: "P" }, "New pitcher. Their pitch count starts now.");

ACT["sk-end"] = () => {
  const g = currentGame();
  const [a, h] = g.score;
  const tieBlocked = a === h && (g.type === "playoff" || !W.rules.tiesAllowed);
  openSheet(
    () => `<h2 class="h2">End the game now?</h2><p class="muted" style="margin:6px 0 14px">Use this for time limits or weather. Games also end on their own after ${W.rules.innings} innings, on a walk-off, or by the mercy rule.</p>
    <div class="card pad center"><p class="h1 num">${esc(W.teamById[g.away].abbr)} ${a} – ${h} ${esc(W.teamById[g.home].abbr)}</p>${a === h ? `<p class="small muted">This would be a tie.</p>` : ""}</div>
    ${tieBlocked ? `<p class="notice bad" style="margin-top:12px">Playoff games can't end in a tie.</p>` : `<button class="btn btn-danger btn-block" style="margin-top:14px" data-act="sk-doend">Yes, it's final</button>`}
    <button class="btn btn-secondary btn-block" style="margin-top:10px" data-act="close-sheet">Keep scoring</button>`,
  );
};
ACT["sk-doend"] = () => pushEvent({ t: "end", reason: "Time limit" });

// ---- app-fantasy.js
/* ---------------------------------------------------------------- fantasy: the site's rules
 * Points leagues, snake drafts, 9 starters + bench, lineups lock weekly (Monday 12:00 am),
 * free agents, trades, an activity log, and bringing a league back next season with keepers.
 * Points come from HLL.scoreLeague, the same code the site runs.
 */
const OWNERS = ["Dan Russo", "Mike Chen", "Laura Patel", "Chris Walsh", "Jen Morales", "Tony Kim", "Sam Keane", "Rachel Diaz", "Nick Ortiz", "Beth Hale", "Paul Grant"];
const TEAM_NAMES = ["Mile Square Mashers", "Sinatra Sluggers", "Washington St. Wallops", "Path Train Pitchers", "Castle Point Crushers", "Elysian Fielders", "Hudson River Hackers", "Stevens Stealers", "Pier C Popups", "Church Square Chuckers", "Waterfront Whiffers"];
const defaultScoring = () => JSON.parse(JSON.stringify(HLL.DEFAULT_SCORING));
const iso = (t) => new Date(t).toISOString();

function newLeague({ id, name, season, size, myIndex, isPublic, code = null, seed, myTeam, commissioner }) {
  const teams = [];
  for (let i = 0, k = 0; teams.length < size - 1; i++, k++) {
    const nm = TEAM_NAMES[(i + seed) % TEAM_NAMES.length];
    if (nm === myTeam || teams.some((t) => t.name === nm)) continue;
    teams.push({ id: `${id}-t${teams.length + 1}`, name: nm, owner: OWNERS[(k + seed) % OWNERS.length] });
  }
  teams.splice(myIndex, 0, { id: `${id}-me`, name: myTeam, owner: S.account.name, mine: true });
  return { id, name, season, size, public: isPublic, code, seed, teams, commissioner: commissioner || S.account.name, scoring: defaultScoring(), keepers: 0, draft: { status: "pre", order: teams.map((t) => t.id), picks: [], doneAt: null }, rows: [], trades: [], log: [] };
}

/* ---- points */
const lastSeason = (L) => (L.season === CUR.id ? PAST.id : L.season === NEXT.id ? CUR.id : null);
/** Points so far this season, game by game (the same way team points are counted). */
function seasonPoints(L) {
  const scored = W.scoredBy[L.season] || [];
  if (!scored.length) return new Map(statsOf(L.season).map((s) => [s.player_id, { bat: HLL.points(HLL.fromImportedBat(s), L.scoring.bat), pit: HLL.points(HLL.fromImportedPit(s), L.scoring.pit) }]));
  const out = new Map();
  for (const g of scored) {
    for (const [pid, b] of Object.entries(g.state.bat)) {
      const x = out.get(pid) || { bat: 0, pit: 0 };
      x.bat += HLL.points(HLL.fromBatLine(b), L.scoring.bat);
      out.set(pid, x);
    }
    for (const [pid, q] of Object.entries(g.state.pit)) {
      const x = out.get(pid) || { bat: 0, pit: 0 };
      x.pit += HLL.points(HLL.fromPitLine(q), L.scoring.pit);
      out.set(pid, x);
    }
  }
  return out;
}
function projections(L) {
  const now = seasonPoints(L);
  const last = new Map((lastSeason(L) ? statsOf(lastSeason(L)) : []).map((s) => [s.player_id, { bat: HLL.points(HLL.fromImportedBat(s), L.scoring.bat), pit: HLL.points(HLL.fromImportedPit(s), L.scoring.pit) }]));
  const zero = { bat: 0, pit: 0 };
  const out = new Map();
  for (const p of fantasyPool(L)) {
    const r = { now: now.get(p.id) || zero, last: last.get(p.id) || zero };
    out.set(p.id, { proj: HLL.projectionOf(r), value: HLL.rankValue(r), now: r.now, last: r.last });
  }
  return out;
}
/** Everyone on a team this season. */
const fantasyPool = (L) => W.allPlayers.filter((p) => W.rosterBy[L.season]?.has(p.id));
function leagueScores(L) {
  if (L.season === PAST.id) {
    // Spring 2026 was before the site: season totals from the spreadsheets for each final starter.
    const pts = new Map(statsOf(PAST.id).map((s) => [s.player_id, HLL.points(HLL.fromImportedBat(s), L.scoring.bat) + HLL.points(HLL.fromImportedPit(s), L.scoring.pit)]));
    return new Map(L.teams.map((t) => {
      const players = new Map();
      let total = 0;
      for (const r of L.rows.filter((r) => r.team_id === t.id && r.end_at == null && r.slot_index < HLL.STARTERS)) {
        const v = pts.get(r.player_id) || 0;
        players.set(r.player_id, { playerId: r.player_id, points: v, games: 0 });
        total += v;
      }
      return [t.id, { teamId: t.id, total, players, byWeek: new Map() }];
    }));
  }
  return HLL.scoreLeague(L.teams.map((t) => t.id), L.rows, W.scoredBy[L.season] || [], L.scoring, L.draft.doneAt ? Date.parse(L.draft.doneAt) : null);
}
function fantasyStandings(L) {
  const sc = leagueScores(L);
  return L.teams.map((team) => ({ team, total: sc.get(team.id)?.total || 0, score: sc.get(team.id) })).sort((a, b) => b.total - a.total);
}

/* ---- rosters over time */
const slotsOf = (L) => HLL.slotsFor(L.size);
const rosterNow = (L, teamId) => L.rows.filter((r) => r.team_id === teamId && r.end_at == null).sort((a, b) => a.slot_index - b.slot_index);
const ownerOf = (L, pid) => L.rows.find((r) => r.player_id === pid && r.end_at == null)?.team_id || null;
const teamById = (L, id) => L.teams.find((t) => t.id === id);
const myTeam = (L) => L.teams.find((t) => t.mine);
function setRow(L, teamId, pid, slot, at) {
  L.rows.push({ team_id: teamId, player_id: pid, slot_index: slot, start_at: iso(at), end_at: null });
}
function endRow(L, pid, at) {
  const row = L.rows.find((r) => r.player_id === pid && r.end_at == null);
  if (row) row.end_at = iso(at);
  return row;
}
function logMove(L, at, text) {
  L.log.unshift({ at: iso(at), text });
}
const seasonOver = (L) => L.season === PAST.id || (L.season === W.season.id ? W.games.length > 0 && W.games.every((g) => g.status === "final" || g.status === "canceled") && !!champion() : L.season !== W.season.id);

/* ---- draft */
const totalPicks = (L) => L.size * slotsOf(L).length;
/** Lowest pick number nobody has used (keepers already hold theirs). */
function nextPick(L) {
  const used = new Set(L.draft.picks.map((p) => p.n));
  const max = Math.min(totalPicks(L), fantasyPool(L).length);
  for (let n = 0; n < totalPicks(L); n++) if (!used.has(n)) return L.draft.picks.length >= max ? null : n;
  return null;
}
const teamOnClock = (L) => {
  const n = nextPick(L);
  return n == null ? null : L.draft.order[HLL.pickOwner(n, L.size)];
};
function filledFor(L, teamId) {
  const filled = slotsOf(L).map(() => false);
  for (const p of L.draft.picks.filter((x) => x.team === teamId)) filled[p.slot] = true;
  return filled;
}
function makePick(L, pid, at = Date.now()) {
  const n = nextPick(L);
  const team = L.draft.order[HLL.pickOwner(n, L.size)];
  const slot = HLL.openSlot(filledFor(L, team), slotsOf(L));
  L.draft.picks.push({ n, team, pid, slot });
  if (nextPick(L) == null) finishDraft(L, at);
}
function cpuPicks(L, { me = false, at = Date.now() } = {}) {
  const proj = projections(L);
  const projMap = new Map([...proj].map(([id, v]) => [id, v.proj]));
  for (let guard = 0; guard < 500 && L.draft.status === "drafting"; guard++) {
    const team = teamOnClock(L);
    if (team == null) break;
    if (!me && teamById(L, team).mine) break;
    const taken = new Set(L.draft.picks.map((p) => p.pid));
    const avail = fantasyPool(L).filter((p) => !taken.has(p.id));
    const pick = HLL.autopick(avail, filledFor(L, team), slotsOf(L), projMap);
    if (!pick) break;
    makePick(L, pick.id, at);
  }
}
function finishDraft(L, at) {
  L.draft.status = "done";
  L.draft.doneAt = iso(at);
  L.rows = L.draft.picks.map((p) => ({ team_id: p.team, player_id: p.pid, slot_index: p.slot, start_at: iso(at), end_at: null }));
  logMove(L, at, "The draft is done. Lineups lock every Monday at 12:00 am.");
}
function startDraft(L, at = Date.now()) {
  L.draft.status = "drafting";
  // Keepers go in each team's last rounds.
  const slots = slotsOf(L).length;
  for (const [teamId, pids] of Object.entries(L.keeperPicks || {}))
    pids.forEach((pid, k) => {
      const round = slots - pids.length + k;
      const pos = L.draft.order.indexOf(teamId);
      const n = round * L.size + (round % 2 ? L.size - 1 - pos : pos);
      L.draft.picks.push({ n, team: teamId, pid, slot: -1, keeper: true });
    });
  // Keepers take the last open spots on the roster.
  for (const teamId of L.draft.order) {
    const mine = L.draft.picks.filter((p) => p.team === teamId && p.keeper);
    mine.forEach((p, i) => (p.slot = slots - mine.length + i));
  }
  logMove(L, at, "The draft started.");
}

/* ---- the leagues the demo starts with */
function initialFantasy() {
  const w = W.weeks;
  const t0 = w.length ? w[0].start - 2 * DAY : NOW - 40 * DAY;
  // Hoboken Sluggers: drafted before the season, a few weeks of moves.
  const L1 = newLeague({ id: "L1", name: "Hoboken Sluggers", season: CUR.id, size: 8, myIndex: 3, isPublic: true, seed: 3, myTeam: "Burks Bombers", commissioner: "Dan Russo" });
  L1.draft.order = L1.teams.map((t) => t.id);
  L1.draft.status = "drafting";
  cpuPicks(L1, { me: true, at: t0 });
  seedMoves(L1);
  // Coaches' Pool: you're the commissioner and the draft hasn't started.
  const L2 = newLeague({ id: "L2", name: "Coaches' Pool", season: CUR.id, size: 6, myIndex: 2, isPublic: false, code: "COACH6", seed: 5, myTeam: "Hoboken Heat" });
  // Dugout Dads: last season's league, finished. Bring it back with keepers.
  const L3 = newLeague({ id: "L3", name: "Dugout Dads", season: PAST.id, size: 6, myIndex: 0, isPublic: false, code: "DADS26", seed: 7, myTeam: "Burks Bombers" });
  L3.draft.status = "drafting";
  cpuPicks(L3, { me: true, at: NOW - 200 * DAY });
  return { leagues: [L1, L2, L3], open: [{ id: "O1", name: "Weekend Warriors", size: 8, filled: 5 }, { id: "O2", name: "Bleacher Parents", size: 6, filled: 3 }] };
}

/** A few weeks of moves in Hoboken Sluggers, so the activity log, history and a pending trade have something to show. */
function seedMoves(L) {
  const wk = (n, days) => (W.weeks[n] ? W.weeks[n].start + days * DAY : NOW - (5 - n) * 7 * DAY);
  const me = myTeam(L).id;
  const other = L.teams[1].id;
  const proj = projections(L);
  const val = (pid) => proj.get(pid)?.value || 0;
  // Week 2: a free-agent pickup.
  const free = fantasyPool(L).filter((p) => !ownerOf(L, p.id)).sort((a, b) => val(b.id) - val(a.id));
  const t2 = L.teams[4].id;
  const worst = rosterNow(L, t2).filter((r) => r.slot_index >= HLL.STARTERS).sort((a, b) => val(a.player_id) - val(b.player_id))[0];
  if (free[0] && worst && wk(1, 1) < NOW) {
    const at = wk(1, 1);
    endRow(L, worst.player_id, at);
    setRow(L, t2, free[0].id, worst.slot_index, at);
    logMove(L, at, `${teamById(L, t2).name} added ${nameOf(free[0].id)} and dropped ${nameOf(worst.player_id)}.`);
  }
  // Week 3: you moved a bench player into the lineup.
  const mine = rosterNow(L, me);
  const benchBest = mine.filter((r) => r.slot_index >= HLL.STARTERS).sort((a, b) => val(b.player_id) - val(a.player_id))[0];
  const startWorst = mine.filter((r) => r.slot_index < HLL.STARTERS).sort((a, b) => val(a.player_id) - val(b.player_id))[0];
  if (benchBest && startWorst && wk(2, 2) < NOW) swapRows(L, me, benchBest.player_id, startWorst.player_id, wk(2, 2));
  // Week 4: a trade that went through, and one that was declined.
  const a = rosterNow(L, me).find((r) => r.slot_index === 5);
  const b = rosterNow(L, L.teams[5].id).find((r) => r.slot_index === 6);
  if (a && b && wk(3, 1) < NOW) {
    const tr = { id: "T1", from: me, to: L.teams[5].id, give: [a.player_id], get: [b.player_id], status: "accepted", at: iso(wk(3, 1) - 3600000), decidedAt: iso(wk(3, 1)) };
    L.trades.push(tr);
    applyTrade(L, tr, wk(3, 1));
  }
  const c = rosterNow(L, L.teams[6].id)[0];
  const d = rosterNow(L, me).find((r) => r.slot_index === 2);
  if (c && d) L.trades.push({ id: "T2", from: me, to: L.teams[6].id, give: [d.player_id], get: [c.player_id], status: "declined", at: iso(NOW - 9 * DAY), decidedAt: iso(NOW - 8 * DAY) });
  // An offer waiting for you.
  const theirs = rosterNow(L, other).find((r) => r.slot_index === 4);
  const yours = rosterNow(L, me).find((r) => r.slot_index === 1);
  if (theirs && yours) {
    L.trades.push({ id: "T3", from: other, to: me, give: [theirs.player_id], get: [yours.player_id], status: "pending", at: iso(NOW - 20 * 3600000) });
    logMove(L, NOW - 20 * 3600000, `${teamById(L, other).name} offered ${teamById(L, me).name} a trade.`);
  }
}

function swapRows(L, teamId, a, b, at) {
  const ra = endRow(L, a, at);
  const rb = endRow(L, b, at);
  setRow(L, teamId, a, rb.slot_index, at);
  setRow(L, teamId, b, ra.slot_index, at);
  logMove(L, at, `${teamById(L, teamId).name} moved ${nameOf(a)} to ${rb.slot_index < HLL.STARTERS ? "the lineup" : "the bench"} and ${nameOf(b)} to ${ra.slot_index < HLL.STARTERS ? "the lineup" : "the bench"}.`);
}
function applyTrade(L, tr, at) {
  const slotsA = tr.give.map((pid) => endRow(L, pid, at).slot_index);
  const slotsB = tr.get.map((pid) => endRow(L, pid, at).slot_index);
  tr.get.forEach((pid, i) => setRow(L, tr.from, pid, slotsA[i] ?? freeSlot(L, tr.from), at));
  tr.give.forEach((pid, i) => setRow(L, tr.to, pid, slotsB[i] ?? freeSlot(L, tr.to), at));
  logMove(L, at, `Trade: ${teamById(L, tr.from).name} sent ${tr.give.map(nameOf).join(", ")} to ${teamById(L, tr.to).name} for ${tr.get.map(nameOf).join(", ")}.`);
}
function freeSlot(L, teamId) {
  const used = new Set(rosterNow(L, teamId).map((r) => r.slot_index));
  const slots = slotsOf(L);
  const st = slots.findIndex((s, i) => s === "ST" && !used.has(i));
  return st >= 0 ? st : slots.findIndex((_, i) => !used.has(i));
}

/* ---------------------------------------------------------------- pages */
const leagueById = (id) => S.fantasy.leagues.find((l) => l.id === id);
const isCommish = (L) => L.commissioner === S.account.name;
const weekLabel = (t) => `Mon ${new Date(t).toLocaleDateString(undefined, { month: "short", day: "numeric" })}`;

function viewFantasy(r) {
  if (r.parts[1]) return viewFantasyLeague(r);
  const fz = S.fantasy;
  return `<div class="page-head"><h1 class="h1">Fantasy</h1><p class="muted">Points leagues with our own players. Draft 9 starters and a bench; set your lineup each week.</p></div>
    <section class="stack" data-tour="fantasy-leagues">${sectionHead("My leagues")}<div class="card list">${fz.leagues
      .map((L) => {
        const me = myTeam(L);
        let status = `<span class="tag">${L.draft.status === "drafting" ? "Drafting" : "Pre-draft"}</span>`;
        if (L.draft.status === "done") {
          const st = fantasyStandings(L);
          const pos = st.findIndex((x) => x.team.mine);
          status = `<span class="small num"><b>${ord(pos + 1)}</b> of ${L.size} · ${fmtPts(st[pos].total)} pts</span>`;
        }
        return `<a class="list-item" href="#/fantasy/${L.id}"><div class="grow"><b>${esc(me.name)}</b><div class="small muted">${esc(L.name)} · ${esc(seasonById(L.season).name)} · ${L.size} teams${isCommish(L) ? " · Commissioner" : ""}${seasonOver(L) ? " · Season over" : ""}</div></div>${status}<span class="chev">›</span></a>`;
      })
      .join("")}</div></section>
    <section class="stack" data-tour="fantasy-create">${sectionHead("Find a league")}
      <div class="card list">${fz.open.map((o) => `<div class="list-item"><div class="grow"><b>${esc(o.name)}</b><div class="small muted">Public · ${o.filled} of ${o.size} teams</div></div><button class="btn btn-sm btn-secondary" data-act="f-join" data-id="${o.id}">Join</button></div>`).join("") || `<p class="pad muted">No open leagues.</p>`}</div>
      <div class="row"><button class="btn btn-primary grow" data-act="f-create">Create a league</button><button class="btn btn-secondary grow" data-act="f-code">Join with code</button></div>
    </section>`;
}

function viewFantasyLeague(r) {
  const L = leagueById(r.parts[1]);
  if (!L) return `<p>League not found.</p>`;
  const me = myTeam(L);
  const drafted = L.draft.status === "done";
  const tab = r.parts[2] || (drafted ? "team" : "draft");
  const pending = L.trades.filter((t) => t.status === "pending" && t.to === me.id).length;
  const tabs = drafted
    ? [["team", "Team"], ["standings", "Standings"], ["players", "Players"], ["trades", `Trades${pending ? ` (${pending})` : ""}`], ["activity", "Activity"], ["draft", "Draft"], ["settings", "Settings"]]
    : [["draft", L.draft.status === "drafting" ? "Draft room" : "Draft"], ["teams", "Teams"], ["settings", "Settings"]];
  const views = { team: teamTab, standings: standingsTab, players: playersTab, trades: tradesTab, trade: tradeBuilder, activity: activityTab, draft: draftTab, teams: teamsTab, settings: settingsTab };
  const body = (views[tab] || draftTab)(L, r);
  const over = seasonOver(L);
  return `<a class="link back" href="#/fantasy">‹ Fantasy</a>
    <div class="page-head"><h1 class="h1">${esc(me.name)}</h1><p class="muted">${esc(L.name)} · ${esc(seasonById(L.season).name)} · ${L.size} teams · ${L.public ? "Public" : `Private · code ${esc(L.code)}`} · Commissioner: ${esc(L.commissioner)}</p></div>
    ${over && drafted ? `<p class="notice warn">The ${esc(seasonById(L.season).name)} season is over, so moves are closed. ${isCommish(L) ? `<a class="link" href="#/fantasy/${L.id}/settings">Bring the league back</a> for next season.` : "The commissioner can bring the league back next season."}</p>` : ""}
    <div class="tabs-inline">${tabs.map(([k, l]) => `<a href="#/fantasy/${L.id}/${k}" class="${tab === k || (k === "trades" && tab === "trade") ? "on" : ""}">${l}</a>`).join("")}</div>${body}`;
}

function teamTab(L, r) {
  const me = myTeam(L);
  const team = teamById(L, r.q.team) || me;
  const mine = team.mine;
  const sc = leagueScores(L).get(team.id);
  const proj = projections(L);
  const rows = rosterNow(L, team.id);
  const slots = slotsOf(L);
  const lock = HLL.nextWeekStart(NOW);
  const over = seasonOver(L);
  const line = (row) => {
    const pid = row.player_id;
    const pts = sc?.players.get(pid)?.points || 0;
    const moving = S.fMove === pid && mine;
    return `<div class="list-item ${moving ? "picked" : ""}"><span class="slot">${slots[row.slot_index] === "ST" ? "ST" : "BN"}</span>${badge(teamOf(pid, L.season))}<div class="grow"><a href="#/player/${pid}"><b>${esc(nameOf(pid))}</b></a><div class="tiny muted">${esc(posLabel(W.playerById[pid]))} · ${fmtPts(proj.get(pid)?.now.bat + proj.get(pid)?.now.pit || 0)} pts this season</div></div><b class="num" title="Points while in your starting lineup">${fmtPts(pts)}</b>
      ${mine && !over ? `<button class="btn btn-sm btn-secondary" data-act="f-move" data-l="${L.id}" data-pid="${pid}">${S.fMove ? (moving ? "Cancel" : "Here") : "Move"}</button>` : ""}</div>`;
  };
  return `<div class="row wrap"><div class="chips grow">${L.teams.map((t) => `<a class="chip ${t.id === team.id ? "on" : ""}" href="${withQuery({ team: t.mine ? null : t.id })}">${esc(t.name)}</a>`).join("")}</div></div>
    ${mine && !over ? `<p class="notice" data-tour="fantasy-lock">Lineups lock every Monday at 12:00 am. Changes you make now count starting ${weekLabel(lock)}. Everyone in your 9 starting spots scores both hitting and pitching points; the bench doesn't score.</p>` : ""}
    <div class="card list" data-tour="fantasy-myteam"><div class="list-item small bold muted">Starters</div>${rows.filter((x) => x.slot_index < HLL.STARTERS).map(line).join("")}
      <div class="list-item small bold muted">Bench</div>${rows.filter((x) => x.slot_index >= HLL.STARTERS).map(line).join("") || '<p class="pad small muted">Empty</p>'}
      <div class="list-item total-row"><span class="grow">Season total</span><b class="num">${fmtPts(sc?.total || 0)}</b></div></div>
    ${sc && sc.players.size ? `<details class="card pad small"><summary class="bold">Players no longer on this team</summary><div class="stack-s" style="margin-top:8px">${[...sc.players.values()].filter((p) => !rows.some((x) => x.player_id === p.playerId)).map((p) => `<div class="row between"><span>${esc(nameOf(p.playerId))}</span><b class="num">${fmtPts(p.points)}</b></div>`).join("") || '<p class="muted">Nobody yet.</p>'}</div><p class="tiny muted">Points stay with the team that started a player that week.</p></details>` : ""}`;
}

function standingsTab(L) {
  const st = fantasyStandings(L);
  const weeks = L.season === PAST.id ? [] : W.weeks.filter((w) => w.start <= NOW);
  const cur = HLL.weekOf(W.weeks, NOW);
  return `<div class="card scroll-x" data-tour="fantasy-standings"><table><thead><tr><th>Team</th>${weeks.map((w) => `<th class="${cur?.n === w.n ? "sorted" : ""}">W${w.n}</th>`).join("")}<th>Total</th><th>Back</th></tr></thead><tbody>${st
    .map((x, i) => `<tr class="${x.team.mine ? "mine" : ""}"><td><span class="rank">${i + 1}</span> <a href="#/fantasy/${L.id}/team?team=${x.team.id}"><b>${esc(x.team.name)}</b></a><div class="tiny muted">${esc(x.team.owner)}</div></td>${weeks.map((w) => `<td class="${cur?.n === w.n ? "sorted" : ""}">${fmtPts(x.score?.byWeek.get(w.start) || 0)}</td>`).join("")}<td><b>${fmtPts(x.total)}</b></td><td class="muted">${i ? fmtPts(st[0].total - x.total) : "–"}</td></tr>`)
    .join("")}</tbody></table></div>
    <p class="small muted">${L.season === PAST.id ? "Season totals for each team's final starters." : `Points by week. ${cur ? `Week ${cur.n} is in progress.` : ""} Each game counts for whoever had the player in a starting spot when that week's lineups locked.`}</p>`;
}

function playersTab(L, r) {
  const proj = projections(L);
  const faOnly = r.q.fa !== "0";
  const q = (r.q.q || "").toLowerCase();
  const list = fantasyPool(L)
    .filter((p) => (!faOnly || !ownerOf(L, p.id)) && (!q || p.name.toLowerCase().includes(q)))
    .sort((a, b) => (proj.get(b.id)?.value || 0) - (proj.get(a.id)?.value || 0))
    .slice(0, 40);
  const over = seasonOver(L);
  return `<div class="row wrap"><a class="chip ${faOnly ? "on" : ""}" href="${withQuery({ fa: null })}">Free agents</a><a class="chip ${faOnly ? "" : "on"}" href="${withQuery({ fa: "0" })}">All players</a><input class="input grow" style="max-width:220px" placeholder="Search players" value="${esc(r.q.q || "")}" data-change="f-search" aria-label="Search players"></div>
    <div class="card list" data-tour="fantasy-fa">${list
      .map((p) => {
        const o = ownerOf(L, p.id);
        const pr = proj.get(p.id);
        const right = o ? `<span class="small muted ellipsis" style="max-width:36%">${esc(teamById(L, o).name)}</span>` : over ? "" : `<button class="btn btn-sm btn-secondary" data-act="f-add" data-pid="${p.id}" data-l="${L.id}">Add</button>`;
        return `<div class="list-item">${badge(teamOf(p.id, L.season))}<div class="grow"><a href="#/player/${p.id}"><b>${esc(p.name)}</b></a><div class="tiny muted">${esc(posLabel(p))} · ${fmtPts(pr.now.bat + pr.now.pit)} pts this season · ${fmtPts(pr.last.bat + pr.last.pit)} last season</div></div>${right}</div>`;
      })
      .join("") || `<p class="pad muted">Nobody matches.</p>`}</div>
    <p class="small muted">Free agents can be added any time; they start scoring the next Monday. If your roster is full, you pick someone to drop.</p>`;
}

function tradeLine(L, tr) {
  const from = teamById(L, tr.from);
  const to = teamById(L, tr.to);
  return `<b>${esc(from.name)}</b> gives ${tr.give.map((p) => `<a href="#/player/${p}">${esc(nameOf(p))}</a>`).join(", ")}<br><b>${esc(to.name)}</b> gives ${tr.get.map((p) => `<a href="#/player/${p}">${esc(nameOf(p))}</a>`).join(", ")}`;
}
function tradesTab(L) {
  const me = myTeam(L).id;
  const incoming = L.trades.filter((t) => t.status === "pending" && t.to === me);
  const outgoing = L.trades.filter((t) => t.status === "pending" && t.from === me);
  const others = L.trades.filter((t) => t.status === "pending" && t.from !== me && t.to !== me);
  const past = L.trades.filter((t) => t.status !== "pending");
  const over = seasonOver(L);
  const card = (t, btns) => `<div class="card pad stack-s"><p class="small">${tradeLine(L, t)}</p><div class="row between"><span class="tiny muted">${fmtWhen(t.at)}${t.status !== "pending" ? ` · ${t.status}` : ""}</span><div class="row">${btns}</div></div></div>`;
  return `<div class="row between"><p class="small muted grow">Trades go through when the other team accepts. The commissioner can cancel any trade. Traded players score for their new team starting the next Monday.</p>${over ? "" : `<a class="btn btn-primary btn-sm" href="#/fantasy/${L.id}/trade">Propose a trade</a>`}</div>
    <section class="stack" data-tour="fantasy-trades">${sectionHead("Offers to you")}${incoming.map((t) => card(t, `<button class="btn btn-sm btn-secondary" data-act="f-trade-answer" data-l="${L.id}" data-id="${t.id}" data-yes="0">Decline</button><button class="btn btn-sm btn-green" data-act="f-trade-answer" data-l="${L.id}" data-id="${t.id}" data-yes="1">Accept</button>`)).join("") || `<p class="card pad small muted">No offers right now.</p>`}</section>
    ${sectionHead("Your offers")}${outgoing.map((t) => card(t, `<button class="btn btn-sm btn-secondary" data-act="f-trade-cancel" data-l="${L.id}" data-id="${t.id}">Cancel</button><button class="btn btn-sm btn-secondary" data-act="f-trade-cpu" data-l="${L.id}" data-id="${t.id}">Demo: have them answer</button>`)).join("") || `<p class="card pad small muted">None.</p>`}
    ${others.length && isCommish(L) ? `${sectionHead("Other offers (commissioner)")}${others.map((t) => card(t, `<button class="btn btn-sm btn-danger" data-act="f-trade-cancel" data-l="${L.id}" data-id="${t.id}">Cancel trade</button>`)).join("")}` : ""}
    ${sectionHead("Past trades")}${past.map((t) => card(t, "")).join("") || `<p class="card pad small muted">None yet.</p>`}`;
}
function tradeBuilder(L, r) {
  const me = myTeam(L);
  const them = teamById(L, r.q.with);
  if (!them) return `<h2 class="h2">Propose a trade with…</h2><div class="card list">${L.teams.filter((t) => !t.mine).map((t) => `<a class="list-item" href="#/fantasy/${L.id}/trade?with=${t.id}"><b class="grow">${esc(t.name)}</b><span class="small muted">${esc(t.owner)}</span><span class="chev">›</span></a>`).join("")}</div>`;
  const sel = S.fTrade || { give: [], get: [] };
  const col = (team, key) => `<div class="col">${sectionHead(esc(team.name))}<div class="card list">${rosterNow(L, team.id)
    .map((row) => `<label class="list-item"><input type="checkbox" data-change="f-trade-pick" data-k="${key}" data-pid="${row.player_id}" ${sel[key].includes(row.player_id) ? "checked" : ""}><span class="grow"><b>${esc(nameOf(row.player_id))}</b> <span class="tiny muted">${row.slot_index < HLL.STARTERS ? "Starter" : "Bench"}</span></span></label>`)
    .join("")}</div></div>`;
  return `<a class="link back" href="#/fantasy/${L.id}/trades">‹ Trades</a><h2 class="h2">Trade with ${esc(them.name)}</h2><p class="small muted">Pick who you'd give and who you want. Both rosters have to fit (${slotsOf(L).length} players), so full rosters trade the same number of players.</p>
    <div class="cols">${col(me, "give")}${col(them, "get")}</div>
    <button class="btn btn-primary btn-block" data-act="f-trade-send" data-l="${L.id}" data-with="${them.id}" ${sel.give.length && sel.get.length ? "" : "disabled"}>Send offer</button>`;
}
function activityTab(L) {
  return `<div class="card list" data-tour="fantasy-activity">${L.log.map((x) => `<div class="list-item"><span class="small muted" style="width:92px">${fmtDay(x.at)}</span><span class="grow small">${esc(x.text)}</span></div>`).join("") || `<p class="pad muted">Nothing yet.</p>`}</div><p class="small muted">Every add, drop, trade, lineup move and commissioner change, for the whole league to see.</p>`;
}
function teamsTab(L) {
  return `<div class="card list">${L.draft.order.map((id, i) => { const t = teamById(L, id); return `<div class="list-item"><span class="rank">${i + 1}</span><div class="grow"><b>${esc(t.name)}</b><div class="tiny muted">${esc(t.owner)}</div></div>${t.mine ? '<span class="tag">You</span>' : ""}</div>`; }).join("")}</div><p class="small muted">Draft order for round 1. The order reverses each round (snake).</p>`;
}

function draftTab(L, r) {
  const me = myTeam(L);
  const slots = slotsOf(L);
  if (L.draft.status === "done") {
    const rounds = [];
    [...L.draft.picks].sort((a, b) => a.n - b.n).forEach((p) => (rounds[Math.floor(p.n / L.size)] ||= []).push(p));
    return `<p class="small muted">Snake draft: the order reverses every round. Keepers are marked K.</p><div class="draft-grid">${rounds
      .map((picks, ri) => `<div class="stack-s"><h3 class="h3">Round ${ri + 1}</h3><div class="card list">${picks.map((p) => { const t = teamById(L, p.team); return `<div class="list-item small ${t.mine ? "mine" : ""}"><span class="num muted" style="width:40px">${HLL.pickLabel(p.n, L.size)}</span><span class="grow"><b>${esc(nameOf(p.pid))}</b>${p.keeper ? ' <span class="tag">K</span>' : ""}</span><span class="muted ellipsis" style="max-width:42%">${esc(t.name)}</span></div>`; }).join("")}</div></div>`)
      .join("")}</div>`;
  }
  if (L.draft.status === "pre") {
    const needKeepers = L.keepers && !L.keeperPicks;
    return `<div class="card pad stack-s" data-tour="fantasy-draft"><p><b>${L.size} teams · ${slots.length} rounds · snake order.</b> Each team drafts ${HLL.STARTERS} starters and ${slots.length - HLL.STARTERS} bench players. ${me ? `You pick ${ord(L.draft.order.indexOf(me.id) + 1)} in round 1.` : ""}</p>
      ${L.keepers ? `<p class="small">This league keeps ${L.keepers} player${L.keepers > 1 ? "s" : ""} per team from last season, in each team's last round${L.keepers > 1 ? "s" : ""}.</p>` : ""}
      ${needKeepers ? keeperPicker(L) : isCommish(L) ? `<button class="btn btn-primary btn-block" data-act="f-start" data-l="${L.id}">Start the draft</button>` : `<p class="small muted">Waiting for the commissioner to start the draft.</p>`}</div>`;
  }
  const clock = teamOnClock(L);
  const myTurn = clock === me.id;
  const proj = projections(L);
  const taken = new Set(L.draft.picks.map((p) => p.pid));
  const avail = fantasyPool(L).filter((p) => !taken.has(p.id)).sort((a, b) => (proj.get(b.id)?.value || 0) - (proj.get(a.id)?.value || 0)).slice(0, 40);
  const n = nextPick(L);
  const recent = [...L.draft.picks].filter((p) => !p.keeper).sort((a, b) => b.n - a.n).slice(0, 8);
  const minePicks = L.draft.picks.filter((p) => p.team === me.id);
  return `<div class="card pad stack-s clock ${myTurn ? "on-clock" : ""}" data-tour="fantasy-draft">
      <p class="eyebrow">Round ${Math.floor(n / L.size) + 1} · Pick ${HLL.pickLabel(n, L.size)}</p><p class="h2">${myTurn ? "You're on the clock" : `${esc(teamById(L, clock).name)} is picking`}</p>
      <div class="row">${myTurn ? `<button class="btn btn-secondary btn-sm" data-act="f-autopick" data-l="${L.id}">Pick the best available for me</button>` : ""}<button class="btn btn-secondary btn-sm" data-act="f-auto" data-l="${L.id}">Autodraft the rest</button>${isCommish(L) && L.draft.picks.some((p) => !p.keeper) ? `<button class="btn btn-secondary btn-sm" data-act="f-undo-pick" data-l="${L.id}">Undo last pick (commissioner)</button>` : ""}</div>
    </div>
    <div class="cols"><div class="col">
    ${sectionHead("Best available", `<span class="small muted">This season's points, plus a bit of last season's</span>`)}
    <div class="card list">${avail.map((p) => `<div class="list-item">${badge(teamOf(p.id, L.season))}<div class="grow"><b>${esc(p.name)}</b><div class="tiny muted">${esc(posLabel(p))} · ${fmtPts(proj.get(p.id).value)}</div></div><button class="btn btn-sm btn-primary" data-act="f-pick" data-l="${L.id}" data-pid="${p.id}" ${myTurn ? "" : "disabled"}>Draft</button></div>`).join("")}</div>
    </div><div class="col">
    ${sectionHead("My roster")}
    <div class="card list">${slots.map((sl, i) => { const p = minePicks.find((x) => x.slot === i); return `<div class="list-item"><span class="slot">${sl}</span>${p ? `<b>${esc(nameOf(p.pid))}</b>${p.keeper ? ' <span class="tag">K</span>' : ""}` : '<span class="muted">Empty</span>'}</div>`; }).join("")}</div>
    ${recent.length ? `${sectionHead("Recent picks")}<div class="card list">${recent.map((p) => `<div class="list-item small"><span class="num muted" style="width:40px">${HLL.pickLabel(p.n, L.size)}</span><span class="grow"><b>${esc(nameOf(p.pid))}</b></span><span class="muted ellipsis" style="max-width:45%">${esc(teamById(L, p.team).name)}</span></div>`).join("")}</div>` : ""}
    </div></div>`;
}
function keeperPicker(L) {
  const prev = leagueById(L.renewedFrom);
  const me = myTeam(L);
  const prevMe = myTeam(prev);
  const sel = S.fKeep || [];
  const options = rosterNow(prev, prevMe.id).filter((r) => W.rosterBy[L.season].has(r.player_id));
  return `<div class="stack-s" data-tour="fantasy-keepers"><p class="bold">Choose your keeper${L.keepers > 1 ? "s" : ""} (up to ${L.keepers})</p><div class="card list">${options
    .map((r) => `<label class="list-item"><input type="checkbox" data-change="f-keep" data-pid="${r.player_id}" ${sel.includes(r.player_id) ? "checked" : ""}><b class="grow">${esc(nameOf(r.player_id))}</b><span class="tiny muted">${esc(teamOf(r.player_id, L.season)?.abbr || "")}</span></label>`)
    .join("")}</div><p class="tiny muted">Kids who aged out or left the league can't be kept. The other teams pick theirs too.</p>
    <button class="btn btn-primary btn-block" data-act="f-keep-save" data-l="${L.id}">Save keepers</button></div>`;
  void me;
}

function settingsTab(L) {
  const edit = isCommish(L);
  const row = (group, k, label) => {
    const v = L.scoring[group][k] ?? 0;
    return `<div class="list-item"><span class="grow">${label}${k === "IP" ? ' <span class="tiny muted">(per inning)</span>' : ""}</span>${edit ? `<input class="input pts-input" type="number" step="0.5" value="${v}" data-change="f-score" data-l="${L.id}" data-g="${group}" data-k="${k}" aria-label="${label} points">` : `<b class="num">${v > 0 ? "+" : ""}${v}</b>`}</div>`;
  };
  const over = seasonOver(L);
  const next = L.season === PAST.id ? CUR : L.season === CUR.id && S.turnover ? NEXT : null;
  const renewed = S.fantasy.leagues.some((x) => x.renewedFrom === L.id);

      <button class="btn btn-primary" data-act="f-renew" data-l="${L.id}">Bring it back</button></section>` : ""}
    <p class="small muted">${edit ? "You're the commissioner, so you can change how many points each stat is worth. Changes apply to the whole league right away, including past weeks." : `Only the commissioner (${esc(L.commissioner)}) can change scoring.`}</p>
    <div class="cols" data-tour="fantasy-settings"><div class="col">${sectionHead("Hitting")}<div class="card list">${HLL.BAT_STATS.map(([k, l]) => row("bat", k, l)).join("")}</div></div>
    <div class="col">${sectionHead("Pitching")}<div class="card list">${HLL.PIT_STATS.map(([k, l]) => row("pit", k, l)).join("")}</div></div></div>
    ${edit ? `<button class="btn btn-secondary" data-act="f-reset-scoring" data-l="${L.id}">Reset to default scoring</button>` : ""}
    ${sectionHead("League")}
    <div class="card list small"><div class="list-item"><span class="grow">Format</span><b>Points, season total</b></div><div class="list-item"><span class="grow">Teams</span><b>${L.size}</b></div><div class="list-item"><span class="grow">Roster</span><b>${HLL.STARTERS} starters + ${slotsOf(L).length - HLL.STARTERS} bench</b></div><div class="list-item"><span class="grow">Lineups lock</span><b>Mondays, 12:00 am</b></div><div class="list-item"><span class="grow">Draft</span><b>Snake${L.keepers ? `, ${L.keepers} keeper${L.keepers > 1 ? "s" : ""}` : ""}</b></div>${L.code ? `<div class="list-item"><span class="grow">League code</span><b>${esc(L.code)}</b></div>` : ""}</div>
    ${sectionHead("Your team")}
    <div class="card pad row"><input class="input grow" id="f-rename" value="${esc(myTeam(L).name)}" aria-label="Team name"><button class="btn btn-secondary" data-act="f-rename" data-l="${L.id}">Rename</button></div>
    <button class="btn btn-danger" data-act="f-leave" data-l="${L.id}">${edit ? "Delete league" : "Leave league"}</button>`;
}

/* ---------------------------------------------------------------- actions */
const curLeague = () => leagueById(parseRoute().parts[1]);
const fsave = (msg) => {
  save();
  render();
  if (msg) toast(msg);
};
CHANGE["f-score"] = (el) => {
  const L = leagueById(el.dataset.l);
  const v = Number(el.value);
  if (!Number.isFinite(v)) return;
  L.scoring[el.dataset.g][el.dataset.k] = v;
  logMove(L, Date.now(), `The commissioner changed scoring: ${el.dataset.k} is now worth ${v}.`);
  fsave("Scoring updated for the whole league.");
};
ACT["f-reset-scoring"] = (el) => {
  const L = leagueById(el.dataset.l);
  L.scoring = defaultScoring();
  logMove(L, Date.now(), "The commissioner reset scoring to the defaults.");
  fsave("Scoring reset to the defaults.");
};
CHANGE["f-search"] = (el) => go(withQuery({ q: el.value || null }).slice(2));
ACT["f-start"] = (el) => {
  const L = leagueById(el.dataset.l);
  startDraft(L);
  cpuPicks(L);
  fsave(teamOnClock(L) === myTeam(L).id ? "You're on the clock." : "Draft started.");
};
ACT["f-pick"] = (el) => {
  const L = leagueById(el.dataset.l);
  if (teamOnClock(L) !== myTeam(L).id) return;
  makePick(L, el.dataset.pid);
  cpuPicks(L);
  save();
  if (L.draft.status === "done") {
    go(`fantasy/${L.id}/team`);
    toast("Draft complete.");
  } else fsave(`You drafted ${nameOf(el.dataset.pid)}.`);
};
ACT["f-autopick"] = (el) => {
  const L = leagueById(el.dataset.l);
  const proj = new Map([...projections(L)].map(([id, v]) => [id, v.proj]));
  const taken = new Set(L.draft.picks.map((p) => p.pid));
  const pick = HLL.autopick(fantasyPool(L).filter((p) => !taken.has(p.id)), filledFor(L, myTeam(L).id), slotsOf(L), proj);
  if (pick) ACT["f-pick"]({ dataset: { l: L.id, pid: pick.id } });
};
ACT["f-auto"] = (el) => {
  const L = leagueById(el.dataset.l);
  cpuPicks(L, { me: true });
  save();
  go(`fantasy/${L.id}/team`);
  toast("Draft complete.");
};
ACT["f-undo-pick"] = (el) => {
  const L = leagueById(el.dataset.l);
  const last = [...L.draft.picks].filter((p) => !p.keeper).sort((a, b) => b.n - a.n)[0];
  if (!last) return;
  L.draft.picks = L.draft.picks.filter((p) => p !== last);
  logMove(L, Date.now(), `The commissioner undid pick ${HLL.pickLabel(last.n, L.size)} (${nameOf(last.pid)}).`);
  fsave(`Undid the pick of ${nameOf(last.pid)}.`);
};
ACT["f-move"] = (el) => {
  const L = leagueById(el.dataset.l);
  const pid = el.dataset.pid;
  if (!S.fMove) {
    S.fMove = pid;
    return fsave("Now tap Here on the player to swap with.");
  }
  if (S.fMove === pid) {
    S.fMove = null;
    return fsave();
  }
  swapRows(L, myTeam(L).id, S.fMove, pid, Date.now());
  S.fMove = null;
  fsave(`Lineup saved. It counts starting ${weekLabel(HLL.nextWeekStart(NOW))}.`);
};
let addPid = null;
ACT["f-add"] = (el) => {
  addPid = el.dataset.pid;
  const L = leagueById(el.dataset.l);
  const rows = rosterNow(L, myTeam(L).id);
  if (rows.length < slotsOf(L).length) {
    const slot = freeSlot(L, myTeam(L).id);
    setRow(L, myTeam(L).id, addPid, slot, Date.now());
    logMove(L, Date.now(), `${myTeam(L).name} added ${nameOf(addPid)}.`);
    return fsave(`Added ${nameOf(addPid)}.`);
  }
  openSheet(
    () => `<h2 class="h2">Add ${esc(nameOf(addPid))}</h2><p class="small muted" style="margin:4px 0 12px">Your roster is full. Pick someone to drop; ${esc(W.playerById[addPid].first)} takes their spot.</p>
    <div class="card list">${rows.map((r) => `<button class="list-item" data-act="f-drop" data-l="${L.id}" data-pid="${r.player_id}"><span class="slot">${r.slot_index < HLL.STARTERS ? "ST" : "BN"}</span><b class="grow">${esc(nameOf(r.player_id))}</b><span class="link">Drop</span></button>`).join("")}</div>
    <button class="btn btn-secondary btn-block" style="margin-top:12px" data-act="close-sheet">Cancel</button>`,
  );
};
ACT["f-drop"] = (el) => {
  const L = leagueById(el.dataset.l);
  const drop = el.dataset.pid;
  const at = Date.now();
  const row = endRow(L, drop, at);
  setRow(L, myTeam(L).id, addPid, row.slot_index, at);
  logMove(L, at, `${myTeam(L).name} added ${nameOf(addPid)} and dropped ${nameOf(drop)}.`);
  save();
  closeSheet();
  go(`fantasy/${L.id}/team`);
  toast(`Added ${nameOf(addPid)}, dropped ${nameOf(drop)}.`);
};
CHANGE["f-trade-pick"] = (el) => {
  const sel = (S.fTrade ||= { give: [], get: [] });
  const k = el.dataset.k;
  sel[k] = el.checked ? [...sel[k], el.dataset.pid] : sel[k].filter((x) => x !== el.dataset.pid);
  fsave();
};
ACT["f-trade-send"] = (el) => {
  const L = leagueById(el.dataset.l);
  const sel = S.fTrade || { give: [], get: [] };
  const full = slotsOf(L).length;
  const me = myTeam(L).id;
  if (rosterNow(L, me).length - sel.give.length + sel.get.length > full || rosterNow(L, el.dataset.with).length - sel.get.length + sel.give.length > full) return toast("Both rosters have to fit. Trade the same number of players.");
  L.trades.push({ id: `T${Date.now()}`, from: me, to: el.dataset.with, give: [...sel.give], get: [...sel.get], status: "pending", at: new Date().toISOString() });
  logMove(L, Date.now(), `${myTeam(L).name} offered ${teamById(L, el.dataset.with).name} a trade.`);
  S.fTrade = null;
  save();
  go(`fantasy/${L.id}/trades`);
  toast("Offer sent. They'll get a notification.");
};
function answerTrade(L, tr, yes, by) {
  tr.status = yes ? "accepted" : "declined";
  tr.decidedAt = new Date().toISOString();
  if (yes) applyTrade(L, tr, Date.now());
  else logMove(L, Date.now(), `${by} declined a trade.`);
}
ACT["f-trade-answer"] = (el) => {
  const L = leagueById(el.dataset.l);
  const tr = L.trades.find((t) => t.id === el.dataset.id);
  answerTrade(L, tr, el.dataset.yes === "1", myTeam(L).name);
  fsave(el.dataset.yes === "1" ? "Trade accepted. The players switch teams now and score for their new team from next Monday." : "Trade declined.");
};
ACT["f-trade-cpu"] = (el) => {
  const L = leagueById(el.dataset.l);
  const tr = L.trades.find((t) => t.id === el.dataset.id);
  const proj = projections(L);
  const v = (ids) => ids.reduce((n, id) => n + (proj.get(id)?.value || 0), 0);
  const yes = v(tr.give) >= v(tr.get) * 0.9;
  answerTrade(L, tr, yes, teamById(L, tr.to).name);
  notify("fantasy", `${teamById(L, tr.to).name} ${yes ? "accepted" : "declined"} your trade in ${L.name}.`, `fantasy/${L.id}/trades`);
  fsave(yes ? "They accepted." : "They declined. Try offering a bit more.");
};
ACT["f-trade-cancel"] = (el) => {
  const L = leagueById(el.dataset.l);
  const tr = L.trades.find((t) => t.id === el.dataset.id);
  tr.status = "canceled";
  logMove(L, Date.now(), isCommish(L) && tr.from !== myTeam(L).id ? "The commissioner canceled a trade." : `${myTeam(L).name} canceled a trade offer.`);
  fsave("Trade canceled.");
};
ACT["f-rename"] = (el) => {
  const L = leagueById(el.dataset.l);
  const v = document.getElementById("f-rename").value.trim();
  if (!v) return;
  logMove(L, Date.now(), `${myTeam(L).name} is now ${v}.`);
  myTeam(L).name = v;
  fsave("Team renamed.");
};
ACT["f-leave"] = (el) => {
  const L = leagueById(el.dataset.l);
  if (!confirm(isCommish(L) ? "Delete this league for everyone?" : "Leave this league?")) return;
  S.fantasy.leagues = S.fantasy.leagues.filter((x) => x !== L);
  save();
  go("fantasy");
  toast(isCommish(L) ? "League deleted." : "You left the league.");
};
ACT["f-renew"] = (el) => {
  const old = leagueById(el.dataset.l);
  const next = old.season === PAST.id ? CUR : NEXT;
  const n = Number(document.getElementById("f-keepn").value);
  const id = `L${Date.now()}`;
  const L = { ...JSON.parse(JSON.stringify(old)), id, season: next.id, renewedFrom: old.id, keepers: n, draft: { status: "pre", order: [...old.draft.order], picks: [], doneAt: null }, rows: [], trades: [], log: [] };
  L.teams = old.teams.map((t) => ({ ...t, id: t.id.replace(old.id, id) }));
  L.draft.order = old.draft.order.map((t) => t.replace(old.id, id));
  logMove(L, Date.now(), `${old.name} is back for ${next.name}, with ${n} keeper${n === 1 ? "" : "s"} per team.`);
  if (!n) L.keeperPicks = {};
  S.fantasy.leagues.push(L);
  save();
  go(`fantasy/${id}/draft`);
  toast(`${L.name} is back for ${next.name}. Everyone's in.`);
};
CHANGE["f-keep"] = (el) => {
  const sel = S.fKeep || [];
  S.fKeep = el.checked ? [...sel, el.dataset.pid] : sel.filter((x) => x !== el.dataset.pid);
  const L = curLeague();
  if (S.fKeep.length > L.keepers) {
    S.fKeep = S.fKeep.slice(0, L.keepers);
    toast(`Up to ${L.keepers}.`);
  }
  fsave();
};
ACT["f-keep-save"] = (el) => {
  const L = leagueById(el.dataset.l);
  const prev = leagueById(L.renewedFrom);
  const proj = projections(L);
  L.keeperPicks = {};
  for (const t of L.teams) {
    const prevId = t.id.replace(L.id, prev.id);
    const eligible = rosterNow(prev, prevId).map((r) => r.player_id).filter((pid) => W.rosterBy[L.season].has(pid));
    L.keeperPicks[t.id] = t.mine ? (S.fKeep || []).slice(0, L.keepers) : eligible.sort((a, b) => (proj.get(b)?.value || 0) - (proj.get(a)?.value || 0)).slice(0, L.keepers);
  }
  S.fKeep = null;
  logMove(L, Date.now(), "Keepers are set.");
  fsave("Keepers saved. They'll fill each team's last rounds.");
};

function leagueForm(title, action, { withLeague = false } = {}) {
  return `<h2 class="h2">${title}</h2>
    ${withLeague ? `<div class="field" style="margin-top:12px"><label for="f-lname">League name</label><input id="f-lname" class="input" value="${esc(S.account.name.split(" ").pop())} League"></div>
      <div class="field" style="margin-top:12px"><label for="f-size">Teams</label><select class="input" id="f-size">${[4, 6, 8, 10, 12].map((n) => `<option value="${n}" ${n === 8 ? "selected" : ""}>${n} teams${n > 10 ? " (1 bench spot)" : ""}</option>`).join("")}</select></div>
      <label class="switch card" style="margin-top:12px"><span><b>Private</b><br/><span class="small muted">Others join with a code</span></span><input type="checkbox" id="f-private" checked></label>` : ""}
    <div class="field" style="margin-top:12px"><label for="f-tname">Team name</label><input id="f-tname" class="input" value="${esc(S.account.name.split(" ").pop())} Bombers"></div>

    <button class="btn btn-secondary btn-block" style="margin-top:8px" data-act="close-sheet">Cancel</button>`;
}
let joining = null;
ACT["f-join"] = (el) => {
  joining = el.dataset.id;
  openSheet(() => leagueForm("Join league", "f-dojoin"));
};
ACT["f-dojoin"] = () => {
  const o = S.fantasy.open.find((x) => x.id === joining);
  const id = `L${Date.now()}`;
  const L = newLeague({ id, name: o.name, season: W.season.id, size: o.size, myIndex: o.filled, isPublic: true, seed: o.size + o.filled, myTeam: document.getElementById("f-tname").value.trim() || "My Team", commissioner: OWNERS[o.size] });
  S.fantasy.leagues.push(L);
  S.fantasy.open = S.fantasy.open.filter((x) => x.id !== joining);
  save();
  closeSheet();
  go(`fantasy/${id}/draft`);
  toast(`Joined ${o.name}.`);
};
ACT["f-create"] = () => openSheet(() => leagueForm("Create a league", "f-docreate", { withLeague: true }));
ACT["f-docreate"] = () => {
  const size = Number(document.getElementById("f-size").value);
  const priv = document.getElementById("f-private").checked;
  const code = Math.random().toString(36).slice(2, 7).toUpperCase();

  S.fantasy.leagues.push(L);
  save();
  closeSheet();
  go(`fantasy/${id}/draft`);

};
ACT["f-code"] = () =>
  openSheet(
    () => `<h2 class="h2">Join a private league</h2><p class="small muted" style="margin:4px 0 12px">Enter the code from the league's commissioner.</p>
    <input class="input code-input" id="f-codein" placeholder="COACH6">
    <button class="btn btn-primary btn-block" style="margin-top:12px" data-act="f-docode">Join</button><button class="btn btn-secondary btn-block" style="margin-top:8px" data-act="close-sheet">Cancel</button>`,
  );
ACT["f-docode"] = () => {
  const v = document.getElementById("f-codein").value.trim().toUpperCase();
  const L = S.fantasy.leagues.find((l) => l.code === v);

}

    </section>

      <div class="card list">${due.map((g) => `<div class="list-item"><div class="grow"><b>${esc(W.teamById[g.away].abbr)} at ${esc(W.teamById[g.home].abbr)}</b><div class="small muted">${gameLabel(g)} · ${fmtDay(g.date)} ${fmtTime(g.date)}</div></div><button class="btn btn-sm btn-secondary" data-act="quick-score" data-id="${g.id}">Enter score</button></div>`).join("") || `<p class="pad small muted">Every game that's been played has a score.</p>`}</div>
      <p class="small muted">If nobody scored a game live, type in the final and the standings update. It counts in the standings but not in stats.</p></section>
    ${sectionHead("Setup checklist")}<div class="card list">${check(true, `${W.teams.length} teams`)}${check(W.players.length > 0, `${W.players.length} players on rosters`)}${check(W.games.length > 0, W.games.length ? `${W.games.length} games on the schedule` : "Make the schedule (Games)")}${check(true, "Game rules set")}${check(S.staff.some((u) => u.role === "scorekeeper"), `${S.staff.filter((u) => u.role === "scorekeeper").length} scorekeepers`)}</div>`;

/* ---- games */
function adminGames(r) {
  if (r.parts[2] === "import") return adminImport(r);
  const days = new Map();
  W.games.forEach((g) => days.set(dayKey(g.date), [...(days.get(dayKey(g.date)) || []), g]));
  const staff = S.staff.filter((u) => u.role !== "member");
  return `<div class="page-head"><h1 class="h1">Games</h1><p class="muted">${esc(W.season.name)}</p></div>
    <div class="row wrap" data-tour="admin-games-tools"><a class="btn btn-primary btn-sm" href="#/admin/games/import">Paste from a spreadsheet</a>${!W.games.length ? `<button class="btn btn-secondary btn-sm" data-act="gen-schedule">Generate a schedule</button>` : ""}<button class="btn btn-secondary btn-sm" data-act="add-game">Add a game</button><button class="btn btn-secondary btn-sm" data-act="schedule-check">Check the schedule</button></div>
    ${[...days.entries()]
      .map(([k, list]) => {
        const open = list.filter((g) => g.status === "scheduled");
        return `<section class="stack-s"><div class="row between"><h3 class="h3">${fmtLongDay(list[0].date)}</h3>${open.length ? `<div class="row" ${k === dayKey(openGames().find((g) => g.status === "scheduled")?.date || "") ? 'data-tour="admin-rain"' : ""}><button class="btn btn-sm btn-secondary" data-act="rain-day" data-day="${k}">Rain out</button><button class="btn btn-sm btn-secondary" data-act="move-day" data-day="${k}">Move day</button></div>` : ""}</div>
          <div class="card list">${list
            .map((g) => `<div class="list-item wrap"><span class="small muted" style="width:62px">${fmtTime(g.date)}</span><div class="grow"><b>${esc(W.teamById[g.away].abbr)} at ${esc(W.teamById[g.home].abbr)}</b> <span class="small muted">${esc(g.field)} · ${gameLabel(g)}</span>${g.movedFrom ? ` <span class="tag">Moved from ${fmtDay(g.movedFrom)}</span>` : ""}</div>
              ${g.status === "final" ? `<b class="num">${g.score[0]}-${g.score[1]}</b>` : g.status === "live" ? `<span class="tag tag-live">Live</span>` : `<select class="input input-sm" data-change="assign" data-id="${g.id}" aria-label="Scorekeeper"><option value="">No scorekeeper</option>${staff.map((u) => `<option value="${u.id}" ${S.assign[g.id] === u.id ? "selected" : ""}>${esc(u.name)}</option>`).join("")}</select><button class="btn btn-sm btn-secondary" data-act="quick-score" data-id="${g.id}">Final</button>`}</div>`)

}

const teamRefs = () => W.teams.map((t) => ({ id: t.id, name: t.name, abbreviation: t.abbr }));
const checkGames = () => W.games.map((g) => ({ id: g.id, home_team_id: g.home, away_team_id: g.away, scheduled_at: g.date, field: g.field, status: g.status }));
function checkReport(check) {
  return `<div class="card scroll-x"><table><thead><tr><th>Team</th><th>Games</th><th>Home</th><th>Away</th>${check.weeks.map((w, i) => `<th>W${i + 1}</th>`).join("")}</tr></thead><tbody>${check.teams

}
function sampleSchedule() {
  const last = W.games.filter((g) => g.type === "regular").reduce((m, g) => (g.date > m ? g.date : m), new Date(NOW).toISOString());
  const d = new Date(last);
  d.setDate(d.getDate() + 3);
  const md = `${d.getMonth() + 1}/${d.getDate()}`;
  const t = W.teams;
  return `Date\tTime\tField\tAway\tHome\n${md}\t5:30 PM\tField 1\t${t[0].name}\t${t[1].name}\n${md}\t5:30 PM\tField 2\t${t[2].abbr}\t${t[3].abbr}\n${md}\t7:30 PM\tField 1\t${t[4].name}\t${t[0].name}\n${md}\t7:30 PM\tField 3\t${t[5].name} @ ${t[6].name}\t\n${md}\t8pm\tField 2\tYankees\t${t[7].name}`;
}
function adminImport() {
  const text = S.importText ?? "";

  const rows = text.trim() ? HLL.parseSchedule(text, teamRefs(), year) : [];
  const good = rows.filter((x) => x.game).map((x) => x.game);
  const bad = rows.filter((x) => x.error);
  const added = good.map((g) => ({ home_team_id: g.home, away_team_id: g.away, scheduled_at: new Date(`${g.date}T${g.time || "17:30"}`).toISOString(), field: g.field || null, status: "scheduled" }));
  const check = good.length ? HLL.checkSchedule([...checkGames(), ...added], teamRefs()) : null;
  return `<a class="link back" href="#/admin/games">‹ Games</a><div class="page-head"><h1 class="h1">Paste the schedule</h1><p class="muted">Copy the rows from Excel or Google Sheets and paste them here: Date, Time, Field, Away, Home (or a header row in any order, or "Away @ Home" in one column). Team names can be short, like "marios".</p></div>

      <div class="card list">${good.map((g) => `<div class="list-item small"><span style="width:90px">${esc(g.date)} ${esc(g.time)}</span><b class="grow">${esc(W.teamById[g.away].name)} at ${esc(W.teamById[g.home].name)}</b><span class="muted">${esc(g.field)}</span></div>`).join("")}${bad.map((x) => `<div class="list-item small bad"><span style="width:90px">Line ${x.line}</span><span class="grow">${esc(x.error)}</span></div>`).join("")}</div>

      ${good.length ? `<button class="btn btn-green btn-block" data-act="imp-save">Add ${good.length} game${good.length === 1 ? "" : "s"}</button>` : ""}` : ""}`;
}

/* ---- settings */
function adminSettings() {
  const R = W.rules;
  const num = (label, path, min, max, val) => `<div class="switch"><b>${label}</b><div class="stepper"><button data-act="rule" data-k="${path}" data-d="-1" data-min="${min}" aria-label="Less">−</button><output>${val}</output><button data-act="rule" data-k="${path}" data-d="1" data-max="${max}" aria-label="More">+</button></div></div>`;
  const tog = (label, sub, path, on) => `<label class="switch"><span><b>${label}</b>${sub ? `<br/><span class="small muted">${sub}</span>` : ""}</span><input type="checkbox" data-change="rule-tog" data-k="${path}" ${on ? "checked" : ""}></label>`;
  return `<div class="page-head"><h1 class="h1">Settings</h1></div>
    <div class="card pad stack-s"><b>League name</b><div class="row"><input class="input grow" id="lg-name" value="${esc(S.leagueName)}"><button class="btn btn-secondary" data-act="lg-name">Save name</button></div></div>
    <section class="stack" data-tour="admin-rules">${sectionHead("Game rules")}<div class="card list">
      ${num("Innings per game", "innings", 3, 9, R.innings)}
      ${num("Run limit per half inning", "runCapPerHalfInning", 0, 20, R.runCapPerHalfInning ?? 0)}
      ${tog("Run limit in the last inning too", "", "runCapInFinalInning", R.runCapInFinalInning)}
      ${tog("Mercy rule", `${R.mercyRule.runLead}+ runs after ${R.mercyRule.afterInnings} innings`, "mercyRule.enabled", R.mercyRule.enabled)}
      ${tog("Ties allowed", "Regular-season games can end tied (playoff games can't)", "tiesAllowed", R.tiesAllowed)}
      ${num("Minimum innings in the field per kid", "minDefensiveOuts", 0, 12, R.minDefensiveOuts / 3)}
      ${num("Pitch limit, ages 9–10", "pitchLimits.age9to10", 30, 120, R.pitchLimits.age9to10)}
      ${num("Pitch limit, ages 11–12", "pitchLimits.age11to12", 30, 120, R.pitchLimits.age11to12)}
    </div><p class="small muted">Live scoring follows these right away.</p></section>`;
}
function setRule(path, value) {
  const R = JSON.parse(JSON.stringify(W.rules));
  const keys = path.split(".");
  let o = R;
  keys.slice(0, -1).forEach((k) => (o = o[k]));
  o[keys.at(-1)] = value;
  S.rules = R;
  save();
  build();
  render();
}
ACT["rule"] = (el) => {
  const path = el.dataset.k;
  const cur = path.split(".").reduce((o, k) => o[k], W.rules) ?? 0;
  const step = path === "minDefensiveOuts" ? 3 : 1;
  const v = cur + Number(el.dataset.d) * step;
  const lim = (x) => (path === "minDefensiveOuts" ? Number(x) * 3 : Number(x));
  if ((el.dataset.min && v < lim(el.dataset.min)) || (el.dataset.max && v > lim(el.dataset.max))) return;
  setRule(path, path === "runCapPerHalfInning" && v === 0 ? null : v);
};
CHANGE["rule-tog"] = (el) => setRule(el.dataset.k, el.checked);

function adminBackups() {

/** Plays the next unfinished game to the end (demo only). */
function simNext() {
  const g = openGames()[0];
  if (!g) {
    if (!S.playoffs && W.games.length && W.season.id === CUR.id) lockSeeds();
    return null;
  }
  const d = S.games[g.id];
  const opts = { tiesAllowed: g.type !== "playoff" && W.rules.tiesAllowed };
  if (g.events && g.setup) {
    // A game someone started scoring (or the one in progress): play out the rest from where it is.
    const events = E.simulate(g.setup, g.seed, W.rules, null, [...g.events, ...(S.pending[g.id] || [])], PROFILES, opts).events;
    S.games[g.id] = { setup: g.setup, events, status: "final", manual: null };
    delete S.pending[g.id];
  } else if (!d) S.played[g.id] = true;
  save();
  build();
  if (g.type === "playoff") {
    advancePlayoffs();
    save();
    build();
  }
  return W.gameById[g.id];
}
function lockSeeds() {
  const seeds = W.standings.slice(0, 8).map((r) => r.team.id);
  const last = W.games.filter((g) => g.type === "regular").reduce((m, g) => (g.date > m ? g.date : m), "");
  const at = (days, h) => {
    const d = new Date(last);
    d.setDate(d.getDate() + days);
    d.setHours(h, 30, 0, 0);
    return d.toISOString();
  };
  S.playoffs = {
    seeds,
    games: [[1, 8], [4, 5], [2, 7], [3, 6]].map(([a, b], i) => ({ id: `po-q${i + 1}`, slot: i + 1, sg: null, round_name: "quarterfinal", home: seeds[a - 1], away: seeds[b - 1], field: `Field ${(i % 2) + 1}`, seed: 1000 + i * 17, date: at(2 + Math.floor(i / 2), i % 2 ? 19 : 17) })),
  };
  save();
  build();
}
function advancePlayoffs() {
  const po = S.playoffs;
  if (!po) return;
  const seedOf = (t) => po.seeds.indexOf(t);
  const byBetter = (a, b) => (seedOf(a) <= seedOf(b) ? [a, b] : [b, a]);
  const find = (slot, sg = null) => po.games.find((g) => g.slot === slot && (g.sg || null) === sg);
  const w = (slot) => winnerOf(W.gameById[find(slot)?.id]);
  const lastDate = () => po.games.reduce((m, g) => (g.date > m ? g.date : m), po.games[0].date);
  const at = (days, h) => {
    const d = new Date(lastDate());
    d.setDate(d.getDate() + days);
    d.setHours(h, 30, 0, 0);
    return d.toISOString();
  };
  const untouched = (g) => g && !S.games[g.id] && !S.played[g.id];
  const drop = (g) => (po.games = po.games.filter((x) => x !== g));
  [[5, 1, 2], [6, 3, 4]].forEach(([slot, a, b]) => {
    const wa = w(a);
    const wb = w(b);
    const existing = find(slot);
    if (existing && untouched(existing) && !(wa && wb && [existing.home, existing.away].sort().join() === [wa, wb].sort().join())) drop(existing);
  });
  {
    const series = po.games.filter((g) => g.slot === 7);
    const fa = w(5);
    const fb = w(6);
    const same = series[0] && fa && fb && [series[0].home, series[0].away].sort().join() === [fa, fb].sort().join();
    if (series.length && !same && series.every(untouched)) series.forEach(drop);
  }
  [[5, 1, 2], [6, 3, 4]].forEach(([slot, a, b]) => {
    const wa = w(a);
    const wb = w(b);
    if (wa && wb && !find(slot)) {
      const [home, away] = byBetter(wa, wb);
      po.games.push({ id: `po-s${slot - 4}`, slot, sg: null, round_name: "semifinal", home, away, date: at(2, slot === 5 ? 17 : 19), field: "Field 1", seed: 2000 + slot });
    }
  });
  const f1 = w(5);
  const f2 = w(6);
  if (f1 && f2 && !find(7, 1)) {
    const [hi, lo] = byBetter(f1, f2);
    [[1, hi, lo, 2], [2, lo, hi, 3], [3, hi, lo, 4]].forEach(([sg, home, away, d]) => po.games.push({ id: `po-f${sg}`, slot: 7, sg, round_name: "championship", home, away, date: at(d, 17), field: "Field 1", seed: 3000 + sg }));
  }
  const wins = {};
  po.games.filter((g) => g.slot === 7).forEach((g) => {
    const x = winnerOf(W.gameById[g.id]);
    if (x) wins[x] = (wins[x] || 0) + 1;
  });
  const decided = Object.values(wins).some((n) => n >= 2);
  po.games.filter((g) => g.slot === 7 && untouched(g)).forEach((g) => (g.canceled = decided));
}
