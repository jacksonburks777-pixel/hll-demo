/* ---------------------------------------------------------------- home */
function champion() {
  if (!S.playoffs) return null;
  const wins = seriesWins();
  return Object.keys(wins).find((t) => wins[t] >= 2) || null;
}

function autoHeadlines(limit = 4) {
  const finals = W.games.filter((g) => g.status === "final" && g.score);
  const scored = new Map(finals.filter((g) => g.rep && !g.manual).map((g) => [g.id, g.rep]));
  const sides = new Map(finals.filter((g) => g.setup).map((g) => [g.id, (pid) => (g.setup.lineups[1].some((x) => x.pid === pid) || g.setup.bench[1].includes(pid) ? 1 : 0)]));
  const teams = new Map(W.teams.map((t) => [t.id, dbTeam(t)]));
  return HLL.resultHeadlines(finals.map(dbGame), teams, scored, nameOf, sides, limit).map((h) => ({ ...h, href: "#/game/" + h.id }));
}

function newsCard(p, { full = false } = {}) {
  return `<a class="card pad news-card ${p.pinned ? "pinned" : ""}" href="#/news/${p.id}"><div class="row between"><span class="eyebrow">${NEWS_CATS[p.category]}${p.pinned ? " · Pinned" : ""}</span><span class="tiny muted">${fmtWhen(p.at)}</span></div>
    <b class="news-title">${esc(p.title)}</b>${full ? `<p>${esc(p.body)}</p>` : `<p class="small muted clamp">${esc(p.body)}</p>`}</a>`;
}

function myPlayers() {
  const mine = Object.entries(S.follows).filter(([, st]) => st === "approved").map(([pid]) => pid).filter((pid) => W.playerById[pid]);
  if (!mine.length) return "";
  return `<section class="stack" data-tour="my-players">${sectionHead("My players")}${mine
    .map((pid) => {
      const s = lineOf(pid);
      const log = (W.extrasBy[W.season.id].logs[pid] || []).slice(-1)[0];
      const t = teamOf(pid);
      const last = log ? `Last game ${fmtDay(log.game.date)}: ${log.b ? `${log.b.H}-for-${log.b.AB}${log.b.HR ? `, ${log.b.HR} HR` : ""}${log.b.RBI ? `, ${log.b.RBI} RBI` : ""}` : ""}${log.p ? `${log.b ? " · " : ""}${E.inningsPitched(log.p.OUTS)} IP, ${log.p.K} K` : ""}` : "No games yet this season.";
      return `<a class="card pad row" href="#/player/${pid}">${badge(t, "md")}<div class="grow"><b>${esc(nameOf(pid))}</b><div class="small muted">${s && s.pa ? `${HLL.fmtRate(HLL.avg(s))} AVG · ${s.hr} HR · ${s.rbi} RBI${s.war != null ? ` · ${HLL.fmt1(s.war)} WAR` : ""}` : esc(t?.name || "")}</div><div class="tiny muted">${last}</div></div><span class="chev">›</span></a>`;
    })
    .join("")}</section>`;
}

function viewHome() {
  const live = W.games.filter((g) => g.status === "live");
  const upcoming = W.games.filter((g) => g.status === "scheduled" && g.home && g.away).slice(0, 3);
  const recent = W.games.filter((g) => g.status === "final").slice(-3).reverse();
  const champ = champion();
  const posts = S.news.filter((p) => p.published).sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0) || b.at.localeCompare(a.at));
  const heads = autoHeadlines(4);
  const nowWeek = HLL.weekOf(W.weeks, NOW);
  const first = W.games.find((g) => g.type === "regular");
  const sub = !W.games.length ? "The schedule hasn't been posted yet." : first && Date.parse(first.date) > NOW ? `Opening day is ${fmtLongDay(first.date)}` : nowWeek ? `Week ${nowWeek.n} of ${W.weeks.length}` : W.games.every((g) => g.status === "final" || g.status === "canceled") ? "Season complete" : "Regular season";
  const hasWar = statsOf().some((s) => s.war != null);
  return `<div class="page-head"><p class="eyebrow">${esc(W.season.name)}</p><h1 class="h1">${champ ? `${esc(W.teamById[champ].name)} are the champions` : esc(W.league)}</h1><p class="muted">${sub}</p></div>
    ${champ ? `<a class="champ" href="#/recap" data-tour="champ-banner"><p class="eyebrow">${esc(W.season.name)} champions</p><p class="h1">${esc(W.teamById[champ].name)}</p><p class="small">See the season recap ›</p></a>` : ""}
    <div class="cols"><div class="col">
    ${myPlayers()}
    ${live.length ? `<section class="stack">${sectionHead("Live now")}${live.map((g, i) => gameCard(g, { tour: i === 0 ? "live-card" : "" })).join("")}</section>` : ""}
    <section class="stack" data-tour="news">${sectionHead("League news", S.role === "admin" ? `<a href="#/admin/news">Post news</a>` : "")}${posts.slice(0, 3).map((p) => newsCard(p)).join("") || `<p class="card pad muted">No news yet.</p>`}</section>
    ${heads.length ? `<section class="stack" data-tour="headlines">${sectionHead("Headlines", `<span class="small muted">Written automatically from results</span>`)}<div class="card list">${heads
      .map((h) => `<a class="list-item" href="${h.href}"><div class="grow"><span class="eyebrow">${esc(h.kicker)}</span><b class="block">${esc(h.title)}</b>${h.star ? `<div class="small muted">${esc(h.star)}</div>` : ""}</div><span class="chev">›</span></a>`)
      .join("")}</div></section>` : ""}
    ${upcoming.length ? `<section class="stack">${sectionHead("Upcoming", `<a href="#/schedule">Schedule</a>`)}${upcoming.map((g) => gameCard(g, { showDate: true })).join("")}</section>` : ""}
    ${recent.length ? `<section class="stack">${sectionHead("Results", `<a href="#/schedule">All scores</a>`)}${recent.map((g) => gameCard(g, { showDate: true })).join("")}</section>` : ""}
    </div><div class="col">
    <section class="stack">${sectionHead(`${esc(W.season.name)} leaders`, `<a href="#/stats">All stats</a>`)}${leadersGrid([...(hasWar ? [["bat", "WAR", "WAR"]] : []), ["bat", "AVG", "Batting average"], ["bat", "HR", "Home runs"], ["pit", "K", "Strikeouts"]], 3, W.season.id)}</section>
    ${W.standings.length ? `<section class="stack">${sectionHead("Standings", `<a href="#/standings">Full table</a>`)}${standingsTable(W.standings, { compact: true })}</section>` : ""}
    </div></div>`;
}

function viewNews(r) {
  const p = S.news.find((x) => x.id === r.parts[1] && (x.published || S.role === "admin"));
  if (!p) return `<a class="link back" href="#/home">‹ Home</a><p class="card pad">That post isn't available.</p>`;
  return `<a class="link back" href="#/home">‹ Home</a><article class="card pad stack-s"><span class="eyebrow">${NEWS_CATS[p.category]} · ${fmtLongDay(p.at)}</span><h1 class="h1">${esc(p.title)}</h1><p>${esc(p.body)}</p></article>
    ${S.role === "admin" ? `<a class="btn btn-secondary" href="#/admin/news/${p.id}">Edit post</a>` : ""}`;
}

/* ---------------------------------------------------------------- scores */
function viewSchedule(r) {
  const team = W.teamById[r.q.team] ? r.q.team : "";
  const games = W.games.filter((g) => !team || g.home === team || g.away === team);
  const weeks = new Map();
  games.forEach((g) => {
    const w = g.type === "playoff" ? "Playoffs" : `Week ${HLL.weekOf(W.weeks, g.date)?.n ?? "?"}`;
    weeks.set(w, [...(weeks.get(w) || []), g]);
  });
  const today = todayKey();
  const rainedOut = W.games.filter((g) => g.movedFrom && g.type === "regular");
  return `<div class="page-head"><h1 class="h1">Scores & schedule</h1><p class="muted">${esc(W.season.name)} · ${W.weeks.length || 0} weeks · most teams play twice a week</p></div>
    <div class="row wrap"><div class="chips grow"><a class="chip ${team ? "" : "on"}" href="${withQuery({ team: null })}">All teams</a>${W.teams.map((t) => `<a class="chip ${team === t.id ? "on" : ""}" href="${withQuery({ team: t.id })}">${badge(t)}${esc(t.abbr)}</a>`).join("")}</div>
      <a class="btn btn-secondary btn-sm" href="#/pitchers">Who can pitch</a><button class="btn btn-secondary btn-sm" data-act="csv" data-file="schedule">Download CSV</button></div>
    ${rainedOut.length && !team ? `<p class="notice warn" data-tour="rainout">Rained out ${fmtDay(rainedOut[0].movedFrom)}: those ${rainedOut.length} games were moved to ${fmtDay(rainedOut[0].date)}.</p>` : ""}
    ${[...weeks.entries()]
      .map(([w, gs]) => {
        const days = new Map();
        gs.forEach((g) => days.set(dayKey(g.date), [...(days.get(dayKey(g.date)) || []), g]));
        return `<section class="stack">${sectionHead(w)}${[...days.entries()]
          .map(([k, list]) => `<p class="small bold muted">${fmtLongDay(list[0].date)}${k === today ? ' <span class="tag tag-plain">Today</span>' : ""}</p><div class="card-grid">${list.map((g) => gameCard(g)).join("")}</div>`)
          .join("")}</section>`;
      })
      .join("") || `<p class="card pad muted">No games on the schedule yet.</p>`}`;
}

/* ---------------------------------------------------------------- standings */
function viewStandings(r) {
  const season = seasonById(r.q.season);
  const rows = W.standingsBy[season.id];
  return `<div class="page-head"><h1 class="h1">Standings</h1><p class="muted">${esc(season.name)} regular season${season.id === PAST.id ? " · final" : ""}</p></div>
    ${seasonPicker(season.id)}
    <div class="cols cols-main"><div class="col">${standingsTable(rows, { tour: "standings" })}</div>
    <div class="col"><div class="card pad stack-s small">
      <p><b>Top 8 make the playoffs</b> (above the dashed line). <a class="link" href="#/playoffs">Bracket</a></p>
      <p class="muted"><b>Pct</b> counts a tie as half a win. <b>GB</b> is games behind first. <b>Strk</b> is the current streak.</p>
      <p class="muted">Ties are broken by head-to-head record, then run differential, then fewest runs allowed.</p>
      <button class="btn btn-secondary btn-sm" data-act="csv" data-file="standings" data-season="${season.id}">Download CSV</button>
    </div></div></div>`;
}

/* ---------------------------------------------------------------- teams */
function viewTeams() {
  const place = Object.fromEntries(W.standings.map((r, i) => [r.team.id, i + 1]));
  const rec = (t) => W.standings.find((r) => r.team.id === t.id);
  return `<div class="page-head"><h1 class="h1">Teams</h1><p class="muted">${esc(W.season.name)}</p></div><div class="team-grid">${W.teams
    .map((t) => {
      const x = rec(t);
      return `<a class="card team-card" href="#/team/${t.id}" style="border-top-color:${t.color}">${badge(t, "lg")}<b>${esc(t.name)}</b><span class="small muted num">${x ? `${x.w}-${x.l}${x.t ? "-" + x.t : ""} · ${ord(place[t.id])}` : `${rosterOf(t.id).length} players`}</span></a>`;
    })
    .join("")}</div>`;
}

function viewTeam(r) {
  const t = W.teamById[r.parts[1]];
  if (!t) return `<p>Team not found.</p>`;
  const tab = r.parts[2] || "roster";
  const place = W.standings.findIndex((x) => x.team.id === t.id);
  const rec = W.standings[place];
  const roster = rosterOf(t.id);
  let body = "";
  if (tab === "roster") {
    body = `<div class="card list" data-tour="roster">${roster
      .map((p) => `<a class="list-item" href="#/player/${p.id}"><span class="jersey" style="background:${t.color}">${p.jersey}</span><div class="grow"><b>${esc(p.name)}</b><div class="tiny muted">${esc(posLabel(p))}${p.age ? ` · Age ${p.age}` : ""}</div></div><span class="chev">›</span></a>`)
      .join("")}</div>`;
  } else if (tab === "stats") {
    const type = r.q.type === "pit" ? "pit" : "bat";
    const rows = statsOf().filter((s) => s.team_id === t.id);
    body = `<div class="seg"><a href="${withQuery({ type: null, sort: null, dir: null })}" class="${type === "bat" ? "on" : ""}">Hitting</a><a href="${withQuery({ type: "pit", sort: null, dir: null })}" class="${type === "pit" ? "on" : ""}">Pitching</a></div>
      ${statTable({ rows, type, sort: r.q.sort, dir: r.q.dir, limit: 0, showTeam: false, seasonId: W.season.id })}`;
  } else if (tab === "innings") {
    body = `<p class="small muted">Innings played at each position in games scored on the site.</p>${inningsTable(roster.map((p) => p.id), W.extrasBy[W.season.id].def)}`;
  } else {
    const games = W.games.filter((g) => g.home === t.id || g.away === t.id);
    body = games.length ? `<div class="card-grid">${games.map((g) => gameCard(g, { showDate: true })).join("")}</div>` : `<p class="card pad muted">No games yet.</p>`;
  }
  return `<section class="card team-head" style="border-left-color:${t.color}">${badge(t, "lg")}<div class="grow"><h1 class="h1">${esc(t.name)}</h1><p class="muted num">${rec ? `${rec.w}-${rec.l}${rec.t ? "-" + rec.t : ""} · ${ord(place + 1)} place · ${rec.rf} runs scored` : esc(W.season.name)}</p></div></section>
    <div class="seg">${[["roster", "Roster"], ["games", "Schedule"], ["stats", "Stats"], ["innings", "Innings"]]
      .map(([k, l]) => `<a href="#/team/${t.id}/${k}" class="${tab === k ? "on" : ""}">${l}</a>`)
      .join("")}</div>${body}`;
}

/* ---------------------------------------------------------------- player */
function viewPlayer(r) {
  const p = W.playerById[r.parts[1]];
  if (!p) return `<p>Player not found.</p>`;
  const t = teamOf(p.id) || W.teamById[p.team];
  const cur = lineOf(p.id);
  const tile = (v, l) => `<div class="tile"><b>${v}</b><span>${l}</span></div>`;
  const ex = W.extrasBy[W.season.id];
  const bip = ex.bip[p.id] || [];
  const log = (ex.logs[p.id] || []).slice().reverse();
  const follow = S.follows[p.id];
  const seasons = W.seasons.map((s) => ({ s, line: lineOf(p.id, s.id), team: teamOf(p.id, s.id) })).filter((x) => x.line).reverse();
  const batRows = seasons.filter((x) => HLL.hasBatting(x.line));
  const pitRows = seasons.filter((x) => HLL.hasPitching(x.line));
  const career = (rows) => rows.slice(1).reduce((a, x) => { const o = { ...a }; for (const k of Object.keys(x.line)) if (typeof x.line[k] === "number") o[k] = (a[k] ?? 0) + x.line[k]; return o; }, rows[0]?.line || {});
  const followBtn =
    follow === "approved" ? `<span class="tag tag-good">Your player</span>`
      : follow === "pending" ? `<span class="tag">Request sent to the admin</span>`
        : `<button class="btn btn-sm btn-secondary" data-act="follow" data-pid="${p.id}" data-tour="follow">This is my kid</button>`;
  const batTable = batRows.length
    ? `<div class="card scroll-x" data-tour="career"><table><thead><tr><th>Hitting</th><th>G</th><th>PA</th><th>AB</th><th>R</th><th>H</th><th>2B</th><th>3B</th><th>HR</th><th>RBI</th><th>BB</th><th>K</th><th>AVG</th><th>OBP</th><th>SLG</th><th>OPS</th><th>WAR</th></tr></thead><tbody>${[...batRows.map((x) => ({ label: x.s.name, team: x.team, s: x.line })), ...(batRows.length > 1 ? [{ label: "Career", s: career(batRows), career: true }] : [])]
      .map((x) => `<tr class="${x.career ? "total-row" : ""}"><td class="bold">${esc(x.label)} ${x.team ? badge(x.team) : ""}</td>${[x.s.g, x.s.pa, x.s.ab, x.s.r, x.s.h, x.s.doubles, x.s.triples, x.s.hr, x.s.rbi, x.s.bb, x.s.so].map((v) => `<td>${v ?? 0}</td>`).join("")}<td>${HLL.fmtRate(HLL.avg(x.s))}</td><td>${HLL.fmtRate(HLL.obp(x.s))}</td><td>${HLL.fmtRate(HLL.slg(x.s))}</td><td>${HLL.fmtRate(HLL.ops(x.s))}</td><td class="bold">${HLL.fmt1(x.s.war ?? null)}</td></tr>`)
      .join("")}</tbody></table></div>`
    : "";
  const pitTable = pitRows.length
    ? `<div class="card scroll-x"><table><thead><tr><th>Pitching</th><th>G</th><th>IP</th><th>W</th><th>L</th><th>SV</th><th>H</th><th>R</th><th>ER</th><th>BB</th><th>K</th><th>ERA</th><th>WHIP</th><th>pWAR</th></tr></thead><tbody>${[...pitRows.map((x) => ({ label: x.s.name, team: x.team, s: x.line })), ...(pitRows.length > 1 ? [{ label: "Career", s: career(pitRows), career: true }] : [])]
      .map((x) => `<tr class="${x.career ? "total-row" : ""}"><td class="bold">${esc(x.label)} ${x.team ? badge(x.team) : ""}</td><td>${x.s.p_g ?? 0}</td><td>${HLL.fmtIp(x.s.outs)}</td>${[x.s.w, x.s.l, x.s.sv, x.s.p_h, x.s.p_r, x.s.er, x.s.p_bb, x.s.p_so].map((v) => `<td>${v ?? 0}</td>`).join("")}<td>${HLL.fmt2(HLL.era(x.s))}</td><td>${HLL.fmt2(HLL.whip(x.s))}</td><td>${HLL.fmt1(x.s.pit_war ?? null)}</td></tr>`)
      .join("")}</tbody></table></div>`
    : "";
  const tiles = cur && HLL.hasBatting(cur)
    ? `<div class="tiles" data-tour="player-cards">${tile(HLL.fmtRate(HLL.avg(cur)), "AVG")}${tile(cur.hr ?? 0, "HR")}${tile(cur.rbi ?? 0, "RBI")}${tile(HLL.fmtRate(HLL.obp(cur)), "OBP")}${tile(HLL.fmtRate(HLL.ops(cur)), "OPS")}${cur.war != null ? tile(HLL.fmt1(cur.war), "WAR") : tile(cur.h ?? 0, "H")}</div>`
    : "";
  const pitTiles = cur && HLL.hasPitching(cur) && cur.outs ? `<div class="tiles">${tile(`${cur.w ?? 0}-${cur.l ?? 0}`, "W-L")}${tile(HLL.fmt2(HLL.era(cur)), "ERA")}${tile(cur.p_so ?? 0, "K")}${cur.pit_war != null ? tile(HLL.fmt1(cur.pit_war), "pWAR") : ""}</div>` : "";
  return `<section class="card team-head" style="border-left-color:${t?.color || "#999"}"><span class="jersey jersey-lg" style="background:${t?.color || "#999"}">${p.jersey ?? "–"}</span>
      <div class="grow"><h1 class="h1">${esc(p.name)}</h1><p class="muted">${t ? `<a class="link" href="#/team/${t.id}">${esc(t.name)}</a> · ` : ""}${esc(posLabel(p))}${W.current[p.id]?.age ? ` · Age ${W.current[p.id].age}` : ""}</p></div>${followBtn}</section>
    <div class="cols"><div class="col">
    ${sectionHead(`${esc(W.season.name)}`)}
    ${tiles}${pitTiles}${!tiles && !pitTiles ? `<p class="card pad small muted">No games yet this season.</p>` : ""}
    ${sectionHead("By season")}
    ${batTable}${pitTable}
    </div><div class="col">
    ${bip.length ? `<section class="card pad stack-s" data-tour="spray"><div class="row between"><b>Spray chart</b><span class="small muted">${bip.length} ball${bip.length > 1 ? "s" : ""} in play</span></div>
      ${fieldSvg({ dots: bip.map((x) => ({ x: x.x, y: x.y, color: bipColor(x.r), label: E.RESULTS[x.r].label })) })}
      <p class="small legend"><span style="color:${HIT_COLOR.hit}">●</span> Hit <span style="color:${HIT_COLOR.out}">●</span> Out <span style="color:${HIT_COLOR.other}">●</span> Error / FC</p></section>` : ""}
    ${log.length ? `${sectionHead("Game log")}<div class="card list" data-tour="game-log">${log
      .slice(0, 12)
      .map(({ game: g, b: gb, p: gp }) => {
        const opp = W.teamById[g.home === teamIdOf(p.id) ? g.away : g.home];
        const line = [gb ? `${gb.H}-${gb.AB}${gb.HR ? `, ${gb.HR} HR` : ""}${gb.RBI ? `, ${gb.RBI} RBI` : ""}` : "", gp ? `${E.inningsPitched(gp.OUTS)} IP, ${gp.K} K` : ""].filter(Boolean).join(" · ");
        return `<a class="list-item" href="#/game/${g.id}"><span class="small muted" style="width:74px">${fmtDay(g.date)}</span><span class="grow bold">vs ${esc(opp?.abbr || "")}</span><span class="small num">${line}</span></a>`;
      })
      .join("")}</div>` : ""}
    </div></div>`;
}

/* ---------------------------------------------------------------- game */
function diamond(bases) {
  return `<div class="diamond" aria-label="Runners on base"><b class="b2 ${bases[1] ? "on" : ""}"></b><b class="b3 ${bases[2] ? "on" : ""}"></b><b class="b1 ${bases[0] ? "on" : ""}"></b></div>`;
}
function outsDots(n) {
  return `<span class="outs">${[0, 1, 2].map((i) => `<i class="${i < n ? "on" : ""}"></i>`).join("")} ${n} out${n === 1 ? "" : "s"}</span>`;
}

function scoreboard(g, tour = "", rep = g.rep) {
  const s = rep;
  const home = W.teamById[g.home];
  const away = W.teamById[g.away];
  const [as, hs] = s ? s.score : g.score || [0, 0];
  const live = g.status !== "final" && s && s.status !== "final";
  const arrow = (t) => (live && s.half === t ? '<span class="bat-arrow">◀</span>' : "");
  return `<div class="board" ${tour ? `data-tour="${tour}"` : ""}>
    <div class="board-label">${gameLabel(g)}</div>
    <div class="teams">
      <div class="tname">${badge(away, "md")}<span>${esc(away?.name || "TBD")}</span></div><div class="runs">${g.status === "scheduled" && !s ? "" : as} ${arrow(0)}</div>
      <div class="tname">${badge(home, "md")}<span>${esc(home?.name || "TBD")}</span></div><div class="runs">${g.status === "scheduled" && !s ? "" : hs} ${arrow(1)}</div>
    </div>
    <div class="sit">${
      live
        ? `<span class="inn">${s.half ? "Bot" : "Top"} ${ord(s.inning)}</span><span class="count">${s.balls}-${s.strikes}</span>${outsDots(s.outs)}${diamond(s.bases)}`
        : g.status === "final" || (s && s.status === "final")
          ? `<span class="inn">Final${s && s.endReason ? " · " + esc(s.endReason) : ""}</span><span class="small">${fmtDay(g.date)}</span>`
          : `<span class="inn">${g.date ? fmtLongDay(g.date) : "Date TBD"}</span><span class="small">${g.date ? fmtTime(g.date) : ""} · ${esc(g.field || "")}</span>`
    }</div>
  </div>`;
}

function lineScore(g, tour = "") {
  const s = g.rep;
  if (!s) return "";
  const n = Math.max(W.rules.innings, s.inning);
  const cell = (t, i) => {
    const v = s.line[t][i];
    if (v !== undefined) return v;
    if (s.status === "final" && t === 1 && i === s.line[0].length - 1 && i >= W.rules.innings - 1) return "X";
    return "";
  };
  const row = (t) => `<tr><td class="bold">${esc(W.teamById[t ? g.home : g.away].abbr)}</td>${Array.from({ length: n }, (_, i) => `<td>${cell(t, i)}</td>`).join("")}<td class="tot">${s.score[t]}</td><td>${s.hits[t]}</td><td>${s.errors[t]}</td></tr>`;
  return `<div class="card scroll-x linescore" ${tour ? `data-tour="${tour}"` : ""}><table><thead><tr><th></th>${Array.from({ length: n }, (_, i) => `<th>${i + 1}</th>`).join("")}<th>R</th><th>H</th><th>E</th></tr></thead><tbody>${row(0)}${row(1)}</tbody></table></div>`;
}

function playLog(g, { limit = 0, tour = "", rep = g.rep } = {}) {
  const s = rep;
  if (!s) return "";
  let entries = s.log.map((e, i) => ({ ...e, i })).reverse();
  if (limit) entries = entries.slice(0, limit);
  let last = "";
  const html = entries
    .map((e) => {
      const key = `${e.inning}-${e.half}`;
      const head = key !== last ? `<div class="inn-head">${e.half ? "Bottom" : "Top"} ${ord(e.inning)} · ${esc(W.teamById[e.half ? g.home : g.away].name)}</div>` : "";
      last = key;
      const fresh = e.i >= s.log.length - 1 && g.status === "live" ? "flash" : "";
      return `${head}<div class="play ${e.kind} ${fresh}"><span class="dot"></span><span>${esc(e.text)}</span><span class="sc">${e.score[0]}-${e.score[1]}</span></div>`;
    })
    .join("");
  return `<div class="card plays" ${tour ? `data-tour="${tour}"` : ""}>${html || '<p class="pad muted">No plays yet.</p>'}</div>`;
}

function boxScore(g) {
  const s = g.rep;
  const side = (t) => {
    const tid = t ? g.home : g.away;
    const ids = [...s.lineup[t].map((x) => x.pid), ...s.bench[t].filter((pid) => s.appeared.has(pid))];
    const rows = ids
      .map((pid) => {
        const b = s.bat[pid] || { AB: 0, R: 0, H: 0, RBI: 0, BB: 0, K: 0 };
        const pos = s.lineup[t].find((x) => x.pid === pid)?.pos || "sub";
        return `<tr><td><a href="#/player/${pid}"><b>${esc(nameOf(pid))}</b></a> <span class="tiny muted">${pos}</span></td><td>${b.AB}</td><td>${b.R}</td><td>${b.H}</td><td>${b.RBI}</td><td>${b.BB}</td><td>${b.K}</td></tr>`;
      })
      .join("");
    const pitchers = [...new Set(s.pitchersUsed[t])]
      .filter((pid) => s.pit[pid])
      .map((pid) => {
        const p = s.pit[pid];
        const dec = s.decision?.W === pid ? " (W)" : s.decision?.L === pid ? " (L)" : s.decision?.SV === pid ? " (S)" : p.HD ? " (H)" : "";
        return `<tr><td><b>${esc(nameOf(pid))}</b>${dec}</td><td>${E.inningsPitched(p.OUTS)}</td><td>${p.H}</td><td>${p.R}</td><td>${p.ER}</td><td>${p.BB}</td><td>${p.K}</td><td>${p.P}</td></tr>`;
      })
      .join("");
    const out = (g.setup?.absent?.[t] || []).map(nameOf);
    return `<h3 class="h3 row">${badge(W.teamById[tid])}${esc(W.teamById[tid].name)}</h3>
      <div class="card scroll-x"><table><thead><tr><th>Batting</th><th>AB</th><th>R</th><th>H</th><th>RBI</th><th>BB</th><th>K</th></tr></thead><tbody>${rows}</tbody></table></div>
      <div class="card scroll-x"><table><thead><tr><th>Pitching</th><th>IP</th><th>H</th><th>R</th><th>ER</th><th>BB</th><th>K</th><th>#P</th></tr></thead><tbody>${pitchers}</tbody></table></div>
      ${out.length ? `<p class="small muted">Not at this game: ${out.map(esc).join(", ")}</p>` : ""}`;
  };
  return `<div class="stack">${side(0)}${side(1)}</div>`;
}

/** A game's fielding: innings at each position, putouts, assists, errors. */
function gameDefense(g) {
  const s = g.rep;
  const side = (t) => {
    const tid = t ? g.home : g.away;
    const pids = [...new Set([...s.lineup[t].map((x) => x.pid), ...s.bench[t]])].filter((pid) => s.defPos[pid]);
    const rows = pids
      .map((pid) => {
        const f = s.fld[pid] || { PO: 0, A: 0, E: 0 };
        const outs = Object.values(s.defPos[pid]).reduce((a, b) => a + b, 0);
        return `<tr><td><a href="#/player/${pid}"><b>${esc(nameOf(pid))}</b></a><div class="tiny muted">${esc(posSummary(s.defPos[pid]))}</div></td><td>${E.inningsPitched(outs)}</td><td>${f.PO}</td><td>${f.A}</td><td>${f.E}</td></tr>`;
      })
      .join("");
    return `<h3 class="h3 row">${badge(W.teamById[tid])}${esc(W.teamById[tid].name)}</h3>
      <div class="card scroll-x"><table><thead><tr><th>Fielder</th><th>INN</th><th>PO</th><th>A</th><th>E</th></tr></thead><tbody>${rows || '<tr><td colspan="5" class="muted">No innings in the field yet.</td></tr>'}</tbody></table></div>`;
  };
  return `<div class="stack" data-tour="game-defense">${side(0)}${side(1)}</div>`;
}

function viewGame(r) {
  const g = W.gameById[r.parts[1]];
  if (!g) return `<p>Game not found.</p>`;
  const tab = r.q.tab || "plays";
  const s = g.rep;
  const staff = S.role !== "fan";
  if (!s) {
    return `${scoreboard(g, "board")}<div class="card pad stack-s"><p class="bold">${g.status === "final" ? "Final score entered by the league admin." : g.movedFrom ? `Rained out on ${fmtDay(g.movedFrom)} and moved to ${fmtDay(g.date)}.` : "This game hasn't started."}</p><p class="small muted">${g.status === "final" ? "There's no play-by-play for this game." : "Once a scorekeeper starts, every pitch shows up here live."}</p></div>
      ${staff && g.status === "scheduled" && g.home && g.away ? `<a class="btn btn-green btn-block" href="#/score/${g.id}">Score this game</a>` : ""}`;
  }
  const live = g.status === "live";
  const spray = s.bip.map((x) => ({ x: x.x, y: x.y, color: bipColor(x.r), label: `${nameOf(x.pid)}: ${E.RESULTS[x.r].label}` }));
  return `<div class="cols"><div class="col">${scoreboard(g, "board")}
    ${live ? `<div class="card pad at-bat"><div><span class="eyebrow">At bat</span><b>${esc(nameOf(s.batter))}</b></div><div><span class="eyebrow">Pitching</span><b>${esc(nameOf(s.pitcher))}</b><span class="small muted">${s.pit[s.pitcher]?.P || 0} pitches</span></div></div>` : ""}
    ${lineScore(g, "linescore")}
    ${live && staff ? `<a class="btn btn-green btn-block" href="#/score/${g.id}">Open scorekeeper screen</a>` : ""}
    ${live ? `<p class="small muted">Updates as the scorekeeper enters each pitch. Open this demo in two browser tabs, score in one and watch the other.</p>` : ""}
    </div><div class="col">
    <div class="seg">${[["plays", "Plays"], ["box", "Box score"], ["spray", "Spray"], ["defense", "Defense"]].map(([k, l]) => `<a href="#/game/${g.id}?tab=${k}" class="${tab === k ? "on" : ""}">${l}</a>`).join("")}</div>
    ${tab === "box" ? boxScore(g) : tab === "spray" ? `<div class="card pad">${fieldSvg({ dots: spray })}</div>` : tab === "defense" ? gameDefense(g) : playLog(g, { tour: "plays" })}
    </div></div>`;
}

/* ---------------------------------------------------------------- playoffs */
const PO_ROUND = { 1: "Quarterfinal", 2: "Quarterfinal", 3: "Quarterfinal", 4: "Quarterfinal", 5: "Semifinal", 6: "Semifinal", 7: "Championship" };
const playoffLabel = (g) => (g.slot === 7 ? `Championship · Game ${g.sg}` : PO_ROUND[g.slot] || "Playoffs");
function winnerOf(g) {
  if (!g || g.status !== "final" || !g.score || g.score[0] === g.score[1]) return null;
  return g.score[1] > g.score[0] ? g.home : g.away;
}
function seriesWins() {
  const wins = {};
  W.games.filter((g) => g.slot === 7).forEach((g) => {
    const w = winnerOf(g);
    if (w) wins[w] = (wins[w] || 0) + 1;
  });
  return wins;
}

function viewPlayoffs() {
  if (!S.playoffs) {
    const left = W.games.filter((g) => g.type === "regular" && g.status !== "final").length;
    return `<div class="page-head"><h1 class="h1">Playoffs</h1><p class="muted">The top 8 teams make the playoffs. Quarterfinals and semifinals are one game; the championship is best of 3.</p></div>
      <div class="card pad stack-s" data-tour="bracket"><b>The bracket is set when the regular season ends.</b><p class="small muted">${left} regular-season game${left === 1 ? "" : "s"} left. Then the admin locks the seeds and the quarterfinals appear here: 1 vs 8, 4 vs 5, 2 vs 7, 3 vs 6.</p></div>
      ${sectionHead("If the season ended today")}${standingsTable(W.standings.slice(0, 8), { compact: true, cut: false })}`;
  }
  const seeds = Object.fromEntries(S.playoffs.seeds.map((t, i) => [t, i + 1]));
  const seedRow = (tid, score, won) => `<div class="row seed-row ${won === false ? "dim" : ""}"><span class="seed">${tid ? seeds[tid] : ""}</span>${badge(W.teamById[tid])}<b class="grow ellipsis">${esc(W.teamById[tid]?.name || "TBD")}</b>${score != null ? `<b class="num score-sm">${score}</b>` : ""}</div>`;
  const slot = (n) => W.games.filter((g) => g.slot === n);
  const match = (g) => {
    if (!g) return `<div class="card pad small muted">Waiting on earlier rounds</div>`;
    const w = winnerOf(g);
    const show = g.status === "final" || g.status === "live";
    return `<a class="card match stack-s" href="#/game/${g.id}"><span class="tiny muted">${g.status === "final" ? "Final" : g.status === "live" ? "Live" : g.date ? fmtDay(g.date) + " · " + fmtTime(g.date) : "TBD"}</span>
      ${seedRow(g.away, show ? g.score[0] : null, w ? w === g.away : undefined)}${seedRow(g.home, show ? g.score[1] : null, w ? w === g.home : undefined)}</a>`;
  };
  const series = slot(7).sort((a, b) => a.sg - b.sg);
  const wins = seriesWins();
  const champ = champion();
  return `<div class="page-head"><h1 class="h1">Playoffs</h1><p class="muted">Top 8 from the ${esc(W.season.name)} standings · quarterfinals and semifinals are one game · championship is best of 3</p></div>
    ${champ ? `<a class="champ" href="#/recap"><p class="eyebrow">${esc(W.season.name)} champions</p><p class="h1">${esc(W.teamById[champ].name)}</p></a>` : ""}
    <div class="bracket" data-tour="bracket">
      <div class="round"><h2 class="h2">Quarterfinals</h2>${[1, 2, 3, 4].map((n) => match(slot(n)[0])).join("")}</div>
      <div class="round"><h2 class="h2">Semifinals</h2>${match(slot(5)[0])}${match(slot(6)[0])}</div>
      <div class="round"><h2 class="h2">Championship</h2>${series.length ? `<div class="card pad stack">${[series[0].home, series[0].away].map((t) => `<div class="row">${badge(W.teamById[t], "md")}<b class="grow">${esc(W.teamById[t].name)}</b><b class="num score-sm">${wins[t] || 0}</b></div>`).join("")}
        <div class="list">${series.map((g) => `<a class="row between series-game" href="#/game/${g.id}"><b>Game ${g.sg}</b><span class="small muted">${g.status === "final" ? `${W.teamById[g.away].abbr} ${g.score[0]}, ${W.teamById[g.home].abbr} ${g.score[1]}` : g.status === "canceled" ? "Not needed" : g.status === "live" ? "Live" : "Upcoming"}</span></a>`).join("")}</div></div>` : `<div class="card pad small muted">Waiting on the semifinals</div>`}</div>
    </div>`;
}

// ---- app-stats.js
/* ---------------------------------------------------------------- stats: the site's own columns, qualifying rules, advanced stats and WAR */
/** Innings by position, formatted: "SS 3.0 · P 1.1" */
const posSummary = (byPos) =>
  Object.entries(byPos || {})
    .sort((a, b) => b[1] - a[1])
    .map(([pos, outs]) => `${pos} ${E.inningsPitched(outs)}`)
    .join(" · ");

/** Sortable stat table (the site's COLUMNS). Rate stats only rank qualified players; counting stats show everyone. */
function statTable({ rows, type, sort, dir, limit = 25, showTeam = true, seasonId = W.season.id }) {
  const teamGames = W.teamGamesBy[seasonId] || new Map();
  const cols = HLL.COLUMNS[type].filter((c) => c.key !== "WAR" || rows.some((r) => c.get(r) != null));
  const ranked = HLL.rankBy(rows, type, sort || "", teamGames, dir);
  const col = ranked.col;
  const desc = ranked.desc ?? true;
  let list = ranked.rows;
  if (limit) list = list.slice(0, limit);
  const head = cols
    .map((c) => {
      const on = col && c.key === col.key;
      const next = on ? (desc ? "asc" : "desc") : c.asc ? "asc" : "desc";
      return `<th class="${on ? "sorted" : ""}"><a href="${withQuery({ sort: c.key, dir: next })}">${c.label}${on ? (desc ? " ↓" : " ↑") : ""}</a></th>`;
    })
    .join("");
  return `<div class="card scroll-x" data-tour="stat-table"><table class="stats"><thead><tr>${col ? "<th>#</th>" : ""}<th>Player</th>${head}</tr></thead><tbody>${list
    .map(
      (s, i) => `<tr>${col ? `<td class="muted">${i + 1}</td>` : ""}<td><a class="row player-cell" href="#/player/${s.player_id}">${showTeam ? badge(W.teamById[s.team_id]) : `<span class="tiny muted">#${W.playerById[s.player_id]?.jersey ?? ""}</span>`}<b>${esc(nameOf(s.player_id))}</b></a></td>${cols
        .map((c) => `<td class="${col && c.key === col.key ? "sorted" : ""}">${HLL.formatStat(c, c.get(s))}</td>`)
        .join("")}</tr>`,
    )
    .join("") || `<tr><td colspan="${cols.length + 2}" class="muted">No stats yet.</td></tr>`}</tbody></table></div>`;
}

function leaderCard(type, key, label, n, seasonId) {
  const { col, rows } = HLL.rankBy(statsOf(seasonId), type, key, W.teamGamesBy[seasonId] || new Map());
  const top3 = rows.slice(0, n);
  const val = (s) => (col ? HLL.formatStat(col, col.get(s)) : "");
  const [top, ...rest] = top3;
  const href = `#/stats?${new URLSearchParams({ type, sort: key, ...(seasonId !== W.season.id ? { season: seasonId } : {}) })}`;
  return `<a class="card leader" href="${href}"><p class="eyebrow">${label}</p>
    ${top ? `<div class="leader-top">${badge(W.teamById[top.team_id], "md")}<div class="grow"><b class="ellipsis">${esc(nameOf(top.player_id))}</b><span class="tiny muted">${esc(W.teamById[top.team_id].name)}</span></div><b class="leader-val">${val(top)}</b></div>` : '<p class="small muted">No stats yet.</p>'}
    ${rest.map((s, i) => `<div class="leader-row"><span class="rank">${i + 2}</span><span class="grow ellipsis">${esc(nameOf(s.player_id))} <span class="muted">${esc(W.teamById[s.team_id].abbr)}</span></span><b class="num">${val(s)}</b></div>`).join("")}</a>`;
}
function leadersGrid(list, n, seasonId) {
  return `<div class="leaders" data-tour="leaders">${list.map(([type, key, label]) => leaderCard(type, key, label, n, seasonId)).join("")}</div>`;
}

const STAT_TABS = [["bat", "Hitting"], ["pit", "Pitching"], ["fld", "Fielding"], ["abat", "Advanced hitting"], ["apit", "Advanced pitching"], ["war", "WAR"]];

function viewStats(r) {
  const season = seasonById(r.q.season);
  const view = STAT_TABS.some(([k]) => k === r.q.type) ? r.q.type : "bat";
  const type = view === "pit" ? "pit" : "bat";
  const rows = statsOf(season.id);
  const scored = W.scoredBy[season.id] || [];
  const tabs = `<div class="tabs-inline" data-tour="stat-tabs">${STAT_TABS.map(([k, l]) => `<a href="${withQuery({ type: k === "bat" ? null : k, sort: null, dir: null })}" class="${view === k ? "on" : ""}">${l}</a>`).join("")}</div>`;
  const csvFile = { pit: "pitching", apit: "pitching", fld: "fielding" }[view] || "hitting";
  const tools = `<div class="row wrap"><a class="btn btn-secondary btn-sm" href="#/records" data-tour="records-link">All-time records</a><a class="btn btn-secondary btn-sm" href="#/recap${season.id !== W.season.id ? "?season=" + season.id : ""}">Season recap</a><a class="btn btn-secondary btn-sm" href="#/innings">Innings by position</a><button class="btn btn-secondary btn-sm" data-act="csv" data-file="${csvFile}" data-season="${season.id}" data-tour="csv">Download CSV</button></div>`;
  const head = `<div class="page-head"><h1 class="h1">Stats</h1><p class="muted">${esc(season.name)}${season.id === PAST.id ? " · from the league's spreadsheets" : ` · from ${scored.length} games scored pitch by pitch`}</p></div>${seasonPicker(season.id, { sort: null, dir: null })}${tabs}${tools}`;
  const needsPitchData = ["fld", "abat", "apit", "war"].includes(view) && !scored.length;
  if (needsPitchData)
    return `${head}<p class="card pad muted">${view === "war" ? "WAR" : view === "fld" ? "Fielding" : "Advanced stats"} come from games scored pitch by pitch on the site. ${esc(season.name)} was imported from spreadsheets, which don't have that detail. Pick ${esc(CUR.name)} above.</p>`;
  if (view === "fld") return head + fieldingView(season, scored, r);
  if (view === "abat" || view === "apit") return head + advancedView(view, scored, r);
  if (view === "war") return head + warView(scored, r);
  const sort = r.q.sort || (type === "bat" ? "OPS" : "K");
  const cats = HLL.LEADER_CATEGORIES.filter((c) => c.type === type && (c.key !== "WAR" || rows.some((s) => s.war != null)));
  return `${head}
    ${sectionHead("League leaders")}
    ${leadersGrid(cats.map((c) => [c.type, c.key, c.label]), 5, season.id)}
    ${sectionHead("Top 25", `<span class="small muted">Click a column to sort</span>`)}
    <p class="small muted" data-tour="qualify">Rate stats (AVG, OBP, SLG, OPS, ERA, WHIP) need ${esc(HLL.QUAL_TEXT)} to qualify. Counting stats (H, HR, RBI, K…) show everyone.</p>
    ${statTable({ rows, type, sort, dir: r.q.dir, seasonId: season.id })}`;
}

/* ---- the site's AdvancedTable: sortable through the URL, rate stats need the minimum */
function advTable(rows, columns, { sort, dir, qualifies, limit = 25, tour = "adv-table" }) {
  const col = columns.find((c) => c.key === sort) || columns[1];
  const desc = dir ? dir === "desc" : !col.asc;
  const pool = rows.filter((x) => (col.rate ? qualifies(x) : true) && col.get(x) != null);
  const shown = pool.sort((a, b) => ((col.get(b) ?? 0) - (col.get(a) ?? 0)) * (desc ? 1 : -1)).slice(0, limit);
  return `<div class="card scroll-x" data-tour="${tour}"><table class="stats"><thead><tr><th>#</th><th>Player</th>${columns
    .map((c) => {
      const on = c === col;
      const next = on ? (desc ? "asc" : "desc") : c.asc ? "asc" : "desc";
      return `<th class="${on ? "sorted" : ""}" title="${esc(c.help)}"><a href="${withQuery({ sort: c.key, dir: next })}">${c.label}${on ? (desc ? " ↓" : " ↑") : ""}</a></th>`;
    })
    .join("")}</tr></thead><tbody>${shown
    .map((x, i) => `<tr><td class="muted">${i + 1}</td><td><a class="row player-cell" href="#/player/${x.player_id}">${badge(W.teamById[x.team_id])}<b>${esc(nameOf(x.player_id))}</b></a></td>${columns.map((c) => `<td class="${c === col ? "sorted" : ""}">${HLL.fmtAdv(c.kind, c.get(x))}</td>`).join("")}</tr>`)
    .join("") || `<tr><td colspan="${columns.length + 2}" class="muted">No stats yet.</td></tr>`}</tbody></table></div>`;
}
function glossary(columns) {
  return `<details class="card pad small" data-tour="glossary"><summary class="bold">What these stats mean</summary><dl class="glossary">${columns.map((c) => `<div><dt>${esc(c.label)}:</dt> <dd>${esc(c.help)}</dd></div>`).join("")}</dl></details>`;
}
function scoredGamesFor(scored) {
  return new Map(W.teams.map((t) => [t.id, scored.filter((g) => g.teamIds.includes(t.id)).length]));
}

function advancedView(view, scored, r) {
  const adv = HLL.advancedFromGames(scored);
  const games = scoredGamesFor(scored);
  if (view === "abat") {
    const cols = HLL.ADV_BAT;
    return `<p class="small muted">Stats from every pitch. Percentages rank players with at least ${HLL.QUAL_PA} plate appearances per game their team has played; counting stats show everyone. Hover a column name, or open the list below.</p>
      ${advTable(adv.bat, cols, { sort: r.q.sort || "QABP", dir: r.q.dir, qualifies: (x) => x.PA >= HLL.minPa(HLL.gamesFor(games, x.team_id)) })}${glossary(cols)}`;
  }
  const cols = HLL.advPitColumns(HLL.fipConstant(adv.pit));
  return `<p class="small muted">Pitch by pitch. Percentages rank pitchers on pace for ${HLL.QUAL_IP} innings over a ${HLL.SEASON_GAMES}-game season; counting stats show everyone.</p>
    ${advTable(adv.pit, cols, { sort: r.q.sort || "SP", dir: r.q.dir, qualifies: (x) => x.outs >= HLL.minOuts(HLL.gamesFor(games, x.team_id)) })}${glossary(cols)}`;
}

function warView(scored, r) {
  const { lines, league } = HLL.warFromGames(scored);
  return `<p class="small muted" data-tour="war-note">Wins above replacement: how many more wins a player was worth than a bench player would have been, counting hitting, baserunning, fielding and pitching. It's measured against this league, where it takes about ${league.rpw.toFixed(0)} extra runs to win one more game. Over a short season most kids land between −0.5 and +1.5, so small differences don't mean much. Fielding only counts errors, since the site can't measure range.</p>
    ${advTable(lines, HLL.WAR_COLUMNS, { sort: r.q.sort || "WAR", dir: r.q.dir, qualifies: () => true, tour: "war-table" })}${glossary(HLL.WAR_COLUMNS)}`;
}

function fieldingView(season, scored, r) {
  const lines = HLL.fieldingFromGames(scored).map((l) => ({ ...l, POS: Object.entries(l.outsAt).sort((a, b) => b[1] - a[1])[0]?.[0] || "", TC: l.po + l.a + l.e }));
  const cols = [
    { key: "POS", label: "Main pos", help: "Where they played most", get: (x) => null, text: (x) => x.POS },
    { key: "INN", label: "INN", help: "Innings in the field", get: (x) => x.totalOuts, kind: "ip" },
    { key: "PO", label: "PO", help: "Putouts", get: (x) => x.po },
    { key: "A", label: "A", help: "Assists", get: (x) => x.a },
    { key: "E", label: "E", help: "Errors", get: (x) => x.e, asc: true },
    { key: "TC", label: "TC", help: "Total chances", get: (x) => x.TC },
    { key: "FPCT", label: "FLD%", help: "Fielding percentage: (putouts + assists) / chances. Needs 3 chances.", get: (x) => HLL.fieldingPct(x), kind: "rate3", rate: true },
  ];
  const sort = r.q.sort || "INN";
  const col = cols.find((c) => c.key === sort) || cols[1];
  const desc = r.q.dir ? r.q.dir === "desc" : !col.asc;
  const shown = lines.filter((x) => (col.rate ? x.TC >= 3 : true) && col.get(x) != null).sort((a, b) => ((col.get(b) ?? 0) - (col.get(a) ?? 0)) * (desc ? 1 : -1)).slice(0, 25);
  return `<p class="small muted">From games scored on the site: putouts, assists and errors from each play, innings from who was at each position.</p>
    <div class="card scroll-x"><table class="stats"><thead><tr><th>#</th><th>Player</th>${cols.map((c) => (c.text ? `<th>${c.label}</th>` : `<th class="${c === col ? "sorted" : ""}"><a href="${withQuery({ sort: c.key, dir: c === col ? (desc ? "asc" : "desc") : c.asc ? "asc" : "desc" })}">${c.label}</a></th>`)).join("")}</tr></thead><tbody>${shown
      .map((x, i) => `<tr><td class="muted">${i + 1}</td><td><a class="row player-cell" href="#/player/${x.player_id}">${badge(W.teamById[x.team_id])}<b>${esc(nameOf(x.player_id))}</b></a></td>${cols.map((c) => `<td>${c.text ? c.text(x) : HLL.fmtAdv(c.kind, c.get(x))}</td>`).join("")}</tr>`)
      .join("")}</tbody></table></div>`;
}

/* ---------------------------------------------------------------- innings by position */
const FIELD_POS = ["P", "C", "1B", "2B", "3B", "SS", "LF", "CF", "RF"];
function inningsTable(pids, def, { showTeam = false } = {}) {
  const rows = pids
    .map((pid) => ({ pid, byPos: def[pid] || {}, total: Object.values(def[pid] || {}).reduce((a, b) => a + b, 0) }))
    .sort((a, b) => b.total - a.total);
  const max = Math.max(1, ...rows.flatMap((r) => Object.values(r.byPos)));
  return `<div class="card scroll-x" data-tour="innings-table"><table class="innings"><thead><tr><th>Player</th>${FIELD_POS.map((p) => `<th>${p}</th>`).join("")}<th>Total</th></tr></thead><tbody>${rows
    .map(
      (r) => `<tr><td><a class="row player-cell" href="#/player/${r.pid}">${showTeam ? badge(teamOf(r.pid)) : `<span class="tiny muted">#${W.playerById[r.pid]?.jersey ?? ""}</span>`}<b>${esc(nameOf(r.pid))}</b></a></td>${FIELD_POS.map((pos) => {
        const o = r.byPos[pos] || 0;
        return `<td class="inn-cell" style="${o ? `background:rgba(11,37,69,${(0.08 + 0.4 * (o / max)).toFixed(2)})` : ""}">${o ? E.inningsPitched(o) : ""}</td>`;
      }).join("")}<td class="bold">${r.total ? E.inningsPitched(r.total) : "–"}</td></tr>`,
    )
    .join("")}</tbody></table></div>`;
}

function viewInnings(r) {

/* ---------------------------------------------------------------- all-time records */
function recordCard(entries, col, label) {
  const [top, ...rest] = entries;
  const val = (v) => HLL.formatStat(col, v);
  return `<div class="card leader record"><p class="eyebrow">${label}</p>
    ${top ? `<div class="leader-top">${badge(W.teamById[top.teamId], "md")}<div class="grow"><a href="#/player/${top.playerId}"><b class="ellipsis">${esc(nameOf(top.playerId))}</b></a><span class="tiny muted">${esc(W.teamById[top.teamId].name)} · ${esc(top.label)}</span></div><b class="leader-val">${val(top.value)}</b></div>` : '<p class="small muted">No records yet.</p>'}
    ${rest.map((e, i) => `<div class="leader-row"><span class="rank">${i + 2}</span><a class="grow ellipsis" href="#/player/${e.playerId}">${esc(nameOf(e.playerId))} <span class="muted">${esc(W.teamById[e.teamId].abbr)} · ${esc(e.label)}</span></a><b class="num">${val(e.value)}</b></div>`).join("")}</div>`;
}

function viewRecords(r) {
  const view = r.q.view === "career" ? "career" : r.q.view === "team" ? "team" : "season";

  const typeSeg = view === "team" ? "" : `<div class="seg seg-inline">${[["bat", "Hitting"], ["pit", "Pitching"]].map(([k, l]) => `<a href="${withQuery({ type: k === "bat" ? null : k })}" class="${type === k ? "on" : ""}">${l}</a>`).join("")}</div>`;
  const note = view === "career" ? `Career totals across every season on the site. Rate stats need ${HLL.CAREER_MIN.pa} career plate appearances or ${HLL.CAREER_MIN.outs / 3} innings.` : view === "season" ? `The best single seasons. Rate stats need ${HLL.QUAL_TEXT}.` : "Best team seasons.";

    <div class="tabs-inline" data-tour="records-tabs">${tabs}</div>${typeSeg}<p class="small muted">${note}</p>${body}`;
}

function teamRecords(seasons) {
  const rows = seasons.flatMap((s) => (W.standingsBy[s.id] || []).filter((x) => x.gp).map((x) => ({ ...x, season: s.name })));
  const card = (label, key, fmt, asc = false) => {
    const list = [...rows].sort((a, b) => (asc ? a[key] - b[key] : b[key] - a[key]) || b.diff - a.diff).slice(0, 5);
    const [top, ...rest] = list;
    if (!top) return "";
    return `<div class="card leader record"><p class="eyebrow">${label}</p>
      <div class="leader-top">${badge(top.team, "md")}<div class="grow"><b class="ellipsis">${esc(top.team.name)}</b><span class="tiny muted">${esc(top.season)} · ${top.w}-${top.l}${top.t ? "-" + top.t : ""}</span></div><b class="leader-val">${fmt(top[key])}</b></div>
      ${rest.map((x, i) => `<div class="leader-row"><span class="rank">${i + 2}</span><span class="grow ellipsis">${esc(x.team.name)} <span class="muted">${esc(x.season)}</span></span><b class="num">${fmt(x[key])}</b></div>`).join("")}</div>`;
  };
  const champs = S.champions || [];
  const champ = champion();
  const list = [...(champ ? [{ team: champ, season: W.season.name }] : []), ...champs];
  return `<div class="leaders">${card("Most wins", "w", String)}${card("Best win %", "pct", (v) => HLL.formatPct(v, 1))}${card("Most runs scored", "rf", String)}${card("Fewest runs allowed", "ra", String, true)}${card("Best run differential", "diff", (v) => (v > 0 ? "+" + v : String(v)))}</div>
    ${sectionHead("Champions")}
    <div class="card list">${list.map((c) => `<div class="list-item">${badge(W.teamById[c.team], "md")}<b class="grow">${esc(W.teamById[c.team].name)}</b><span class="muted">${esc(c.season)}</span></div>`).join("") || `<p class="pad small muted">Champions are added here each season.</p>`}</div>`;
}

/* ---------------------------------------------------------------- CSV downloads (same columns as the site's) */
function csvText(header, rows) {
  const cell = (v) => {
    const s = v == null ? "" : String(v);
    const safe = /^[=+\-@]/.test(s) && !/^-?\d/.test(s) ? `'${s}` : s;
    return /[",\n\r]/.test(safe) ? `"${safe.replace(/"/g, '""')}"` : safe;
  };
  return [header, ...rows].map((r) => r.map(cell).join(",")).join("\r\n") + "\r\n";
}
ACT["csv"] = (el) => {
  const season = seasonById(el.dataset.season);
  const file = el.dataset.file;
  const stats = statsOf(season.id);
  const games = W.teamGamesBy[season.id] || new Map();
  const tname = (id) => W.teamById[id]?.name || "";
  const jersey = (pid) => W.playerById[pid]?.jersey ?? "";
  const rate = (v, d = 3) => (v == null ? "" : v.toFixed(d));
  const qual = (have, need, fmt) => [have >= need ? "Yes" : "No", fmt(need), have >= need ? "" : fmt(need - have)];
  let text;
  if (file === "hitting")
    text = csvText(
      ["Player", "Jersey", "Team", "G", "PA", "AB", "R", "H", "2B", "3B", "HR", "RBI", "BB", "K", "HBP", "TB", "AVG", "OBP", "SLG", "OPS", "WAR", "Qualified", "PA needed", "PA short"],
      stats.filter((s) => (s.pa ?? 0) > 0).map((s) => [nameOf(s.player_id), jersey(s.player_id), tname(s.team_id), s.g, s.pa, s.ab, s.r, s.h, s.doubles, s.triples, s.hr, s.rbi, s.bb, s.so, s.hbp, s.tb, rate(HLL.avg(s)), rate(HLL.obp(s)), rate(HLL.slg(s)), rate(HLL.ops(s)), rate(s.war ?? null, 1), ...qual(s.pa ?? 0, HLL.minPa(games.get(s.team_id) ?? 0), (n) => n)]),
    );
  else if (file === "pitching")
    text = csvText(
      ["Player", "Jersey", "Team", "G", "IP", "W", "L", "SV", "HLD", "H", "R", "ER", "BB", "K", "Pitches", "ERA", "WHIP", "Pitching WAR", "Qualified", "IP needed", "IP short"],
      stats.filter((s) => (s.outs ?? 0) > 0).map((s) => [nameOf(s.player_id), jersey(s.player_id), tname(s.team_id), s.p_g, HLL.fmtIp(s.outs), s.w, s.l, s.sv, s.hld, s.p_h, s.p_r, s.er, s.p_bb, s.p_so, s.pitches, rate(HLL.era(s), 2), rate(HLL.whip(s), 2), rate(s.pit_war ?? null, 1), ...qual(s.outs ?? 0, HLL.minOuts(games.get(s.team_id) ?? 0), HLL.fmtIp)]),
    );
  else if (file === "fielding")
    text = csvText(["Player", "Jersey", "Team", "G", "Innings", "PO", "A", "E", "FPCT", ...FIELD_POS.map((p) => `Inn ${p}`)], HLL.fieldingFromGames(W.scoredBy[season.id] || []).map((l) => [nameOf(l.player_id), jersey(l.player_id), tname(l.team_id), l.g, HLL.fmtIp(l.totalOuts), l.po, l.a, l.e, rate(HLL.fieldingPct(l)), ...FIELD_POS.map((p) => (l.outsAt[p] ? HLL.fmtIp(l.outsAt[p]) : ""))]));
  else if (file === "standings") text = csvText(["Place", "Team", "GP", "W", "L", "T", "PCT", "GB", "RF", "RA", "Diff", "Streak"], (W.standingsBy[season.id] || []).map((r, i) => [i + 1, r.team.name, r.gp, r.w, r.l, r.t, r.pct.toFixed(3), r.gb, r.rf, r.ra, r.diff, r.streak]));
  else if (file === "schedule") text = csvText(["Date", "Time", "Field", "Away", "Home", "Status", "Away score", "Home score", "Type"], W.games.map((g) => [dayKey(g.date), fmtTime(g.date), g.field, tname(g.away), tname(g.home), g.status, g.score?.[0] ?? "", g.score?.[1] ?? "", g.type === "playoff" ? playoffLabel(g) : "Regular season"]));
  else text = csvText(["Team", "Jersey", "Player", "League age", "Positions"], W.players.map((p) => [tname(p.team), p.jersey, p.name, p.age, (p.pos || []).join(" ")]));
  download(`${season.name.replace(/\W+/g, "-").toLowerCase()}-${file}.csv`, text);
  toast(`Downloaded ${file}.csv. It opens in Excel or Google Sheets.`);
};

/* ---------------------------------------------------------------- scorekeeper */
let SK = null; // in-progress flow: { kind: "play"|"runner"|"sub", step, loc, bb, result, fielders, moves, runnerKind, err }

function viewScore(r) {
  if (r.parts[1]) return viewScoring(r.parts[1]);
  const today = todayKey();
  const live = W.games.filter((g) => g.status === "live");
  const todays = W.games.filter((g) => g.status === "scheduled" && g.home && g.away && g.date && dayKey(g.date) <= today);
  const soon = W.games.filter((g) => g.status === "scheduled" && g.home && g.away && g.date && dayKey(g.date) > today).slice(0, 5);
  const item = (g, label, cls) => {
    const who = S.staff.find((u) => u.id === S.assign[g.id]);
    const tag = who ? `<span class="tag ${who.email === S.account.email ? "tag-good" : ""}">${who.email === S.account.email ? "Assigned to you" : "Assigned to " + esc(who.name)}</span>` : "";

    ${W.gameById.practice && W.gameById.practice.status !== "scheduled" ? `<a class="card pad row" href="#/score/practice"><div class="grow"><b>Continue practice game</b><p class="small muted">${esc(W.teamById[W.gameById.practice.away].abbr)} at ${esc(W.teamById[W.gameById.practice.home].abbr)} · ${W.gameById.practice.status}</p></div><span class="chev">›</span></a>` : ""}
    ${live.length ? `<h2 class="h2">In progress</h2>${live.map((g) => item(g, "Continue", "btn-green")).join("")}` : ""}
    ${todays.length ? `<h2 class="h2">Today</h2>${todays.map((g) => item(g, "Start", "btn-primary")).join("")}` : ""}
    ${soon.length ? `<h2 class="h2">Coming up</h2>${soon.map((g) => item(g, "Start early", "btn-secondary")).join("")}` : ""}

}

/** The game as this phone sees it: saved plays plus any still waiting for a signal. */
function localGame(g) {
  const pend = S.pending[g.id] || [];
  if (!pend.length || !g.setup) return g;
  const events = [...(g.events || []), ...pend];
  const rep = E.replay({ setup: g.setup, events }, W.rules, W.names);
  return { ...g, events, rep, score: [...rep.score], status: rep.status === "final" ? "final" : "live" };
}

function offlineBar(g) {
  const n = (S.pending[g.id] || []).length;
  return `<div class="card pad row offline-bar ${S.offline ? "off" : ""}" data-tour="sk-offline"><div class="grow"><b>${S.offline ? "No signal" : "Online"}</b><div class="small muted">${S.offline ? `Keep scoring. ${n} play${n === 1 ? "" : "s"} saved on this phone will send as soon as there's a signal.` : "Every entry is saved right away."}</div></div>
    <label class="switch-inline small"><input type="checkbox" data-change="offline" ${S.offline ? "checked" : ""}> Demo: pretend there's no signal</label></div>`;
}

  const s = g.rep;

      <div class="row between" style="margin-top:6px"><span class="small bold muted">PITCHING · ${esc(nameOf(s.pitcher))}${age ? ` (age ${age})` : ""}</span><span class="small bold num">${pc} / ${limit}</span></div>
      <div class="pc-bar ${pcCls}"><i style="width:${Math.min(100, (pc / limit) * 100)}%"></i></div>
      ${pc >= limit ? `<p class="notice bad">Pitch limit reached. Change pitchers (Lineup → Pitch).</p>` : pc >= limit - 10 ? `<p class="notice warn">${limit - pc} pitches left before the Little League limit.</p>` : ""}
    </div>
    <div class="desk-only stack"><div class="section-head"><h2 class="h2">Recent plays</h2><a href="#/game/${g.id}">Fan view ↗</a></div>${playLog(g, { limit: 8 })}</div>
    </div><div class="col">
    <div class="sk-grid" data-tour="sk-pitch">

      <button class="sk-btn sk-strike" data-act="sk-pitch" data-r="SS">Strike<small>swinging</small></button>
      <button class="sk-btn sk-foul" data-act="sk-pitch" data-r="F">Foul<small>${s.strikes === 2 ? "stays 2 strikes" : ""}</small></button>
      <button class="sk-btn sk-play" data-act="sk-inplay" data-tour="sk-inplay">Ball in play</button>
    </div>
    <div class="sk-grid" data-tour="sk-more">
      <button class="sk-btn sk-mini" data-act="sk-hbp">Hit by pitch</button>

      <button class="btn btn-danger" data-act="sk-end">End game</button>
    </div>
    <div class="mobile-only stack"><div class="section-head"><h2 class="h2">Recent plays</h2><a href="#/game/${g.id}">Fan view ↗</a></div>${playLog(g, { limit: 6 })}</div>
    </div></div>`;
}

function eventLabel(ev) {
  switch (ev.t) {
    case "pitch": return { B: "Ball", CS: "Strike looking", SS: "Strike swinging", F: "Foul" }[ev.r];
    case "hbp": return "Hit by pitch";
    case "play": return E.RESULTS[ev.r].label;
    case "runner": return { SB: "Stolen base", CS: "Caught stealing", WP: "Wild pitch", PB: "Passed ball", PK: "Pickoff" }[ev.k];
    case "sub": return "Substitution";
    case "pos": return "Position change";
    case "end": return "End game";
  }
  return "";
}

/** The lineup a game will start with: whatever the scorekeeper set, or the suggested one. */
function draftSetup(g) {
  return S.lineups[g.id] || E.setupFor(g, playersForGame(g));
}
const cloneSetup = (x) => JSON.parse(JSON.stringify(x));

          <span class="lu-move"><button class="btn btn-sm btn-secondary" data-act="lu-move" data-g="${g.id}" data-t="${t}" data-i="${i}" data-d="-1" ${i ? "" : "disabled"} aria-label="Move up">↑</button><button class="btn btn-sm btn-secondary" data-act="lu-move" data-g="${g.id}" data-t="${t}" data-i="${i}" data-d="1" ${i < setup.lineups[t].length - 1 ? "" : "disabled"} aria-label="Move down">↓</button></span></div>`,
        )

  };
  return `${scoreboard(g)}
    <div class="stack-s" data-tour="lineup-editor">
