function viewFantasyLeague(r) {
  const L = leagueById(r.parts[1]);
  if (!L) return `<p>League not found.</p>`;
  const me = myTeam(L);
  const drafted = L.draft.status === "done";
  const tab = r.parts[2] || (drafted ? "team" : "draft");
  const pending = L.trades.filter((t) => t.status === "pending" && t.to === me.id).length;
  const tabs = drafted
    ? [["team", "Team"], ["standings", "Standings"], ["players", "Players"], ["trades", `Trades${pending ? ` (${pending})` : ""}`], ["activity", "Activity"], ["draft", "Draft"], ["settings", "Settings"]]
    : [["draft", L.draft.status === "drafting" ? "Draft room" : "Draft"], ["teams", "Teams"], ["settings", "Settings"]];
  const views = { team: teamTab, standings: standingsTab, players: playersTab, trades: tradesTab, trade: tradeBuilder, activity: activityTab, draft: draftTab, teams: teamsTab, settings: settingsTab };
  const body = (views[tab] || draftTab)(L, r);
  const over = seasonOver(L);
  return `<a class="link back" href="#/fantasy">‹ Fantasy</a>
    <div class="page-head"><h1 class="h1">${esc(me.name)}</h1><p class="muted">${esc(L.name)} · ${esc(seasonById(L.season).name)} · ${L.size} teams · ${leagueSettings(L).type === "h2h" ? "Head-to-head" : "Points"} · ${L.public ? "Public" : L.code ? `Private · code ${esc(L.code)}` : "Private"} · Commissioner: ${esc(L.commissioner)}</p></div>
    ${over && drafted ? `<p class="notice warn">The ${esc(seasonById(L.season).name)} season is over, so moves are closed. ${isCommish(L) ? `<a class="link" href="#/fantasy/${L.id}/settings">Bring the league back</a> for next season.` : "The commissioner can bring the league back next season."}</p>` : ""}
    <div class="tabs-inline">${tabs.map(([k, l]) => `<a href="#/fantasy/${L.id}/${k}" class="${tab === k || (k === "trades" && tab === "trade") ? "on" : ""}">${l}</a>`).join("")}</div>${body}`;
}

function teamTab(L, r) {
  const me = myTeam(L);
  const team = teamById(L, r.q.team) || me;
  const mine = team.mine;
  const sc = leagueScores(L).get(team.id);
  const proj = projections(L);
  const rows = rosterNow(L, team.id);
  const slots = slotsOf(L);
  const over = seasonOver(L);
  const line = (row) => {
    const pid = row.player_id;
    const pts = sc?.players.get(pid)?.points || 0;
    const moving = S.fMove === pid && mine;
    return `<div class="list-item ${moving ? "picked" : ""}"><span class="slot">${slots[row.slot_index] === "ST" ? "ST" : "BN"}</span>${badge(teamOf(pid, L.season))}<div class="grow"><a href="#/player/${pid}"><b>${esc(nameOf(pid))}</b></a><div class="tiny muted">${esc(posLabel(W.playerById[pid]))} · ${fmtPts(proj.get(pid)?.now.bat + proj.get(pid)?.now.pit || 0)} pts this season${lockedToday(L, pid) ? ' · <b class="warn-text">Game started today</b>' : ""}</div></div><b class="num" title="Points while in your starting lineup">${fmtPts(pts)}</b>
      ${mine && !over ? `<button class="btn btn-sm btn-secondary" data-act="f-move" data-l="${L.id}" data-pid="${pid}">${S.fMove ? (moving ? "Cancel" : "Here") : "Move"}</button>` : ""}</div>`;
  };
  return `<div class="row wrap"><div class="chips grow">${L.teams.map((t) => `<a class="chip ${t.id === team.id ? "on" : ""}" href="${withQuery({ team: t.mine ? null : t.id })}">${esc(t.name)}</a>`).join("")}</div></div>
    ${mine && !over ? `<p class="notice" data-tour="fantasy-lock">Swap starters and bench players any time, as long as neither one's game today has already started. Each game counts for whoever is starting the player when it begins. Everyone in your 9 starting spots scores both hitting and pitching points; the bench doesn't score.</p>` : ""}
    <div class="card list" data-tour="fantasy-myteam"><div class="list-item small bold muted">Starters</div>${rows.filter((x) => x.slot_index < HLL.STARTERS).map(line).join("")}
      <div class="list-item small bold muted">Bench</div>${rows.filter((x) => x.slot_index >= HLL.STARTERS).map(line).join("") || '<p class="pad small muted">Empty</p>'}
      <div class="list-item total-row"><span class="grow">Season total</span><b class="num">${fmtPts(sc?.total || 0)}</b></div></div>
    ${sc && sc.players.size ? `<details class="card pad small"><summary class="bold">Players no longer on this team</summary><div class="stack-s" style="margin-top:8px">${[...sc.players.values()].filter((p) => !rows.some((x) => x.player_id === p.playerId)).map((p) => `<div class="row between"><span>${esc(nameOf(p.playerId))}</span><b class="num">${fmtPts(p.points)}</b></div>`).join("") || '<p class="muted">Nobody yet.</p>'}</div><p class="tiny muted">Points stay with the team that started a player that week.</p></details>` : ""}`;
}

function standingsTab(L) {
  if (leagueSettings(L).type === "h2h") return h2hStandings(L);
  const st = fantasyStandings(L);
  const weeks = L.season === PAST.id ? [] : W.weeks.filter((w) => w.start <= NOW);
  const cur = HLL.weekOf(W.weeks, NOW);
  return `<div class="card scroll-x" data-tour="fantasy-standings"><table><thead><tr><th>Team</th>${weeks.map((w) => `<th class="${cur?.n === w.n ? "sorted" : ""}">W${w.n}</th>`).join("")}<th>Total</th><th>Back</th></tr></thead><tbody>${st
    .map((x, i) => `<tr class="${x.team.mine ? "mine" : ""}"><td><span class="rank">${i + 1}</span> <a href="#/fantasy/${L.id}/team?team=${x.team.id}"><b>${esc(x.team.name)}</b></a><div class="tiny muted">${esc(x.team.owner)}</div></td>${weeks.map((w) => `<td class="${cur?.n === w.n ? "sorted" : ""}">${fmtPts(x.score?.byWeek.get(w.start) || 0)}</td>`).join("")}<td><b>${fmtPts(x.total)}</b></td><td class="muted">${i ? fmtPts(st[0].total - x.total) : "–"}</td></tr>`)
    .join("")}</tbody></table></div>
    <p class="small muted">${L.season === PAST.id ? "Season totals for each team's starters. During a season, points are counted game by game." : `Points by week. ${cur ? `Week ${cur.n} is in progress.` : ""} Each game counts for whoever had the player in a starting spot when that week's lineups locked.`}</p>`;
}

function h2hStandings(L) {
  const scores = leagueScores(L);
  const s = leagueSettings(L);
  const allWeeks = leagueWeeks(L);
  // Weekly matchups need points week by week (a season scored game by game on the site).
  if (!allWeeks.some((w) => w.start <= NOW) || ![...scores.values()].some((x) => x.byWeek.size))
    return `<p class="notice">This is a head-to-head league: each week you play one other team, and the standings are your win-loss record. Weekly matchups need a season scored game by game on the site; ${esc(seasonById(L.season).name)} came from the league's records, so here are total points instead.</p>${pointsTable(L)}${playoffPlan(L)}`;
  const start = HLL.playoffStart(s, allWeeks.length);
  const { table, matchups } = HLL.h2hStandings(L.teams.map((t) => t.id), allWeeks, scores, start, NOW);
  const field = HLL.playoffField(s.playoffTeams, L.teams.length);
  const seeds = table.slice(0, field).map((r) => r.teamId);
  const bracket = start != null ? HLL.playoffBracket(seeds, start, allWeeks, scores, NOW) : [];
  const cur = HLL.weekOf(allWeeks, NOW);
  const inPlayoffs = start != null && cur && cur.n >= start;
  const shownWeek = inPlayoffs ? start - 1 : cur?.n ?? matchups.at(-1)?.week;
  const shown = matchups.filter((m) => m.week === shownWeek);
  const nm = (id) => (id ? esc(teamById(L, id).name) : "Bye");
  return `<div class="card scroll-x" data-tour="fantasy-standings"><table><thead><tr><th>Team</th><th>W</th><th>L</th><th>T</th><th>PF</th><th>PA</th></tr></thead><tbody>${table.map((x, i) => { const team = teamById(L, x.teamId); return `<tr class="${team.mine ? "mine" : ""} ${i === field ? "cut" : ""}"><td><span class="rank">${i + 1}</span> <b>${esc(team.name)}</b></td><td><b>${x.w}</b></td><td>${x.l}</td><td>${x.t}</td><td>${fmtPts(x.pf)}</td><td class="muted">${fmtPts(x.pa)}</td></tr>`; }).join("")}</tbody></table></div>
    <p class="small muted">Each week you play one team; more points that week wins. The top ${field} make the playoffs${start != null ? `, starting week ${start} (${weeksText(HLL.playoffRounds(field))}, one round a week)` : ""}.</p>
    ${shown.length && !inPlayoffs ? `${sectionHead(`Week ${shownWeek} matchups`)}<div class="card list">${shown.map((m) => `<div class="list-item"><b class="grow">${nm(m.a)}</b><span class="num">${m.b ? `${fmtPts(m.pa)} – ${fmtPts(m.pb)}` : "bye"}</span><b class="grow" style="text-align:right">${m.b ? nm(m.b) : ""}</b></div>`).join("")}</div>` : ""}
    ${bracket.length ? `${sectionHead(inPlayoffs ? "Playoffs" : "Playoffs (if the season ended today)")}<div class="cols">${bracket.map((games, r) => `<div class="col card list"><div class="list-item"><b class="small muted">${HLL.roundName(r + 1, bracket.length).toUpperCase()} · WEEK ${start + r}</b></div>${games.map((g) => [[g.a, g.pa], [g.b, g.pb]].map(([seed, pts]) => `<div class="list-item"><span class="grow ${g.winner && g.winner === seed ? "bold" : ""}">${seed ? `${seed}. ${nm(seeds[seed - 1])}` : '<span class="muted">TBD</span>'}</span>${seed && inPlayoffs && cur.n >= start + r ? `<span class="num">${fmtPts(pts)}</span>` : ""}</div>`).join("")).join('<div class="list-item"></div>')}</div>`).join("")}</div>${field === 6 ? '<p class="small muted">Seeds 1 and 2 have a bye in the first round.</p>' : ""}` : ""}`;
}
/** The playoffs this league is set up for, in words. */
function playoffPlan(L) {
  const s = leagueSettings(L);
  const weeks = leagueWeeks(L).length;
  const field = HLL.playoffField(s.playoffTeams, L.teams.length);
  const rounds = HLL.playoffRounds(field);
  const start = HLL.playoffStart(s, weeks);
  if (!weeks) return `<p class="small muted">Playoffs: the top ${field} teams, the last ${weeksText(rounds)} of the season.</p>`;
  if (start == null) return `<p class="small muted">The season is too short for ${field} playoff teams.</p>`;
  return `<p class="small"><b>Playoffs:</b> the top ${field} teams, weeks ${start}${rounds > 1 ? `–${start + rounds - 1}` : ""} (${weeksText(rounds)}, one round a week)${field === 6 ? "; seeds 1 and 2 get a bye" : ""}.</p>`;
}
function pointsTable(L) {
  const st = fantasyStandings(L);
  return `<div class="card scroll-x"><table><thead><tr><th>Team</th><th>Total</th></tr></thead><tbody>${st.map((x, i) => `<tr class="${x.team.mine ? "mine" : ""}"><td><span class="rank">${i + 1}</span> <b>${esc(x.team.name)}</b></td><td><b>${fmtPts(x.total)}</b></td></tr>`).join("")}</tbody></table></div>`;
}

function playersTab(L, r) {
  const proj = projections(L);
  const faOnly = r.q.fa !== "0";
  const q = (r.q.q || "").toLowerCase();
  const list = fantasyPool(L)
    .filter((p) => (!faOnly || !ownerOf(L, p.id)) && (!q || p.name.toLowerCase().includes(q)))
    .sort((a, b) => (proj.get(b.id)?.value || 0) - (proj.get(a.id)?.value || 0))
    .slice(0, 40);
  const over = seasonOver(L);
  return `<div class="row wrap"><a class="chip ${faOnly ? "on" : ""}" href="${withQuery({ fa: null })}">Free agents</a><a class="chip ${faOnly ? "" : "on"}" href="${withQuery({ fa: "0" })}">All players</a><input class="input grow" style="max-width:220px" placeholder="Search players" value="${esc(r.q.q || "")}" data-change="f-search" aria-label="Search players"></div>
    <div class="card list" data-tour="fantasy-fa">${list
      .map((p) => {
        const o = ownerOf(L, p.id);
        const pr = proj.get(p.id);
        const waiver = L.waivers?.[p.id] && Date.parse(L.waivers[p.id]) > Date.now() ? L.waivers[p.id] : null;
        const right = o ? `<span class="small muted ellipsis" style="max-width:36%">${esc(teamById(L, o).name)}</span>` : over ? "" : waiver ? `<span class="tag">Waivers until ${fmtDay(waiver)}</span>` : `<button class="btn btn-sm btn-secondary" data-act="f-add" data-pid="${p.id}" data-l="${L.id}">Add</button>`;
        return `<div class="list-item">${badge(teamOf(p.id, L.season))}<div class="grow"><a href="#/player/${p.id}"><b>${esc(p.name)}</b></a><div class="tiny muted">${esc(posLabel(p))} · ${fmtPts(pr.now.bat + pr.now.pit)} pts this season${lastSeason(L) ? ` · ${fmtPts(pr.last.bat + pr.last.pit)} last season` : ""}</div></div>${right}</div>`;
      })
      .join("") || `<p class="pad muted">Nobody matches.</p>`}</div>
    <p class="small muted">Free agents can be added any time; they score from their next game. If your roster is full, you pick someone to drop.</p>`;
}

function tradeLine(L, tr) {
  const from = teamById(L, tr.from);
  const to = teamById(L, tr.to);
  return `<b>${esc(from.name)}</b> gives ${tr.give.map((p) => `<a href="#/player/${p}">${esc(nameOf(p))}</a>`).join(", ")}<br><b>${esc(to.name)}</b> gives ${tr.get.map((p) => `<a href="#/player/${p}">${esc(nameOf(p))}</a>`).join(", ")}`;
}
function tradesTab(L) {
  const me = myTeam(L).id;
  const incoming = L.trades.filter((t) => t.status === "pending" && t.to === me);
  const outgoing = L.trades.filter((t) => t.status === "pending" && t.from === me);
  const others = L.trades.filter((t) => t.status === "pending" && t.from !== me && t.to !== me);
  const waiting = L.trades.filter((t) => t.status === "review" || t.status === "vote");
  const past = L.trades.filter((t) => !["pending", "review", "vote"].includes(t.status));
  const over = seasonOver(L);
  const card = (t, btns) => `<div class="card pad stack-s"><p class="small">${tradeLine(L, t)}</p><div class="row between"><span class="tiny muted">${fmtWhen(t.at)}${t.status !== "pending" ? ` · ${t.status}` : ""}</span><div class="row">${btns}</div></div></div>`;
  return `<div class="row between"><p class="small muted grow">${{ none: "Trades go through when the other team accepts.", commish: "Accepted trades go through once the commissioner approves them.", vote: "Accepted trades go to a one-day league vote." }[leagueSettings(L).tradeReview]}${L.settings.tradeDeadline ? ` Trade deadline: ${fmtDay(L.settings.tradeDeadline)}.` : ""} The commissioner can cancel any trade. Traded players score for their new team from their next game.</p>${over || pastDeadline(L) ? "" : `<a class="btn btn-primary btn-sm" href="#/fantasy/${L.id}/trade">Propose a trade</a>`}</div>
    <section class="stack" data-tour="fantasy-trades">${sectionHead("Offers to you")}${incoming.map((t) => card(t, `<button class="btn btn-sm btn-secondary" data-act="f-trade-answer" data-l="${L.id}" data-id="${t.id}" data-yes="0">Decline</button><button class="btn btn-sm btn-green" data-act="f-trade-answer" data-l="${L.id}" data-id="${t.id}" data-yes="1">Accept</button>`)).join("") || `<p class="card pad small muted">No offers right now.</p>`}</section>
    ${sectionHead("Your offers")}${outgoing.map((t) => card(t, `<button class="btn btn-sm btn-secondary" data-act="f-trade-cancel" data-l="${L.id}" data-id="${t.id}">Cancel</button><button class="btn btn-sm btn-secondary" data-act="f-trade-cpu" data-l="${L.id}" data-id="${t.id}">Demo: have them answer</button>`)).join("") || `<p class="card pad small muted">None.</p>`}
    ${others.length && isCommish(L) ? `${sectionHead("Other offers (commissioner)")}${others.map((t) => card(t, `<button class="btn btn-sm btn-danger" data-act="f-trade-cancel" data-l="${L.id}" data-id="${t.id}">Cancel trade</button>`)).join("")}` : ""}
    ${waiting.length ? `${sectionHead(L.settings.tradeReview === "vote" ? "Waiting for the league vote" : "Waiting for the commissioner")}${waiting.map((t) => card(t, isCommish(L) || t.status === "vote" ? `<button class="btn btn-sm btn-danger" data-act="f-trade-review" data-l="${L.id}" data-id="${t.id}" data-yes="0">${t.status === "vote" ? "Demo: voted down" : "Veto"}</button><button class="btn btn-sm btn-green" data-act="f-trade-review" data-l="${L.id}" data-id="${t.id}" data-yes="1">${t.status === "vote" ? "Demo: vote passes" : "Approve"}</button>` : `<button class="btn btn-sm btn-secondary" data-act="f-trade-review" data-l="${L.id}" data-id="${t.id}" data-yes="1">Demo: commissioner approves</button>`)).join("")}` : ""}
    ${sectionHead("Past trades")}${past.map((t) => card(t, "")).join("") || `<p class="card pad small muted">None yet.</p>`}`;
}
function tradeBuilder(L, r) {
  const me = myTeam(L);
  const them = teamById(L, r.q.with);
  if (!them) return `<h2 class="h2">Propose a trade with…</h2><div class="card list">${L.teams.filter((t) => !t.mine).map((t) => `<a class="list-item" href="#/fantasy/${L.id}/trade?with=${t.id}"><b class="grow">${esc(t.name)}</b><span class="small muted">${esc(t.owner)}</span><span class="chev">›</span></a>`).join("")}</div>`;
  const sel = S.fTrade || { give: [], get: [] };
  const col = (team, key) => `<div class="col">${sectionHead(esc(team.name))}<div class="card list">${rosterNow(L, team.id)
    .map((row) => `<label class="list-item"><input type="checkbox" data-change="f-trade-pick" data-k="${key}" data-pid="${row.player_id}" ${sel[key].includes(row.player_id) ? "checked" : ""}><span class="grow"><b>${esc(nameOf(row.player_id))}</b> <span class="tiny muted">${row.slot_index < HLL.STARTERS ? "Starter" : "Bench"}</span></span></label>`)
    .join("")}</div></div>`;

  tr.decidedAt = new Date().toISOString();

// ---- app-draft.js
/* ---------------------------------------------------------------- fantasy: live draft room and league settings (modeled on ESPN)
 * The draft runs on a pick clock (2 minutes by default). Computer teams pick after a few seconds; when your clock
 * runs out, the best player in your queue (or the best available) is picked for you. The commissioner sets the
 * clock, the draft type (snake, linear, third-round reversal), the order (random or set by hand) and everything
 * else in League settings.
 */
const CLOCKS = [[0, "No limit"], [15, "15 seconds"], [30, "30 seconds"], [45, "45 seconds"], [60, "1 minute"], [90, "90 seconds"], [120, "2 minutes"], [180, "3 minutes"], [300, "5 minutes"], [600, "10 minutes"]];
const DRAFT_TYPES = { snake: "Snake", linear: "Linear (same order every round)", trr: "Third-round reversal" };
const LEAGUE_TYPES = { points: "Points (season total)", h2h: "Head-to-head points (weekly matchups)" };
const TRADE_REVIEW = { none: "None (trades go through right away)", commish: "Commissioner approves", vote: "League votes (one day)" };
const POS_FILTERS = [["", "All"], ["P", "P"], ["C", "C"], ["1B", "1B"], ["INF", "INF"], ["OF", "OF"]];

/** Settings every league has (older saved leagues get the defaults). */
function leagueSettings(L) {
  L.settings ||= {};
  const d = { type: "points", clock: 120, draftType: "snake", order: "random", draftAt: null, addsPerWeek: 0, waiverDays: 0, tradeReview: "none", tradeDeadline: null, playoffTeams: 4, playoffStartWeek: null };
  for (const [k, v] of Object.entries(d)) if (!(k in L.settings)) L.settings[k] = v;
  return L.settings;
}

/** Which draft position (0-based) owns overall pick n, for this league's draft type. */
function ownerIndex(L, n) {
  const size = L.size;
  const round = Math.floor(n / size);
  const i = n % size;
  const type = leagueSettings(L).draftType;
  const reversed = type === "linear" ? false : type === "trr" ? (round === 0 ? false : round === 1 || round === 2 ? true : round % 2 === 0) : round % 2 === 1;
  return reversed ? size - 1 - i : i;
}
const pickLabelOf = (L, n) => `${Math.floor(n / L.size) + 1}.${String((n % L.size) + 1).padStart(2, "0")}`;
const fmtClock = (ms) => {
  const s = Math.max(0, Math.ceil(ms / 1000));
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
};

/* ---- the clock */
/** Starts the clock for the pick on the clock, if it isn't running yet. */
function armClock(L) {
  const n = nextPick(L);
  if (n == null || L.draft.paused) return;
  if (L.draft.clockFor === n) return;
  const secs = leagueSettings(L).clock;
  L.draft.clockFor = n;
  L.draft.deadline = secs ? Date.now() + secs * 1000 : null;
  // Computer teams take a few seconds, like a person looking over the board.
  L.draft.cpuAt = Date.now() + 1500 + Math.random() * 2500;
}
/** The best player for a team: its queue first (for you), then the most projected points. */
function bestPick(L, teamId) {
  const taken = new Set(L.draft.picks.map((p) => p.pid));
  const avail = fantasyPool(L).filter((p) => !taken.has(p.id));
  const team = teamById(L, teamId);
  if (team?.mine) {
    const q = (L.queue || []).find((pid) => !taken.has(pid));
    if (q) return q;
  }
  const proj = new Map([...projections(L)].map(([id, v]) => [id, v.proj]));
  return HLL.autopick(avail, filledFor(L, teamId), slotsOf(L), proj)?.id || null;
}
function draftPick(L, pid, how = "") {
  const team = teamOnClock(L);
  makePick(L, pid);
  if (L.queue) L.queue = L.queue.filter((x) => x !== pid);
  if (how) logMove(L, Date.now(), `${teamById(L, team).name} ${how} ${nameOf(pid)}.`);
  if (L.draft.status === "done") notify("fantasy", `The ${L.name} draft is done.`, `fantasy/${L.id}/team`);
}

// One clock for every draft in progress: computer picks, time running out, autodraft.
setInterval(() => {
  if (!S || !S.fantasy || !W) return;
  const r = parseRoute();
  let changed = false;
  for (const L of S.fantasy.leagues) {
    if (L.draft.status !== "drafting" || L.draft.paused) continue;
    armClock(L);
    const team = teamOnClock(L);
    if (team == null) continue;
    const mine = teamById(L, team)?.mine;
    const now = Date.now();
    if (!mine && now >= L.draft.cpuAt) {
      const pid = bestPick(L, team);
      if (pid) draftPick(L, pid);
      changed = true;
    } else if (mine && (L.draft.autodraft || (L.draft.deadline && now >= L.draft.deadline))) {
      const pid = bestPick(L, team);
      if (pid) draftPick(L, pid, L.draft.autodraft ? "autodrafted" : "ran out of time, so the pick was made for them:");
      changed = true;
    }
    if (!changed && r.name === "fantasy" && r.parts[1] === L.id) {
      const el = document.getElementById("draft-clock");
      if (el) {
        const left = L.draft.deadline ? L.draft.deadline - now : null;
        el.textContent = left == null ? "No limit" : fmtClock(left);
        el.classList.toggle("urgent", left != null && left <= 10000);
      }
    }
  }
  if (changed) {
    save();
    if (r.name === "fantasy") {
      const y = window.scrollY;
      const focus = document.activeElement?.id;
      const caret = document.activeElement?.selectionStart;
      render();
      window.scrollTo(0, y);
      if (focus) {
        const el = document.getElementById(focus);
        if (el) {
          el.focus();
          if (caret != null && el.setSelectionRange) el.setSelectionRange(caret, caret);
        }
      }
    }
  }
}, 400);

/* ---- the draft tab */
function draftTab(L, r) {
  leagueSettings(L);
  if (L.draft.status === "pre") return preDraft(L);
  if (L.draft.status === "done") return `<p class="small muted">${DRAFT_TYPES[L.settings.draftType]} draft · ${L.draft.picks.length} picks. Keepers are marked K.</p>${draftBoard(L)}`;
  return draftRoom(L, r);
}

function preDraft(L) {
  const s = L.settings;
  const me = myTeam(L);

    </div>
    <section class="stack-s">${sectionHead("Draft order")}<div class="card list">${L.draft.order.map((id, i) => `<div class="list-item"><span class="rank">${s.order === "random" ? "?" : i + 1}</span><b class="grow">${esc(teamById(L, id).name)}</b><span class="small muted">${esc(teamById(L, id).owner)}</span></div>`).join("")}</div>
    ${s.order === "random" ? `<p class="small muted">The order is drawn at random when the commissioner starts the draft.</p>` : ""}</section>`;
}

function draftRoom(L, r) {
  const me = myTeam(L);
  const s = L.settings;
  armClock(L);
  const n = nextPick(L);
  const clock = teamOnClock(L);
  const myTurn = clock === me.id;
  const view = r.q.view || "players";
  // How many picks until yours.
  let until = null;
  for (let k = n; k < totalPicks(L); k++) if (L.draft.order[ownerIndex(L, k)] === me.id && !L.draft.picks.some((p) => p.n === k)) { until = k - n; break; }
  const left = L.draft.deadline ? L.draft.deadline - Date.now() : null;
  const recent = [...L.draft.picks].filter((p) => !p.keeper).sort((a, b) => b.n - a.n).slice(0, 6);
  const views = [["players", "Players"], ["board", "Draft board"], ["rosters", "Rosters"], ["queue", `My queue${L.queue?.length ? ` (${L.queue.length})` : ""}`]];
  const body = view === "board" ? draftBoard(L) : view === "rosters" ? draftRosters(L, r) : view === "queue" ? draftQueue(L) : draftPlayers(L, myTurn);
  return `<div class="draft-head ${myTurn ? "on-clock" : ""}" data-tour="fantasy-draft-clock">
      <div class="grow"><p class="eyebrow">Round ${Math.floor(n / L.size) + 1} · Pick ${pickLabelOf(L, n)} · overall ${n + 1} of ${totalPicks(L)}</p>
        <p class="h2">${myTurn ? "You're on the clock" : `${esc(teamById(L, clock).name)} is picking`}</p>
        <p class="small muted">${myTurn ? "Pick a player, or the best one in your queue is taken when the clock hits zero." : until != null ? `Your pick is ${until === 1 ? "next" : `in ${until} picks`}.` : "You're done picking."}${L.draft.paused ? " <b>Paused by the commissioner.</b>" : ""}</p></div>
      <div class="draft-clock-box"><span id="draft-clock" class="draft-clock ${left != null && left <= 10000 ? "urgent" : ""}">${L.draft.paused ? "Paused" : left == null ? "No limit" : fmtClock(left)}</span><span class="tiny muted">${s.clock ? `${CLOCKS.find(([v]) => v === s.clock)?.[1]} per pick` : ""}</span></div>
    </div>
    <div class="row wrap draft-tools">
      <label class="switch-inline small"><input type="checkbox" data-change="f-autodraft" data-l="${L.id}" ${L.draft.autodraft ? "checked" : ""}> Autodraft for me</label>
      ${isCommish(L) ? `<button class="btn btn-sm btn-secondary" data-act="f-pause" data-l="${L.id}">${L.draft.paused ? "Resume draft" : "Pause draft"}</button>${L.draft.picks.some((p) => !p.keeper) ? `<button class="btn btn-sm btn-secondary" data-act="f-undo-pick" data-l="${L.id}">Undo last pick</button>` : ""}` : ""}
      <button class="btn btn-sm btn-secondary" data-act="f-auto" data-l="${L.id}">Demo: finish the draft now</button>
    </div>
    ${recent.length ? `<div class="pick-ticker">${recent.map((p) => `<span><b>${pickLabelOf(L, p.n)}</b> ${esc(nameOf(p.pid))} <span class="muted">${esc(teamById(L, p.team).name)}</span></span>`).join("")}</div>` : ""}
    <div class="tabs-inline">${views.map(([k, l]) => `<a href="${withQuery({ view: k === "players" ? null : k })}" class="${view === k ? "on" : ""}">${l}</a>`).join("")}</div>
    ${body}`;
}

function draftPlayers(L, myTurn) {
  return `<div class="row wrap" data-tour="fantasy-draft-search"><input class="input grow" id="draft-search" placeholder="Search for a player" value="${esc(S.draftQ || "")}" data-input="draft-search" aria-label="Search for a player" autocomplete="off">
      <div class="chips">${POS_FILTERS.map(([k, l]) => `<button class="chip ${(S.draftPos || "") === k ? "on" : ""}" data-act="f-dpos" data-k="${k}">${l}</button>`).join("")}</div></div>
    <div id="draft-avail" data-tour="fantasy-draft-avail">${availList(L, myTurn)}</div>`;
}
function availList(L, myTurn) {
  const proj = projections(L);
  const taken = new Set(L.draft.picks.map((p) => p.pid));
  const q = (S.draftQ || "").toLowerCase().trim();
  const pos = S.draftPos || "";
  const list = fantasyPool(L)
    .filter((p) => !taken.has(p.id) && (!q || p.name.toLowerCase().includes(q) || (teamOf(p.id, L.season)?.name || "").toLowerCase().includes(q)) && (!pos || (p.pos || []).includes(pos)))
    .sort((a, b) => (proj.get(b.id)?.value || 0) - (proj.get(a.id)?.value || 0));
  const queued = new Set(L.queue || []);
  const rank = new Map(fantasyPool(L).sort((a, b) => (proj.get(b.id)?.value || 0) - (proj.get(a.id)?.value || 0)).map((p, i) => [p.id, i + 1]));
  return `<div class="card scroll-x"><table class="draft-avail"><thead><tr><th>Rank</th><th>Player</th><th>Pos</th><th>Proj</th>${lastSeason(L) ? "<th>Last season</th>" : ""}<th></th></tr></thead><tbody>${list
    .slice(0, 60)
    .map((p) => {
      const pr = proj.get(p.id);
      return `<tr><td class="muted">${rank.get(p.id)}</td><td><a class="row player-cell" href="#/player/${p.id}">${badge(teamOf(p.id, L.season))}<b>${esc(p.name)}</b></a></td><td class="small">${esc(posLabel(p))}</td><td>${fmtPts(pr.value)}</td>${lastSeason(L) ? `<td class="muted">${fmtPts(pr.last.bat + pr.last.pit)}</td>` : ""}
        <td class="nowrap"><button class="btn btn-sm ${queued.has(p.id) ? "btn-primary" : "btn-secondary"}" data-act="f-queue" data-l="${L.id}" data-pid="${p.id}" title="${queued.has(p.id) ? "Remove from queue" : "Add to queue"}">${queued.has(p.id) ? "Queued" : "+ Queue"}</button> <button class="btn btn-sm btn-green" data-act="f-pick" data-l="${L.id}" data-pid="${p.id}" ${myTurn ? "" : "disabled"}>Draft</button></td></tr>`;
    })
    .join("") || `<tr><td colspan="6" class="muted">Nobody matches "${esc(S.draftQ || "")}".</td></tr>`}</tbody></table></div>
    <p class="small muted">${list.length} available. Proj is this season's points plus a bit of last season's. Queue players so the right one is picked if your clock runs out.</p>`;
}
document.addEventListener("input", (e) => {

/** Every pick, team by team (columns) and round by round (rows), like ESPN's draft board. */
function draftBoard(L) {
  const rounds = slotsOf(L).length;
  const byN = new Map(L.draft.picks.map((p) => [p.n, p]));
  const onClock = L.draft.status === "drafting" ? nextPick(L) : null;
  const cols = L.draft.order;
  const cell = (n) => {
    const p = byN.get(n);
    const who = p ? W.playerById[p.pid] : null;
    const t = p ? teamOf(p.pid, L.season) : null;
    return `<td class="board-cell ${n === onClock ? "now" : ""} ${p?.keeper ? "keeper" : ""}" style="${t ? `border-left-color:${t.color}` : ""}"><span class="tiny muted">${pickLabelOf(L, n)}</span>${who ? `<b>${esc(who.first)} ${esc(who.last)}</b><span class="tiny muted">${esc(t?.abbr || "")}${p.keeper ? " · K" : ""}</span>` : n === onClock ? '<b class="tiny">On the clock</b>' : ""}</td>`;
  };
  return `<div class="card scroll-x draft-board" data-tour="fantasy-draft-board"><table><thead><tr><th>Rd</th>${cols.map((id) => `<th class="${teamById(L, id).mine ? "mine" : ""}">${esc(teamById(L, id).name)}<div class="tiny muted">${esc(teamById(L, id).owner)}</div></th>`).join("")}</tr></thead><tbody>${Array.from({ length: rounds }, (_, ri) => {
    const picks = cols.map((_, ci) => {
      for (let n = ri * L.size; n < (ri + 1) * L.size; n++) if (ownerIndex(L, n) === ci) return n;
      return null;
    });
    return `<tr><td class="bold">${ri + 1}</td>${picks.map((n) => cell(n)).join("")}</tr>`;
  }).join("")}</tbody></table></div>`;
}

function draftRosters(L, r) {
  const team = teamById(L, r.q.team) || myTeam(L);
  const picks = L.draft.picks.filter((p) => p.team === team.id);
  return `<div class="chips">${L.teams.map((t) => `<a class="chip ${t.id === team.id ? "on" : ""}" href="${withQuery({ team: t.mine ? null : t.id })}">${esc(t.name)}</a>`).join("")}</div>

}

function draftQueue(L) {

const toLocalInput = (iso) => {
  const d = new Date(iso);
  const p = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
};

/* ---- head-to-head playoffs */
const weeksText = (n) => `${n} week${n === 1 ? "" : "s"}`;
/** The season's weeks for this league (the schedule it plays in). */
const leagueWeeks = (L) => (L.season === W.season.id ? W.weeks : []);
/** Playoff teams, and when the playoffs start: one round a week, as late as the season allows unless the commissioner moves it earlier. */
function playoffRows(L, s, sel, row) {
  const weeks = leagueWeeks(L).length;
  const rounds = HLL.playoffRounds(s.playoffTeams);
  const latest = HLL.latestPlayoffStart(weeks, s.playoffTeams);
  const opts = latest
    ? [["", `Week ${latest} (the latest: ends the last week)`], ...HLL.playoffStartOptions(weeks, s.playoffTeams).filter((w) => w < latest).reverse().map((w) => [w, `Week ${w} (ends week ${w + rounds - 1})`])]
    : [];
  const cur = s.playoffStartWeek != null && latest && s.playoffStartWeek < latest ? s.playoffStartWeek : "";
  const startCtl = !weeks
    ? `<b>Last ${weeksText(rounds)}</b>`
    : latest
      ? `<select class="input input-sm" data-change="f-set" data-l="${L.id}" data-k="playoffStartWeek" ${isCommish(L) ? "" : "disabled"}>${opts.map(([v, l]) => `<option value="${v}" ${String(cur) === String(v) ? "selected" : ""}>${l}</option>`).join("")}</select>`
      : `<b>Season too short</b>`;
  return (
    row("Playoff teams", sel("playoffTeams", [2, 4, 6, 8].filter((n) => n <= L.size).map((n) => [n, `${n} (${weeksText(HLL.playoffRounds(n))})`])), "The top teams at the end of the regular season play for the title, one round a week.") +
    row("Playoffs start", startCtl, `${s.playoffTeams} teams need ${weeksText(rounds)} of playoffs, so they can't start later than week ${latest ?? "–"} of ${weeks || "the season"}. You can start them earlier.`)
  );
}

const settingsSaved = (L, text) => {
  if (text) logMove(L, Date.now(), `The commissioner changed a setting: ${text}.`);
  save();

};
CHANGE["f-set"] = (el) => {
  const L = leagueById(el.dataset.l);
  const s = leagueSettings(L);
  const k = el.dataset.k;
  const v = k === "playoffStartWeek" ? (el.value ? Number(el.value) : null) : ["clock", "addsPerWeek", "waiverDays", "playoffTeams"].includes(k) ? Number(el.value) : el.value;
  s[k] = v;
  if (k === "clock" && L.draft.status === "drafting") L.draft.clockFor = null;
  const label = { clock: `pick clock is ${CLOCKS.find(([x]) => x === v)?.[1]}`, draftType: `${DRAFT_TYPES[v]} draft`, order: v === "random" ? "draft order is random" : "draft order set by the commissioner", type: LEAGUE_TYPES[v], addsPerWeek: v ? `${v} adds per week` : "unlimited adds", waiverDays: v ? `${v}-day waivers` : "no waivers", tradeReview: `trade review: ${TRADE_REVIEW[v]}`, playoffTeams: `${v} playoff teams`, playoffStartWeek: v ? `playoffs start week ${v}` : "playoffs start as late as possible" }[k];
  settingsSaved(L, label);
};
CHANGE["f-lname"] = (el) => {
  const L = leagueById(el.dataset.l);

};
CHANGE["f-public"] = (el) => {
  const L = leagueById(el.dataset.l);
  L.public = el.value === "1";
  if (!L.public && !L.code) L.code = Math.random().toString(36).slice(2, 8).toUpperCase();
  settingsSaved(L, L.public ? "anyone can join" : "invite code only");
};
ACT["f-newcode"] = (el) => {
  const L = leagueById(el.dataset.l);
  L.code = Math.random().toString(36).slice(2, 8).toUpperCase();
  settingsSaved(L, "new league code");
};
CHANGE["f-size"] = (el) => {
  const L = leagueById(el.dataset.l);
  const size = Number(el.value);
  while (L.teams.length < size) {
    const i = L.teams.length;
    const t = { id: `${L.id}-t${Date.now()}${i}`, name: TEAM_NAMES[(i + 3) % TEAM_NAMES.length] + (L.teams.some((x) => x.name === TEAM_NAMES[(i + 3) % TEAM_NAMES.length]) ? " II" : ""), owner: OWNERS[(i + 5) % OWNERS.length] };
    L.teams.push(t);
    L.draft.order.push(t.id);
  }
  while (L.teams.length > size) {
    const drop = [...L.teams].reverse().find((t) => !t.mine);
    L.teams = L.teams.filter((t) => t !== drop);
    L.draft.order = L.draft.order.filter((id) => id !== drop.id);
  }
  L.size = size;
  settingsSaved(L, `${size} teams`);
};
CHANGE["f-draftat"] = (el) => {
  const L = leagueById(el.dataset.l);
  L.settings.draftAt = el.value ? new Date(el.value).toISOString() : null;
  settingsSaved(L, el.value ? "draft scheduled" : "");
};
CHANGE["f-keepers"] = (el) => {
  const L = leagueById(el.dataset.l);
  L.keepers = Number(el.value);
  if (!L.renewedFrom) L.keeperPicks = {};
  settingsSaved(L, `${L.keepers} keepers per team`);
};
CHANGE["f-deadline"] = (el) => {
  const L = leagueById(el.dataset.l);
  L.settings.tradeDeadline = el.value ? new Date(el.value + "T23:59:00").toISOString() : null;
  settingsSaved(L, el.value ? `trade deadline ${fmtDay(el.value + "T12:00:00")}` : "no trade deadline");
};
CHANGE["f-tname"] = (el) => {
  const L = leagueById(el.dataset.l);
  const t = teamById(L, el.dataset.t);
  if (!el.value.trim()) return;
  logMove(L, Date.now(), `The commissioner renamed ${t.name} to ${el.value.trim()}.`);
  t.name = el.value.trim();
  save();
  toast("Team renamed.");
};
ACT["f-order"] = (el) => {
  const L = leagueById(el.dataset.l);
  const i = Number(el.dataset.i);
  const j = i + Number(el.dataset.d);
  [L.draft.order[i], L.draft.order[j]] = [L.draft.order[j], L.draft.order[i]];
  save();
  render();
};
ACT["f-shuffle"] = (el) => {
  const L = leagueById(el.dataset.l);
  L.draft.order = shuffle(L.draft.order);
  settingsSaved(L, "draft order randomized");
};
const shuffle = (xs) => {
  const a = [...xs];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
};
ACT["f-pause"] = (el) => {
  const L = leagueById(el.dataset.l);
  L.draft.paused = !L.draft.paused;
  if (L.draft.paused) L.draft.pausedLeft = L.draft.deadline ? L.draft.deadline - Date.now() : null;
  else {
    L.draft.deadline = L.draft.pausedLeft != null ? Date.now() + L.draft.pausedLeft : null;
    L.draft.cpuAt = Date.now() + 2000;
  }
  logMove(L, Date.now(), L.draft.paused ? "The commissioner paused the draft." : "The draft is back on.");
  save();
  render();
};
ACT["f-reset-draft"] = (el) => {
  const L = leagueById(el.dataset.l);

  L.draft = { status: "pre", order: L.draft.order, picks: [], doneAt: null };

  save();
  go(`fantasy/${L.id}/draft`);
};
CHANGE["f-autodraft"] = (el) => {
  const L = leagueById(el.dataset.l);

ACT["f-queue"] = (el) => {
  const L = leagueById(el.dataset.l);

ACT["f-qmove"] = (el) => {
  const L = leagueById(el.dataset.l);

  [L.queue[i], L.queue[j]] = [L.queue[j], L.queue[i]];

};
ACT["f-dpos"] = (el) => {
  S.draftPos = el.dataset.k;

};

        const open = list.filter((g) => g.status === "scheduled");
        return `<section class="stack-s"><div class="row between"><h3 class="h3">${fmtLongDay(list[0].date)}</h3>${open.length ? `<div class="row" ${k === dayKey(openGames().find((g) => g.status === "scheduled")?.date || "") ? 'data-tour="admin-rain"' : ""}><button class="btn btn-sm btn-secondary" data-act="rain-day" data-day="${k}">Rain out</button><button class="btn btn-sm btn-secondary" data-act="move-day" data-day="${k}">Move day</button></div>` : ""}</div>
          <div class="card list">${list
            .map((g) => `<div class="list-item wrap"><span class="small muted" style="width:62px">${fmtTime(g.date)}</span><div class="grow"><b>${esc(W.teamById[g.away].abbr)} at ${esc(W.teamById[g.home].abbr)}</b> <span class="small muted">${gameLabel(g)}</span>${g.movedFrom ? ` <span class="tag">Moved from ${fmtDay(g.movedFrom)}</span>` : ""}</div>
              ${g.status === "final" ? `<b class="num">${g.score[0]}-${g.score[1]}</b>` : g.status === "live" ? `<span class="tag tag-live">Live</span>` : `<select class="input input-sm" data-change="assign" data-id="${g.id}" aria-label="Scorekeeper"><option value="">No scorekeeper</option>${staff.map((u) => `<option value="${u.id}" ${S.assign[g.id] === u.id ? "selected" : ""}>${esc(u.name)}</option>`).join("")}</select>`}</div>`)
            .join("")}</div></section>`;
      })
      .join("") || `<p class="card pad muted">No games yet. Paste your schedule from a spreadsheet, or generate one.</p>`}`;
}

const teamRefs = () => W.teams.map((t) => ({ id: t.id, name: t.name, abbreviation: t.abbr }));
const checkGames = () => W.games.map((g) => ({ id: g.id, home_team_id: g.home, away_team_id: g.away, scheduled_at: g.date, field: g.field, status: g.status }));
function checkReport(check) {
  return `<div class="card scroll-x"><table><thead><tr><th>Team</th><th>Games</th><th>Home</th><th>Away</th>${check.weeks.map((w, i) => `<th>W${i + 1}</th>`).join("")}</tr></thead><tbody>${check.teams
    .map((l) => `<tr><td><b>${esc(l.team.name)}</b></td><td>${l.games}</td><td>${l.home}</td><td>${l.away}</td>${check.weeks.map((w) => `<td class="${(l.perWeek.get(w) || 0) > 2 ? "bad" : ""}">${l.perWeek.get(w) || ""}</td>`).join("")}</tr>`)
    .join("")}</tbody></table></div>
    ${check.problems.length ? `<div class="notice warn"><b>Worth a look:</b><ul>${check.problems.map((p) => `<li>${esc(p)}</li>`).join("")}</ul></div>` : `<p class="notice good">No double-booked teams or fields, and nobody plays more than twice in a week.</p>`}`;
}
function sampleSchedule() {
  const last = W.games.filter((g) => g.type === "regular").reduce((m, g) => (g.date > m ? g.date : m), new Date(NOW).toISOString());
  const d = new Date(last);
  d.setDate(d.getDate() + 3);
  const md = `${d.getMonth() + 1}/${d.getDate()}`;
  const t = W.teams;
  const d2 = new Date(d);
  d2.setDate(d2.getDate() + 1);
  const md2 = `${d2.getMonth() + 1}/${d2.getDate()}`;
  return `Date\tTime\tAway\tHome\n${md}\t5:30 PM\t${t[0].name}\t${t[1].name}\n${md}\t7:30 PM\t${t[2].abbr}\t${t[3].abbr}\n${md2}\t5:30 PM\t${t[4].name}\t${t[0].name}\n${md2}\t7:30 PM\t${t[5].name} @ ${t[6].name}\t\n${md2}\t8pm\tYankees\t${t[7].name}`;
}
function adminImport() {
  const text = S.importText ?? "";
  const year = W.season.year;
  const rows = text.trim() ? HLL.parseSchedule(text, teamRefs(), year) : [];
  const good = rows.filter((x) => x.game).map((x) => x.game);
  const bad = rows.filter((x) => x.error);
  const added = good.map((g) => ({ home_team_id: g.home, away_team_id: g.away, scheduled_at: new Date(`${g.date}T${g.time || "17:30"}`).toISOString(), field: g.field || null, status: "scheduled" }));
  const check = good.length ? HLL.checkSchedule([...checkGames(), ...added], teamRefs()) : null;
  return `<a class="link back" href="#/admin/games">‹ Games</a><div class="page-head"><h1 class="h1">Paste the schedule</h1><p class="muted">Copy the rows from Excel or Google Sheets and paste them here: Date, Time, Field, Away, Home (or a header row in any order, or "Away @ Home" in one column). Team names can be short, like "marios".</p></div>
    <div class="card pad stack-s" data-tour="admin-import"><textarea class="input mono" rows="7" id="imp-text" placeholder="Date	Time	Field	Away	Home">${esc(text)}</textarea>
      <div class="row"><button class="btn btn-primary" data-act="imp-read">Read it</button><button class="btn btn-secondary" data-act="imp-sample">Demo: paste an example</button></div></div>
    ${rows.length ? `${sectionHead(`${good.length} game${good.length === 1 ? "" : "s"} ready${bad.length ? `, ${bad.length} line${bad.length === 1 ? "" : "s"} to fix` : ""}`)}
      <div class="card list">${good.map((g) => `<div class="list-item small"><span style="width:90px">${esc(g.date)} ${esc(g.time)}</span><b class="grow">${esc(W.teamById[g.away].name)} at ${esc(W.teamById[g.home].name)}</b><span class="muted">${esc(g.field)}</span></div>`).join("")}${bad.map((x) => `<div class="list-item small bad"><span style="width:90px">Line ${x.line}</span><span class="grow">${esc(x.error)}</span></div>`).join("")}</div>
      ${check ? `${sectionHead("Schedule check, with these added")}<div data-tour="admin-check">${checkReport(check)}</div>` : ""}
      ${good.length ? `<button class="btn btn-green btn-block" data-act="imp-save">Add ${good.length} game${good.length === 1 ? "" : "s"}</button>` : ""}` : ""}`;
}

/* ---- teams & players */
function adminTeams() {
  return `<div class="page-head"><h1 class="h1">Teams</h1><p class="muted">${esc(W.season.name)}</p></div><div class="card list">${W.teams
    .map((t) => `<div class="list-item">${badge(t, "md")}<div class="grow"><b>${esc(t.name)}</b><div class="tiny muted">${rosterOf(t.id).length} players · short name ${esc(t.abbr)}</div></div><a class="btn btn-sm btn-secondary" href="#/team/${t.id}">Roster</a></div>`)
    .join("")}</div><p class="small muted">Name, short name, color and a coin-flip tiebreaker can be edited on the real site. Rosters carry over to the next season.</p>`;
}
function adminPlayers(r) {
  const q = (r.q.q || "").toLowerCase();
  const list = W.players.filter((p) => !q || p.name.toLowerCase().includes(q)).sort((a, b) => a.team.localeCompare(b.team) || a.jersey - b.jersey).slice(0, 60);
  return `<div class="page-head"><h1 class="h1">Players</h1><p class="muted">${W.players.length} kids this season</p></div>
    <div class="card pad stack-s" data-tour="admin-players"><b>Add a player</b><div class="row wrap"><input class="input grow" id="np-name" placeholder="First and last name"><select class="input" id="np-team">${W.teams.map((t) => `<option value="${t.id}">${esc(t.name)}</option>`).join("")}</select><input class="input" id="np-num" type="number" placeholder="#" style="width:70px"><input class="input" id="np-age" type="number" placeholder="Age" style="width:80px"></div><button class="btn btn-primary" data-act="np-add">Add player</button><p class="tiny muted">A whole roster can also be pasted from a spreadsheet on the real site.</p></div>
    <input class="input" placeholder="Search players" value="${esc(r.q.q || "")}" data-change="p-search" aria-label="Search players">

      .join("")}</div>`;
}

/* ---- playoffs */
function adminPlayoffs() {
  if (!W.sheetSeason) return `<div class="page-head"><h1 class="h1">Playoffs</h1></div><p class="notice">The top 8 are seeded when the ${esc(W.season.name)} regular season ends. (In the demo, the playoffs are shown in ${esc(PAST.name)}.)</p>`;
  const left = W.games.filter((g) => g.type === "regular" && g.status !== "final").length;
  const seeds = S.playoffs ? S.playoffs.seeds : W.standings.slice(0, 8).map((r) => r.team.id);
  return `<div class="page-head"><h1 class="h1">Playoffs</h1><p class="muted">Top 8 · 1 vs 8, 4 vs 5, 2 vs 7, 3 vs 6 · the championship is best of 3</p></div>
    <div class="card list" data-tour="admin-seeds">${seeds.map((t, i) => `<div class="list-item"><span class="rank">${i + 1}</span>${badge(W.teamById[t])}<b class="grow">${esc(W.teamById[t].name)}</b></div>`).join("")}</div>
    ${S.playoffs ? `<p class="notice good">Seeds are locked. Semifinals and the championship are added as games finish. <a class="link" href="#/playoffs">Bracket</a></p><button class="btn btn-danger" data-act="po-reset">Delete the bracket</button>`
      : left ? `<p class="notice">${left} regular-season game${left === 1 ? "" : "s"} left. Seeds are locked once they're done (ties use head-to-head, run differential, then runs allowed).</p>` : `<button class="btn btn-primary" data-act="po-lock">Lock seeds & create quarterfinals</button>`}`;
}

/* ---- families */
function adminFamilies() {
  const mine = Object.entries(S.follows).map(([pid, st]) => ({ id: `me-${pid}`, user: S.account.name, pid, status: st, me: true }));
  const all = [...mine, ...(S.otherFollows || [])].filter((f) => W.playerById[f.pid]);
  const pending = all.filter((f) => f.status === "pending");
  const approved = all.filter((f) => f.status === "approved");
  const row = (f, btns) => `<div class="list-item"><div class="grow"><b>${esc(f.user)}</b> <span class="small muted">says they're a parent of</span> <a href="#/player/${f.pid}"><b>${esc(nameOf(f.pid))}</b></a> <span class="tiny muted">${esc(teamOf(f.pid)?.abbr || "")}</span></div>${btns}</div>`;
  return `<div class="page-head"><h1 class="h1">Families</h1><p class="muted">Parents ask to follow their kid from the player page. Approve the ones you recognize; they'll see their kid on their home page and get a notification.</p></div>
    ${sectionHead(`Waiting for you (${pending.length})`)}<div class="card list" data-tour="admin-families">${pending.map((f) => row(f, `<button class="btn btn-sm btn-secondary" data-act="fam" data-id="${f.id}" data-yes="0">Decline</button><button class="btn btn-sm btn-green" data-act="fam" data-id="${f.id}" data-yes="1">Approve</button>`)).join("") || `<p class="pad small muted">No requests right now.</p>`}</div>
    ${sectionHead("Approved")}<div class="card list">${approved.map((f) => row(f, `<button class="btn btn-sm btn-secondary" data-act="fam" data-id="${f.id}" data-yes="0">Remove</button>`)).join("") || `<p class="pad small muted">None yet.</p>`}</div>`;
}

/* ---- staff */
function adminStaff() {
  return `<div class="page-head"><h1 class="h1">Staff accounts</h1><p class="muted">Scorekeepers can score games; admins can do everything. Everyone else is a member.</p></div>
    <div class="card list" data-tour="admin-staff">${S.staff
      .map((u) => `<div class="list-item"><div class="grow"><b>${esc(u.name)}</b><div class="tiny muted">${esc(u.email)}</div></div><select class="input input-sm" data-change="staff-role" data-id="${u.id}" aria-label="Role">${["member", "scorekeeper", "admin"].map((k) => `<option value="${k}" ${u.role === k ? "selected" : ""}>${k[0].toUpperCase() + k.slice(1)}</option>`).join("")}</select>${u.email !== S.account.email ? `<button class="btn btn-sm btn-danger" data-act="staff-remove" data-id="${u.id}">Remove</button>` : ""}</div>`)
      .join("")}</div>
    <div class="card pad stack-s"><b>Add a staff account</b><div class="row wrap"><input class="input grow" id="st-name" placeholder="Name"><input class="input grow" id="st-email" placeholder="Email"><select class="input" id="st-role"><option value="scorekeeper">Scorekeeper</option><option value="admin">Admin</option></select></div><button class="btn btn-primary" data-act="staff-add">Create account</button><p class="tiny muted">They get an email to set their password.</p></div>`;
}

/* ---- settings */
function adminSettings() {
  const R = W.rules;
  const num = (label, path, min, max, val) => `<div class="switch"><b>${label}</b><div class="stepper"><button data-act="rule" data-k="${path}" data-d="-1" data-min="${min}" aria-label="Less">−</button><output>${val}</output><button data-act="rule" data-k="${path}" data-d="1" data-max="${max}" aria-label="More">+</button></div></div>`;
  const tog = (label, sub, path, on) => `<label class="switch"><span><b>${label}</b>${sub ? `<br/><span class="small muted">${sub}</span>` : ""}</span><input type="checkbox" data-change="rule-tog" data-k="${path}" ${on ? "checked" : ""}></label>`;
  return `<div class="page-head"><h1 class="h1">Settings</h1></div>
    <div class="card pad stack-s"><b>League name</b><div class="row"><input class="input grow" id="lg-name" value="${esc(S.leagueName)}"><button class="btn btn-secondary" data-act="lg-name">Save name</button></div></div>
    <section class="stack" data-tour="admin-rules">${sectionHead("Game rules")}<div class="card list">
      ${num("Innings per game", "innings", 3, 9, R.innings)}
      ${num("Run limit per half inning", "runCapPerHalfInning", 0, 20, R.runCapPerHalfInning ?? 0)}
      ${tog("Run limit in the last inning too", "", "runCapInFinalInning", R.runCapInFinalInning)}
      ${tog("Mercy rule", `${R.mercyRule.runLead}+ runs after ${R.mercyRule.afterInnings} innings`, "mercyRule.enabled", R.mercyRule.enabled)}
      ${tog("Ties allowed", "Regular-season games can end tied (playoff games can't)", "tiesAllowed", R.tiesAllowed)}
      ${num("Minimum innings in the field per kid", "minDefensiveOuts", 0, 12, R.minDefensiveOuts / 3)}
      ${num("Pitch limit, ages 9–10", "pitchLimits.age9to10", 30, 120, R.pitchLimits.age9to10)}
      ${num("Pitch limit, ages 11–12", "pitchLimits.age11to12", 30, 120, R.pitchLimits.age11to12)}
    </div><p class="small muted">Live scoring follows these right away.</p></section>`;
}
function setRule(path, value) {
  const R = JSON.parse(JSON.stringify(W.rules));
  const keys = path.split(".");
  let o = R;
  keys.slice(0, -1).forEach((k) => (o = o[k]));
  o[keys.at(-1)] = value;
  S.rules = R;
  save();
  build();
  render();
}
ACT["rule"] = (el) => {
  const path = el.dataset.k;
  const cur = path.split(".").reduce((o, k) => o[k], W.rules) ?? 0;
  const step = path === "minDefensiveOuts" ? 3 : 1;
  const v = cur + Number(el.dataset.d) * step;
  const lim = (x) => (path === "minDefensiveOuts" ? Number(x) * 3 : Number(x));
  if ((el.dataset.min && v < lim(el.dataset.min)) || (el.dataset.max && v > lim(el.dataset.max))) return;
  setRule(path, path === "runCapPerHalfInning" && v === 0 ? null : v);
};
CHANGE["rule-tog"] = (el) => setRule(el.dataset.k, el.checked);

/* ---- backups */
function adminBackups() {
  return `<div class="page-head"><h1 class="h1">Backups</h1><p class="muted">Once a week the site saves a copy of all league data (teams, players, every game and play, stats, news, fantasy) and keeps the last 8. Download one now and then to keep a copy of your own. The same daily job keeps the free database from pausing.</p></div>
    <button class="btn btn-primary" data-act="backup-now" data-tour="admin-backups">Back up now</button>
    <div class="card list">${S.backups.map((b, i) => `<div class="list-item"><div class="grow"><b>${fmtDay(b.at)}, ${fmtTime(b.at)}</b><div class="tiny muted">${b.size} KB · ${b.auto ? "weekly" : "made by hand"}</div></div><button class="btn btn-sm btn-secondary" data-act="backup-dl" data-i="${i}">Download</button></div>`).join("")}</div>`;
}

/* ---- seasons & turnover */
function adminSeasons(r) {
  if (r.parts[2] === "next") return adminTurnover();
  const champ = champion();
  const done = W.games.length && W.games.every((g) => g.status === "final" || g.status === "canceled");
  return `<div class="page-head"><h1 class="h1">Seasons</h1></div>
    <div class="card list">${W.seasons.map((s) => `<div class="list-item"><div class="grow"><b>${esc(s.name)}</b><div class="tiny muted">${s.id === W.season.id ? "Current season" : "Past season"}</div></div>${s.id === W.season.id ? '<span class="tag tag-good">Current</span>' : ""}</div>`).join("")}</div>
    ${S.turnover ? `<p class="notice good">${esc(NEXT.name)} has started. Career stats from ${esc(PAST.name)} are kept on every player page and in the records.</p>`
      : `<section class="card pad stack-s" data-tour="admin-turnover"><h2 class="h2">Start ${esc(NEXT.name)}</h2><p class="small muted">Rosters carry over and every kid's age goes up a year. You'll review each team first; kids turning 13 are flagged. Stats and records from every past season stay. Fantasy leagues don't restart on their own; each commissioner can bring theirs back.</p>
        ${done && champ ? "" : `<p class="notice warn">${esc(W.season.name)} isn't finished yet${champ ? "" : " (no champion yet)"}. You can still start the next season now; usually you'd wait until the championship is over.</p>`}
        <a class="btn btn-primary" href="#/admin/seasons/next">Review rosters</a></section>`}`;
}
function adminTurnover() {
  const keep = S.keepDraft || Object.fromEntries(W.players.map((p) => [p.id, true]));
  const aging = (p) => p.age != null && p.age + 1 > 12;
  const flagged = W.players.filter(aging);
  return `<a class="link back" href="#/admin/seasons">‹ Seasons</a><div class="page-head"><h1 class="h1">Start ${esc(NEXT.name)}</h1><p class="muted">Uncheck anyone who isn't coming back. ${flagged.length} kid${flagged.length === 1 ? " is" : "s are"} turning 13 and aging out; they're still checked, so look them over.</p></div>
    <div class="team-cols" data-tour="admin-turnover-review">${W.teams
      .map((t) => `<section class="card pad stack-s"><div class="row">${badge(t, "md")}<b class="grow">${esc(t.name)}</b><span class="small muted">${rosterOf(t.id).filter((p) => keep[p.id]).length} kept</span></div>${rosterOf(t.id)
        .map((p) => `<label class="row small ${aging(p) ? "aging" : ""}"><input type="checkbox" data-change="keep" data-pid="${p.id}" ${keep[p.id] ? "checked" : ""}><span class="grow">${esc(p.name)}${p.age ? ` <span class="muted">${p.age} → ${p.age + 1}</span>` : ""}</span>${aging(p) ? '<b class="warn-text">Aging out</b>' : ""}</label>`)
        .join("")}</section>`)
      .join("")}</div>
    <button class="btn btn-green btn-block" data-act="turnover" data-tour="admin-turnover-go">Start ${esc(NEXT.name)}</button>`;
}

/* ---------------------------------------------------------------- admin actions */
ACT["news-save"] = (el) => {
  const title = document.getElementById("nw-title").value.trim();
  const body = document.getElementById("nw-body").value.trim();
  if (!title) return toast("Give the post a title.");
  const data = { title, body, category: document.getElementById("nw-cat").value, pinned: document.getElementById("nw-pin").checked, published: document.getElementById("nw-pub").checked };
  let post = S.news.find((p) => p.id === el.dataset.id);
  const wasPublished = post?.published;
  if (post) Object.assign(post, data);
  else S.news.unshift((post = { id: `n${Date.now()}`, at: new Date().toISOString(), ...data }));
  if (post.published && !wasPublished) notify("news", `New post: ${post.title}`, `news/${post.id}`);
  save();
  go("admin/news");
  toast(post.published ? "Posted. It's on the home page." : "Saved as a draft.");
};
ACT["news-delete"] = (el) => {
  if (!confirm("Delete this post?")) return;
  S.news = S.news.filter((p) => p.id !== el.dataset.id);
  save();
  go("admin/news");
};
CHANGE["assign"] = (el) => {
  if (el.value) S.assign[el.dataset.id] = el.value;
  else delete S.assign[el.dataset.id];
  save();
  toast(el.value ? `Assigned. Only ${S.staff.find((u) => u.id === el.value).name} (or an admin) can score it.` : "Anyone on staff can score it.");
};
let dayAction = null;
function dayMoveSheet(kind) {
  const games = W.games.filter((g) => dayKey(g.date) === dayAction && g.status === "scheduled");
  const lastReg = W.games.filter((g) => g.type === "regular").reduce((m, g) => (g.date > m ? g.date : m), dayAction);
  const d = new Date(lastReg);
  d.setDate(d.getDate() + (kind === "rain" ? 3 : 1));
  return `<h2 class="h2">${kind === "rain" ? "Rain out" : "Move"} ${fmtLongDay(dayAction + "T12:00:00")}</h2><p class="small muted" style="margin:4px 0 12px">${games.length} game${games.length === 1 ? "" : "s"}. They keep their times and fields and move to:</p>
    <input class="input" type="date" id="mv-date" value="${dayKey(d.toISOString())}">
    <p class="small muted" style="margin-top:8px">Families who get schedule notifications are told right away.</p>
    <button class="btn btn-primary btn-block" style="margin-top:12px" data-act="day-go" data-kind="${kind}">${kind === "rain" ? "Rain out and move" : "Move games"}</button><button class="btn btn-secondary btn-block" style="margin-top:8px" data-act="close-sheet">Cancel</button>`;
}
ACT["rain-day"] = (el) => {
  dayAction = el.dataset.day;
  openSheet(() => dayMoveSheet("rain"));
};
ACT["move-day"] = (el) => {
  dayAction = el.dataset.day;
  openSheet(() => dayMoveSheet("move"));
};
ACT["day-go"] = (el) => {
  const to = document.getElementById("mv-date").value;
  if (!to) return;
  const games = W.games.filter((g) => dayKey(g.date) === dayAction && g.status === "scheduled");
  for (const g of games) {
    const d = new Date(g.date);
    const [y, m, day] = to.split("-").map(Number);
    d.setFullYear(y, m - 1, day);
    S.moves[g.id] = { date: d.toISOString(), from: g.movedFrom || g.date };
  }
  notify("schedule", `${el.dataset.kind === "rain" ? "Rained out" : "Moved"}: games on ${fmtDay(dayAction + "T12:00:00")} are now ${fmtDay(to + "T12:00:00")}.`, "schedule");
  save();
  build();
  closeSheet();
  render();
  toast(`${games.length} game${games.length === 1 ? "" : "s"} moved. Families were notified.`);
};

/* ---- the playoffs */
function lockSeeds() {
  const seeds = W.standings.slice(0, 8).map((r) => r.team.id);
  const last = W.games.filter((g) => g.type === "regular").reduce((m, g) => (g.date > m ? g.date : m), "");
  const at = (days, h) => {
    const d = new Date(last);
    d.setDate(d.getDate() + days);
    d.setHours(h, 30, 0, 0);
    return d.toISOString();
  };
  S.playoffs = {
    seeds,
    games: [[1, 8], [4, 5], [2, 7], [3, 6]].map(([a, b], i) => ({ id: `po-q${i + 1}`, slot: i + 1, sg: null, round_name: "quarterfinal", home: seeds[a - 1], away: seeds[b - 1], field: null, seed: 1000 + i * 17, date: at(2 + Math.floor(i / 2), i % 2 ? 19 : 17) })),
  };
  save();
  build();
}
function advancePlayoffs() {
  const po = S.playoffs;
  if (!po) return;
  const seedOf = (t) => po.seeds.indexOf(t);
  const byBetter = (a, b) => (seedOf(a) <= seedOf(b) ? [a, b] : [b, a]);
  const find = (slot, sg = null) => po.games.find((g) => g.slot === slot && (g.sg || null) === sg);
  const w = (slot) => winnerOf(W.gameById[find(slot)?.id]);
  const lastDate = () => po.games.reduce((m, g) => (g.date > m ? g.date : m), po.games[0].date);
  const at = (days, h) => {
    const d = new Date(lastDate());
    d.setDate(d.getDate() + days);
    d.setHours(h, 30, 0, 0);
    return d.toISOString();
  };
  const untouched = (g) => g && !S.games[g.id] && !S.played[g.id];
  const drop = (g) => (po.games = po.games.filter((x) => x !== g));
  [[5, 1, 2], [6, 3, 4]].forEach(([slot, a, b]) => {
    const wa = w(a);
    const wb = w(b);
    const existing = find(slot);
    if (existing && untouched(existing) && !(wa && wb && [existing.home, existing.away].sort().join() === [wa, wb].sort().join())) drop(existing);
  });
  {
    const series = po.games.filter((g) => g.slot === 7);
    const fa = w(5);
    const fb = w(6);
    const same = series[0] && fa && fb && [series[0].home, series[0].away].sort().join() === [fa, fb].sort().join();
    if (series.length && !same && series.every(untouched)) series.forEach(drop);
  }
  [[5, 1, 2], [6, 3, 4]].forEach(([slot, a, b]) => {
    const wa = w(a);
    const wb = w(b);
    if (wa && wb && !find(slot)) {
      const [home, away] = byBetter(wa, wb);
      po.games.push({ id: `po-s${slot - 4}`, slot, sg: null, round_name: "semifinal", home, away, date: at(2, slot === 5 ? 17 : 19), field: null, seed: 2000 + slot });
    }
  });
  const f1 = w(5);
  const f2 = w(6);
  if (f1 && f2 && !find(7, 1)) {
    const [hi, lo] = byBetter(f1, f2);
    [[1, hi, lo, 2], [2, lo, hi, 3], [3, hi, lo, 4]].forEach(([sg, home, away, d]) => po.games.push({ id: `po-f${sg}`, slot: 7, sg, round_name: "championship", home, away, date: at(d, 17), field: null, seed: 3000 + sg }));
  }
  const wins = {};
  po.games.filter((g) => g.slot === 7).forEach((g) => {
    const x = winnerOf(W.gameById[g.id]);
    if (x) wins[x] = (wins[x] || 0) + 1;
  });
  const decided = Object.values(wins).some((n) => n >= 2);
  po.games.filter((g) => g.slot === 7 && untouched(g)).forEach((g) => (g.canceled = decided));
}

/* ---------------------------------------------------------------- guided practice game (scorekeeping walkthrough)
 * A practice game between the top two teams. A coach panel walks through every
 * scorekeeping feature. Next either moves on (if you did the step yourself) or
 * does the step for you. Skip ends the walkthrough and leaves the game to play with.
 */
const walkGame = () => W.gameById.practice;
const walkSig = (g) => (g ? `${g.status}:${(g.events || []).length}` : "");

/** Builds events on top of the practice game, re-reading the game state as it goes. */
function walkCtx() {
  const g = walkGame();
  return {
    events: [...(g.events || [])],
    s() {
      return E.replay({ setup: g.setup, events: this.events }, W.rules, W.names);
    },
    push(...evs) {
      if (this.s().status !== "final") this.events.push(...evs);
    },
    pitch(r) {
      this.push({ t: "pitch", r });
    },
    walk() {
      const s = this.s();
      for (let i = s.balls; i < 4; i++) this.pitch("B");
    },
    strikeout() {
      const s = this.s();
      for (let i = s.strikes; i < 2; i++) this.pitch("CS");
      this.pitch("SS");
    },
    /** Make sure there are at most `max` outs (strike out the side if needed). */
    outsAtMost(max) {
      for (let i = 0; i < 3 && this.s().outs > max; i++) this.strikeout();
    },
    /** Make sure base `b` (1-3) is occupied, by walking batters. */
    runnerOn(b) {
      for (let i = 0; i < 4 && !this.s().bases[b - 1]; i++) this.walk();
    },
    play(r, f, loc, bb, patch = {}, hh = bb === "L") {
      const s = this.s();
      this.push({ t: "play", r, f, m: { ...E.defaultMoves(s.bases, r), ...patch }, bb, loc, hh });
    },
    runner(k, m) {
      this.push({ t: "runner", k, m });
    },
  };
}

function startPractice() {
  const g = walkGame();
  if (g && g.status === "scheduled") saveGame(g, { setup: draftSetup(g), events: [], status: "live" });
}
// The practice game never goes offline for real: make sure the switch is off when the walkthrough ends.

function runStep(step) {
  if (!step.act) return;
  if (step.act === "start") return startPractice();
  const g = walkGame();
  if (!g || !g.events || g.status === "final") return;
  const c = walkCtx();
  step.act(c);
  const rep = E.replay({ setup: g.setup, events: c.events }, W.rules, W.names);
  saveGame(g, { events: c.events, status: rep.status === "final" ? "final" : "live" });
}

const stepRoute = (step) => step.route || "score/practice";

ACT["walk-start"] = () => {
  T = null;
  closeSheet();
  const [a, b] = W.standings;
  S.practice = { home: a.team.id, away: b.team.id, date: new Date().toISOString() };
  delete S.games.practice;
  delete S.lineups.practice;
  S.seenWelcome = true;
  S.signedIn = true;
  S.role = "scorekeeper";
  build();
  S.walk = { step: 0, mark: walkSig(walkGame()) };
  save();
  go(stepRoute(WALK[0]));
};
ACT["walk-next"] = () => {
  const step = WALK[S.walk.step];
  // If you did the step yourself, just move on; otherwise do it for you.
  if (walkSig(walkGame()) === S.walk.mark) runStep(step);
  S.walk.step++;
  if (S.walk.step >= WALK.length) {
    S.walk = null;
    save();
    render();
    openSheet(
      () => `<h2 class="h2">Walkthrough complete</h2><p class="small muted" style="margin:4px 0 12px">You've seen every scorekeeping feature. The practice game stays here if you want to look around.</p>
      <div class="card list"><a class="list-item" href="#/game/practice?tab=box" data-act="close-sheet-nav"><b class="grow">Box score</b><span class="chev">›</span></a><a class="list-item" href="#/game/practice?tab=defense" data-act="close-sheet-nav"><b class="grow">Defense and innings</b><span class="chev">›</span></a><a class="list-item" href="#/score" data-act="close-sheet-nav"><b class="grow">Score a real game</b><span class="chev">›</span></a></div>
      <button class="btn btn-secondary btn-block" style="margin-top:12px" data-act="close-sheet">Close</button>`,
    );
    return;
  }
  S.walk.mark = walkSig(walkGame());
  save();
  walkScrolled = -1;
  const target = "#/" + stepRoute(WALK[S.walk.step]);
  if (location.hash !== target) location.hash = target;
  else render();
};
ACT["walk-skip"] = () => {
  S.walk = null;
  save();
  render();
  toast("Walkthrough closed. The practice game is still here to play with.");
};
ACT["walk-back-to-game"] = () => go(stepRoute(WALK[S.walk.step]));

let walkScrolled = -1;
function walkRefresh() {
  const host = document.getElementById("coach");
  document.body.classList.toggle("walking", !!S.walk);
  document.querySelectorAll(".coach-hl").forEach((el) => el.classList.remove("coach-hl"));
  if (!S.walk || !walkGame()) {
    host.innerHTML = "";
    return;
  }
  const step = WALK[S.walk.step];
  const here = location.hash.replace(/^#\//, "").split("?")[0] === stepRoute(step).split("?")[0];
  const did = walkSig(walkGame()) !== S.walk.mark;
  host.innerHTML = `<aside class="coach" aria-live="polite">
    <div class="row between"><span class="eyebrow">Practice game · step ${S.walk.step + 1} of ${WALK.length}</span><button class="link" data-act="walk-skip">Skip</button></div>
    <h3>${esc(step.title)}</h3><p>${esc(step.body)}</p>
    ${step.act && here ? `<p class="coach-hint">${did ? "Nice. Press Next to continue." : "Try it yourself, or press Next and it will be done for you."}</p>` : ""}
    <div class="coach-bar"><div class="coach-progress"><i style="width:${Math.round(((S.walk.step + 1) / WALK.length) * 100)}%"></i></div>
    ${here ? `<button class="btn btn-primary btn-sm" data-act="walk-next">Next</button>` : `<button class="btn btn-secondary btn-sm" data-act="walk-back-to-game">Back to the step</button>`}</div>
  </aside>`;
  if (!here) return;
  const el = document.querySelector(`[data-tour="${step.sel}"]`);
  if (!el) return;
  el.classList.add("coach-hl");
  if (walkScrolled !== S.walk.step) {
    walkScrolled = S.walk.step;
    el.scrollIntoView({ block: "center" });
    // Keep the highlighted part clear of the coach panel.
    const coach = host.querySelector(".coach").getBoundingClientRect();
    const r = el.getBoundingClientRect();
    if (coach.left < r.right && r.bottom > coach.top - 8) window.scrollBy(0, Math.min(r.top - 70, r.bottom - coach.top + 16));
  }
}

const TOURS = {
  full: {
    title: "Full tour",
    steps: Object.entries(SECTIONS).flatMap(([id, sec]) => sec.steps.map((st) => ({ ...st, section: sec.title, sectionId: id, role: st.role || sec.role || "fan" }))),
  },
};
const sectionStart = (id) => TOURS.full.steps.findIndex((st) => st.sectionId === id);
const nextScheduled = () => W.games.find((g) => g.status === "scheduled" && g.home && g.away)?.id || SHOWCASE;

let T = null; // { id, i }
const tourHost = () => document.getElementById("tour");

function startTour(id, at = 0) {
  closeSheet();
  S.seenWelcome = true;
  S.signedIn = true;
  save();
  T = { id, i: at };
  showStep();
}

function showStep() {
  const tour = TOURS[T.id];
  const step = tour.steps[T.i];
  const role = step.role || tour.role || "fan";
  if (step.prep) {
    step.prep();
    build();
  }
  if (S.role !== role) S.role = role;
  save();
  const target = "#/" + (typeof step.route === "function" ? step.route() : step.route);
  if (location.hash !== target) location.hash = target;
  else render();
}

function tourRefresh() {
  const host = tourHost();
  if (!T) {
    host.innerHTML = "";
    return;
  }
  const tour = TOURS[T.id];
  const step = tour.steps[T.i];
  const el = document.querySelector(`[data-tour="${step.sel}"]`);
  const last = T.i === tour.steps.length - 1;
  host.innerHTML = `<div class="tour-spot" hidden></div><div class="tour-tip" role="dialog" aria-live="polite">
    <div class="row between"><span class="step">${esc(step.section || tour.title)} · ${T.i + 1} of ${tour.steps.length}</span><button class="link" data-act="tour-end">Close</button></div>
    <h3>${esc(step.title)}</h3><p>${esc(step.body)}</p>${step.tryIt ? `<p class="try">${esc(step.tryIt)}</p>` : ""}
    <div class="row between" style="margin-top:14px"><div class="tour-progress"><i style="width:${Math.round(((T.i + 1) / tour.steps.length) * 100)}%"></i></div>
    <div class="row">${T.i ? `<button class="btn btn-sm btn-secondary" data-act="tour-prev">Back</button>` : ""}<button class="btn btn-sm btn-primary" data-act="tour-next">${last ? "Finish" : "Next"}</button></div></div></div>`;
  if (el) {
    // Tall targets: show their top part with the tip underneath instead of covering them.
    const th = document.querySelector(".tour-tip").offsetHeight;
    const room = window.innerHeight - th - 150;
    if (el.getBoundingClientRect().height > room) {
      el.scrollIntoView({ block: "start" });
      window.scrollBy(0, -(document.querySelector(".top")?.offsetHeight || 0) - 12);
    } else el.scrollIntoView({ block: "center" });
  }
  placeTour();
}

function placeTour() {
  if (!T) return;
  const step = TOURS[T.id].steps[T.i];
  const el = document.querySelector(`[data-tour="${step.sel}"]`);
  const spot = document.querySelector(".tour-spot");
  const tip = document.querySelector(".tour-tip");
  if (!spot || !tip) return;
  const vh = window.innerHeight;
  if (!el) {
    spot.hidden = true;
    tip.style.top = `${Math.max(16, vh / 2 - tip.offsetHeight / 2)}px`;
    return;
  }
  const r = el.getBoundingClientRect();
  const pad = 6;
  const top = Math.max(4, r.top - pad);
  const th0 = tip.offsetHeight;
  let bottom = Math.min(vh - 4, r.bottom + pad);
  if (bottom + th0 + 20 > vh && top - th0 - 20 < 0) bottom = Math.max(top + 80, vh - th0 - 24);
  Object.assign(spot.style, { left: `${r.left - pad}px`, top: `${top}px`, width: `${r.width + pad * 2}px`, height: `${Math.max(0, bottom - top)}px` });
  spot.hidden = false;
  const th = tip.offsetHeight;
  const below = bottom + 12;
  const above = top - th - 12;
  const y = below + th < vh - 8 ? below : above > 8 ? above : vh - th - 12;
  tip.style.top = `${Math.max(8, y)}px`;
}
window.addEventListener("resize", placeTour);
window.addEventListener("scroll", () => requestAnimationFrame(placeTour), { passive: true });

ACT["tour-next"] = () => {
  const tour = TOURS[T.id];
  if (T.i < tour.steps.length - 1) {
    T.i++;
    showStep();
  } else {
    T = null;
    tourRefresh();
    openSheet(() => tourMenu("Tour finished", "That's every feature. Try the practice game, or keep exploring."));
  }
};
ACT["tour-prev"] = () => {
  T.i = Math.max(0, T.i - 1);
  showStep();
};
ACT["tour-end"] = () => {
  T = null;
  tourRefresh();
};
ACT["start-tour"] = (el) => startTour("full", el.dataset.section ? sectionStart(el.dataset.section) : 0);
ACT["help"] = () => openSheet(() => tourMenu("Guided tours", "The full tour walks through every feature on the site. You can close it any time, or jump to one part."));

function tourMenu(title, sub) {
  return `<h2 class="h2">${title}</h2><p class="small muted" style="margin:4px 0 12px">${sub}</p>
    <div class="card list">
      <button class="list-item" data-act="start-tour"><div class="grow"><b>The full tour</b><div class="small muted">Every feature, start to finish · ${TOURS.full.steps.length} steps</div></div><span class="link">Start</span></button>
      <button class="list-item" data-act="walk-start"><div class="grow"><b>Score a practice game</b><div class="small muted">A guided full game covering every scorekeeping button · ${WALK.length} steps</div></div><span class="link">Start</span></button>
    </div>
    <p class="eyebrow" style="margin-top:14px">Or jump to one part of the tour</p>
    <div class="chips" style="margin-top:6px">${Object.entries(SECTIONS).map(([id, sec]) => `<button class="chip" data-act="start-tour" data-section="${id}" title="${esc(sec.blurb)}">${esc(sec.title)}</button>`).join("")}</div>
    <div class="row" style="margin-top:14px"><button class="btn btn-secondary grow" data-act="about-close">Costs & plan</button><button class="btn btn-secondary grow" data-act="close-sheet">Keep exploring</button></div>`;
}
ACT["about-close"] = () => {
  closeSheet();
  go("about");
};

/* ---------------------------------------------------------------- boot */
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const fn = ACT[el.dataset.act];
  if (!fn) return;
  if (el.tagName === "A" && !["close-sheet-nav", "note-open"].includes(el.dataset.act)) e.preventDefault();
  if (el.dataset.act === "note-open") e.preventDefault();
  fn(el, e);
});
document.addEventListener("change", (e) => {
  const el = e.target.closest("[data-change]");
  if (el && CHANGE[el.dataset.change]) CHANGE[el.dataset.change](el, e);
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && e.target.closest?.("[data-tour=signin]") && e.target.tagName === "INPUT") {
    const btn = e.target.closest("[data-tour=signin]").querySelector(".btn-primary");
    if (btn) btn.click();
  }
  if (e.key === "Escape") {
    if (sheetRender) ACT["close-sheet"]();
    else if (T) ACT["tour-end"]();
  }
});
window.addEventListener("hashchange", () => {
  if (!T) {
    sheetRender = null;
    SK = null;
  }
  render();
});

// Let the "setting up" screen paint before the season is simulated (first visit only takes a second or two).
// Opening the demo from its plain address always starts on the welcome page (with the tour buttons).
// Links to a specific page (with #/...) still open that page.
if (!location.hash || location.hash === "#" || location.hash === "#/") history.replaceState(null, "", "#/welcome");
setTimeout(() => {
  build();
  render();
}, 30);

})();
</script>
</body>
</html>
