<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b2545">
<title>Hoboken Little League · Demo</title>
<meta name="description" content="Interactive demo of the league website: news, live scoring, stats, WAR, families, fantasy baseball and admin tools.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%2715%27 fill=%27%230b2545%27/%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%2711%27 fill=%27%23fff%27/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: light;
  --ink: #111827;
  --ink-2: #374151;
  --muted: #6b7280;
  --line: #e5e7eb;
  --line-2: #d1d5db;
  --page: #f3f4f6;
  --card: #ffffff;
  --navy: #0b2545;
  --navy-2: #13315c;
  --red: #c8102e;
  --green: #15803d;
  --amber: #b45309;
  --blue: #1d4ed8;
  --radius: 10px;
  --head: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-size: 15px;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: #e7e9ee; color: var(--ink); -webkit-font-smoothing: antialiased; min-height: 100dvh; line-height: 1.4; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; text-decoration: none; }
h1, h2, h3, p { margin: 0; }

/* ---------------------------------------------------------------- shell */
.shell { position: relative; max-width: 480px; min-height: 100dvh; margin: 0 auto; background: var(--page); padding-bottom: 84px; }
.shell.bare { padding-bottom: 0; background: #fff; }

.top { position: sticky; top: 0; z-index: 20; background: var(--navy); color: #fff; }
.top-row { display: flex; align-items: center; gap: 10px; padding: 10px 12px 10px 14px; }
.brand { display: flex; align-items: center; gap: 9px; flex: 1; min-width: 0; font-family: var(--head); font-weight: 700; font-size: 20px; letter-spacing: 0.01em; text-transform: uppercase; }
.brand span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.logo-mark { width: 26px; height: 26px; flex-shrink: 0; }
.acct-btn { display: flex; align-items: center; gap: 7px; border: 0; background: rgba(255, 255, 255, 0.1); color: #fff; padding: 4px 10px 4px 4px; border-radius: 999px; font-size: 13px; font-weight: 600; }
.acct-btn:hover { background: rgba(255, 255, 255, 0.18); }
.avatar { display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 26px; border-radius: 50%; background: var(--red); color: #fff; font-size: 11px; font-weight: 700; flex-shrink: 0; }
.avatar-lg { width: 44px; height: 44px; font-size: 16px; }
.help-btn { border: 1px solid rgba(255, 255, 255, 0.35); background: transparent; color: #fff; font-weight: 700; width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0; }
.demo-strip { background: var(--navy-2); color: rgba(255, 255, 255, 0.75); font-size: 12px; text-align: center; padding: 5px 10px; }
.demo-strip .link { color: #fff; text-decoration: underline; font-weight: 600; }

main.view { padding: 16px; display: flex; flex-direction: column; gap: 16px; }

.tabs { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; z-index: 20; background: #fff; border-top: 1px solid var(--line); display: grid; padding-bottom: env(safe-area-inset-bottom); }
.tabs a { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 60px; font-size: 11px; font-weight: 600; color: var(--muted); border-top: 2px solid transparent; }
.tabs a.on { color: var(--navy); border-top-color: var(--red); }
.tabs svg { width: 22px; height: 22px; }

/* ---------------------------------------------------------------- type */
.h1 { font-family: var(--head); font-size: 30px; font-weight: 700; line-height: 1.05; letter-spacing: 0.005em; }
.h2 { font-family: var(--head); font-size: 19px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; }
.h3 { font-family: var(--head); font-size: 17px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.02em; }
.eyebrow { display: block; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.tiny { font-size: 11.5px; }
.bold { font-weight: 700; }
.num { font-variant-numeric: tabular-nums; }
.center { text-align: center; }
.row { display: flex; align-items: center; gap: 10px; }
.between { justify-content: space-between; }
.wrap { flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.stack-s { display: flex; flex-direction: column; gap: 6px; }
.ellipsis { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
.page-head { display: flex; flex-direction: column; gap: 4px; padding-bottom: 2px; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; border-bottom: 2px solid var(--ink); padding-bottom: 4px; }
.section-head a { color: var(--blue); font-weight: 600; font-size: 13px; }
.link { color: var(--blue); font-weight: 600; background: none; border: 0; padding: 0; }
.link:hover { text-decoration: underline; }
.back { font-size: 14px; }
.chev { color: var(--line-2); font-size: 20px; line-height: 1; }

/* ---------------------------------------------------------------- cards, lists, buttons */
.card { background: var(--card); border-radius: var(--radius); border: 1px solid var(--line); }
.pad { padding: 14px 16px; }
.list > * + * { border-top: 1px solid var(--line); }
.list-item { display: flex; align-items: center; gap: 12px; padding: 11px 14px; width: 100%; background: none; border: 0; text-align: left; }
button.list-item:hover, a.list-item:hover { background: #f9fafb; }
.list-item.mine, tr.mine td { background: #eef2ff; }
.total-row { font-weight: 700; background: #f9fafb; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 18px; border-radius: 8px; border: 1px solid transparent; font-weight: 600; font-size: 15px; text-align: center; }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: 0.4; pointer-events: none; }
.btn-primary { background: var(--navy); color: #fff; }
.btn-primary:hover { background: var(--navy-2); }
.btn-secondary { background: #fff; color: var(--ink); border-color: var(--line-2); }
.btn-secondary:hover { background: #f9fafb; }
.btn-green { background: var(--green); color: #fff; }
.btn-danger { background: #fff; color: var(--red); border-color: #f1c0c7; }
.btn-block { width: 100%; }
.btn-sm { min-height: 34px; font-size: 13px; padding: 0 12px; }
.tag { display: inline-flex; align-items: center; border-radius: 4px; padding: 2px 7px; font-size: 11px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; background: #f3f4f6; color: var(--ink-2); white-space: nowrap; }
.tag-live { background: var(--red); color: #fff; }
.tag-plain { background: none; padding: 0; color: var(--muted); letter-spacing: 0; text-transform: none; font-weight: 600; font-size: 12px; }
.tag-good { background: #dcfce7; color: #166534; }
.notice { border-radius: 8px; padding: 10px 12px; font-size: 14px; }
.notice.warn { background: #fef3c7; color: #78350f; }
.notice.bad { background: #fee2e2; color: #991b1b; }
.notice.good { background: #dcfce7; color: #166534; }

/* ---------------------------------------------------------------- team marks */
.badge { display: inline-flex; align-items: center; justify-content: center; border-radius: 6px; color: #fff; font-weight: 800; flex-shrink: 0; font-family: var(--head); letter-spacing: 0.02em; }
.b-sm { width: 30px; height: 24px; font-size: 12px; }
.b-md { width: 40px; height: 32px; font-size: 15px; }
.b-lg { width: 60px; height: 48px; font-size: 22px; border-radius: 8px; }
.jersey { display: inline-flex; align-items: center; justify-content: center; width: 34px; height: 34px; border-radius: 6px; color: #fff; font-weight: 700; font-size: 14px; flex-shrink: 0; font-family: var(--head); font-size: 17px; }
.jersey-lg { width: 52px; height: 52px; font-size: 24px; border-radius: 8px; }
.team-head { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-left: 5px solid; }
.team-card { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 16px 10px; text-align: center; border-top: 4px solid; }
.team-card:hover { border-color: var(--line-2); }
.rank { display: inline-block; width: 16px; text-align: right; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* ---------------------------------------------------------------- game cards */
.game { display: block; padding: 12px 14px; }
.game:hover { border-color: var(--line-2); }
.game-meta { display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 8px; gap: 8px; }
.game-team { display: flex; align-items: center; gap: 10px; }
.game-team + .game-team { margin-top: 6px; }
.game-team .name { font-weight: 600; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.game-team .score { font-family: var(--head); font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
.game-team.dim { color: var(--muted); }

/* ---------------------------------------------------------------- tables */
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 14px; }
th { font-family: var(--head); font-size: 13px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); font-weight: 700; padding: 8px 6px; text-align: center; border-bottom: 1px solid var(--line); background: #fafafa; }
td { padding: 9px 6px; text-align: center; border-top: 1px solid var(--line); }
tr:first-child td { border-top: 0; }
th:first-child, td:first-child { text-align: left; padding-left: 14px; }
th:last-child, td:last-child { padding-right: 14px; }
.table-card { overflow: hidden; }
.scroll-x { overflow-x: auto; }
.scroll-x table { min-width: 100%; white-space: nowrap; }
tr.cut td { border-top: 2px dashed var(--red); }
.team-link { gap: 8px; }
table.stats th a { color: inherit; display: block; white-space: nowrap; }
table.stats th a:hover { color: var(--ink); }
table.stats th.sorted { color: var(--ink); background: #eef2ff; }
table.stats td.sorted { font-weight: 700; background: #f5f7ff; }
.player-cell { gap: 8px; }

/* ---------------------------------------------------------------- chips & segmented */
.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chip { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 5px 12px; background: #fff; border: 1px solid var(--line-2); font-weight: 600; font-size: 13px; white-space: nowrap; }
.chip.on { background: var(--navy); color: #fff; border-color: var(--navy); }
.seg { display: flex; border: 1px solid var(--line-2); border-radius: 8px; overflow: hidden; background: #fff; }
.seg a, .seg button { flex: 1; border: 0; background: none; padding: 9px 4px; font-weight: 600; font-size: 14px; color: var(--muted); text-align: center; }
.seg > * + * { border-left: 1px solid var(--line-2); }
.seg .on { background: var(--navy); color: #fff; }
.tabs-inline { display: flex; gap: 2px; border-bottom: 1px solid var(--line-2); overflow-x: auto; scrollbar-width: none; }
.tabs-inline a { padding: 9px 12px; font-weight: 600; font-size: 14px; color: var(--muted); border-bottom: 3px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tabs-inline a.on { color: var(--ink); border-bottom-color: var(--red); }

/* ---------------------------------------------------------------- scoreboard */
.board { background: var(--navy); color: #fff; border-radius: var(--radius); padding: 12px 16px 14px; }
.board-label { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: rgba(255, 255, 255, 0.6); margin-bottom: 8px; }
.board .teams { display: grid; grid-template-columns: 1fr auto; gap: 8px 12px; align-items: center; }
.board .tname { display: flex; gap: 10px; align-items: center; font-weight: 600; font-size: 17px; min-width: 0; }
.board .tname span:last-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.board .runs { font-family: var(--head); font-size: 38px; font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; line-height: 1; }
.board .bat-arrow { color: #fbbf24; font-size: 12px; vertical-align: middle; }
.board .sit { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; padding-top: 10px; border-top: 1px solid rgba(255, 255, 255, 0.15); gap: 10px; }
.board .inn { font-family: var(--head); font-weight: 700; font-size: 17px; text-transform: uppercase; letter-spacing: 0.03em; }
.count { font-family: var(--head); font-weight: 700; font-size: 18px; font-variant-numeric: tabular-nums; }
.outs { display: flex; gap: 5px; align-items: center; font-size: 12px; }
.outs i { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid rgba(255, 255, 255, 0.55); display: inline-block; }
.outs i.on { background: #fbbf24; border-color: #fbbf24; }
.diamond { width: 44px; height: 44px; position: relative; flex-shrink: 0; }
.diamond b { position: absolute; width: 14px; height: 14px; transform: rotate(45deg); border: 1.5px solid rgba(255, 255, 255, 0.55); }
.diamond b.on { background: #fbbf24; border-color: #fbbf24; }
.diamond .b1 { right: 2px; top: 16px; }
.diamond .b2 { left: 15px; top: 2px; }
.diamond .b3 { left: 2px; top: 16px; }
.linescore th, .linescore td { padding: 7px 5px; font-size: 13px; }
.linescore td.tot { font-weight: 700; }
.at-bat { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.at-bat > div { display: flex; flex-direction: column; gap: 2px; }

/* ---------------------------------------------------------------- play log */
.plays { overflow: hidden; }
.plays .inn-head { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); padding: 9px 14px 5px; background: #fafafa; border-top: 1px solid var(--line); }
.plays .inn-head:first-child { border-top: 0; }
.play { padding: 9px 14px; font-size: 14px; display: flex; gap: 10px; align-items: flex-start; border-top: 1px solid #f3f4f6; }
.play .dot { width: 7px; height: 7px; border-radius: 50%; margin-top: 7px; flex-shrink: 0; background: #d1d5db; }
.play.run .dot { background: var(--red); }
.play.hit .dot { background: var(--navy); }
.play.run { font-weight: 600; }
.play.info { color: var(--muted); font-size: 13px; }
.play .sc { margin-left: auto; font-weight: 600; font-size: 12px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.flash { animation: flash 1.2s ease-out; }
@keyframes flash { from { background: #fef9c3; } to { background: transparent; } }

/* ---------------------------------------------------------------- scorekeeper */
.sk-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.sk-btn { min-height: 68px; border-radius: 10px; border: 1px solid var(--line-2); font-size: 18px; font-weight: 700; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; background: #fff; }
.sk-btn:active { transform: translateY(1px); }
.sk-btn small { font-size: 11px; font-weight: 500; color: var(--muted); }
.sk-ball { border-color: #bfdbfe; background: #eff6ff; color: #1e3a8a; }
.sk-strike { border-color: #fecaca; background: #fef2f2; color: #991b1b; }
.sk-foul { border-color: #fde68a; background: #fffbeb; color: #78350f; }
.sk-play { grid-column: span 2; min-height: 72px; background: var(--green); border-color: var(--green); color: #fff; font-size: 20px; }
.sk-mini { min-height: 50px; font-size: 14px; font-weight: 600; }
.sk-btn:disabled { opacity: 0.4; }
.pc-bar { height: 6px; border-radius: 99px; background: #e5e7eb; overflow: hidden; margin-top: 6px; }
.pc-bar i { display: block; height: 100%; background: var(--green); }
.pc-bar.warn i { background: #d97706; }
.pc-bar.over i { background: var(--red); }
.pos-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.pos-grid button { min-height: 54px; border-radius: 8px; border: 1px solid var(--line-2); background: #fff; font-weight: 700; font-size: 17px; font-family: var(--head); }
.pos-grid button small { display: block; font-size: 11px; color: var(--muted); font-family: "Inter", sans-serif; font-weight: 500; }
.res-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
.res-grid button { min-height: 46px; border-radius: 8px; border: 1px solid var(--line-2); font-weight: 600; font-size: 14px; background: #fff; }
.res-grid button.hit { border-color: #bfdbfe; color: #1e3a8a; }
.res-grid button:disabled { opacity: 0.35; }
.bb-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 12px; }
.bb-grid button { min-height: 42px; border-radius: 8px; border: 1px solid var(--line-2); background: #fff; font-weight: 600; font-size: 13px; }
.bb-grid button.on, .pos-grid button.on { background: var(--navy); color: #fff; border-color: var(--navy); }
.pos-grid button.on small { color: rgba(255, 255, 255, 0.75); }
.runner-row { padding: 10px 0; }
.runner-row + .runner-row { border-top: 1px solid var(--line); }
.dest { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; margin-top: 7px; }
.dest button { min-height: 40px; border-radius: 7px; border: 1px solid var(--line-2); background: #fff; font-weight: 600; font-size: 13px; }
.dest button.on { background: var(--navy); color: #fff; border-color: var(--navy); }
.dest button.on.out { background: var(--red); border-color: var(--red); }
.dest button.on.home { background: var(--green); border-color: var(--green); }
.dest button:disabled { visibility: hidden; }
.field { width: 100%; height: auto; display: block; border-radius: 8px; background: #2f6f42; }
.field.tap { cursor: crosshair; touch-action: manipulation; }
.field-wrap { max-width: 360px; margin: 0 auto; }
.legend span { margin-left: 8px; }
.legend span:first-child { margin-left: 0; }

/* ---------------------------------------------------------------- sheet / dialog */
.sheet-wrap { position: fixed; inset: 0; z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
.sheet-bg { position: absolute; inset: 0; background: rgba(17, 24, 39, 0.5); }
.sheet { position: relative; width: 100%; max-width: 480px; max-height: 88dvh; overflow-y: auto; background: var(--page); border-radius: 14px 14px 0 0; padding: 8px 16px calc(18px + env(safe-area-inset-bottom)); animation: up 0.18s ease-out; }
.sheet .grab { width: 36px; height: 4px; border-radius: 9px; background: var(--line-2); margin: 4px auto 12px; }
@keyframes up { from { transform: translateY(24px); opacity: 0; } }

/* ---------------------------------------------------------------- forms */
.field label { display: block; font-size: 13px; font-weight: 600; color: var(--ink-2); margin-bottom: 5px; }
.input { width: 100%; min-height: 44px; border-radius: 8px; border: 1px solid var(--line-2); background: #fff; padding: 0 12px; font-size: 15px; }
.input:focus { outline: none; border-color: var(--navy); box-shadow: 0 0 0 3px rgba(11, 37, 69, 0.12); }
.code-input { text-align: center; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 700; }
.pts-input { width: 84px; min-height: 36px; text-align: right; }
.switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 11px 14px; }
.switch input { width: 42px; height: 24px; appearance: none; background: var(--line-2); border-radius: 99px; position: relative; flex-shrink: 0; cursor: pointer; }
.switch input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: transform 0.15s; }
.switch input:checked { background: var(--green); }
.switch input:checked::after { transform: translateX(18px); }
.stepper { display: flex; align-items: center; gap: 8px; }
.stepper button { width: 36px; height: 36px; border-radius: 8px; border: 1px solid var(--line-2); background: #fff; font-size: 18px; font-weight: 600; }
.stepper output { font-family: var(--head); font-size: 24px; font-weight: 700; min-width: 34px; text-align: center; font-variant-numeric: tabular-nums; }
.slot { display: inline-flex; justify-content: center; width: 46px; font-size: 11px; font-weight: 700; color: var(--muted); background: #f3f4f6; border-radius: 4px; padding: 3px 0; flex-shrink: 0; }

/* ---------------------------------------------------------------- stat tiles & leaders */
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.tile { background: #fff; border-radius: 8px; border: 1px solid var(--line); padding: 10px 8px; text-align: center; }
.tile b { display: block; font-family: var(--head); font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; }
.tile span { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; color: var(--muted); }
.leaders { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.leader { padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.leader:hover { border-color: var(--line-2); }
.leader-top { display: flex; align-items: center; gap: 8px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
.leader-top b.ellipsis { font-size: 13px; }
.leader-val { font-family: var(--head); font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }
.leader-row { display: flex; align-items: center; gap: 6px; font-size: 12.5px; }
.leader-row .rank { width: 12px; }

/* ---------------------------------------------------------------- bracket */
.bracket { display: flex; flex-direction: column; gap: 16px; }
.round { display: flex; flex-direction: column; gap: 8px; }
.match { padding: 10px 14px; }
.match:hover { border-color: var(--line-2); }
.seed-row { gap: 8px; }
.seed-row.dim { color: var(--muted); }
.seed { width: 16px; text-align: right; font-size: 12px; font-weight: 700; color: var(--muted); }
.score-sm { font-family: var(--head); font-size: 22px; }
.series-game { padding: 8px 0; }
.champ { background: var(--navy); color: #fff; border-radius: var(--radius); padding: 18px 20px; border-left: 6px solid var(--red); }
.champ .eyebrow { color: rgba(255, 255, 255, 0.6); }

/* ---------------------------------------------------------------- welcome */
.welcome { padding: 32px 22px 40px; display: flex; flex-direction: column; gap: 18px; }
.welcome-mark { display: flex; justify-content: center; }
.welcome-mark .logo-mark { width: 56px; height: 56px; background: var(--navy); border-radius: 50%; padding: 8px; }
.feature { padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; }
.about-item { display: block; font-size: 14px; line-height: 1.5; }
.demo-box { border: 1px dashed var(--line-2); background: #fafafa; }
.clock.on-clock { border-color: var(--green); box-shadow: inset 4px 0 0 var(--green); }

/* ---------------------------------------------------------------- tour */
.tour-spot { position: fixed; z-index: 60; border-radius: 10px; pointer-events: none; box-shadow: 0 0 0 3px #fbbf24, 0 0 0 9999px rgba(17, 24, 39, 0.55); transition: all 0.2s ease; }
.tour-tip { position: fixed; z-index: 61; left: 50%; transform: translateX(-50%); width: min(420px, calc(100vw - 24px)); background: #fff; border-radius: 10px; padding: 14px 16px; box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3); transition: top 0.2s ease; border-top: 4px solid var(--red); }
.tour-tip .step { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
.tour-tip h3 { font-family: var(--head); font-size: 22px; font-weight: 700; margin: 4px 0 6px; }
.tour-tip p { font-size: 14px; line-height: 1.5; color: var(--ink-2); }
.tour-tip .try { margin-top: 8px; font-size: 13px; font-weight: 600; color: var(--green); }
.tour-dots { display: flex; gap: 4px; }
.tour-dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--line-2); }
.tour-dots i.on { background: var(--navy); }

.toast { position: fixed; left: 50%; bottom: 86px; transform: translateX(-50%); z-index: 70; background: var(--ink); color: #fff; font-weight: 500; font-size: 14px; padding: 10px 16px; border-radius: 8px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25); max-width: calc(100vw - 32px); animation: up 0.18s ease-out; }

/* ---------------------------------------------------------------- layout helpers (phone first) */
.cols, .col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.card-grid { display: flex; flex-direction: column; gap: 8px; }
.team-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.draft-grid { display: flex; flex-direction: column; gap: 14px; }
.top-nav, .desk-only { display: none; }

/* ---------------------------------------------------------------- desktop */
@media (min-width: 960px) {
  .shell { max-width: 1200px; margin: 0 auto; min-height: 100dvh; padding-bottom: 40px; box-shadow: 0 0 0 1px var(--line); }
  .shell.bare { max-width: 560px; margin-top: 40px; min-height: auto; border-radius: 12px; }
  .tabs, .mobile-only { display: none; }
  .desk-only { display: flex; }
  .top-row { padding: 0 24px; gap: 20px; min-height: 58px; }
  .brand { flex: 0 0 auto; font-size: 22px; }
  .top-nav { display: flex; gap: 2px; flex: 1; align-self: stretch; }
  .top-nav a { display: flex; align-items: center; padding: 0 14px; font-weight: 600; font-size: 14px; color: rgba(255, 255, 255, 0.75); border-bottom: 3px solid transparent; }
  .top-nav a:hover { color: #fff; }
  .top-nav a.on { color: #fff; border-bottom-color: var(--red); }
  main.view { padding: 28px 32px; gap: 20px; }
  main.view.narrow { max-width: 820px; margin: 0 auto; width: 100%; }
  .h1 { font-size: 38px; }
  .cols { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 28px; align-items: start; }
  .cols.cols-main { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); }
  .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
  .team-grid { grid-template-columns: repeat(5, minmax(0, 1fr)); }
  .leaders { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
  .bracket { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; align-items: start; }
  .draft-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }
  .seg-inline { max-width: 320px; }
  .field-wrap { max-width: 420px; }
  .sk-btn { min-height: 80px; }
  .sheet-wrap { align-items: center; }
  .sheet { max-width: 520px; border-radius: 12px; max-height: 90dvh; }
  .sheet .grab { display: none; }
  .toast { bottom: 28px; }
}
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}

/* ---------------------------------------------------------------- lineup editor */
.lineup-row { gap: 6px; padding: 7px 10px; }
.lineup-row .rank { width: 14px; }
.lu-player { flex: 1; min-width: 0; min-height: 36px; font-size: 14px; padding: 0 6px; }
.lu-pos { width: 64px; min-height: 36px; font-size: 14px; padding: 0 4px; }
.lu-move { display: flex; gap: 3px; }
.lu-move .btn { min-height: 32px; padding: 0 8px; }

/* ---------------------------------------------------------------- innings table */
table.innings td.inn-cell { color: var(--ink); font-weight: 600; min-width: 38px; }

/* ---------------------------------------------------------------- practice-game coach */
.coach { position: fixed; z-index: 45; left: 8px; right: 8px; bottom: calc(68px + env(safe-area-inset-bottom)); background: #fff; border-radius: 10px; border-top: 4px solid var(--red); box-shadow: 0 12px 36px rgba(0, 0, 0, 0.28); padding: 12px 14px; max-height: 46dvh; overflow-y: auto; }
.coach h3 { font-family: var(--head); font-size: 21px; font-weight: 700; margin: 3px 0 4px; }
.coach p { font-size: 14px; line-height: 1.45; color: var(--ink-2); }
.coach .coach-hint { margin-top: 6px; font-size: 13px; font-weight: 600; color: var(--green); }
.coach-bar { display: flex; align-items: center; gap: 12px; margin-top: 10px; }
.coach-progress { flex: 1; height: 5px; border-radius: 99px; background: var(--line); overflow: hidden; }
.coach-progress i { display: block; height: 100%; background: var(--navy); }
.coach-hl { outline: 3px solid #fbbf24; outline-offset: 3px; border-radius: 10px; }
body.walking .shell { padding-bottom: 46dvh; }
@media (min-width: 960px) {
  .coach { left: auto; right: 24px; bottom: 24px; width: 380px; max-height: 70dvh; }
  body.walking .shell { padding-bottom: 40px; }
  body.walking main.view { padding-right: 420px; }
}

/* ---------------------------------------------------------------- added for the full-feature demo */
.notice:not(.warn):not(.bad):not(.good) { background: #eef2ff; color: #1e3a8a; }
.notice ul { margin: 6px 0 0 18px; padding: 0; }
.bell { position: relative; display: inline-flex; color: #fff; width: 30px; height: 30px; align-items: center; justify-content: center; flex-shrink: 0; }
.bell svg { width: 20px; height: 20px; }
.bell b { position: absolute; top: -2px; right: -4px; background: var(--red); color: #fff; font-size: 10px; min-width: 17px; height: 17px; border-radius: 99px; display: flex; align-items: center; justify-content: center; padding: 0 4px; border: 2px solid var(--navy); }
.chip.off { background: #f3f4f6; color: var(--muted); text-decoration: line-through; border-style: dashed; }
.tiny.rain, .rain { color: var(--amber); font-weight: 600; margin-top: 4px; }
.news-card { display: block; }
.news-card.pinned { border-left: 4px solid var(--red); }
.news-title { display: block; font-size: 16px; margin: 4px 0 2px; }
.clamp { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.block { display: block; }
.danger-zone { border: 1px solid #fecaca; }
.dot-sm { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; background: transparent; }
.dot-sm.on { background: var(--red); }
.list-item.unread b { font-weight: 800; }
.list-item.wrap { flex-wrap: wrap; }
.list-item.bad { background: #fef2f2; color: #991b1b; }
.list-item.picked { background: #fef3c7; }
.switch-inline { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; cursor: pointer; }
.offline-bar { gap: 12px; flex-wrap: wrap; margin-bottom: 12px; border-left: 4px solid var(--green); }
.offline-bar.off { border-left-color: var(--amber); background: #fffbeb; }
.input-sm { min-height: 32px; padding: 4px 8px; font-size: 13px; width: auto; }
.mono { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; }
textarea.input { width: 100%; resize: vertical; }
.team-cols { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
.team-cols label { gap: 8px; padding: 3px 0; }
.aging { background: #fffbeb; border-radius: 6px; padding: 3px 4px !important; }
.warn-text { color: var(--amber); font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; }
.ok-dot, .todo-dot { width: 22px; height: 22px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-weight: 800; font-size: 12px; flex-shrink: 0; }
.ok-dot { background: #dcfce7; color: #166534; }
.todo-dot { background: #fef3c7; color: #78350f; }
.glossary { display: grid; gap: 6px 24px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); margin: 10px 0 0; }
.glossary dt, .glossary dd { display: inline; margin: 0; }
.glossary dt { font-weight: 700; }
td.bad { background: #fee2e2; color: #991b1b; font-weight: 700; }
.admin-tabs { margin-bottom: 14px; }
details summary { cursor: pointer; }
.record { min-width: 0; }
@media (max-width: 640px) {
  .bell { width: 26px; }
  .offline-bar .switch-inline { white-space: normal; }
}

.tour-progress { flex: 1; height: 5px; background: var(--line); border-radius: 99px; overflow: hidden; margin-right: 12px; }
.tour-progress i { display: block; height: 100%; background: var(--red); }

</style>

/* Hoboken Little League demo — helpers around the real site's engine (window.HLL):
 * simulated games from each kid's real hitting, suggested lineups, field spots.
 * Scoring, stats, WAR and fantasy points all come from HLL, the same code the site runs.
 *
 * A game is { setup, events }. Its state is always rebuilt by replaying events, so
 * "undo" is just removing the last event and every stat comes from the play-by-play.
 */
const Engine = (() => {
  const { POS, posOf, RESULTS, BB_TYPES, OUT_FOR, restDays, pitchLimit, inningsPitched, ordinal } = HLL;

  // Field coordinates (0-100 box, home plate at the bottom middle).
  const SPOTS = { 1: [50, 76], 2: [50, 96], 3: [64, 69], 4: [58, 60], 5: [36, 69], 6: [42, 60], 7: [22, 37], 8: [50, 24], 9: [78, 37] };
  const FIELD_NAME = { 1: "the pitcher", 2: "the catcher", 3: "first base", 4: "second base", 5: "third base", 6: "shortstop", 7: "left field", 8: "center field", 9: "right field" };
  function nearestFielder(x, y, skip = []) {
    let best = 1;
    let d = Infinity;
    for (const [n, [fx, fy]] of Object.entries(SPOTS)) {
      if (skip.includes(Number(n))) continue;
      const dd = (fx - x) ** 2 + (fy - y) ** 2;
      if (dd < d) (d = dd), (best = Number(n));
    }
    return best;
  }

  function rng(seed) {
    let s = seed >>> 0;
    return () => {
      s = (s + 0x6d2b79f5) | 0;
      let t = Math.imul(s ^ (s >>> 15), 1 | s);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const pick = (r, xs) => xs[Math.floor(r() * xs.length)];

  /** Default destinations: keys "B" (batter), 1, 2, 3 → 1-3 base, 4 scores, "X" out. */
  function defaultMoves(bases, result) {
    const occ = [1, 2, 3].filter((b) => bases[b - 1]);
    const m = {};
    const adv = (n) => occ.forEach((b) => (m[b] = Math.min(4, b + n)));
    const hold = () => occ.forEach((b) => (m[b] = b));
    switch (result) {
      case "1B": m.B = 1; adv(1); break;
      case "2B": m.B = 2; adv(2); break;
      case "3B": m.B = 3; adv(3); break;
      case "HR": m.B = 4; adv(3); break;
      case "E": m.B = 1; adv(1); break;
      case "SF": m.B = "X"; hold(); if (bases[2]) m[3] = 4; break;
      case "SAC": m.B = "X"; adv(1); break;
      case "FC": m.B = 1; hold(); if (bases[0]) m[1] = "X"; else if (occ.length) m[Math.max(...occ)] = "X"; break;
      case "DP": m.B = "X"; hold(); if (bases[0]) m[1] = "X"; break;
      default: m.B = "X"; hold();
    }
    return m;
  }

  /** The real engine, with the league's rules (LeagueRules shape, as the admin edits them). */
  const replay = (game, rules, names = {}) => HLL.replay(game.setup, game.events, HLL.engineRules(rules), names);

  /** Plate-appearance outcome weights from a player's real season line. */
  function profileFor(bat) {

    if (!bat || bat.PA < 5) return base;

    const real = {
      BB: bat.BB / pa, K: bat.K / pa, HBP: bat.HBP / pa, "1B": bat["1B"] / pa, "2B": bat["2B"] / pa, "3B": bat["3B"] / pa, HR: bat.HR / pa,
      E: bat.ROE / pa, FC: bat.FC / pa, GO: (inPlayOuts * 0.5) / pa, FO: (inPlayOuts * 0.27) / pa, LO: (inPlayOuts * 0.08) / pa, PO: (inPlayOuts * 0.13) / pa, DP: (inPlayOuts * 0.015) / pa, SF: (inPlayOuts * 0.005) / pa,
    };
    return base.map(([k, v]) => [k, v * (1 - w) + (real[k] ?? v) * w]);
  }

  // Where balls end up, by result. Returns [x, y] on the 0-100 field.
  function spot(r, result, fielder, type) {
    const j = (n) => (r() - 0.5) * n;
    if (result === "HR") return [25 + r() * 50, 5 + r() * 6];
    if (result === "3B") return [pick(r, [16, 84]) + j(6), 30 + j(8)];
    if (result === "2B") return [pick(r, [14, 32, 68, 86]) + j(8), pick(r, [26, 40]) + j(6)];
    if (result === "1B") return type === "G" ? [pick(r, [34, 47, 53, 66]) + j(5), 54 + j(6)] : [24 + r() * 52, 44 + j(8)];
    const [fx, fy] = SPOTS[fielder] || SPOTS[6];
    return [fx + j(10), fy + j(8)];
  }

  // ------------------------------------------------------------ lineups & simulation
  /** Starting lineup for one team: the kids who usually start, a rotating pitcher, sensible positions. */
  function teamSetup(roster, round, r) {
    const gs = (p) => (p.bat?.GS || 0) + r() * 3;
    const order = [...roster].sort((a, b) => gs(b) - gs(a));
    const pitchers = roster.filter((p) => p.pit && p.pit.GS > 0).sort((a, b) => b.pit.GS - a.pit.GS);
    const starter = pitchers.length ? pitchers[round % Math.min(4, pitchers.length)] : order[0];
    let starters = order.slice(0, 9);
    if (!starters.includes(starter)) starters = [...starters.slice(0, 8), starter];
    const bench = roster.filter((p) => !starters.includes(p));
    const left = new Set(starters.filter((p) => p !== starter));
    const take = (want) => {
      const p = [...left].find((x) => want.some((w) => x.pos.includes(w))) || [...left][0];
      left.delete(p);
      return p;
    };
    const assigned = { P: starter, C: take(["C"]), "1B": take(["1B"]), SS: take(["INF"]), "2B": take(["INF"]), "3B": take(["INF"]), CF: take(["OF"]), LF: take(["OF"]), RF: take(["OF"]) };
    const byPlayer = new Map(Object.entries(assigned).filter(([, p]) => p).map(([pos, p]) => [p, pos]));
    const opsOf = (p) => (p.bat && p.bat.AB ? (p.bat.H + p.bat.BB) / p.bat.PA + p.bat.TB / p.bat.AB : 0);
    const batting = [...starters].sort((a, b) => opsOf(b) - opsOf(a));
    // Classic order: good hitters at the top, the best in the 3 hole.
    const lineup = [batting[2], batting[1], batting[0], batting[3], ...batting.slice(4)].filter(Boolean).map((p) => ({ pid: p.id, pos: byPlayer.get(p) || "RF" }));
    const relief = pitchers.filter((p) => p !== starter).map((p) => p.id);
    return { lineup, bench: bench.map((p) => p.id), relief };
  }

  /** Suggested lineups for a game. `absent` = [awayIds, homeIds] of kids who aren't there. */
  function setupFor(game, players, absent = [[], []]) {
    const r = rng(game.seed);
    const side = (tid, t, round) => teamSetup(players.filter((p) => p.team === tid && !absent[t].includes(p.id)), round, r);
    const a = side(game.away, 0, game.round || 0);
    const h = side(game.home, 1, (game.round || 0) + 1);
    return { lineups: [a.lineup, h.lineup], bench: [a.bench, h.bench], absent: [[...absent[0]], [...absent[1]]], relief: [a.relief, h.relief] };
  }

  const FIELDERS = {
    GO: ["6-3", "4-3", "5-3", "1-3", "3", "6-3", "4-3"], FO: ["7", "8", "9", "8"], LO: ["4", "6", "5", "3", "8"], PO: ["2", "4", "6", "5", "3"],
    DP: ["6-4-3", "4-6-3", "5-4-3"], FC: ["6-4", "4-6", "5-4"], E: ["E6", "E5", "E4", "E1", "E8", "E9"], SF: ["8", "9", "7"],
    "1B": ["7", "8", "9"], "2B": ["7", "8", "9"], "3B": ["8", "9"], HR: ["8", "7", "9"],
  };
  const TYPE_FOR = { GO: "G", FO: "F", LO: "L", PO: "P", DP: "G", FC: "G", SF: "F", SAC: "B", BO: "B" };
  const pitcherOf = (s, t) => (s.lineup[t].find((x) => x.pos === "P") || s.lineup[t][0]).pid;

  /** Generates events for a whole (or partial) game. profiles: pid → outcome weights. */
  function simulate(setup, seed, rules, stop = null, startEvents = [], profiles = {}, { tiesAllowed = true } = {}) {
    const r = rng(seed);
    const game = { setup, events: [...startEvents] };
    const push = (ev) => game.events.push(ev);
    let lastHalfKey = "";
    for (let guard = 0; guard < 5000; guard++) {
      const s = replay(game, rules);
      if (s.status === "final" || (stop && stop(s))) break;
      const fieldTeam = 1 - s.half;
      const fresh = s.outs === 0 && s.balls === 0 && s.strikes === 0;
      const halfKey = `${s.inning}-${s.half}`;
      if (halfKey !== lastHalfKey && fresh) {
        lastHalfKey = halfKey;
        if (s.inning > rules.innings && s.half === 0 && s.score[0] === s.score[1] && tiesAllowed && r() < 0.6) {
          push({ t: "end", reason: "Tie, time limit" });
          continue;
        }
      }
      // Pitching change: between innings after ~45-65 pitches, or right away near the limit.
      const pp = s.pit[pitcherOf(s, fieldTeam)];
      if (pp && s.balls === 0 && s.strikes === 0 && ((fresh && pp.P > 45 + r() * 20) || pp.P >= 68)) {
        const next = (setup.relief?.[fieldTeam] || []).find((pid) => !s.pitchersUsed[fieldTeam].includes(pid));
        if (next && s.lineup[fieldTeam].some((x) => x.pid === next)) {
          push({ t: "pos", team: fieldTeam, pid: next, pos: "P" });
          continue;
        }
        if (next && s.bench[fieldTeam].includes(next)) {
          push({ t: "sub", team: fieldTeam, slot: s.lineup[fieldTeam].findIndex((x) => x.pos === "P"), pid: next });
          continue;
        }
        const cand = s.lineup[fieldTeam].filter((x) => x.pos !== "P" && x.pos !== "C" && !s.pitchersUsed[fieldTeam].includes(x.pid));
        if (cand.length) {
          push({ t: "pos", team: fieldTeam, pid: pick(r, cand).pid, pos: "P" });
          continue;
        }
      }
      // Outcome for this plate appearance, from the batter's real profile.
      const weights = profiles[s.batter] || profileFor(null);
      const total = weights.reduce((n, [, w]) => n + w, 0);
      let x = r() * total;
      let out = "GO";
      for (const [k, w] of weights) if ((x -= w) < 0) { out = k; break; }
      const occupied = s.bases.some(Boolean);
      if (out === "DP" && !(s.bases[0] && s.outs < 2)) out = "GO";
      if (out === "SF" && !(s.bases[2] && s.outs < 2)) out = "FO";
      if (out === "FC" && !occupied) out = "GO";
      const pre = (maxB, maxS) => {
        let b = 0, k = 0;
        const n = Math.floor(r() * 5);
        for (let i = 0; i < n; i++) {
          if (r() < 0.5 && b < maxB) (push({ t: "pitch", r: "B" }), b++);
          else if (k < maxS) (push({ t: "pitch", r: pick(r, ["CS", "SS", "F"]) }), k++);
          else if (r() < 0.5) push({ t: "pitch", r: "F" });
        }
        return [b, k];
      };
      if (out === "BB") {
        const [b] = pre(3, 2);
        for (let i = b; i < 4; i++) push({ t: "pitch", r: "B" });
      } else if (out === "K") {
        const [, k] = pre(3, 2);
        for (let i = k; i < 3; i++) push({ t: "pitch", r: r() < 0.4 ? "CS" : "SS" });
      } else if (out === "HBP") {
        pre(3, 2);
        push({ t: "hbp" });
      } else {
        pre(3, 2);
        const m = defaultMoves(s.bases, out);
        if (out === "1B" && s.bases[1] && r() < 0.6) m[2] = 4;
        if (out === "1B" && s.bases[0] && !s.bases[2] && r() < 0.3) m[1] = 3;
        if (out === "GO" && s.bases[2] && s.outs < 2 && r() < 0.5) m[3] = 4;
        const f = pick(r, FIELDERS[out] || ["6-3"]);
        const first = Number(f.replace(/^E/, "").split("-")[0]);
        const bb = TYPE_FOR[out] || (out === "1B" ? pick(r, ["G", "L", "L"]) : out === "E" ? pick(r, ["G", "G", "F"]) : out === "HR" ? "F" : pick(r, ["L", "F"]));
        const loc = spot(r, out, first, bb).map((v) => Math.round(Math.max(1, Math.min(99, v))));
        // Hard-hit: the scorekeeper's call. Most line drives and extra-base hits, a few others.
        const hh = bb === "L" ? r() < 0.8 : ["2B", "3B", "HR"].includes(out) ? r() < 0.7 : r() < 0.15;
        push({ t: "play", r: out, f, m, bb, loc, hh });
      }
      const s2 = replay(game, rules);
      if (s2.status !== "final" && s2.bases[0] && !s2.bases[1] && r() < 0.22) {
        const safe = r() < 0.78;
        push({ t: "runner", k: safe ? "SB" : "CS", m: { 1: safe ? 2 : "X" } });
      }
    }
    return game;
  }

  /** Spray charts, game logs and innings by position, from a season's games. */
  function seasonExtras(games) {
    const bip = {};
    const logs = {};
    const def = {};
    for (const g of games) {
      const s = g.rep;
      if (!s || g.status !== "final") continue;
      for (const pid of new Set([...Object.keys(s.bat), ...Object.keys(s.pit)])) (logs[pid] ||= []).push({ game: g, b: s.bat[pid] || null, p: s.pit[pid] || null });
      s.bip.forEach((x) => (bip[x.pid] ||= []).push(x));
      for (const [pid, byPos] of Object.entries(s.defPos)) {
        const t = (def[pid] ||= {});
        for (const [pos, outs] of Object.entries(byPos)) t[pos] = (t[pos] || 0) + outs;
      }
    }
    return { bip, logs, def };
  }

  return { POS, posOf, RESULTS, BB_TYPES, OUT_FOR, SPOTS, FIELD_NAME, nearestFielder, rng, pick, defaultMoves, replay, ordinal, inningsPitched, restDays, pitchLimit, profileFor, setupFor, simulate, seasonExtras };
})();

/** Round r of the Fall 2026 schedule: every 3-4 days, round 10 is today. */
function roundDate(r, gi) {
  const d = new Date(NOW);
  d.setHours(0, 0, 0, 0);
  d.setDate(d.getDate() + Math.floor((r - TODAY_ROUND) * 3.5));
  if (r === TODAY_ROUND) {
    if (gi === 0) return new Date(NOW - 70 * 60000).toISOString();
    const t = new Date(NOW + (gi < 3 ? 60 : 150) * 60000);
    t.setMinutes(Math.round(t.getMinutes() / 15) * 15, 0, 0);
    return t.toISOString();
  }
  d.setHours(gi < 3 ? 17 : 19, 30, 0, 0);
  return d.toISOString();
}

/** The Fall 2026 schedule before anything happens in the demo. */
function fallSchedule() {
  const games = [];
  const rounds = HLL.seasonRounds(TEAMS.map((t) => t.id), 14);
  const r = E.rng(2026);
  rounds.forEach((round, ri) =>
    round.forEach((g, gi) => {
      let date = roundDate(ri, gi);
      let movedFrom = null;
      if (ri === RAIN_ROUND) {
        movedFrom = date;
        date = roundDate(rounds.length + 1, gi);
      }
      games.push({ id: `g${ri}-${gi}`, season: CUR.id, type: "regular", round: ri, date, movedFrom, field: `Field ${(gi % 3) + 1}`, home: g.home, away: g.away, seed: Math.floor(r() * 1e9) });
    }),
  );
  return games;
}

  const ageIn = (p, season) => (p.age == null ? null : p.age + (season.year - 2026));

}

function lineOf(pid, seasonId = W.season.id) {
  const rows = statsOf(seasonId).filter((s) => s.player_id === pid);
  if (!rows.length) return null;
  if (rows.length === 1) return rows[0];

const fmtDay = (iso) => new Date(iso).toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });

  const mins = Math.round((Date.now() - Date.parse(iso)) / 60000);
  if (mins < 1) return "just now";
  if (mins < 60) return `${mins} min ago`;
  if (mins < 24 * 60) return `${Math.round(mins / 60)} h ago`;
  return fmtDay(iso);
};
const dayKey = (iso) => {

function download(name, text, type = "text/csv") {
  const blob = new Blob([type === "text/csv" ? "﻿" + text : text], { type: `${type};charset=utf-8` });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);

  setTimeout(() => {

  }, 500);

/* ---------------------------------------------------------------- routing */
function parseRoute() {
  const h = location.hash.replace(/^#\/?/, "");
  const [path, query = ""] = h.split("?");
  const parts = path.split("/").filter(Boolean);
  return { parts, name: parts[0] || "", path, q: Object.fromEntries(new URLSearchParams(query)) };
}
function go(path) {
  const target = "#/" + path.replace(/^#?\/?/, "");
  if (location.hash === target) render();
  else location.hash = target;
}
/** Link to the current page with some query params changed. */
function withQuery(changes) {
  const r = parseRoute();
  const q = { ...r.q, ...changes };
  Object.keys(q).forEach((k) => (q[k] === null || q[k] === undefined || q[k] === "") && delete q[k]);
  const qs = new URLSearchParams(q).toString();
  return `#/${r.path}${qs ? "?" + qs : ""}`;
}

      <div class="feature"><b>Live scoring</b><p class="small muted">Scorekeepers score pitch by pitch from a phone, even with no signal.</p></div>
      <div class="feature"><b>Stats</b><p class="small muted">Leaders, advanced stats, WAR, career records and spray charts.</p></div>
      <div class="feature"><b>Families</b><p class="small muted">Follow your kid, get notifications and emails.</p></div>
      <div class="feature"><b>Fantasy baseball</b><p class="small muted">Drafts, weekly lineups, free agents and trades.</p></div>
    </div>
    <button class="btn btn-primary btn-block" data-act="start-tour">Take the full tour</button>
    <button class="btn btn-secondary btn-block" data-act="walk-start">Score a practice game (guided)</button>
    <button class="btn btn-secondary btn-block" data-act="explore">Explore on my own</button>
    <button class="link center" data-act="about">Costs & plan</button>
  </div>`;
}

}

function viewCheckEmail() {
