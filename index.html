  const t = W.teamById[p.team];
  const b = W.bat[p.id];
  const pit = W.pit[p.id];
  const tile = (v, l) => `<div class="tile"><b>${v}</b><span>${l}</span></div>`;
  const bip = W.po.bip[p.id] || [];
  const log = (W.po.logs[p.id] || []).slice().reverse();
  const batTiles = b ? `<div class="tiles" data-tour="player-cards">${tile(E.rate(E.avg(b)), "AVG")}${tile(b.HR, "HR")}${tile(b.RBI, "RBI")}${tile(E.rate(E.obp(b)), "OBP")}${tile(E.rate(E.ops(b)), "OPS")}${tile(b.H, "H")}</div>` : "";
  const pitTiles = pit ? `<div class="tiles">${tile(pit.W + "-" + pit.L, "W-L")}${tile(E.era(pit) == null ? "---" : E.era(pit).toFixed(2), "ERA")}${tile(pit.K, "K")}</div>` : "";
  return `<section class="card team-head" style="border-left-color:${t.color}"><span class="jersey jersey-lg" style="background:${t.color}">${p.jersey}</span>
      <div class="grow"><h1 class="h1">${esc(p.name)}</h1><p class="muted"><a class="link" href="#/team/${t.id}">${esc(t.name)}</a> · ${esc(posLabel(p))}${p.age ? ` · Age ${p.age}` : ""}</p></div></section>
    <div class="cols"><div class="col">
    ${sectionHead(`${SEASON} season`)}
    ${batTiles}${pitTiles}
    ${b ? `<div class="card scroll-x"><table><thead><tr><th>Hitting</th><th>G</th><th>PA</th><th>AB</th><th>R</th><th>H</th><th>2B</th><th>3B</th><th>HR</th><th>RBI</th><th>BB</th><th>K</th><th>SLG</th></tr></thead>
      <tbody><tr><td class="bold">Season</td><td>${b.G}</td><td>${b.PA}</td><td>${b.AB}</td><td>${b.R}</td><td>${b.H}</td><td>${b["2B"]}</td><td>${b["3B"]}</td><td>${b.HR}</td><td>${b.RBI}</td><td>${b.BB}</td><td>${b.K}</td><td>${E.rate(E.slg(b))}</td></tr></tbody></table></div>` : ""}
    ${pit ? `<div class="card scroll-x"><table><thead><tr><th>Pitching</th><th>G</th><th>IP</th><th>W</th><th>L</th><th>H</th><th>R</th><th>ER</th><th>BB</th><th>K</th><th>WHIP</th></tr></thead><tbody><tr><td class="bold">Season</td><td>${pit.G}</td><td>${E.inningsPitched(pit.OUTS)}</td><td>${pit.W}</td><td>${pit.L}</td><td>${pit.H}</td><td>${pit.R}</td><td>${pit.ER}</td><td>${pit.BB}</td><td>${pit.K}</td><td>${E.whip(pit) == null ? "---" : E.whip(pit).toFixed(2)}</td></tr></tbody></table></div>` : ""}
    </div><div class="col">
    ${sectionHead("Playoffs")}
    ${bip.length ? `<section class="card pad stack-s" data-tour="spray"><div class="row between"><b>Spray chart</b><span class="small muted">${bip.length} ball${bip.length > 1 ? "s" : ""} in play</span></div>
      ${fieldSvg({ dots: bip.map((x) => ({ x: x.x, y: x.y, color: bipColor(x.r), label: E.RESULTS[x.r].label })) })}
      <p class="small legend"><span style="color:${HIT_COLOR.hit}">●</span> Hit <span style="color:${HIT_COLOR.out}">●</span> Out <span style="color:${HIT_COLOR.other}">●</span> Error / FC</p></section>` : ""}
    ${log.length ? `<div class="card list">${log
      .map(({ game: g, b: gb, p: gp }) => {
        const opp = W.teamById[g.home === p.team ? g.away : g.home];
        const line = [gb ? `${gb.H}-${gb.AB}${gb.HR ? `, ${gb.HR} HR` : ""}${gb.RBI ? `, ${gb.RBI} RBI` : ""}` : "", gp ? `${E.inningsPitched(gp.OUTS)} IP, ${gp.K} K` : ""].filter(Boolean).join(" · ");
        return `<a class="list-item" href="#/game/${g.id}"><span class="small muted" style="width:74px">${fmtDay(g.date)}</span><span class="grow bold">vs ${esc(opp.abbr)}</span><span class="small num">${line}</span></a>`;
      })
      .join("")}</div>` : `<p class="card pad small muted">${W.games.some((g) => g.home === p.team || g.away === p.team) ? "No playoff at-bats yet." : `${esc(t.name)} did not make the playoffs.`}</p>`}
    </div></div>`;
}

/* ---------------------------------------------------------------- game */
function diamond(bases) {
  return `<div class="diamond" aria-label="Runners on base"><b class="b2 ${bases[1] ? "on" : ""}"></b><b class="b3 ${bases[2] ? "on" : ""}"></b><b class="b1 ${bases[0] ? "on" : ""}"></b></div>`;
}
function outsDots(n) {
  return `<span class="outs">${[0, 1, 2].map((i) => `<i class="${i < n ? "on" : ""}"></i>`).join("")} ${n} out${n === 1 ? "" : "s"}</span>`;
}

function scoreboard(g, tour = "") {
  const s = g.rep;
  const home = W.teamById[g.home];
  const away = W.teamById[g.away];
  const [as, hs] = g.score || [0, 0];
  const live = g.status === "live" && s;
  const arrow = (t) => (live && s.half === t ? '<span class="bat-arrow">◀</span>' : "");
  return `<div class="board" ${tour ? `data-tour="${tour}"` : ""}>
    <div class="board-label">${playoffLabel(g)}</div>
    <div class="teams">
      <div class="tname">${badge(away, "md")}<span>${esc(away?.name || "TBD")}</span></div><div class="runs">${g.status === "scheduled" ? "" : as} ${arrow(0)}</div>
      <div class="tname">${badge(home, "md")}<span>${esc(home?.name || "TBD")}</span></div><div class="runs">${g.status === "scheduled" ? "" : hs} ${arrow(1)}</div>
    </div>
    <div class="sit">${
      live
        ? `<span class="inn">${s.half ? "Bot" : "Top"} ${ord(s.inning)}</span><span class="count">${s.balls}-${s.strikes}</span>${outsDots(s.outs)}${diamond(s.bases)}`
        : g.status === "final"
          ? `<span class="inn">Final${g.rep && g.rep.endReason ? " · " + esc(g.rep.endReason) : ""}</span><span class="small">${fmtDay(g.date)}</span>`
          : `<span class="inn">${g.date ? fmtLongDay(g.date) : "Date TBD"}</span><span class="small">${g.date ? fmtTime(g.date) : ""} · ${esc(g.field || "")}</span>`
    }</div>
  </div>`;
}

function lineScore(g, tour = "") {
  const s = g.rep;
  if (!s) return "";
  const n = Math.max(W.rules.innings, s.inning);
  const cell = (t, i) => {
    const v = s.line[t][i];
    if (v !== undefined) return v;
    if (s.status === "final" && t === 1 && i === s.line[0].length - 1 && i >= W.rules.innings - 1) return "X";
    return "";
  };
  const row = (t) =>
    `<tr><td class="bold">${esc(W.teamById[t ? g.home : g.away].abbr)}</td>${Array.from({ length: n }, (_, i) => `<td>${cell(t, i)}</td>`).join("")}<td class="tot">${s.score[t]}</td><td>${s.hits[t]}</td><td>${s.errors[t]}</td></tr>`;
  return `<div class="card scroll-x linescore" ${tour ? `data-tour="${tour}"` : ""}><table><thead><tr><th></th>${Array.from({ length: n }, (_, i) => `<th>${i + 1}</th>`).join("")}<th>R</th><th>H</th><th>E</th></tr></thead><tbody>${row(0)}${row(1)}</tbody></table></div>`;
}

function playLog(g, { limit = 0, tour = "" } = {}) {
  const s = g.rep;
  if (!s) return "";
  let entries = s.log.map((e, i) => ({ ...e, i })).reverse();
  if (limit) entries = entries.slice(0, limit);
  let last = "";
  const html = entries
    .map((e) => {
      const key = `${e.inning}-${e.half}`;
      const head = key !== last ? `<div class="inn-head">${e.half ? "Bottom" : "Top"} ${ord(e.inning)} · ${esc(W.teamById[e.half ? g.home : g.away].name)}</div>` : "";
      last = key;
      const fresh = e.i >= s.log.length - 1 && g.status === "live" ? "flash" : "";
      return `${head}<div class="play ${e.kind} ${fresh}"><span class="dot"></span><span>${esc(e.text)}</span><span class="sc">${e.score[0]}-${e.score[1]}</span></div>`;
    })
    .join("");
  return `<div class="card plays" ${tour ? `data-tour="${tour}"` : ""}>${html || '<p class="pad muted">No plays yet.</p>'}</div>`;
}

function boxScore(g) {
  const s = g.rep;
  const side = (t) => {
    const tid = t ? g.home : g.away;
    const ids = [...s.lineup[t].map((x) => x.pid), ...s.bench[t].filter((pid) => s.appeared.has(pid))];
    const rows = ids
      .map((pid) => {
        const b = s.bat[pid] || { AB: 0, R: 0, H: 0, RBI: 0, BB: 0, K: 0 };
        const pos = s.lineup[t].find((x) => x.pid === pid)?.pos || "sub";
        return `<tr><td><a href="#/player/${pid}"><b>${esc(nameOf(pid))}</b></a> <span class="tiny muted">${pos}</span></td><td>${b.AB}</td><td>${b.R}</td><td>${b.H}</td><td>${b.RBI}</td><td>${b.BB}</td><td>${b.K}</td></tr>`;
      })
      .join("");
    const pitchers = [...new Set(s.pitchersUsed[t])]
      .filter((pid) => s.pit[pid])
      .map((pid) => {
        const p = s.pit[pid];
        const dec = s.decision?.W === pid ? " (W)" : s.decision?.L === pid ? " (L)" : "";
        return `<tr><td><b>${esc(nameOf(pid))}</b>${dec}</td><td>${E.inningsPitched(p.OUTS)}</td><td>${p.H}</td><td>${p.R}</td><td>${p.ER}</td><td>${p.BB}</td><td>${p.K}</td><td>${p.P}</td></tr>`;
      })
      .join("");
    return `<h3 class="h3 row">${badge(W.teamById[tid])}${esc(W.teamById[tid].name)}</h3>
      <div class="card scroll-x"><table><thead><tr><th>Batting</th><th>AB</th><th>R</th><th>H</th><th>RBI</th><th>BB</th><th>K</th></tr></thead><tbody>${rows}</tbody></table></div>
      <div class="card scroll-x"><table><thead><tr><th>Pitching</th><th>IP</th><th>H</th><th>R</th><th>ER</th><th>BB</th><th>K</th><th>#P</th></tr></thead><tbody>${pitchers}</tbody></table></div>`;
  };
  return `<div class="stack">${side(0)}${side(1)}</div>`;
}

function viewGame(r) {
  const g = W.gameById[r.parts[1]];
  if (!g) return `<p>Game not found.</p>`;
  const tab = r.q.tab || "plays";
  const s = g.rep;
  const staff = S.role !== "fan";
  if (!s) {
    return `${scoreboard(g, "board")}<div class="card pad stack-s"><p class="bold">${g.status === "final" ? "Final score entered by the league admin." : "This game hasn't started."}</p><p class="small muted">${g.status === "final" ? "There's no play-by-play for this game." : "Once a scorekeeper starts, every pitch shows up here live."}</p></div>
      ${staff && g.status === "scheduled" && g.home && g.away ? `<a class="btn btn-green btn-block" href="#/score/${g.id}">Score this game</a>` : ""}`;
  }
  const live = g.status === "live";
  const spray = s.bip.map((x) => ({ x: x.x, y: x.y, color: bipColor(x.r), label: `${nameOf(x.pid)}: ${E.RESULTS[x.r].label}` }));
  return `<div class="cols"><div class="col">${scoreboard(g, "board")}
    ${live ? `<div class="card pad at-bat"><div><span class="eyebrow">At bat</span><b>${esc(nameOf(s.batter))}</b></div><div><span class="eyebrow">Pitching</span><b>${esc(nameOf(s.pitcher))}</b><span class="small muted">${s.pit[s.pitcher]?.P || 0} pitches</span></div></div>` : ""}
    ${lineScore(g, "linescore")}
    ${live && staff ? `<a class="btn btn-green btn-block" href="#/score/${g.id}">Open scorekeeper screen</a>` : ""}
    ${live ? `<p class="small muted">Updates as the scorekeeper enters each pitch. To see it, open this demo in two browser tabs, score in one and watch the other.</p>` : ""}
    </div><div class="col">
    <div class="seg"><a href="#/game/${g.id}?tab=plays" class="${tab === "plays" ? "on" : ""}">Plays</a><a href="#/game/${g.id}?tab=box" class="${tab === "box" ? "on" : ""}">Box score</a><a href="#/game/${g.id}?tab=spray" class="${tab === "spray" ? "on" : ""}">Spray chart</a></div>
    ${tab === "box" ? boxScore(g) : tab === "spray" ? `<div class="card pad">${fieldSvg({ dots: spray })}</div>` : playLog(g, { tour: "plays" })}
    </div></div>`;
}

/* ---------------------------------------------------------------- playoffs */
const PO_ROUND = { 1: "Quarterfinal", 2: "Quarterfinal", 3: "Quarterfinal", 4: "Quarterfinal", 5: "Semifinal", 6: "Semifinal", 7: "Championship" };
const playoffLabel = (g) => (g.slot === 7 ? `Championship · Game ${g.sg}` : PO_ROUND[g.slot] || "Game");
function winnerOf(g) {
  if (!g || g.status !== "final" || !g.score || g.score[0] === g.score[1]) return null;
  return g.score[1] > g.score[0] ? g.home : g.away;
}
const playoffGames = () => W.games;
function seriesWins() {
  const wins = {};
  W.games.filter((g) => g.slot === 7).forEach((g) => {
    const w = winnerOf(g);
    if (w) wins[w] = (wins[w] || 0) + 1;
  });
  return wins;
}
function playoffChampion() {
  const w = seriesWins();
  return Object.keys(w).find((t) => w[t] >= 2) || null;
}

function viewPlayoffs() {
  const seeds = Object.fromEntries(S.playoffs.seeds.map((t, i) => [t, i + 1]));
  const seedRow = (tid, score, won) =>
    `<div class="row seed-row ${won === false ? "dim" : ""}"><span class="seed">${tid ? seeds[tid] : ""}</span>${badge(W.teamById[tid])}<b class="grow ellipsis">${esc(W.teamById[tid]?.name || "TBD")}</b>${score != null ? `<b class="num score-sm">${score}</b>` : ""}</div>`;
  const slot = (n) => W.games.filter((g) => g.slot === n);
  const match = (g) => {
    if (!g) return `<div class="card pad small muted">Waiting on earlier rounds</div>`;
    const w = winnerOf(g);
    const show = g.status === "final" || g.status === "live";
    return `<a class="card match stack-s" href="#/game/${g.id}"><span class="tiny muted">${g.status === "final" ? "Final" : g.status === "live" ? "Live" : g.date ? fmtDay(g.date) + " · " + fmtTime(g.date) : "TBD"}</span>
      ${seedRow(g.away, show ? g.score[0] : null, w ? w === g.away : undefined)}${seedRow(g.home, show ? g.score[1] : null, w ? w === g.home : undefined)}</a>`;
  };
  const series = slot(7).sort((a, b) => a.sg - b.sg);
  const wins = seriesWins();
  const champ = playoffChampion();
  return `<div class="page-head"><h1 class="h1">Playoffs</h1><p class="muted">Top 8 from the ${SEASON} standings · quarterfinals and semifinals are one game · championship is best of 3</p></div>
    ${champ ? `<div class="champ"><p class="eyebrow">${SEASON} champions</p><p class="h1">${esc(W.teamById[champ].name)}</p></div>` : ""}
    <div class="bracket" data-tour="bracket">
      <div class="round"><h2 class="h2">Quarterfinals</h2>${[1, 2, 3, 4].map((n) => match(slot(n)[0])).join("")}</div>
      <div class="round"><h2 class="h2">Semifinals</h2>${match(slot(5)[0])}${match(slot(6)[0])}</div>
      <div class="round"><h2 class="h2">Championship</h2>${series.length ? `<div class="card pad stack">${[series[0].home, series[0].away].map((t) => `<div class="row">${badge(W.teamById[t], "md")}<b class="grow">${esc(W.teamById[t].name)}</b><b class="num score-sm">${wins[t] || 0}</b></div>`).join("")}
        <div class="list">${series.map((g) => `<a class="row between series-game" href="#/game/${g.id}"><b>Game ${g.sg}</b><span class="small muted">${g.status === "final" ? `${W.teamById[g.away].abbr} ${g.score[0]}, ${W.teamById[g.home].abbr} ${g.score[1]}` : g.status === "canceled" ? "Not needed" : g.status === "live" ? "Live" : "Upcoming"}</span></a>`).join("")}</div></div>` : `<div class="card pad small muted">Waiting on the semifinals</div>`}</div>
    </div>
    ${S.role === "admin" ? "" : `<p class="small muted">Demo: switch to the admin account (top right) to play out the rest of the bracket.</p>`}`;
}

// ---- app-stats.js
/* ---------------------------------------------------------------- stats: leaders + sortable tables */
const fmt3 = (v) => E.rate(v);
const fmt2 = (v) => (v == null ? "---" : v.toFixed(2));
const COLS = {
  bat: [
    { k: "G" }, { k: "PA" }, { k: "AB" }, { k: "R" }, { k: "H" }, { k: "2B" }, { k: "3B" }, { k: "HR" }, { k: "RBI" }, { k: "BB" }, { k: "K" },
    { k: "AVG", get: E.avg, fmt: fmt3, rate: true }, { k: "OBP", get: E.obp, fmt: fmt3, rate: true }, { k: "SLG", get: E.slg, fmt: fmt3, rate: true }, { k: "OPS", get: E.ops, fmt: fmt3, rate: true },
  ],
  pit: [
    { k: "G" }, { k: "IP", get: (p) => p.OUTS, fmt: E.inningsPitched }, { k: "W" }, { k: "L" }, { k: "SV" }, { k: "H" }, { k: "R" }, { k: "ER" }, { k: "BB" }, { k: "K" },
    { k: "ERA", get: E.era, fmt: fmt2, rate: true, asc: true }, { k: "WHIP", get: E.whip, fmt: fmt2, rate: true, asc: true },
  ],
};
const colVal = (c, line) => (c.get ? c.get(line) : line[c.k] ?? null);
const colFmt = (c, v) => (v == null ? "–" : c.fmt ? c.fmt(v) : v);
const statLines = (type) => (type === "pit" ? W.pit : W.bat);

// Qualifying minimums for rate stats (14-game season).
const MIN_PA = 21;
const MIN_OUTS = 30; // 10 innings
const qualified = (type, line) => (type === "bat" ? line.PA >= MIN_PA : line.OUTS >= MIN_OUTS);

/** Sortable stat table. With `sort` unset, rows stay in jersey order. */
function statTable({ type, players = W.players, limit = 25, qualify = true, sort, dir, showTeam = true }) {
  const lines = statLines(type);
  const cols = COLS[type];
  const col = cols.find((c) => c.k === sort);
  const desc = col ? (dir ? dir === "desc" : !col.asc) : true;
  let rows = players.filter((p) => lines[p.id]).map((p) => ({ p, line: lines[p.id] }));
  if (col) {
    if (col.rate && qualify) rows = rows.filter((x) => qualified(type, x.line));
    rows.sort((a, b) => {
      const va = colVal(col, a.line);
      const vb = colVal(col, b.line);
      if (va == null) return 1;
      if (vb == null) return -1;
      return desc ? vb - va : va - vb;
    });
  }
  if (limit) rows = rows.slice(0, limit);
  const head = cols
    .map((c) => {
      const on = c === col;
      const nextDir = on ? (desc ? "asc" : "desc") : c.asc ? "asc" : "desc";
      return `<th class="${on ? "sorted" : ""}"><a href="${withQuery({ sort: c.k, dir: nextDir })}">${c.k}${on ? (desc ? " ↓" : " ↑") : ""}</a></th>`;
    })
    .join("");
  const note = col && col.rate && qualify ? `<p class="small muted">Minimum ${type === "bat" ? `${MIN_PA} plate appearances` : `${MIN_OUTS / 3} innings pitched`} to qualify.</p>` : "";
  return `${note}<div class="card scroll-x" data-tour="stat-table"><table class="stats"><thead><tr>${col ? "<th>#</th>" : ""}<th>Player</th>${head}</tr></thead><tbody>${rows
    .map(
      ({ p, line }, i) => `<tr>${col ? `<td class="muted">${i + 1}</td>` : ""}<td><a class="row player-cell" href="#/player/${p.id}">${showTeam ? badge(W.teamById[p.team]) : `<span class="tiny muted">#${p.jersey}</span>`}<b>${esc(p.name)}</b></a></td>${cols
        .map((c) => `<td class="${c === col ? "sorted" : ""}">${colFmt(c, colVal(c, line))}</td>`)
        .join("")}</tr>`,
    )
    .join("") || `<tr><td colspan="${cols.length + 2}" class="muted">No stats.</td></tr>`}</tbody></table></div>`;
}

const LEADERS = {
  AVG: { type: "bat", key: "AVG", label: "Batting average" },
  HR: { type: "bat", key: "HR", label: "Home runs" },
  RBI: { type: "bat", key: "RBI", label: "Runs batted in" },
  H: { type: "bat", key: "H", label: "Hits" },
  R: { type: "bat", key: "R", label: "Runs" },
  OPS: { type: "bat", key: "OPS", label: "OPS" },
  "2B": { type: "bat", key: "2B", label: "Doubles" },
  BB: { type: "bat", key: "BB", label: "Walks" },
  K_P: { type: "pit", key: "K", label: "Strikeouts" },
  ERA: { type: "pit", key: "ERA", label: "ERA" },
  W: { type: "pit", key: "W", label: "Wins" },
  WHIP: { type: "pit", key: "WHIP", label: "WHIP" },
  IP: { type: "pit", key: "IP", label: "Innings pitched" },
};

function leaderCard(id, n) {
  const L = LEADERS[id];
  const lines = statLines(L.type);
  const col = COLS[L.type].find((c) => c.k === L.key);
  let rows = W.players.filter((p) => lines[p.id]).map((p) => ({ p, v: colVal(col, lines[p.id]), line: lines[p.id] }));
  if (col.rate) rows = rows.filter((x) => qualified(L.type, x.line));
  rows = rows.filter((x) => x.v != null).sort((a, b) => (col.asc ? a.v - b.v : b.v - a.v)).slice(0, n);
  const href = `#/stats?${new URLSearchParams({ type: L.type, sort: L.key })}`;
  const [top, ...rest] = rows;
  return `<a class="card leader" href="${href}"><p class="eyebrow">${L.label}</p>
    ${top ? `<div class="leader-top">${badge(W.teamById[top.p.team], "md")}<div class="grow"><b class="ellipsis">${esc(top.p.name)}</b><span class="tiny muted">${esc(W.teamById[top.p.team].name)}</span></div><b class="leader-val">${colFmt(col, top.v)}</b></div>` : ""}
    ${rest.map(({ p, v }, i) => `<div class="leader-row"><span class="rank">${i + 2}</span><span class="grow ellipsis">${esc(p.name)} <span class="muted">${esc(W.teamById[p.team].abbr)}</span></span><b class="num">${colFmt(col, v)}</b></div>`).join("")}</a>`;
}

function leadersGrid(type, n = 5, ids = null) {
  const list = ids || Object.keys(LEADERS).filter((id) => LEADERS[id].type === type);
  return `<div class="leaders" data-tour="leaders">${list.map((id) => leaderCard(id, n)).join("")}</div>`;
}

function viewStats(r) {
  const type = r.q.type === "pit" ? "pit" : "bat";
  const sort = r.q.sort || (type === "bat" ? "OPS" : "K");
  return `<div class="page-head"><h1 class="h1">Stats</h1><p class="muted">${SEASON} regular season · final</p></div>
    <div class="seg seg-inline"><a href="${withQuery({ type: null, sort: null, dir: null })}" class="${type === "bat" ? "on" : ""}">Hitting</a><a href="${withQuery({ type: "pit", sort: null, dir: null })}" class="${type === "pit" ? "on" : ""}">Pitching</a></div>
    ${sectionHead("League leaders")}
    ${leadersGrid(type, 5)}
    ${sectionHead("Top 25", `<span class="small muted">Click a column to sort</span>`)}
    ${statTable({ type, sort, dir: r.q.dir })}`;
}

function viewScore(r) {

function eventLabel(ev) {
  switch (ev.t) {
    case "pitch": return { B: "Ball", CS: "Strike looking", SS: "Strike swinging", F: "Foul" }[ev.r];
    case "hbp": return "Hit by pitch";
    case "play": return E.RESULTS[ev.r].label;
    case "runner": return { SB: "Stolen base", CS: "Caught stealing", WP: "Wild pitch", PB: "Passed ball", PK: "Pickoff" }[ev.k];
    case "sub": return "Substitution";
    case "pos": return "Position change";
    case "end": return "End game";
  }
  return "";
}

function pregame(g) {
  const setup = E.setupFor(g, W.players);
  const side = (t) => {
    const team = W.teamById[t ? g.home : g.away];
    return `<div class="card"><div class="pad row">${badge(team, "md")}<b class="grow">${esc(team.name)}</b><span class="small muted">${t ? "Home" : "Away"}</span></div>
      <div class="list">${setup.lineups[t].map((x, i) => `<div class="list-item"><span class="small bold muted" style="width:18px">${i + 1}</span><b class="grow">${esc(nameOf(x.pid))}</b><span class="pill pill-soft">${x.pos}</span></div>`).join("")}
      <div class="list-item small muted">Bench: ${setup.bench[t].map((pid) => esc(nameOf(pid))).join(", ")}</div></div></div>`;
  };
  return `${scoreboard(g)}<h2 class="h2">Starting lineups</h2><p class="small muted">Lineups can be edited before first pitch. Substitutions can be made anytime.</p>
    ${side(0)}${side(1)}<button class="btn btn-green btn-block" data-act="sk-start" data-id="${g.id}">Start game</button>`;
}

const currentGame = () => W.gameById[parseRoute().parts[1]];

function pushEvent(ev, msg) {
  const g = currentGame();
  if (!g) return;
  const wasFinal = g.status === "final";
  g.events = [...g.events, ev];
  const rules = g.type === "playoff" ? { ...W.rules, tiesAllowed: false } : W.rules;
  const rep = E.replay({ setup: g.setup, events: g.events }, rules, W.names);
  const status = rep.status === "final" ? "final" : "live";
  saveGame(g, { events: g.events, status });
  if (status === "final") {
    advancePlayoffs();
    save();
    build();
  }
  closeSheet();
  SK = null;
  render();
  if (!wasFinal && status === "final") toast("Final. The bracket has been updated.");
  else if (msg) toast(msg);
}

ACT["sk-start"] = (el) => {
  const g = W.gameById[el.dataset.id];
  saveGame(g, { setup: E.setupFor(g, W.players), events: [], status: "live" });
  render();
  toast("Game started.");
};
ACT["sk-pitch"] = (el) => pushEvent({ t: "pitch", r: el.dataset.r });
ACT["sk-hbp"] = () => pushEvent({ t: "hbp" });
ACT["sk-undo"] = (el) => {
  const g = W.gameById[el.dataset.id];
  if (!g || !g.events.length) return;
  const last = g.events[g.events.length - 1];
  const events = g.events.slice(0, -1);
  const rep = E.replay({ setup: g.setup, events }, W.rules, W.names);
  saveGame(g, { events, status: rep.status === "final" ? "final" : "live" });
  render();
  toast(`Undid: ${eventLabel(last)}`);
};

/* ---- ball in play: where + how → result → fielders → runners */
ACT["sk-inplay"] = () => {
  SK = { kind: "play", step: "where", loc: null, bb: null, result: null, fielders: [], moves: null };
  openSheet(inPlaySheet);
};
function inPlaySheet() {
  if (!SK) return "";
  const s = currentGame().rep;
  if (SK.step === "where") {
    const dot = SK.loc ? [{ x: SK.loc[0], y: SK.loc[1], color: "#ffc93c", r: 3 }] : [];
    return `<h2 class="h2">Where was it hit?</h2><p class="small muted" style="margin:4px 0 10px">Tap the spot on the field, then pick how ${esc(nameOf(s.batter))} hit it.</p>
      <div class="field-wrap" data-act="sk-tapfield">${fieldSvg({ dots: dot, id: "tapfield", tap: true, labels: true })}</div>
      <div class="bb-grid">${Object.entries(E.BB_TYPES).map(([k, l]) => `<button class="${SK.bb === k ? "on" : ""}" data-act="sk-bb" data-k="${k}">${l}</button>`).join("")}</div>
      <div class="row" style="margin-top:14px"><button class="btn btn-secondary" data-act="close-sheet">Cancel</button><button class="btn btn-primary grow" data-act="sk-where-next" ${SK.loc && SK.bb ? "" : "disabled"}>Next</button></div>`;
  }
  if (SK.step === "result") {
    const outCode = E.OUT_FOR[SK.bb];
    const ok = {
      DP: s.bases[0] && s.outs < 2 && SK.bb === "G",
      SF: s.bases[2] && s.outs < 2 && (SK.bb === "F" || SK.bb === "L"),
      SAC: s.bases.some(Boolean) && s.outs < 2 && SK.bb === "B",
      FC: s.bases.some(Boolean),
    };
    const btn = (k, cls = "", label = E.RESULTS[k].label) => `<button class="${cls}" data-act="sk-result" data-r="${k}" ${k in ok && !ok[k] ? "disabled" : ""}>${label}</button>`;
    return `<h2 class="h2">What happened?</h2><p class="small muted" style="margin:4px 0 12px">${E.BB_TYPES[SK.bb]} to ${E.FIELD_NAME[E.nearestFielder(...SK.loc)]}.</p>
      <p class="small bold muted">HIT</p><div class="res-grid" style="margin:6px 0 14px">${["1B", "2B", "3B", "HR"].map((k) => btn(k, "hit")).join("")}</div>
      <p class="small bold muted">OUT</p><div class="res-grid" style="margin:6px 0 14px">${btn(outCode, "out")}${btn("DP", "out")}${btn("SF", "out")}${btn("SAC", "out")}</div>
      <p class="small bold muted">SAFE ON</p><div class="res-grid" style="margin-top:6px">${btn("E")}${btn("FC")}</div>
      <div class="row" style="margin-top:14px"><button class="btn btn-secondary grow" data-act="sk-back">Back</button></div>`;
  }
  if (SK.step === "fielders") {
    const res = E.RESULTS[SK.result];
    return `<h2 class="h2">${res.label}: ${SK.result === "E" ? "E" : ""}${SK.fielders.join("-") || "?"}</h2>
      <p class="small muted" style="margin:4px 0 12px">${SK.result === "E" ? "Who made the error? " : "We guessed from where it was hit. "}${res.multi ? "Tap fielders in order to change it (e.g. SS then 1B = 6-3)." : "Tap a fielder to change it."}</p>
      <div class="pos-grid">${[7, 8, 9, 5, 6, 4, 1, 2, 3].map((n) => `<button data-act="sk-fielder" data-n="${n}" class="${SK.fielders.includes(n) ? "on" : ""}">${n}<small>${E.posOf(n)}</small></button>`).join("")}</div>
      <div class="row" style="margin-top:14px"><button class="btn btn-secondary" data-act="sk-back">Back</button>${res.multi ? `<button class="btn btn-secondary" data-act="sk-fclear">Clear</button>` : ""}<button class="btn btn-primary grow" data-act="sk-fdone" ${SK.fielders.length ? "" : "disabled"}>Next</button></div>`;
  }
  return runnerSheet();
}
ACT["sk-tapfield"] = (el, e) => {
  const svgEl = document.getElementById("tapfield");
  const r = svgEl.getBoundingClientRect();
  const x = Math.round(((e.clientX - r.left) / r.width) * 100);
  const y = Math.round(((e.clientY - r.top) / r.height) * 100);
  SK.loc = [Math.max(1, Math.min(99, x)), Math.max(1, Math.min(99, y))];
  // Guess the type from where it landed; the scorekeeper can change it.
  if (!SK.bb) SK.bb = y > 52 ? "G" : y > 34 ? "L" : "F";
  paintSheet();
};
ACT["sk-bb"] = (el) => {
  SK.bb = el.dataset.k;
  paintSheet();
};
ACT["sk-where-next"] = () => {
  SK.step = "result";
  paintSheet();
};
function guessFielders(result, loc) {
  const first = E.nearestFielder(...loc);
  if (result === "GO" || result === "BO" || result === "SAC") return first === 3 ? [3] : [first, 3];
  if (result === "DP") return [first, first === 4 ? 6 : 4, 3];
  if (result === "FC") return [first, first === 6 || first === 5 ? 4 : 6];
  return [first];
}
ACT["sk-result"] = (el) => {
  SK.result = el.dataset.r;
  const res = E.RESULTS[SK.result];
  SK.fielders = guessFielders(SK.result, SK.loc);
  if (res.hit) {
    ACT["sk-fdone"]();
    return;
  }
  SK.step = "fielders";
  SK.edited = false;
  paintSheet();
};
ACT["sk-fielder"] = (el) => {
  const n = Number(el.dataset.n);
  if (!E.RESULTS[SK.result].multi) SK.fielders = [n];
  else {
    if (!SK.edited) SK.fielders = [];
    SK.fielders.push(n);
  }
  SK.edited = true;
  paintSheet();
};
ACT["sk-fclear"] = () => {
  SK.fielders = [];
  SK.edited = true;
  paintSheet();
};
ACT["sk-fdone"] = () => {
  const s = currentGame().rep;
  SK.step = "runners";
  SK.moves = E.defaultMoves(s.bases, SK.result);
  paintSheet();
};
ACT["sk-back"] = () => {
  if (SK.kind === "runner") SK.runnerKind = null;
  else if (SK.step === "runners") SK.step = E.RESULTS[SK.result].hit ? "result" : "fielders";
  else if (SK.step === "fielders") SK.step = "result";
  else if (SK.step === "result") SK.step = "where";
  SK.err = null;
  paintSheet();
};

function runnerSheet() {
  const s = currentGame().rep;
  const rows = [];
  [3, 2, 1].forEach((b) => s.bases[b - 1] && rows.push([b, s.bases[b - 1].pid]));
  if (SK.kind === "play") rows.push(["B", s.batter]);
  const label = { B: "Batter", 1: "On 1st", 2: "On 2nd", 3: "On 3rd" };
  const dests = [[1, "1st"], [2, "2nd"], [3, "3rd"], [4, "Home"], ["X", "Out"]];
  const title = SK.kind === "play" ? `${E.RESULTS[SK.result].label}${SK.fielders.length && !E.RESULTS[SK.result].hit ? ` (${SK.result === "E" ? "E" : ""}${SK.fielders.join("-")})` : ""}` : { SB: "Stolen base", CS: "Caught stealing", WP: "Wild pitch", PB: "Passed ball", PK: "Pickoff" }[SK.runnerKind];
  return `<h2 class="h2">Where did everyone end up?</h2><p class="small muted" style="margin:4px 0 8px">${esc(title)}. We filled in the usual result, so tap to change anything.</p>
    <div class="card pad" style="padding-top:4px;padding-bottom:4px">${rows
      .map(([from, pid]) => {
        const cur = SK.moves[from] ?? (from === "B" ? 1 : from);
        const min = from === "B" ? 1 : from;
        return `<div class="runner-row"><div class="row between"><b>${esc(nameOf(pid))}</b><span class="small muted">${label[from]}</span></div>
          <div class="dest">${dests.map(([d, l]) => `<button data-act="sk-move" data-from="${from}" data-to="${d}" class="${cur === d ? "on" : ""} ${d === "X" ? "out" : d === 4 ? "home" : ""}" ${d !== "X" && d < min ? "disabled" : ""}>${l}</button>`).join("")}</div></div>`;
      })
      .join("")}</div>
    ${SK.err ? `<p class="notice bad" style="margin-top:10px">${esc(SK.err)}</p>` : ""}
    <div class="row" style="margin-top:14px"><button class="btn btn-secondary" data-act="sk-back">Back</button><button class="btn btn-green grow" data-act="sk-save">Save play</button></div>`;
}
ACT["sk-move"] = (el) => {
  const from = el.dataset.from === "B" ? "B" : Number(el.dataset.from);
  const to = el.dataset.to === "X" ? "X" : Number(el.dataset.to);
  SK.moves = { ...SK.moves, [from]: to };
  SK.err = null;
  paintSheet();
};
ACT["sk-save"] = () => {
  const s = currentGame().rep;
  const occupied = {};
  const froms = [...[1, 2, 3].filter((b) => s.bases[b - 1]), ...(SK.kind === "play" ? ["B"] : [])];
  for (const f of froms) {
    const to = SK.moves[f] ?? (f === "B" ? 1 : f);
    if (to !== "X" && to !== 4) {
      if (occupied[to]) {
        SK.err = "Two runners can't be on the same base.";
        return paintSheet();
      }
      occupied[to] = true;
    }
  }
  if (SK.kind === "play") {
    const f = SK.fielders.length ? (SK.result === "E" ? "E" : "") + SK.fielders.join("-") : "";
    pushEvent({ t: "play", r: SK.result, f, m: SK.moves, bb: SK.bb, loc: SK.loc });
  } else pushEvent({ t: "runner", k: SK.runnerKind, m: SK.moves });
};

/* ---- runner events between pitches */
ACT["sk-runners"] = () => {
  SK = { kind: "runner", runnerKind: null, moves: {} };
  openSheet(() => {
    if (!SK) return "";
    if (!SK.runnerKind) {
      return `<h2 class="h2">Runner play</h2><p class="small muted" style="margin:4px 0 12px">Something happened between pitches?</p>
        <div class="res-grid">${[["SB", "Stolen base"], ["WP", "Wild pitch"], ["PB", "Passed ball"], ["CS", "Caught stealing"], ["PK", "Picked off"]].map(([k, l]) => `<button data-act="sk-rkind" data-k="${k}">${l}</button>`).join("")}</div>
        <button class="btn btn-secondary btn-block" style="margin-top:14px" data-act="close-sheet">Cancel</button>`;
    }
    return runnerSheet();
  });
};
ACT["sk-rkind"] = (el) => {
  const s = currentGame().rep;
  const k = el.dataset.k;
  SK.runnerKind = k;
  const occ = [3, 2, 1].filter((b) => s.bases[b - 1]);
  const m = {};
  occ.forEach((b) => (m[b] = b));
  if (k === "WP" || k === "PB") occ.forEach((b) => (m[b] = b + 1));
  else if (k === "SB") {
    const lead = occ.find((b) => b === 3 || !s.bases[b]);
    if (lead) m[lead] = lead + 1;
  } else m[occ[0]] = "X";
  SK.moves = m;
  paintSheet();
};

/* ---- lineup, subs, pitching change */
let lineupTeam = null;
ACT["sk-lineup"] = () => {
  lineupTeam = 1 - currentGame().rep.half;
  SK = null;
  openSheet(lineupSheet);
};
function lineupSheet() {
  const g = currentGame();
  const s = g.rep;
  const t = lineupTeam;
  const team = W.teamById[t ? g.home : g.away];
  if (SK && SK.kind === "sub") {
    const slot = s.lineup[t][SK.slot];
    return `<h2 class="h2">Sub in for ${esc(nameOf(slot.pid))} (${slot.pos})</h2><p class="small muted" style="margin:4px 0 12px">The new player takes over this batting spot and position.</p>
      <div class="card list">${s.bench[t].map((pid) => `<button class="list-item" data-act="sk-dosub" data-pid="${pid}"><b class="grow">${esc(nameOf(pid))}</b><span class="small muted">${esc(posLabel(W.playerById[pid]))}</span></button>`).join("") || '<p class="pad muted">Nobody on the bench.</p>'}</div>
      <button class="btn btn-secondary btn-block" style="margin-top:12px" data-act="sk-subcancel">Back</button>`;
  }
  return `<div class="seg">${[0, 1].map((x) => `<button class="${x === t ? "on" : ""}" data-act="sk-lteam" data-t="${x}">${esc(W.teamById[x ? g.home : g.away].name)}</button>`).join("")}</div>
    <p class="small muted" style="margin:10px 0">Batting order for ${esc(team.name)}. <b>Sub</b> brings in a bench player. <b>Pitch</b> makes someone the new pitcher.</p>
    <div class="card list">${s.lineup[t]
      .map((x, i) => `<div class="list-item"><span class="small bold muted" style="width:16px">${i + 1}</span><div class="grow"><b>${esc(nameOf(x.pid))}</b><div class="tiny muted">${x.pos}${s.pit[x.pid] ? ` · ${s.pit[x.pid].P} pitches` : ""}</div></div>
        ${x.pos !== "P" ? `<button class="btn btn-sm btn-secondary" data-act="sk-makep" data-pid="${x.pid}">Pitch</button>` : '<span class="pill pill-soft">Pitcher</span>'}
        <button class="btn btn-sm btn-secondary" data-act="sk-sub" data-slot="${i}" ${s.bench[t].length ? "" : "disabled"}>Sub</button></div>`)
      .join("")}</div>
    <p class="small bold muted" style="margin-top:12px">BENCH</p><p class="small">${s.bench[t].map((pid) => esc(nameOf(pid))).join(", ") || "Nobody"}</p>
    <button class="btn btn-secondary btn-block" style="margin-top:12px" data-act="close-sheet">Done</button>`;
}
ACT["sk-lteam"] = (el) => {
  lineupTeam = Number(el.dataset.t);
  paintSheet();
};
ACT["sk-sub"] = (el) => {
  SK = { kind: "sub", slot: Number(el.dataset.slot) };
  paintSheet();
};
ACT["sk-subcancel"] = () => {
  SK = null;
  paintSheet();
};
ACT["sk-dosub"] = (el) => pushEvent({ t: "sub", team: lineupTeam, slot: SK.slot, pid: el.dataset.pid }, "Substitution made.");
ACT["sk-makep"] = (el) => pushEvent({ t: "pos", team: lineupTeam, pid: el.dataset.pid, pos: "P" }, "New pitcher. Their pitch count starts now.");

ACT["sk-end"] = () => {
  const g = currentGame();
  const [a, h] = g.score;
  const tieBlocked = a === h && (g.type === "playoff" || !W.rules.tiesAllowed);
  openSheet(
    () => `<h2 class="h2">End the game now?</h2><p class="muted" style="margin:6px 0 14px">Use this for time limits or weather. Games also end on their own after ${W.rules.innings} innings, on a walk-off, or by the mercy rule.</p>
    <div class="card pad center"><p class="h1 num">${esc(W.teamById[g.away].abbr)} ${a} – ${h} ${esc(W.teamById[g.home].abbr)}</p>${a === h ? `<p class="small muted">This would be a tie.</p>` : ""}</div>
    ${tieBlocked ? `<p class="notice bad" style="margin-top:12px">Playoff games can't end in a tie.</p>` : `<button class="btn btn-danger btn-block" style="margin-top:14px" data-act="sk-doend">Yes, it's final</button>`}
    <button class="btn btn-secondary btn-block" style="margin-top:10px" data-act="close-sheet">Keep scoring</button>`,
  );
};
ACT["sk-doend"] = () => pushEvent({ t: "end", reason: "Time limit" });

// ---- app-fantasy.js
/* ---------------------------------------------------------------- fantasy (points leagues, snake draft, commissioner scoring) */
const OWNERS = ["Dan Russo", "Mike Chen", "Laura Patel", "Chris Walsh", "Jen Morales", "Tony Kim", "Sam Keane", "Rachel Diaz", "Nick Ortiz", "Beth Hale", "Paul Grant"];
const TEAM_NAMES = ["Mile Square Mashers", "Sinatra Sluggers", "Washington St. Wallops", "Path Train Pitchers", "Castle Point Crushers", "Elysian Fielders", "Hudson River Hackers", "Stevens Stealers", "Pier C Popups", "Church Square Chuckers", "Waterfront Whiffers"];
const defaultScoring = () => JSON.parse(JSON.stringify(E.DEFAULT_SCORING));

function cpuTeams(n, skip, offset = 0) {
  const out = [];
  for (let i = 0; out.length < n; i++) {
    const name = TEAM_NAMES[(i + offset) % TEAM_NAMES.length];
    if (skip.includes(name) || out.some((t) => t.name === name)) continue;
    out.push({ name, owner: OWNERS[(i + offset) % OWNERS.length] });
  }
  return out;
}

function newLeague({ id, name, size, myIndex, isPublic, code = null, seed, myTeam, commissioner = null }) {
  const teams = cpuTeams(size - 1, [myTeam], seed);
  teams.splice(myIndex, 0, { name: myTeam, owner: S.account.name, mine: true });
  return { id, name, size, myIndex, public: isPublic, code, seed, teams, picks: [], rosters: null, scoring: defaultScoring(), commissioner: commissioner || S.account.name };
}

function initialFantasy() {
  const L1 = newLeague({ id: "L1", name: "Hoboken Sluggers", size: 10, myIndex: 3, isPublic: true, seed: 3, myTeam: "Burks Bombers", commissioner: "Dan Russo" });
  const L2 = newLeague({ id: "L2", name: "Coaches' Pool", size: 6, myIndex: 2, isPublic: false, code: "COACH6", seed: 5, myTeam: "Hoboken Heat" });
  // The big league drafted before the season (autodraft).
  runDraft(L1, true);
  return { leagues: [L1, L2], open: [{ id: "O1", name: "Weekend Warriors", size: 8, filled: 5 }, { id: "O2", name: "Dugout Dads", size: 6, filled: 3 }] };
}

const leagueById = (id) => S.fantasy.leagues.find((l) => l.id === id);
const myTeamIdx = (L) => L.teams.findIndex((t) => t.mine);
const isCommish = (L) => L.commissioner === S.account.name;
const totalPicks = (L) => L.size * E.SLOTS.length;
const onClock = (L) => (L.picks.length < totalPicks(L) ? E.pickOwner(L.picks.length, L.size) : -1);
const pickLabel = (i, size) => `${Math.floor(i / size) + 1}.${String((i % size) + 1).padStart(2, "0")}`;

/** A player's season points under a league's scoring: pitching points in a P slot, hitting points anywhere else. */
const batPts = (L, pid) => E.batPoints(W.bat[pid], L.scoring.bat);
const pitPts = (L, pid) => E.pitPoints(W.pit[pid], L.scoring.pit);
const slotPts = (L, pid, slot) => (pid ? (slot === "P" ? pitPts(L, pid) : batPts(L, pid)) : 0);
const bestPts = (L, pid) => Math.max(W.bat[pid] ? batPts(L, pid) : -Infinity, W.pit[pid] ? pitPts(L, pid) : -Infinity);
const projFor = (L) => Object.fromEntries(W.players.map((p) => [p.id, { bat: batPts(L, p.id), pit: pitPts(L, p.id) }]));
const teamTotal = (L, i) => L.rosters[i].reduce((n, pid, s) => n + slotPts(L, pid, E.SLOTS[s]), 0);

function rostersFromPicks(L) {
  const rosters = L.teams.map(() => Array(E.SLOTS.length).fill(null));
  L.picks.forEach((pid, i) => {
    const t = E.pickOwner(i, L.size);
    const pl = W.playerById[pid];
    let slot = E.openSlotFor(pl, rosters[t]);
    if (slot < 0) slot = E.openSlotFor(pl, rosters[t], true);
    if (slot >= 0) rosters[t][slot] = pid;
  });
  return rosters;
}

/** Computer teams pick until it's your turn (or all the way, with autoMe). */
function runDraft(L, autoMe = false) {
  const taken = new Set(L.picks);
  const proj = projFor(L);
  let rosters = rostersFromPicks(L);
  while (L.picks.length < totalPicks(L)) {
    const t = onClock(L);
    if (t === myTeamIdx(L) && !autoMe) break;
    const p = E.cpuPick(W.players.filter((x) => !taken.has(x.id)), rosters[t], proj, E.rng(L.seed * 1000 + L.picks.length));
    if (!p) break;
    L.picks.push(p.id);
    taken.add(p.id);
    rosters = rostersFromPicks(L);
  }
  if (L.picks.length >= totalPicks(L)) L.rosters = rostersFromPicks(L);
}

function standingsFor(L) {
  return L.teams.map((team, i) => ({ i, team, pts: teamTotal(L, i) })).sort((a, b) => b.pts - a.pts);
}

function viewFantasy(r) {
  if (r.parts[1]) return viewFantasyLeague(r);
  const fz = S.fantasy;
  return `<div class="page-head"><h1 class="h1">Fantasy</h1><p class="muted">Points leagues built on the league's real stats. Each commissioner sets the scoring.</p></div>
    <section class="stack" data-tour="fantasy-leagues">${sectionHead("My leagues")}<div class="card list">${fz.leagues
      .map((L) => {
        const me = L.teams[myTeamIdx(L)];
        let status = `<span class="tag">${L.picks.length ? "Drafting" : "Pre-draft"}</span>`;
        if (L.rosters) {
          const st = standingsFor(L);
          const pos = st.findIndex((x) => x.team.mine);
          status = `<span class="small num"><b>${ord(pos + 1)}</b> of ${L.size} · ${fmtPts(st[pos].pts)} pts</span>`;
        }
        return `<a class="list-item" href="#/fantasy/${L.id}"><div class="grow"><b>${esc(me.name)}</b><div class="small muted">${esc(L.name)} · ${L.size} teams${isCommish(L) ? " · Commissioner" : ""}</div></div>${status}<span class="chev">›</span></a>`;
      })
      .join("")}</div></section>
    <section class="stack" data-tour="fantasy-create">${sectionHead("Find a league")}
      <div class="card list">${fz.open.map((o) => `<div class="list-item"><div class="grow"><b>${esc(o.name)}</b><div class="small muted">Public · ${o.filled} of ${o.size} teams</div></div><button class="btn btn-sm btn-secondary" data-act="f-join" data-id="${o.id}">Join</button></div>`).join("") || `<p class="pad muted">No open leagues.</p>`}</div>
      <div class="row"><button class="btn btn-primary grow" data-act="f-create">Create a league</button><button class="btn btn-secondary grow" data-act="f-code">Join with code</button></div>
    </section>`;
}

function viewFantasyLeague(r) {
  const L = leagueById(r.parts[1]);
  if (!L) return `<p>League not found.</p>`;
  const me = myTeamIdx(L);
  const drafted = !!L.rosters;
  const tab = r.parts[2] || (drafted ? "team" : "draft");
  const tabs = drafted ? [["team", "My team"], ["standings", "Standings"], ["players", "Players"], ["draft", "Draft"], ["settings", "Settings"]] : [["draft", "Draft room"], ["teams", "Teams"], ["settings", "Settings"]];
  let body = "";
  if (tab === "team" && drafted) {
    const roster = L.rosters[me];
    body = `<div class="card list" data-tour="fantasy-myteam">${roster
      .map((pid, i) => {
        const slot = E.SLOTS[i];
        if (!pid) return `<div class="list-item"><span class="slot">${slot}</span><span class="muted">Empty</span></div>`;
        return `<button class="list-item" data-act="f-pts" data-l="${L.id}" data-pid="${pid}" data-slot="${slot}"><span class="slot">${slot}</span>${badge(teamOf(pid))}<div class="grow"><b>${esc(nameOf(pid))}</b><div class="tiny muted">${esc(posLabel(W.playerById[pid]))}</div></div><b class="num">${fmtPts(slotPts(L, pid, slot))}</b></button>`;
      })
      .join("")}<div class="list-item total-row"><span class="grow">Total</span><b class="num">${fmtPts(teamTotal(L, me))}</b></div></div>
      <p class="small muted">${SEASON} points under this league's scoring. Click a player for the breakdown.</p>`;
  } else if (tab === "standings" && drafted) {
    const st = standingsFor(L);
    body = `<div class="card table-card" data-tour="fantasy-standings"><table><thead><tr><th>Team</th><th>Pts</th><th>Back</th></tr></thead><tbody>${st
      .map((x, i) => `<tr class="${x.team.mine ? "mine" : ""}"><td><span class="rank">${i + 1}</span> <b>${esc(x.team.name)}</b><div class="tiny muted">${esc(x.team.owner)}</div></td><td><b>${fmtPts(x.pts)}</b></td><td class="muted">${i ? fmtPts(st[0].pts - x.pts) : "–"}</td></tr>`)
      .join("")}</tbody></table></div>
      <p class="small muted">Ranked by total points for the ${SEASON} season. During a live season, leagues can also play weekly head-to-head matchups.</p>`;
  } else if (tab === "players" && drafted) {
    body = playersTab(L, r);
  } else if (tab === "draft") {
    body = drafted ? draftResults(L) : draftRoom(L, r);
  } else if (tab === "teams") {
    body = `<div class="card list">${L.teams.map((t, i) => `<div class="list-item"><span class="rank">${i + 1}</span><div class="grow"><b>${esc(t.name)}</b><div class="tiny muted">${esc(t.owner)}</div></div>${t.mine ? '<span class="tag">You</span>' : ""}</div>`).join("")}</div><p class="small muted">Draft order for round 1. The order reverses each round (snake).</p>`;
  } else if (tab === "settings") {
    body = settingsTab(L);
  }
  return `<a class="link back" href="#/fantasy">‹ Fantasy</a>
    <div class="page-head"><h1 class="h1">${esc(L.teams[me].name)}</h1><p class="muted">${esc(L.name)} · ${L.size} teams · ${L.public ? "Public" : `Private · code ${esc(L.code)}`} · Commissioner: ${esc(L.commissioner)}</p></div>
    <div class="tabs-inline">${tabs.map(([k, l]) => `<a href="#/fantasy/${L.id}/${k}" class="${tab === k ? "on" : ""}">${l}</a>`).join("")}</div>${body}`;
}

function posFilter(list, pos) {
  if (!pos) return list;
  return list.filter((p) => (pos === "P" ? !!p.pit : p.bat && (pos === "C/1B" ? p.pos.includes("C") || p.pos.includes("1B") : p.pos.includes(pos))));
}
function posChips(pos) {
  return `<div class="chips">${["", "C/1B", "INF", "OF", "P"].map((k) => `<a class="chip ${pos === k ? "on" : ""}" href="${withQuery({ pos: k || null })}">${k || "All"}</a>`).join("")}</div>`;
}
function ptsLine(L, p) {
  return [W.bat[p.id] ? `H ${fmtPts(batPts(L, p.id))}` : "", W.pit[p.id] ? `P ${fmtPts(pitPts(L, p.id))}` : ""].filter(Boolean).join(" · ");
}

function draftRoom(L, r) {
  const me = myTeamIdx(L);
  const clock = onClock(L);
  const myTurn = clock === me;
  const rosters = rostersFromPicks(L);
  const taken = new Set(L.picks);
  const pos = r.q.pos || "";
  const avail = posFilter(W.players.filter((p) => !taken.has(p.id)), pos).sort((a, b) => bestPts(L, b.id) - bestPts(L, a.id)).slice(0, 40);
  const recent = L.picks.map((pid, i) => ({ pid, i })).slice(-8).reverse();
  // If nobody left fits your open slots, anyone can fill them.
  const force = !W.players.some((p) => !taken.has(p.id) && E.openSlotFor(p, rosters[me]) >= 0);
  const n = L.picks.length;
  return `<div class="card pad stack-s clock ${myTurn ? "on-clock" : ""}" data-tour="fantasy-draft">
      ${n === 0 ? `<p><b>${L.size} teams · ${E.SLOTS.length} rounds · snake order.</b> You pick ${ord(me + 1)} in round 1.</p><button class="btn btn-primary btn-block" data-act="f-start" data-l="${L.id}">Start draft</button>`
        : `<p class="eyebrow">Round ${Math.floor(n / L.size) + 1} · Pick ${pickLabel(n, L.size)}</p><p class="h2">${myTurn ? "You're on the clock" : `${esc(L.teams[clock]?.name || "")} is picking`}</p>
      <button class="btn btn-secondary btn-sm" data-act="f-auto" data-l="${L.id}">Autodraft the rest</button>`}
    </div>
    <div class="cols"><div class="col">
    ${sectionHead("Available", `<span class="small muted">Ranked by ${SEASON} points</span>`)}
    ${posChips(pos)}
    <div class="card list">${avail
      .map((p) => {
        const fits = E.openSlotFor(p, rosters[me], force) >= 0;
        return `<div class="list-item">${badge(W.teamById[p.team])}<div class="grow"><b>${esc(p.name)}</b><div class="tiny muted">${esc(posLabel(p))} · ${ptsLine(L, p)}</div></div><button class="btn btn-sm btn-primary" data-act="f-pick" data-pid="${p.id}" ${myTurn && fits ? "" : "disabled"}>Draft</button></div>`;
      })
      .join("")}</div>

function draftResults(L) {
  const rounds = [];
  L.picks.forEach((pid, i) => (rounds[Math.floor(i / L.size)] ||= []).push({ pid, i }));
  return `<p class="small muted">Snake draft: the order reverses every round.</p><div class="draft-grid">${rounds
    .map((picks, ri) => `<div class="stack-s"><h3 class="h3">Round ${ri + 1}</h3><div class="card list">${picks.map(({ pid, i }) => {
      const t = L.teams[E.pickOwner(i, L.size)];
      return `<div class="list-item small ${t.mine ? "mine" : ""}"><span class="num muted" style="width:40px">${pickLabel(i, L.size)}</span><span class="grow"><b>${esc(nameOf(pid))}</b> <span class="tiny muted">${esc(teamOf(pid).abbr)}</span></span><span class="muted ellipsis" style="max-width:42%">${esc(t.name)}</span></div>`;
    }).join("")}</div></div>`)
    .join("")}</div>`;
}

function playersTab(L, r) {
  const owner = new Map();
  L.rosters.forEach((ros, i) => ros.forEach((pid) => pid && owner.set(pid, i)));
  const pos = r.q.pos || "";
  const faOnly = r.q.fa === "1";
  const list = posFilter(W.players, pos)
    .filter((p) => !faOnly || !owner.has(p.id))
    .sort((a, b) => bestPts(L, b.id) - bestPts(L, a.id))
    .slice(0, 40);
  return `<div class="row wrap">${posChips(pos)}<a class="chip ${faOnly ? "on" : ""}" href="${withQuery({ fa: faOnly ? null : "1" })}">Free agents only</a></div>
    <div class="card list" data-tour="fantasy-fa">${list
      .map((p) => {
        const o = owner.get(p.id);
        const right = o == null ? `<button class="btn btn-sm btn-secondary" data-act="f-add" data-pid="${p.id}" data-l="${L.id}">Add</button>` : `<span class="small muted ellipsis" style="max-width:36%">${esc(L.teams[o].name)}</span>`;
        return `<div class="list-item">${badge(W.teamById[p.team])}<div class="grow"><b>${esc(p.name)}</b><div class="tiny muted">${esc(posLabel(p))} · ${ptsLine(L, p)}</div></div>${right}</div>`;
      })
      .join("")}</div>`;
}

function settingsTab(L) {
  const edit = isCommish(L);
  const row = (group, k, label) => {
    const v = L.scoring[group][k] ?? 0;
    return `<div class="list-item"><span class="grow">${label}${k === "IP" ? ' <span class="tiny muted">(per inning)</span>' : ""}</span>${
      edit ? `<input class="input pts-input" type="number" step="0.5" value="${v}" data-change="f-score" data-l="${L.id}" data-g="${group}" data-k="${k}" aria-label="${label} points">` : `<b class="num">${v > 0 ? "+" : ""}${v}</b>`
    }</div>`;
  };
  return `<p class="small muted">${edit ? "You're the commissioner, so you can change how many points each stat is worth. Changes apply to the whole league right away." : `Only the commissioner (${esc(L.commissioner)}) can change scoring.`}</p>
    <div class="cols" data-tour="fantasy-settings"><div class="col">${sectionHead("Batting")}<div class="card list">${E.F_BAT.map(([k, l]) => row("bat", k, l)).join("")}</div></div>
    <div class="col">${sectionHead("Pitching")}<div class="card list">${E.F_PIT.map(([k, l]) => row("pit", k, l)).join("")}</div></div></div>
    ${edit ? `<button class="btn btn-secondary" data-act="f-reset-scoring" data-l="${L.id}">Reset to default scoring</button>` : ""}
    ${sectionHead("League")}
    <div class="card list small"><div class="list-item"><span class="grow">Format</span><b>Points</b></div><div class="list-item"><span class="grow">Teams</span><b>${L.size}</b></div><div class="list-item"><span class="grow">Roster</span><b>${E.SLOTS.join(", ")}</b></div><div class="list-item"><span class="grow">Draft</span><b>Snake</b></div></div>`;
}

function ruleRow(label, val, key, min, max) {

  if ((el.dataset.min && v < Number(el.dataset.min)) || (el.dataset.max && v > Number(el.dataset.max))) return;

};
CHANGE["mercy"] = (el) => setRules({ mercy: { ...W.rules.mercy, on: el.checked } });

function viewPitchers() {
  const today = new Date(todayKey() + "T12:00:00");
  const rows = W.players
    .filter((p) => W.po.pit[p.id])
    .map((p) => {
      const outings = W.games.filter((g) => g.rep && g.rep.pit[p.id]).map((g) => ({ date: new Date(g.date), pitches: g.rep.pit[p.id].P }));
      const last = outings[outings.length - 1];
      const rest = last ? E.restDays(last.pitches) : 0;
      const eligible = last ? new Date(last.date.getFullYear(), last.date.getMonth(), last.date.getDate() + rest + 1, 12) : today;
      return { p, last, rest, eligible, ok: eligible <= today };
    })
    .sort((a, b) => a.p.team.localeCompare(b.p.team) || a.p.jersey - b.p.jersey);
  return `<a class="link back" href="#/admin">‹ Admin</a><div class="page-head"><h1 class="h1">Pitcher eligibility</h1><p class="muted">Little League rest rules: 66+ pitches = 4 days, 51–65 = 3, 36–50 = 2, 21–35 = 1. Counts come from the scorekeepers' pitch entries.</p></div>
    <div class="card scroll-x" data-tour="pitchers"><table><thead><tr><th>Pitcher</th><th>Last outing</th><th>Pitches</th><th>Rest</th><th>Eligible</th></tr></thead><tbody>${rows
      .map((x) => `<tr><td><b>${esc(x.p.name)}</b> <span class="tiny muted">${esc(W.teamById[x.p.team].abbr)}</span></td><td>${fmtDay(x.last.date.toISOString())}</td><td>${x.last.pitches}</td><td>${x.rest} day${x.rest === 1 ? "" : "s"}</td>
        <td>${x.ok ? '<span class="tag tag-good">Now</span>' : `<span class="tag">${fmtDay(x.eligible.toISOString())}</span>`}</td></tr>`)
      .join("") || `<tr><td colspan="5" class="muted">No playoff pitching yet.</td></tr>`}</tbody></table></div>`;
}

};

/* ---- playoffs */
ACT["po-next"] = () => {
  const open = W.games.filter((g) => g.status === "scheduled" || g.status === "live").sort((a, b) => a.date.localeCompare(b.date) || a.slot - b.slot);
  if (!open.length) return;
  const g = open[0];
  const d = S.games[g.id];
  if (d && d.events) {
    // A game someone started scoring: play out the rest from where they left off.
    const events = E.simulate(d.setup, g.seed, { ...W.rules, tiesAllowed: false }, null, d.events, W.profiles).events;
    S.games[g.id] = { ...d, events, status: "final" };
  } else {
    S.playoffs.games.find((x) => x.id === g.id).status = "final";
  }
  save();
  build();
  advancePlayoffs();
  save();
  build();
  render();
  const champ = playoffChampion();
  const done = W.gameById[g.id];
  toast(champ ? `${W.teamById[champ].name} win the championship.` : `${W.teamById[done.away].abbr} ${done.score[0]}, ${W.teamById[done.home].abbr} ${done.score[1]}. Final.`);
};
function advancePlayoffs() {
  const po = S.playoffs;
  const seedOf = (t) => po.seeds.indexOf(t);
  const byBetter = (a, b) => (seedOf(a) <= seedOf(b) ? [a, b] : [b, a]);
  const find = (slot, sg = null) => po.games.find((g) => g.slot === slot && (g.sg || null) === sg);
  const w = (slot) => winnerOf(W.gameById[find(slot)?.id]);
  const lastDate = () => po.games.reduce((m, g) => (g.date > m ? g.date : m), po.games[0].date);
  const at = (days, h) => {
    const d = new Date(lastDate());
    d.setDate(d.getDate() + days);
    d.setHours(h, 30, 0, 0);
    return d.toISOString();
  };
  [[5, 1, 2], [6, 3, 4]].forEach(([slot, a, b]) => {
    const wa = w(a);
    const wb = w(b);
    if (wa && wb && !find(slot)) {
      const [home, away] = byBetter(wa, wb);
      po.games.push({ id: `po-s${slot - 4}`, slot, sg: null, home, away, date: at(2, slot === 5 ? 17 : 19), field: "Field 1", status: "scheduled", seed: 2000 + slot, round: 30 + slot });
    }
  });
  const f1 = w(5);
  const f2 = w(6);
  if (f1 && f2 && !find(7, 1)) {
    const [hi, lo] = byBetter(f1, f2);
    [[1, hi, lo, 2], [2, lo, hi, 3], [3, hi, lo, 4]].forEach(([sg, home, away, d]) =>
      po.games.push({ id: `po-f${sg}`, slot: 7, sg, home, away, date: at(d, 17), field: "Field 1", status: "scheduled", seed: 3000 + sg, round: 40 + sg }),
    );
  }
  const wins = {};
  po.games.filter((g) => g.slot === 7).forEach((g) => {
    const x = winnerOf(W.gameById[g.id]);
    if (x) wins[x] = (wins[x] || 0) + 1;
  });
  if (Object.values(wins).some((n) => n >= 2)) po.games.filter((g) => g.slot === 7 && g.status === "scheduled" && !S.games[g.id]).forEach((g) => (g.status = "canceled"));
}
ACT["reset"] = () => {
  if (!confirm("Reset the demo? Anything you scored or changed goes back to the start.")) return;

const sprayStar = () => Object.entries(W.po.bip).sort((a, b) => b[1].length - a[1].length)[0]?.[0] || "p0";

const TOURS = {

      { route: `game/${SHOWCASE}`, sel: "board", role: "fan", title: "Everyone sees it", body: "Each entry shows up on the public game page right away. Open the demo in two tabs to see it happen." },

let T = null; // { id, i }
const tourHost = () => document.getElementById("tour");

function startTour(id) {
  closeSheet();
  S.seenWelcome = true;
  S.signedIn = true;
  save();
  T = { id, i: 0 };
  showStep();
}

function showStep() {
  const tour = TOURS[T.id];
  const step = tour.steps[T.i];
  const role = step.role || tour.role || "fan";
  if (S.role !== role) {
    S.role = role;
    save();
  }
  const target = "#/" + (typeof step.route === "function" ? step.route() : step.route);
  if (location.hash !== target) location.hash = target;
  else render();
}

function tourRefresh() {
  const host = tourHost();
  if (!T) {
    host.innerHTML = "";
    return;
  }
  const tour = TOURS[T.id];
  const step = tour.steps[T.i];
  const el = document.querySelector(`[data-tour="${step.sel}"]`);
  const last = T.i === tour.steps.length - 1;
  host.innerHTML = `<div class="tour-spot" hidden></div><div class="tour-tip" role="dialog" aria-live="polite">
    <div class="row between"><span class="step">${esc(tour.title)} · ${T.i + 1} of ${tour.steps.length}</span><button class="link" data-act="tour-end">Close</button></div>
    <h3>${esc(step.title)}</h3><p>${esc(step.body)}</p>${step.tryIt ? `<p class="try">${esc(step.tryIt)}</p>` : ""}
    <div class="row between" style="margin-top:14px"><div class="tour-dots">${tour.steps.map((_, i) => `<i class="${i === T.i ? "on" : ""}"></i>`).join("")}</div>
    <div class="row">${T.i ? `<button class="btn btn-sm btn-secondary" data-act="tour-prev">Back</button>` : ""}<button class="btn btn-sm btn-primary" data-act="tour-next">${last ? "Finish" : "Next"}</button></div></div></div>`;
  if (el) {
    // Tall targets: show their top part with the tip underneath instead of covering them.
    const th = document.querySelector('.tour-tip').offsetHeight;
    const room = window.innerHeight - th - 150;
    if (el.getBoundingClientRect().height > room) {
      el.scrollIntoView({ block: 'start' });
      window.scrollBy(0, -(document.querySelector('.top')?.offsetHeight || 0) - 12);
    } else el.scrollIntoView({ block: 'center' });
    placeTour();
  } else placeTour();
}

function placeTour() {
  if (!T) return;
  const step = TOURS[T.id].steps[T.i];
  const el = document.querySelector(`[data-tour="${step.sel}"]`);
  const spot = document.querySelector(".tour-spot");
  const tip = document.querySelector(".tour-tip");
  if (!spot || !tip) return;
  const vh = window.innerHeight;
  if (!el) {
    spot.hidden = true;
    tip.style.top = `${Math.max(16, vh / 2 - tip.offsetHeight / 2)}px`;
    return;
  }
  const r = el.getBoundingClientRect();
  const pad = 6;
  const top = Math.max(4, r.top - pad);
  const th0 = tip.offsetHeight;
  let bottom = Math.min(vh - 4, r.bottom + pad);
  if (bottom + th0 + 20 > vh && top - th0 - 20 < 0) bottom = Math.max(top + 80, vh - th0 - 24);
  Object.assign(spot.style, { left: `${r.left - pad}px`, top: `${top}px`, width: `${r.width + pad * 2}px`, height: `${Math.max(0, bottom - top)}px` });
  spot.hidden = false;
  const th = tip.offsetHeight;
  const below = bottom + 12;
  const above = top - th - 12;
  let y = below + th < vh - 8 ? below : above > 8 ? above : vh - th - 12;
  tip.style.top = `${Math.max(8, y)}px`;
}
window.addEventListener("resize", placeTour);
window.addEventListener("scroll", () => requestAnimationFrame(placeTour), { passive: true });

ACT["tour-next"] = () => {
  const tour = TOURS[T.id];
  if (T.i < tour.steps.length - 1) {
    T.i++;
    showStep();
  } else {
    const done = T.id;
    T = null;
    tourRefresh();
    openSheet(() => tourMenu("Tour finished", "Pick another tour, or keep exploring."));
  }
};
ACT["tour-prev"] = () => {
  T.i = Math.max(0, T.i - 1);
  showStep();
};
ACT["tour-end"] = () => {
  T = null;
  tourRefresh();
};
ACT["start-tour"] = (el) => startTour(el.dataset.tourId);
ACT["help"] = () => openSheet(() => tourMenu("Guided tours", "Each takes about a minute. You can close a tour at any time."));

function tourMenu(title, sub) {
  return `<h2 class="h2">${title}</h2><p class="small muted" style="margin:4px 0 12px">${sub}</p>
    <div class="card list">${Object.entries(TOURS)
      .map(([id, t]) => `<button class="list-item" data-act="start-tour" data-tour-id="${id}"><div class="grow"><b>${esc(t.title)}</b><div class="small muted">${esc(t.blurb)}</div></div><span class="link">Start</span></button>`)
      .join("")}</div>
    <div class="row" style="margin-top:12px"><button class="btn btn-secondary grow" data-act="about-close">Costs & plan</button><button class="btn btn-secondary grow" data-act="close-sheet">Keep exploring</button></div>`;
}
ACT["about-close"] = () => {
  closeSheet();
  go("about");
};

/* ---------------------------------------------------------------- boot */
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const fn = ACT[el.dataset.act];
  if (!fn) return;
  if (el.tagName === "A" && el.dataset.act !== "close-sheet-nav") e.preventDefault();
  fn(el, e);
});
document.addEventListener("change", (e) => {
  const el = e.target.closest("[data-change]");
  if (el && CHANGE[el.dataset.change]) CHANGE[el.dataset.change](el, e);
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && e.target.closest?.("[data-tour=signin]")) ACT["signin"]();
  if (e.key === "Escape") {
    if (sheetRender) ACT["close-sheet"]();
    else if (T) ACT["tour-end"]();
  }
});
window.addEventListener("hashchange", () => {
  if (!T) {
    sheetRender = null;
    SK = null;
  }
  render();
});

build();
render();

})();
