/* ---------------------------------------------------------------- player */
/** A player's advanced stats: each season scored pitch by pitch, plus a career line (same as the site's player page). */
function playerAdvanced(p) {
  const sum = (rows) => (rows.length ? rows.slice(1).reduce((a, x) => { const o = { ...a }; for (const [k, v] of Object.entries(x)) if (typeof v === "number") o[k] = (a[k] ?? 0) + v; return o; }, { ...rows[0] }) : null);
  const mine = (rows) => sum(rows.filter((x) => x.player_id === p.id));
  const rows = W.seasons
    .slice()
    .reverse()
    .map((s) => {
      const all = W.scoredBy[s.id] || [];
      const games = all.filter((g) => g.state.appeared.has(p.id));
      if (!games.length) return null;
      const adv = HLL.advancedFromGames(games);
      return { label: esc(s.name), team: teamOf(p.id, s.id), bat: mine(adv.bat), pit: mine(adv.pit), fipC: HLL.fipConstant(HLL.advancedFromGames(all).pit), games: all };
    })
    .filter(Boolean);
  if (!rows.length) return "";
  if (rows.length > 1) {
    const all = rows.flatMap((r) => r.games);
    const adv = HLL.advancedFromGames(all.filter((g) => g.state.appeared.has(p.id)));
    rows.push({ label: "Career", career: true, bat: mine(adv.bat), pit: mine(adv.pit), fipC: HLL.fipConstant(HLL.advancedFromGames(all).pit) });
  }
  const table = (title, list, cols, get) =>
    list.length
      ? `<div class="card scroll-x"><table><thead><tr><th>${title}</th>${cols.map((c) => `<th title="${esc(c.help)}">${esc(c.label)}</th>`).join("")}</tr></thead><tbody>${list
          .map((r) => `<tr class="${r.career ? "total-row" : ""}"><td class="bold">${r.label} ${r.team ? badge(r.team) : ""}</td>${cols.map((c, i) => `<td>${HLL.fmtAdv(c.kind, get(r, i))}</td>`).join("")}</tr>`)
          .join("")}</tbody></table></div>`
      : "";
  const bat = rows.filter((r) => r.bat && r.bat.PA > 0);
  const pit = rows.filter((r) => r.pit && r.pit.BF > 0);
  if (!bat.length && !pit.length) return "";
  return `${sectionHead("Advanced")}${table("Hitting", bat, HLL.ADV_BAT, (r, i) => HLL.ADV_BAT[i].get(r.bat))}${table("Pitching", pit, HLL.advPitColumns(0), (r, i) => HLL.advPitColumns(r.fipC)[i].get(r.pit))}
    <p class="small muted">From games scored pitch by pitch on the site (spreadsheet seasons don't have this detail). Hover a column name for what it means.</p>`;
}

function viewPlayer(r) {
  const p = W.playerById[r.parts[1]];
  if (!p) return `<p>Player not found.</p>`;
  const t = teamOf(p.id) || W.teamById[p.team];
  const cur = lineOf(p.id);
  const tile = (v, l) => `<div class="tile"><b>${v}</b><span>${l}</span></div>`;
  const ex = W.extrasBy[W.season.id];
  const bip = ex.bip[p.id] || [];
  const log = (ex.logs[p.id] || []).slice().reverse();
  const follow = S.follows[p.id];
  const seasons = W.seasons.map((s) => ({ s, line: lineOf(p.id, s.id), team: teamOf(p.id, s.id) })).filter((x) => x.line).reverse();
  const batRows = seasons.filter((x) => HLL.hasBatting(x.line));
  const pitRows = seasons.filter((x) => HLL.hasPitching(x.line));
  const career = (rows) => rows.slice(1).reduce((a, x) => { const o = { ...a }; for (const k of Object.keys(x.line)) if (typeof x.line[k] === "number") o[k] = (a[k] ?? 0) + x.line[k]; return o; }, rows[0]?.line || {});
  const followBtn =
    follow === "approved" ? `<span class="tag tag-good">Your player</span>`
      : follow === "pending" ? `<span class="tag">Request sent to the admin</span>`
        : `<button class="btn btn-sm btn-secondary" data-act="follow" data-pid="${p.id}" data-tour="follow">This is my kid</button>`;
  const batTable = batRows.length
    ? `<div class="card scroll-x" data-tour="career"><table><thead><tr><th>Hitting</th><th>G</th><th>PA</th><th>AB</th><th>R</th><th>H</th><th>2B</th><th>3B</th><th>HR</th><th>RBI</th><th>BB</th><th>K</th><th>AVG</th><th>OBP</th><th>SLG</th><th>OPS</th><th>WAR</th></tr></thead><tbody>${[...batRows.map((x) => ({ label: x.s.name, team: x.team, s: x.line })), ...(batRows.length > 1 ? [{ label: "Career", s: career(batRows), career: true }] : [])]
      .map((x) => `<tr class="${x.career ? "total-row" : ""}"><td class="bold">${esc(x.label)} ${x.team ? badge(x.team) : ""}</td>${[x.s.g, x.s.pa, x.s.ab, x.s.r, x.s.h, x.s.doubles, x.s.triples, x.s.hr, x.s.rbi, x.s.bb, x.s.so].map((v) => `<td>${v ?? 0}</td>`).join("")}<td>${HLL.fmtRate(HLL.avg(x.s))}</td><td>${HLL.fmtRate(HLL.obp(x.s))}</td><td>${HLL.fmtRate(HLL.slg(x.s))}</td><td>${HLL.fmtRate(HLL.ops(x.s))}</td><td class="bold">${HLL.fmt1(x.s.war ?? null)}</td></tr>`)
      .join("")}</tbody></table></div>`
    : "";
  const pitTable = pitRows.length
    ? `<div class="card scroll-x"><table><thead><tr><th>Pitching</th><th>G</th><th>IP</th><th>W</th><th>L</th><th>SV</th><th>H</th><th>R</th><th>ER</th><th>BB</th><th>K</th><th>ERA</th><th>WHIP</th><th>pWAR</th></tr></thead><tbody>${[...pitRows.map((x) => ({ label: x.s.name, team: x.team, s: x.line })), ...(pitRows.length > 1 ? [{ label: "Career", s: career(pitRows), career: true }] : [])]
      .map((x) => `<tr class="${x.career ? "total-row" : ""}"><td class="bold">${esc(x.label)} ${x.team ? badge(x.team) : ""}</td><td>${x.s.p_g ?? 0}</td><td>${HLL.fmtIp(x.s.outs)}</td>${[x.s.w, x.s.l, x.s.sv, x.s.p_h, x.s.p_r, x.s.er, x.s.p_bb, x.s.p_so].map((v) => `<td>${v ?? 0}</td>`).join("")}<td>${HLL.fmt2(HLL.era(x.s))}</td><td>${HLL.fmt2(HLL.whip(x.s))}</td><td>${HLL.fmt1(x.s.pit_war ?? null)}</td></tr>`)
      .join("")}</tbody></table></div>`
    : "";
  const advTables = playerAdvanced(p);
  const tiles = cur && HLL.hasBatting(cur)
    ? `<div class="tiles" data-tour="player-cards">${tile(HLL.fmtRate(HLL.avg(cur)), "AVG")}${tile(cur.hr ?? 0, "HR")}${tile(cur.rbi ?? 0, "RBI")}${tile(HLL.fmtRate(HLL.obp(cur)), "OBP")}${tile(HLL.fmtRate(HLL.ops(cur)), "OPS")}${cur.war != null ? tile(HLL.fmt1(cur.war), "WAR") : tile(cur.h ?? 0, "H")}</div>`
    : "";
  const pitTiles = cur && HLL.hasPitching(cur) && cur.outs ? `<div class="tiles">${tile(`${cur.w ?? 0}-${cur.l ?? 0}`, "W-L")}${tile(HLL.fmt2(HLL.era(cur)), "ERA")}${tile(cur.p_so ?? 0, "K")}${cur.pit_war != null ? tile(HLL.fmt1(cur.pit_war), "pWAR") : ""}</div>` : "";
  return `<section class="card team-head" style="border-left-color:${t?.color || "#999"}"><span class="jersey jersey-lg" style="background:${t?.color || "#999"}">${p.jersey ?? "–"}</span>
      <div class="grow"><h1 class="h1">${esc(p.name)}</h1><p class="muted">${t ? `<a class="link" href="#/team/${t.id}">${esc(t.name)}</a> · ` : ""}${esc(posLabel(p))}${W.current[p.id]?.age ? ` · Age ${W.current[p.id].age}` : ""}</p></div>${followBtn}</section>
    <div class="cols"><div class="col">
    ${sectionHead(`${esc(W.season.name)}`)}
    ${tiles}${pitTiles}${!tiles && !pitTiles ? `<p class="card pad small muted">No games yet this season.</p>` : ""}
    ${sectionHead("By season")}
    ${batTable}${pitTable}
    ${advTables}
    </div><div class="col">
    ${bip.length ? `<section class="card pad stack-s" data-tour="spray"><div class="row between"><b>Spray chart</b><span class="small muted">${bip.length} ball${bip.length > 1 ? "s" : ""} in play</span></div>
      ${fieldSvg({ dots: bip.map((x) => ({ x: x.x, y: x.y, color: bipColor(x.r), label: E.RESULTS[x.r].label })) })}
      <p class="small legend"><span style="color:${HIT_COLOR.hit}">●</span> Hit <span style="color:${HIT_COLOR.out}">●</span> Out <span style="color:${HIT_COLOR.other}">●</span> Error / FC</p></section>` : ""}
    ${log.length ? `${sectionHead("Game log")}<div class="card list" data-tour="game-log">${log
      .slice(0, 12)
      .map(({ game: g, b: gb, p: gp }) => {
        const opp = W.teamById[g.home === teamIdOf(p.id) ? g.away : g.home];
        const line = [gb ? `${gb.H}-${gb.AB}${gb.HR ? `, ${gb.HR} HR` : ""}${gb.RBI ? `, ${gb.RBI} RBI` : ""}` : "", gp ? `${E.inningsPitched(gp.OUTS)} IP, ${gp.K} K` : ""].filter(Boolean).join(" · ");
        return `<a class="list-item" href="#/game/${g.id}"><span class="small muted" style="width:74px">${fmtDay(g.date)}</span><span class="grow bold">vs ${esc(opp?.abbr || "")}</span><span class="small num">${line}</span></a>`;
      })
      .join("")}</div>` : ""}
    </div></div>`;
}

/* ---------------------------------------------------------------- game */
function diamond(bases) {
  return `<div class="diamond" aria-label="Runners on base"><b class="b2 ${bases[1] ? "on" : ""}"></b><b class="b3 ${bases[2] ? "on" : ""}"></b><b class="b1 ${bases[0] ? "on" : ""}"></b></div>`;
}
function outsDots(n) {
  return `<span class="outs">${[0, 1, 2].map((i) => `<i class="${i < n ? "on" : ""}"></i>`).join("")} ${n} out${n === 1 ? "" : "s"}</span>`;
}

function scoreboard(g, tour = "", rep = g.rep) {
  const s = rep;
  const home = W.teamById[g.home];
  const away = W.teamById[g.away];
  const [as, hs] = s ? s.score : g.score || [0, 0];
  const live = g.status !== "final" && s && s.status !== "final";
  const arrow = (t) => (live && s.half === t ? '<span class="bat-arrow">◀</span>' : "");
  return `<div class="board" ${tour ? `data-tour="${tour}"` : ""}>
    <div class="board-label">${gameLabel(g)}</div>
    <div class="teams">
      <div class="tname">${badge(away, "md")}<span>${esc(away?.name || "TBD")}</span></div><div class="runs">${g.status === "scheduled" && !s ? "" : as} ${arrow(0)}</div>
      <div class="tname">${badge(home, "md")}<span>${esc(home?.name || "TBD")}</span></div><div class="runs">${g.status === "scheduled" && !s ? "" : hs} ${arrow(1)}</div>
    </div>
    <div class="sit">${
      live
        ? `<span class="inn">${s.half ? "Bot" : "Top"} ${ord(s.inning)}</span><span class="count">${s.balls}-${s.strikes}</span>${outsDots(s.outs)}${diamond(s.bases)}`
        : g.status === "final" || (s && s.status === "final")
          ? `<span class="inn">Final${s && s.endReason ? " · " + esc(s.endReason) : ""}</span><span class="small">${fmtDay(g.date)}</span>`
          : `<span class="inn">${g.date ? fmtLongDay(g.date) : "Date TBD"}</span><span class="small">${g.date ? fmtTime(g.date) : ""}${g.field ? " · " + esc(g.field) : ""}</span>`
    }</div>
  </div>`;
}

function lineScore(g, tour = "") {
  const s = g.rep;
  if (!s) return "";
  const n = Math.max(W.rules.innings, s.inning);
  const cell = (t, i) => {
    const v = s.line[t][i];
    if (v !== undefined) return v;
    if (s.status === "final" && t === 1 && i === s.line[0].length - 1 && i >= W.rules.innings - 1) return "X";
    return "";
  };
  const row = (t) => `<tr><td class="bold">${esc(W.teamById[t ? g.home : g.away].abbr)}</td>${Array.from({ length: n }, (_, i) => `<td>${cell(t, i)}</td>`).join("")}<td class="tot">${s.score[t]}</td><td>${s.hits[t]}</td><td>${s.errors[t]}</td></tr>`;
  return `<div class="card scroll-x linescore" ${tour ? `data-tour="${tour}"` : ""}><table><thead><tr><th></th>${Array.from({ length: n }, (_, i) => `<th>${i + 1}</th>`).join("")}<th>R</th><th>H</th><th>E</th></tr></thead><tbody>${row(0)}${row(1)}</tbody></table></div>`;
}

function playLog(g, { limit = 0, tour = "", rep = g.rep } = {}) {
  const s = rep;
  if (!s) return "";
  let entries = s.log.map((e, i) => ({ ...e, i })).reverse();
  if (limit) entries = entries.slice(0, limit);
  let last = "";
  const html = entries
    .map((e) => {
      const key = `${e.inning}-${e.half}`;
      const head = key !== last ? `<div class="inn-head">${e.half ? "Bottom" : "Top"} ${ord(e.inning)} · ${esc(W.teamById[e.half ? g.home : g.away].name)}</div>` : "";
      last = key;
      const fresh = e.i >= s.log.length - 1 && g.status === "live" ? "flash" : "";
      return `${head}<div class="play ${e.kind} ${fresh}"><span class="dot"></span><span>${esc(e.text)}</span><span class="sc">${e.score[0]}-${e.score[1]}</span></div>`;
    })
    .join("");
  return `<div class="card plays" ${tour ? `data-tour="${tour}"` : ""}>${html || '<p class="pad muted">No plays yet.</p>'}</div>`;
}

function boxScore(g) {
  const s = g.rep;
  const live = s.status !== "final";
  const list = (ids, n) => ids.map((pid) => [pid, n(pid)]).filter(([, v]) => v > 0).map(([pid, v]) => `${esc(nameOf(pid))}${v > 1 ? " " + v : ""}`).join(", ");
  const side = (t) => {
    const tid = t ? g.home : g.away;
    const ids = [...s.lineup[t].map((x) => x.pid), ...s.bench[t].filter((pid) => s.appeared.has(pid))];
    const batting = live && s.half === t;
    const tot = { AB: 0, R: 0, H: 0, RBI: 0, BB: 0, K: 0 };
    const rows = ids
      .map((pid) => {
        const b = s.bat[pid] || { AB: 0, R: 0, H: 0, RBI: 0, BB: 0, K: 0 };
        for (const k in tot) tot[k] += b[k] || 0;
        const pos = s.lineup[t].find((x) => x.pid === pid)?.pos || "sub";
        const up = batting && s.batter === pid;
        const on = batting && s.bases.some((r) => r?.pid === pid);
        return `<tr class="${up ? "now" : ""}"><td><a href="#/player/${pid}"><b>${esc(nameOf(pid))}</b></a> <span class="tiny muted">${pos}</span>${up ? ' <span class="tag tag-now">At bat</span>' : on ? ' <span class="tag">On base</span>' : ""}</td><td>${b.AB}</td><td>${b.R}</td><td>${b.H}</td><td>${b.RBI}</td><td>${b.BB}</td><td>${b.K}</td></tr>`;
      })
      .join("");
    const fielders = [...new Set([...s.lineup[t].map((x) => x.pid), ...s.bench[t]])];
    const bat = (k) => (pid) => s.bat[pid]?.[k] || 0;
    const notes = [["2B", list(ids, bat("2B"))], ["3B", list(ids, bat("3B"))], ["HR", list(ids, bat("HR"))], ["SB", list(ids, bat("SB"))], ["CS", list(ids, bat("CS"))], ["HBP", list(ids, bat("HBP"))], ["SF", list(ids, bat("SF"))], ["SAC", list(ids, bat("SAC"))], ["E", list(fielders, (pid) => s.fld[pid]?.E || 0)]].filter(([, v]) => v);
    const pitchers = [...new Set(s.pitchersUsed[t])]
      .filter((pid) => s.pit[pid])
      .map((pid) => {
        const p = s.pit[pid];
        const dec = s.decision?.W === pid ? " (W)" : s.decision?.L === pid ? " (L)" : s.decision?.SV === pid ? " (S)" : p.HD ? " (H)" : "";
        const now = live && s.pitcher === pid && s.half !== t;
        return `<tr class="${now ? "now" : ""}"><td><b>${esc(nameOf(pid))}</b>${dec}${now ? ' <span class="tag tag-now">Pitching</span>' : ""}</td><td>${E.inningsPitched(p.OUTS)}</td><td>${p.H}</td><td>${p.R}</td><td>${p.ER}</td><td>${p.BB}</td><td>${p.K}</td><td>${p.HR}</td><td>${p.P}-${p.S}</td></tr>`;
      })
      .join("");
    const out = (g.setup?.absent?.[t] || []).map(nameOf);
    return `<h3 class="h3 row">${badge(W.teamById[tid])}${esc(W.teamById[tid].name)}<span class="grow"></span><span class="small num">${s.score[t]} R · ${s.hits[t]} H · ${s.errors[t]} E</span></h3>
      <div class="card scroll-x"><table><thead><tr><th>Batting</th><th>AB</th><th>R</th><th>H</th><th>RBI</th><th>BB</th><th>K</th></tr></thead><tbody>${rows}<tr class="total-row"><td><b>Totals</b></td>${Object.values(tot).map((v) => `<td><b>${v}</b></td>`).join("")}</tr></tbody></table></div>
      ${notes.length ? `<p class="small box-notes">${notes.map(([k, v]) => `<span><b>${k}:</b> ${v}</span>`).join("")}</p>` : ""}
      <div class="card scroll-x"><table><thead><tr><th>Pitching</th><th>IP</th><th>H</th><th>R</th><th>ER</th><th>BB</th><th>K</th><th>HR</th><th>P-S</th></tr></thead><tbody>${pitchers}</tbody></table></div>
      ${out.length ? `<p class="small muted">Not at this game: ${out.map(esc).join(", ")}</p>` : ""}`;
  };
  return `<div class="stack" data-tour="box-score">${live ? '<p class="small muted">Live: updates with every pitch.</p>' : ""}${side(0)}${side(1)}</div>`;
}

/** A game's fielding: innings at each position, putouts, assists, errors. */
function gameDefense(g) {
  const s = g.rep;
  const side = (t) => {
    const tid = t ? g.home : g.away;
    const pids = [...new Set([...s.lineup[t].map((x) => x.pid), ...s.bench[t]])].filter((pid) => s.defPos[pid]);
    const rows = pids
      .map((pid) => {
        const f = s.fld[pid] || { PO: 0, A: 0, E: 0 };
        const outs = Object.values(s.defPos[pid]).reduce((a, b) => a + b, 0);
        return `<tr><td><a href="#/player/${pid}"><b>${esc(nameOf(pid))}</b></a><div class="tiny muted">${esc(posSummary(s.defPos[pid]))}</div></td><td>${E.inningsPitched(outs)}</td><td>${f.PO}</td><td>${f.A}</td><td>${f.E}</td></tr>`;
      })
      .join("");
    return `<h3 class="h3 row">${badge(W.teamById[tid])}${esc(W.teamById[tid].name)}</h3>
      <div class="card scroll-x"><table><thead><tr><th>Fielder</th><th>INN</th><th>PO</th><th>A</th><th>E</th></tr></thead><tbody>${rows || '<tr><td colspan="5" class="muted">No innings in the field yet.</td></tr>'}</tbody></table></div>`;
  };
  return `<div class="stack" data-tour="game-defense">${side(0)}${side(1)}</div>`;
}

function viewGame(r) {
  const g = W.gameById[r.parts[1]];
  if (!g) return `<p>Game not found.</p>`;
  const tab = r.q.tab || "plays";
  const s = g.rep;
  const staff = S.role !== "fan";
  if (!s) {
    return `${scoreboard(g, "board")}<div class="card pad stack-s"><p class="bold">${g.status === "final" ? "Final." : g.movedFrom ? `Rained out on ${fmtDay(g.movedFrom)} and moved to ${fmtDay(g.date)}.` : "This game hasn't started."}</p><p class="small muted">${g.status === "final" ? "This result is from the league's records, from before games were scored on the site, so there's no play-by-play." : "Once a scorekeeper starts, every pitch shows up here live."}</p></div>
      ${staff && g.status === "scheduled" && g.home && g.away ? `<a class="btn btn-green btn-block" href="#/score/${g.id}">Score this game</a>` : ""}`;
  }
  const live = g.status === "live";
  const spray = s.bip.map((x) => ({ x: x.x, y: x.y, color: bipColor(x.r), label: `${nameOf(x.pid)}: ${E.RESULTS[x.r].label}` }));
  return `<div class="cols"><div class="col">${scoreboard(g, "board")}
    ${live ? `<div class="card pad at-bat"><div><span class="eyebrow">At bat</span><b>${esc(nameOf(s.batter))}</b></div><div><span class="eyebrow">Pitching</span><b>${esc(nameOf(s.pitcher))}</b><span class="small muted">${s.pit[s.pitcher]?.P || 0} pitches</span></div></div>` : ""}
    ${lineScore(g, "linescore")}
    ${live && staff ? `<a class="btn btn-green btn-block" href="#/score/${g.id}">Open scorekeeper screen</a>` : ""}
    ${live ? `<p class="small muted">Updates as the scorekeeper enters each pitch. Open this demo in two browser tabs, score in one and watch the other.</p>` : ""}
    </div><div class="col">
    <div class="seg" data-tour="game-tabs">${[["plays", "Plays"], ["box", live ? "Live box score" : "Box score"], ["spray", "Spray"], ["defense", "Defense"]].map(([k, l]) => `<a href="#/game/${g.id}?tab=${k}" class="${tab === k ? "on" : ""}">${l}</a>`).join("")}</div>
    ${tab === "box" ? boxScore(g) : tab === "spray" ? `<div class="card pad">${fieldSvg({ dots: spray })}</div>` : tab === "defense" ? gameDefense(g) : playLog(g, { tour: "plays" })}
    </div></div>`;
}

/* ---------------------------------------------------------------- playoffs */
const PO_ROUND = { 1: "Quarterfinal", 2: "Quarterfinal", 3: "Quarterfinal", 4: "Quarterfinal", 5: "Semifinal", 6: "Semifinal", 7: "Championship" };
const playoffLabel = (g) => (g.slot === 7 ? `Championship · Game ${g.sg}` : PO_ROUND[g.slot] || "Playoffs");
function winnerOf(g) {
  if (!g || g.status !== "final" || !g.score || g.score[0] === g.score[1]) return null;
  return g.score[1] > g.score[0] ? g.home : g.away;
}
function seriesWins() {
  const wins = {};
  W.games.filter((g) => g.slot === 7).forEach((g) => {
    const w = winnerOf(g);
    if (w) wins[w] = (wins[w] || 0) + 1;
  });
  return wins;
}

function viewPlayoffs() {
  if (!S.playoffs || !W.sheetSeason) {
    const left = W.games.filter((g) => g.type === "regular" && g.status !== "final").length;
    return `<div class="page-head"><h1 class="h1">Playoffs</h1><p class="muted">The top 8 teams make the playoffs. Quarterfinals and semifinals are one game; the championship is best of 3.</p></div>
      <div class="card pad stack-s" data-tour="bracket"><b>The bracket is set when the regular season ends.</b><p class="small muted">${left} regular-season game${left === 1 ? "" : "s"} left. Then the admin locks the seeds and the quarterfinals appear here: 1 vs 8, 4 vs 5, 2 vs 7, 3 vs 6.</p></div>
      ${sectionHead("If the season ended today")}${standingsTable(W.standings.slice(0, 8), { compact: true, cut: false })}`;
  }
  const seeds = Object.fromEntries(S.playoffs.seeds.map((t, i) => [t, i + 1]));
  const seedRow = (tid, score, won) => `<div class="row seed-row ${won === false ? "dim" : ""}"><span class="seed">${tid ? seeds[tid] : ""}</span>${badge(W.teamById[tid])}<b class="grow ellipsis">${esc(W.teamById[tid]?.name || "TBD")}</b>${score != null ? `<b class="num score-sm">${score}</b>` : ""}</div>`;
  const slot = (n) => W.games.filter((g) => g.slot === n);
  const match = (g) => {
    if (!g) return `<div class="card pad small muted">Waiting on earlier rounds</div>`;
    const w = winnerOf(g);
    const show = g.status === "final" || g.status === "live";
    return `<a class="card match stack-s" href="#/game/${g.id}"><span class="tiny muted">${g.status === "final" ? "Final" : g.status === "live" ? "Live" : g.date ? fmtDay(g.date) + " · " + fmtTime(g.date) : "TBD"}</span>
      ${seedRow(g.away, show ? g.score[0] : null, w ? w === g.away : undefined)}${seedRow(g.home, show ? g.score[1] : null, w ? w === g.home : undefined)}</a>`;
  };
  const series = slot(7).sort((a, b) => a.sg - b.sg);
  const wins = seriesWins();
  const champ = champion();
  return `<div class="page-head"><h1 class="h1">Playoffs</h1><p class="muted">Top 8 from the ${esc(W.season.name)} standings · quarterfinals and semifinals are one game · championship is best of 3</p></div>
    ${champ ? `<a class="champ" href="#/recap"><p class="eyebrow">${esc(W.season.name)} champions</p><p class="h1">${esc(W.teamById[champ].name)}</p></a>` : ""}
    <div class="bracket" data-tour="bracket">
      <div class="round"><h2 class="h2">Quarterfinals</h2>${[1, 2, 3, 4].map((n) => match(slot(n)[0])).join("")}</div>
      <div class="round"><h2 class="h2">Semifinals</h2>${match(slot(5)[0])}${match(slot(6)[0])}</div>
      <div class="round"><h2 class="h2">Championship</h2>${series.length ? `<div class="card pad stack">${[series[0].home, series[0].away].map((t) => `<div class="row">${badge(W.teamById[t], "md")}<b class="grow">${esc(W.teamById[t].name)}</b><b class="num score-sm">${wins[t] || 0}</b></div>`).join("")}
        <div class="list">${series.map((g) => `<a class="row between series-game" href="#/game/${g.id}"><b>Game ${g.sg}</b><span class="small muted">${g.status === "final" ? `${W.teamById[g.away].abbr} ${g.score[0]}, ${W.teamById[g.home].abbr} ${g.score[1]}` : g.status === "canceled" ? "Not needed" : g.status === "live" ? "Live" : "Upcoming"}</span></a>`).join("")}</div></div>` : `<div class="card pad small muted">Waiting on the semifinals</div>`}</div>
    </div>`;
}

// ---- app-stats.js
/* ---------------------------------------------------------------- stats: the site's own columns, qualifying rules, advanced stats and WAR */
/** Innings by position, formatted: "SS 3.0 · P 1.1" */
const posSummary = (byPos) =>
  Object.entries(byPos || {})
    .sort((a, b) => b[1] - a[1])
    .map(([pos, outs]) => `${pos} ${E.inningsPitched(outs)}`)
    .join(" · ");

/** Sortable stat table (the site's COLUMNS). Rate stats only rank qualified players; counting stats show everyone. */
function statTable({ rows, type, sort, dir, limit = 25, showTeam = true, seasonId = W.season.id }) {
  const teamGames = W.teamGamesBy[seasonId] || new Map();
  const cols = HLL.COLUMNS[type].filter((c) => c.key !== "WAR" || rows.some((r) => c.get(r) != null));
  const ranked = HLL.rankBy(rows, type, sort || "", teamGames, dir);
  const col = ranked.col;
  const desc = ranked.desc ?? true;
  let list = ranked.rows;
  if (limit) list = list.slice(0, limit);
  const head = cols
    .map((c) => {
      const on = col && c.key === col.key;
      const next = on ? (desc ? "asc" : "desc") : c.asc ? "asc" : "desc";
      return `<th class="${on ? "sorted" : ""}"><a href="${withQuery({ sort: c.key, dir: next })}">${c.label}${on ? (desc ? " ↓" : " ↑") : ""}</a></th>`;
    })
    .join("");
  return `<div class="card scroll-x" data-tour="stat-table"><table class="stats"><thead><tr>${col ? "<th>#</th>" : ""}<th>Player</th>${head}</tr></thead><tbody>${list
    .map(
      (s, i) => `<tr>${col ? `<td class="muted">${i + 1}</td>` : ""}<td><a class="row player-cell" href="#/player/${s.player_id}">${showTeam ? badge(W.teamById[s.team_id]) : `<span class="tiny muted">#${W.playerById[s.player_id]?.jersey ?? ""}</span>`}<b>${esc(nameOf(s.player_id))}</b></a></td>${cols
        .map((c) => `<td class="${col && c.key === col.key ? "sorted" : ""}">${HLL.formatStat(c, c.get(s))}</td>`)
        .join("")}</tr>`,
    )
    .join("") || `<tr><td colspan="${cols.length + 2}" class="muted">No stats yet.</td></tr>`}</tbody></table></div>`;
}

function leaderCard(type, key, label, n, seasonId) {
  const { col, rows } = HLL.rankBy(statsOf(seasonId), type, key, W.teamGamesBy[seasonId] || new Map());
  const top3 = rows.slice(0, n);
  const val = (s) => (col ? HLL.formatStat(col, col.get(s)) : "");
  const [top, ...rest] = top3;
  const href = `#/stats?${new URLSearchParams({ type, sort: key, ...(seasonId !== W.season.id ? { season: seasonId } : {}) })}`;
  return `<a class="card leader" href="${href}"><p class="eyebrow">${label}</p>
    ${top ? `<div class="leader-top">${badge(W.teamById[top.team_id], "md")}<div class="grow"><b class="ellipsis">${esc(nameOf(top.player_id))}</b><span class="tiny muted">${esc(W.teamById[top.team_id].name)}</span></div><b class="leader-val">${val(top)}</b></div>` : '<p class="small muted">No stats yet.</p>'}
    ${rest.map((s, i) => `<div class="leader-row"><span class="rank">${i + 2}</span><span class="grow ellipsis">${esc(nameOf(s.player_id))} <span class="muted">${esc(W.teamById[s.team_id].abbr)}</span></span><b class="num">${val(s)}</b></div>`).join("")}</a>`;
}
function leadersGrid(list, n, seasonId) {
  return `<div class="leaders" data-tour="leaders">${list.map(([type, key, label]) => leaderCard(type, key, label, n, seasonId)).join("")}</div>`;
}

const STAT_TABS = [["bat", "Hitting"], ["pit", "Pitching"], ["fld", "Fielding"], ["abat", "Advanced hitting"], ["apit", "Advanced pitching"], ["war", "WAR"]];

function viewStats(r) {
  const season = seasonById(r.q.season);
  const view = STAT_TABS.some(([k]) => k === r.q.type) ? r.q.type : "bat";
  const type = view === "pit" ? "pit" : "bat";
  const rows = statsOf(season.id);
  const scored = W.scoredBy[season.id] || [];
  const tabs = `<div class="tabs-inline" data-tour="stat-tabs">${STAT_TABS.map(([k, l]) => `<a href="${withQuery({ type: k === "bat" ? null : k, sort: null, dir: null })}" class="${view === k ? "on" : ""}">${l}</a>`).join("")}</div>`;
  const csvFile = { pit: "pitching", apit: "pitching", fld: "fielding" }[view] || "hitting";
  const tools = `<div class="row wrap"><a class="btn btn-secondary btn-sm" href="#/records" data-tour="records-link">All-time records</a><a class="btn btn-secondary btn-sm" href="#/recap${season.id !== W.season.id ? "?season=" + season.id : ""}">Season recap</a><a class="btn btn-secondary btn-sm" href="#/innings">Innings by position</a><button class="btn btn-secondary btn-sm" data-act="csv" data-file="${csvFile}" data-season="${season.id}" data-tour="csv">Download CSV</button></div>`;
  const head = `<div class="page-head"><h1 class="h1">Stats</h1><p class="muted">${esc(season.name)}${season.id === PAST.id ? ` · final regular season${["fld", "abat", "apit", "war"].includes(view) ? ` · these are example stats` : ""}` : ` · from ${scored.length} games scored pitch by pitch`}</p></div>${seasonPicker(season.id, { sort: null, dir: null })}${tabs}${tools}`;
  const needsPitchData = ["fld", "abat", "apit", "war"].includes(view) && !scored.length;
  if (needsPitchData)
    return `${head}<p class="card pad muted">${view === "war" ? "WAR" : view === "fld" ? "Fielding" : "Advanced stats"} come from games scored pitch by pitch on the site, and none have been played yet this season.</p>`;
  if (view === "fld") return head + fieldingView(season, scored, r);
  if (view === "abat" || view === "apit") return head + advancedView(view, scored, r);
  if (view === "war") return head + warView(scored, r);
  const sort = r.q.sort || (type === "bat" ? "OPS" : "K");
  const cats = HLL.LEADER_CATEGORIES.filter((c) => c.type === type && (c.key !== "WAR" || rows.some((s) => s.war != null)));
  return `${head}
    ${sectionHead("League leaders")}
    ${leadersGrid(cats.map((c) => [c.type, c.key, c.label]), 5, season.id)}
    ${sectionHead("Top 25", `<span class="small muted">Click a column to sort</span>`)}
    <p class="small muted" data-tour="qualify">Rate stats (AVG, OBP, SLG, OPS, ERA, WHIP) need ${esc(HLL.QUAL_TEXT)} to qualify. Counting stats (H, HR, RBI, K…) show everyone.</p>
    ${statTable({ rows, type, sort, dir: r.q.dir, seasonId: season.id })}`;
}

/* ---- the site's AdvancedTable: sortable through the URL, rate stats need the minimum */
function advTable(rows, columns, { sort, dir, qualifies, limit = 25, tour = "adv-table" }) {
  const col = columns.find((c) => c.key === sort) || columns[1];
  const desc = dir ? dir === "desc" : !col.asc;
  const pool = rows.filter((x) => (col.rate ? qualifies(x) : true) && col.get(x) != null);
  const shown = pool.sort((a, b) => ((col.get(b) ?? 0) - (col.get(a) ?? 0)) * (desc ? 1 : -1)).slice(0, limit);
  return `<div class="card scroll-x" data-tour="${tour}"><table class="stats"><thead><tr><th>#</th><th>Player</th>${columns
    .map((c) => {
      const on = c === col;
      const next = on ? (desc ? "asc" : "desc") : c.asc ? "asc" : "desc";
      return `<th class="${on ? "sorted" : ""}" title="${esc(c.help)}"><a href="${withQuery({ sort: c.key, dir: next })}">${c.label}${on ? (desc ? " ↓" : " ↑") : ""}</a></th>`;
    })
    .join("")}</tr></thead><tbody>${shown
    .map((x, i) => `<tr><td class="muted">${i + 1}</td><td><a class="row player-cell" href="#/player/${x.player_id}">${badge(W.teamById[x.team_id])}<b>${esc(nameOf(x.player_id))}</b></a></td>${columns.map((c) => `<td class="${c === col ? "sorted" : ""}">${HLL.fmtAdv(c.kind, c.get(x))}</td>`).join("")}</tr>`)
    .join("") || `<tr><td colspan="${columns.length + 2}" class="muted">No stats yet.</td></tr>`}</tbody></table></div>`;
}
function glossary(columns) {
  return `<details class="card pad small" data-tour="glossary"><summary class="bold">What these stats mean</summary><dl class="glossary">${columns.map((c) => `<div><dt>${esc(c.label)}:</dt> <dd>${esc(c.help)}</dd></div>`).join("")}</dl></details>`;
}
function scoredGamesFor(scored) {
  return new Map(W.teams.map((t) => [t.id, scored.filter((g) => g.teamIds.includes(t.id)).length]));
}

function advancedView(view, scored, r) {
  const adv = HLL.advancedFromGames(scored);
  const games = scoredGamesFor(scored);
  if (view === "abat") {
    const cols = HLL.ADV_BAT;
    return `<p class="small muted">Stats from every pitch. Percentages rank players with at least ${HLL.QUAL_PA} plate appearances per game their team has played; counting stats show everyone. Hover a column name, or open the list below.</p>
      ${advTable(adv.bat, cols, { sort: r.q.sort || "QABP", dir: r.q.dir, qualifies: (x) => x.PA >= HLL.minPa(HLL.gamesFor(games, x.team_id)) })}${glossary(cols)}`;
  }
  const cols = HLL.advPitColumns(HLL.fipConstant(adv.pit));
  return `<p class="small muted">Pitch by pitch. Percentages rank pitchers on pace for ${HLL.QUAL_IP} innings over a ${HLL.SEASON_GAMES}-game season; counting stats show everyone.</p>
    ${advTable(adv.pit, cols, { sort: r.q.sort || "SP", dir: r.q.dir, qualifies: (x) => x.outs >= HLL.minOuts(HLL.gamesFor(games, x.team_id)) })}${glossary(cols)}`;
}

function warView(scored, r) {
  const { lines, league } = HLL.warFromGames(scored);
  return `<p class="small muted" data-tour="war-note">Wins above replacement: how many more wins a player was worth than a bench player would have been, counting hitting, baserunning, fielding and pitching. It's measured against this league, where it takes about ${league.rpw.toFixed(0)} extra runs to win one more game. Over a short season most kids land between −0.5 and +1.5, so small differences don't mean much. Fielding only counts errors, since the site can't measure range.</p>
    ${advTable(lines, HLL.WAR_COLUMNS, { sort: r.q.sort || "WAR", dir: r.q.dir, qualifies: () => true, tour: "war-table" })}${glossary(HLL.WAR_COLUMNS)}`;
}

function fieldingView(season, scored, r) {
  const lines = HLL.fieldingFromGames(scored).map((l) => ({ ...l, POS: Object.entries(l.outsAt).sort((a, b) => b[1] - a[1])[0]?.[0] || "", TC: l.po + l.a + l.e }));
  const cols = [
    { key: "POS", label: "Main pos", help: "Where they played most", get: (x) => null, text: (x) => x.POS },
    { key: "INN", label: "INN", help: "Innings in the field", get: (x) => x.totalOuts, kind: "ip" },
    { key: "PO", label: "PO", help: "Putouts", get: (x) => x.po },
    { key: "A", label: "A", help: "Assists", get: (x) => x.a },
    { key: "E", label: "E", help: "Errors", get: (x) => x.e, asc: true },
    { key: "TC", label: "TC", help: "Total chances", get: (x) => x.TC },
    { key: "FPCT", label: "FLD%", help: "Fielding percentage: (putouts + assists) / chances. Needs 3 chances.", get: (x) => HLL.fieldingPct(x), kind: "rate3", rate: true },
  ];
  const sort = r.q.sort || "INN";
  const col = cols.find((c) => c.key === sort) || cols[1];
  const desc = r.q.dir ? r.q.dir === "desc" : !col.asc;
  const shown = lines.filter((x) => (col.rate ? x.TC >= 3 : true) && col.get(x) != null).sort((a, b) => ((col.get(b) ?? 0) - (col.get(a) ?? 0)) * (desc ? 1 : -1)).slice(0, 25);
  return `<p class="small muted">From games scored on the site: putouts, assists and errors from each play, innings from who was at each position.</p>
    <div class="card scroll-x"><table class="stats"><thead><tr><th>#</th><th>Player</th>${cols.map((c) => (c.text ? `<th>${c.label}</th>` : `<th class="${c === col ? "sorted" : ""}"><a href="${withQuery({ sort: c.key, dir: c === col ? (desc ? "asc" : "desc") : c.asc ? "asc" : "desc" })}">${c.label}</a></th>`)).join("")}</tr></thead><tbody>${shown
      .map((x, i) => `<tr><td class="muted">${i + 1}</td><td><a class="row player-cell" href="#/player/${x.player_id}">${badge(W.teamById[x.team_id])}<b>${esc(nameOf(x.player_id))}</b></a></td>${cols.map((c) => `<td>${c.text ? c.text(x) : HLL.fmtAdv(c.kind, c.get(x))}</td>`).join("")}</tr>`)
      .join("")}</tbody></table></div>`;
}

/* ---------------------------------------------------------------- innings by position */
const FIELD_POS = ["P", "C", "1B", "2B", "3B", "SS", "LF", "CF", "RF"];
function inningsTable(pids, def, { showTeam = false } = {}) {
  const rows = pids
    .map((pid) => ({ pid, byPos: def[pid] || {}, total: Object.values(def[pid] || {}).reduce((a, b) => a + b, 0) }))
    .sort((a, b) => b.total - a.total);
  const max = Math.max(1, ...rows.flatMap((r) => Object.values(r.byPos)));
  return `<div class="card scroll-x" data-tour="innings-table"><table class="innings"><thead><tr><th>Player</th>${FIELD_POS.map((p) => `<th>${p}</th>`).join("")}<th>Total</th></tr></thead><tbody>${rows
    .map(
      (r) => `<tr><td><a class="row player-cell" href="#/player/${r.pid}">${showTeam ? badge(teamOf(r.pid)) : `<span class="tiny muted">#${W.playerById[r.pid]?.jersey ?? ""}</span>`}<b>${esc(nameOf(r.pid))}</b></a></td>${FIELD_POS.map((pos) => {
        const o = r.byPos[pos] || 0;
        return `<td class="inn-cell" style="${o ? `background:rgba(11,37,69,${(0.08 + 0.4 * (o / max)).toFixed(2)})` : ""}">${o ? E.inningsPitched(o) : ""}</td>`;
      }).join("")}<td class="bold">${r.total ? E.inningsPitched(r.total) : "–"}</td></tr>`,
    )
    .join("")}</tbody></table></div>`;
}

function viewInnings(r) {
  const def = W.extrasBy[W.season.id].def;
  const team = W.teamById[r.q.team] ? r.q.team : W.teams[0].id;
  const games = W.games.filter((g) => g.rep && g.status === "final" && (g.home === team || g.away === team)).length;
  return `<a class="link back" href="#/stats?type=fld">‹ Fielding stats</a>
    <div class="page-head"><h1 class="h1">Innings by position</h1><p class="muted">Who played where, and for how long, in games scored on the site. Handy for playing-time rules and pitcher use.</p></div>
    <div class="chips">${W.teams.map((t) => `<a class="chip ${team === t.id ? "on" : ""}" href="#/innings?team=${t.id}">${badge(t)}${esc(t.name)}</a>`).join("")}</div>
    <p class="small muted">${esc(W.teamById[team].name)} · ${games} game${games === 1 ? "" : "s"} · darker cells = more innings · everyone should get at least ${W.rules.minDefensiveOuts / 3} innings in the field</p>
    ${inningsTable(rosterOf(team).map((p) => p.id), def)}`;
}

/* ---------------------------------------------------------------- all-time records */
function recordCard(entries, col, label) {
  const [top, ...rest] = entries;
  const val = (v) => HLL.formatStat(col, v);
  return `<div class="card leader record"><p class="eyebrow">${label}</p>
    ${top ? `<div class="leader-top">${badge(W.teamById[top.teamId], "md")}<div class="grow"><a href="#/player/${top.playerId}"><b class="ellipsis">${esc(nameOf(top.playerId))}</b></a><span class="tiny muted">${esc(W.teamById[top.teamId].name)} · ${esc(top.label)}</span></div><b class="leader-val">${val(top.value)}</b></div>` : '<p class="small muted">No records yet.</p>'}
    ${rest.map((e, i) => `<div class="leader-row"><span class="rank">${i + 2}</span><a class="grow ellipsis" href="#/player/${e.playerId}">${esc(nameOf(e.playerId))} <span class="muted">${esc(W.teamById[e.teamId].abbr)} · ${esc(e.label)}</span></a><b class="num">${val(e.value)}</b></div>`).join("")}</div>`;
}

function viewRecords(r) {
  const view = r.q.view === "career" ? "career" : r.q.view === "team" ? "team" : "season";
  const type = r.q.type === "pit" ? "pit" : "bat";
  const seasons = W.seasons.filter((s) => statsOf(s.id).length);
  const rows = seasons.flatMap((s) => statsOf(s.id));
  const info = new Map(seasons.map((s) => [s.id, { name: s.name, teamGames: W.teamGamesBy[s.id] }]));
  const order = seasons.map((s) => s.id);
  const tabs = [["season", "Single season"], ["career", "Career"], ["team", "Team"]].map(([k, l]) => `<a href="#/records${k === "season" ? "" : "?view=" + k}" class="${view === k ? "on" : ""}">${l}</a>`).join("");
  const typeSeg = view === "team" ? "" : `<div class="seg seg-inline">${[["bat", "Hitting"], ["pit", "Pitching"]].map(([k, l]) => `<a href="${withQuery({ type: k === "bat" ? null : k })}" class="${type === k ? "on" : ""}">${l}</a>`).join("")}</div>`;
  const note = view === "career" ? `Career totals across every season on the site. Rate stats need ${HLL.CAREER_MIN.pa} career plate appearances or ${HLL.CAREER_MIN.outs / 3} innings.` : view === "season" ? `The best single seasons. Rate stats need ${HLL.QUAL_TEXT}.` : "Best team seasons.";
  let body;
  if (view === "team") body = teamRecords(seasons);
  else
    body = `<div class="leaders" data-tour="records">${HLL.RECORD_CATEGORIES[type]
      .map(([key, label]) => {
        const col = HLL.COLUMNS[type].find((c) => c.key === key);
        const entries = view === "career" ? HLL.careerRecords(rows, type, key, order) : HLL.seasonRecords(rows, type, key, info);
        return recordCard(entries, col, label);
      })
      .join("")}</div>`;
  return `<a class="link back" href="#/stats">‹ Stats</a>
    <div class="page-head"><h1 class="h1">All-time records</h1><p class="muted">${seasons.length} season${seasons.length > 1 ? "s" : ""} of stats: ${seasons.map((s) => esc(s.name)).join(", ")}. Every season is kept, so career stats keep adding up.</p></div>
    <div class="tabs-inline" data-tour="records-tabs">${tabs}</div>${typeSeg}<p class="small muted">${note}</p>${body}`;
}

function teamRecords(seasons) {
  const rows = seasons.flatMap((s) => (W.standingsBy[s.id] || []).filter((x) => x.gp).map((x) => ({ ...x, season: s.name })));
  const card = (label, key, fmt, asc = false) => {
    const list = [...rows].sort((a, b) => (asc ? a[key] - b[key] : b[key] - a[key]) || b.diff - a.diff).slice(0, 5);
    const [top, ...rest] = list;
    if (!top) return "";
    return `<div class="card leader record"><p class="eyebrow">${label}</p>
      <div class="leader-top">${badge(top.team, "md")}<div class="grow"><b class="ellipsis">${esc(top.team.name)}</b><span class="tiny muted">${esc(top.season)} · ${top.w}-${top.l}${top.t ? "-" + top.t : ""}</span></div><b class="leader-val">${fmt(top[key])}</b></div>
      ${rest.map((x, i) => `<div class="leader-row"><span class="rank">${i + 2}</span><span class="grow ellipsis">${esc(x.team.name)} <span class="muted">${esc(x.season)}</span></span><b class="num">${fmt(x[key])}</b></div>`).join("")}</div>`;
  };
  const champs = S.champions || [];
  const champ = champion();
  const list = [...(champ ? [{ team: champ, season: W.season.name }] : []), ...champs];
  return `<div class="leaders">${card("Most wins", "w", String)}${card("Best win %", "pct", (v) => HLL.formatPct(v, 1))}${card("Most runs scored", "rf", String)}${card("Fewest runs allowed", "ra", String, true)}${card("Best run differential", "diff", (v) => (v > 0 ? "+" + v : String(v)))}</div>
    ${sectionHead("Champions")}
    <div class="card list">${list.map((c) => `<div class="list-item">${badge(W.teamById[c.team], "md")}<b class="grow">${esc(W.teamById[c.team].name)}</b><span class="muted">${esc(c.season)}</span></div>`).join("") || `<p class="pad small muted">Champions are added here each season.</p>`}</div>`;
}

/* ---------------------------------------------------------------- season recap */
function viewRecap(r) {
  const season = seasonById(r.q.season);
  const rows = W.standingsBy[season.id] || [];
  const champ = season.id === W.season.id ? champion() : (S.champions || []).find((c) => c.season === season.name)?.team;
  const hasWar = statsOf(season.id).some((s) => s.war != null);
  const cats = [["bat", "AVG", "Batting average"], ["bat", "HR", "Home runs"], ["bat", "RBI", "Runs batted in"], ["bat", "OPS", "OPS"], ["pit", "K", "Strikeouts"], ["pit", "ERA", "ERA"], ...(hasWar ? [["bat", "WAR", "WAR"], ["pit", "WAR", "Pitching WAR"]] : [])];
  const fz = (S.fantasy?.leagues || []).filter((L) => L.season === season.id && L.rows?.length);
  return `<div class="page-head"><p class="eyebrow">Season recap</p><h1 class="h1">${esc(season.name)}</h1><p class="muted">Champions, final standings, the best players and fantasy winners.</p></div>
    ${seasonPicker(season.id)}

/* ---------------------------------------------------------------- CSV downloads (same columns as the site's) */
function csvText(header, rows) {
  const cell = (v) => {
    const s = v == null ? "" : String(v);
    const safe = /^[=+\-@]/.test(s) && !/^-?\d/.test(s) ? `'${s}` : s;
    return /[",\n\r]/.test(safe) ? `"${safe.replace(/"/g, '""')}"` : safe;
  };
  return [header, ...rows].map((r) => r.map(cell).join(",")).join("\r\n") + "\r\n";
}

  const rate = (v, d = 3) => (v == null ? "" : v.toFixed(d));

      stats.filter((s) => (s.pa ?? 0) > 0).map((s) => [nameOf(s.player_id), jersey(s.player_id), tname(s.team_id), s.g, s.pa, s.ab, s.r, s.h, s.doubles, s.triples, s.hr, s.rbi, s.bb, s.so, s.hbp, s.tb, rate(HLL.avg(s)), rate(HLL.obp(s)), rate(HLL.slg(s)), rate(HLL.ops(s)), rate(s.war ?? null, 1), ...qual(s.pa ?? 0, HLL.minPa(games.get(s.team_id) ?? 0), (n) => n)]),
    );
  else if (file === "pitching")
    text = csvText(
      ["Player", "Jersey", "Team", "G", "IP", "W", "L", "SV", "HLD", "H", "R", "ER", "BB", "K", "Pitches", "ERA", "WHIP", "Pitching WAR", "Qualified", "IP needed", "IP short"],
      stats.filter((s) => (s.outs ?? 0) > 0).map((s) => [nameOf(s.player_id), jersey(s.player_id), tname(s.team_id), s.p_g, HLL.fmtIp(s.outs), s.w, s.l, s.sv, s.hld, s.p_h, s.p_r, s.er, s.p_bb, s.p_so, s.pitches, rate(HLL.era(s), 2), rate(HLL.whip(s), 2), rate(s.pit_war ?? null, 1), ...qual(s.outs ?? 0, HLL.minOuts(games.get(s.team_id) ?? 0), HLL.fmtIp)]),
    );
  else if (file === "fielding")
    text = csvText(["Player", "Jersey", "Team", "G", "Innings", "PO", "A", "E", "FPCT", ...FIELD_POS.map((p) => `Inn ${p}`)], HLL.fieldingFromGames(W.scoredBy[season.id] || []).map((l) => [nameOf(l.player_id), jersey(l.player_id), tname(l.team_id), l.g, HLL.fmtIp(l.totalOuts), l.po, l.a, l.e, rate(HLL.fieldingPct(l)), ...FIELD_POS.map((p) => (l.outsAt[p] ? HLL.fmtIp(l.outsAt[p]) : ""))]));
  else if (file === "standings") text = csvText(["Place", "Team", "GP", "W", "L", "T", "PCT", "GB", "RF", "RA", "Diff", "Streak"], (W.standingsBy[season.id] || []).map((r, i) => [i + 1, r.team.name, r.gp, r.w, r.l, r.t, r.pct.toFixed(3), r.gb, r.rf, r.ra, r.diff, r.streak]));

  else text = csvText(["Team", "Jersey", "Player", "League age", "Positions"], W.players.map((p) => [tname(p.team), p.jersey, p.name, p.age, (p.pos || []).join(" ")]));

/** The game as this phone sees it: saved plays plus any still waiting for a signal. */
function localGame(g) {
  const pend = S.pending[g.id] || [];
  if (!pend.length || !g.setup) return g;
  const events = [...(g.events || []), ...pend];
  const rep = E.replay({ setup: g.setup, events }, W.rules, W.names);
  return { ...g, events, rep, score: [...rep.score], status: rep.status === "final" ? "final" : "live" };
}

function offlineBar(g) {
  const n = (S.pending[g.id] || []).length;
  return `<div class="card pad row offline-bar ${S.offline ? "off" : ""}" data-tour="sk-offline"><div class="grow"><b>${S.offline ? "No signal" : "Online"}</b><div class="small muted">${S.offline ? `Keep scoring. ${n} play${n === 1 ? "" : "s"} saved on this phone will send as soon as there's a signal.` : "Every entry is saved right away."}</div></div>
    <label class="switch-inline small"><input type="checkbox" data-change="offline" ${S.offline ? "checked" : ""}> Demo: pretend there's no signal</label></div>`;
}

function eventLabel(ev) {
  switch (ev.t) {
    case "pitch": return ev.d3 ? "Dropped third strike" : { B: "Ball", CS: "Strike looking", SS: "Strike swinging", F: "Foul", FT: "Foul tip", FB: "Foul bunt" }[ev.r];
    case "hbp": return "Hit by pitch";
    case "ibb": return "Intentional walk";
    case "ci": return "Catcher's interference";
    case "bout": return "Batter out";
    case "cr": return "Courtesy runner";
    case "remove": return "Player left the game";
    case "order": return "Batting order fix";
    case "note": return "Note";
    case "play": return E.RESULTS[ev.r].label;
    case "runner": return RUNNER_KINDS[ev.k];
    case "sub": return "Substitution";
    case "pos": return "Position change";
    case "end": return "End game";
  }
  return "";
}

/** The lineup a game will start with: whatever the scorekeeper set, or the suggested one. */
function draftSetup(g) {
  return S.lineups[g.id] || E.setupFor(g, playersForGame(g));
}
const cloneSetup = (x) => JSON.parse(JSON.stringify(x));

function pregame(g) {
  const setup = draftSetup(g);
  const absent = setup.absent || [[], []];
  const side = (t) => {
    const team = W.teamById[t ? g.home : g.away];
    const everyone = [...setup.lineups[t].map((x) => x.pid), ...setup.bench[t]];
    const roster = playersForGame(g).filter((p) => p.team === team.id).sort((a, b) => a.jersey - b.jersey);
    const tourAttr = t === 0 ? 'data-tour="absent"' : "";
    return `<section class="card lineup-card">
      <div class="pad row">${badge(team, "md")}<b class="grow">${esc(team.name)}</b><span class="small muted">${t ? "Home" : "Away"}</span></div>
      <div class="pad stack-s" ${tourAttr}><p class="eyebrow">Who's here? Tap to mark not here</p><div class="chips">${roster
        .map((p) => `<button class="chip ${absent[t].includes(p.id) ? "off" : "on"}" data-act="lu-absent" data-g="${g.id}" data-t="${t}" data-pid="${p.id}">${absent[t].includes(p.id) ? "✕ " : ""}${esc(p.first)}</button>`)
        .join("")}</div>${absent[t].length ? `<p class="tiny muted">Not here: ${absent[t].map((x) => esc(nameOf(x))).join(", ")}. They're left out of the lineup, can't be subbed in, and don't get a game played.</p>` : ""}</div>
      <div class="list">${setup.lineups[t]
        .map(
          (x, i) => `<div class="list-item lineup-row"><span class="rank">${i + 1}</span>
          <select class="input lu-player" aria-label="Batter ${i + 1}" data-change="lu-player" data-g="${g.id}" data-t="${t}" data-i="${i}">${everyone
            .map((pid) => `<option value="${pid}" ${pid === x.pid ? "selected" : ""}>${esc(nameOf(pid))}${setup.bench[t].includes(pid) ? " (bench)" : ""}</option>`)
            .join("")}</select>
          <select class="input lu-pos" aria-label="Position" data-change="lu-pos" data-g="${g.id}" data-t="${t}" data-i="${i}">${E.POS.map((pos) => `<option ${pos === x.pos ? "selected" : ""}>${pos}</option>`).join("")}</select>
          <span class="lu-move"><button class="btn btn-sm btn-secondary" data-act="lu-move" data-g="${g.id}" data-t="${t}" data-i="${i}" data-d="-1" ${i ? "" : "disabled"} aria-label="Move up">↑</button><button class="btn btn-sm btn-secondary" data-act="lu-move" data-g="${g.id}" data-t="${t}" data-i="${i}" data-d="1" ${i < setup.lineups[t].length - 1 ? "" : "disabled"} aria-label="Move down">↓</button></span></div>`,
        )
        .join("")}
      <div class="list-item small"><span class="muted">Bench:</span> <span class="grow">${setup.bench[t].map((pid) => esc(nameOf(pid))).join(", ") || "none"}</span></div></div></section>`;
  };
  return `${scoreboard(g)}
    <div class="stack-s" data-tour="lineup-editor">
      ${sectionHead("Starting lineups", `<button class="link" data-act="lu-reset" data-g="${g.id}">Reset to suggested</button>`)}
      <p class="small muted">First mark anyone who isn't at the game. Then set the batting order and positions: choose a player in any spot to swap them (bench players too), pick a position to swap positions, or use the arrows. Substitutions can also be made during the game.</p>
      <div class="cols">${side(0)}${side(1)}</div>
    </div>
    <button class="btn btn-green btn-block" data-act="sk-start" data-id="${g.id}">Start game</button>`;
}

function editLineup(el, fn) {
  const g = W.gameById[el.dataset.g];
  const setup = cloneSetup(draftSetup(g));
  fn(setup, Number(el.dataset.t), Number(el.dataset.i));
  S.lineups[g.id] = setup;
  save();
  render();
}
CHANGE["lu-player"] = (el) =>
  editLineup(el, (setup, t, i) => {
    const pid = el.value;
    const slot = setup.lineups[t][i];
    const j = setup.lineups[t].findIndex((x) => x.pid === pid);
    if (j >= 0) [setup.lineups[t][j].pid, slot.pid] = [slot.pid, pid];
    else {
      setup.bench[t] = setup.bench[t].map((b) => (b === pid ? slot.pid : b));
      slot.pid = pid;
    }
  });
CHANGE["lu-pos"] = (el) =>
  editLineup(el, (setup, t, i) => {
    const slot = setup.lineups[t][i];
    const other = setup.lineups[t].find((x) => x.pos === el.value);
    if (other) other.pos = slot.pos;
    slot.pos = el.value;
  });
ACT["lu-move"] = (el) =>
  editLineup(el, (setup, t, i) => {
    const j = i + Number(el.dataset.d);
    const l = setup.lineups[t];
    if (j < 0 || j >= l.length) return;
    [l[i], l[j]] = [l[j], l[i]];
  });
ACT["lu-absent"] = (el) => {
  const g = W.gameById[el.dataset.g];
  const t = Number(el.dataset.t);
  const pid = el.dataset.pid;
  const cur = draftSetup(g).absent || [[], []];
  const absent = [[...cur[0]], [...cur[1]]];
  absent[t] = absent[t].includes(pid) ? absent[t].filter((x) => x !== pid) : [...absent[t], pid];
  const players = playersForGame(g);
  if (players.filter((p) => p.team === (t ? g.home : g.away) && !absent[t].includes(p.id)).length < 8) return toast("A team needs at least 8 players.");
  S.lineups[g.id] = E.setupFor(g, players, absent);
  save();
  render();
};
ACT["lu-reset"] = (el) => {
  delete S.lineups[el.dataset.g];
  save();
  render();
};

const currentGame = () => {
  const g = W.gameById[parseRoute().parts[1]];
  return g ? localGame(g) : g;
};

function pushEvent(ev, msg) {
  const g = currentGame();
  if (!g) return;
  if (S.offline) {
    S.pending[g.id] = [...(S.pending[g.id] || []), ev];
    save();
    closeSheet();
    SK = null;
    render();
    toast("Saved on this phone. It will send when there's a signal.");
    return;
  }
  const wasFinal = g.status === "final";
  g.events = [...g.events, ev];
  const rep = E.replay({ setup: g.setup, events: g.events }, W.rules, W.names);
  const status = rep.status === "final" ? "final" : "live";
  saveGame(g, { events: g.events, status });
  if (status === "final" && g.type === "playoff") {
    advancePlayoffs();
    save();
    build();
  }
  closeSheet();
  SK = null;
  render();
  if (!wasFinal && status === "final") toast(g.type === "playoff" ? "Final. The bracket has been updated." : "Final. Standings and stats have been updated.");
  else if (msg) toast(msg);
}

/** Sends plays saved while there was no signal (the site retries every few seconds). */
function flushPending() {
  let sent = 0;
  for (const [gid, evs] of Object.entries(S.pending)) {
    const g = W.gameById[gid];
    if (!g || !evs.length) continue;
    const events = [...(g.events || []), ...evs];
    const rep = E.replay({ setup: g.setup, events }, W.rules, W.names);
    S.games[gid] = { setup: g.setup, events, status: rep.status === "final" ? "final" : "live", manual: null };
    sent += evs.length;
  }
  S.pending = {};
  save();
  build();
  return sent;
}
CHANGE["offline"] = (el) => {
  S.offline = el.checked;
  if (!S.offline) {
    const n = flushPending();
    render();
    toast(n ? `Back online. Sent ${n} saved play${n === 1 ? "" : "s"}.` : "Back online.");
    return;
  }
  save();
  render();
  toast("No signal. Keep scoring; plays are saved on this phone.");
};
ACT["sk-start"] = (el) => {
  const g = W.gameById[el.dataset.id];
  saveGame(g, { setup: draftSetup(g), events: [], status: "live" });
  render();
  toast("Game started.");
};
ACT["sk-pitch"] = (el) => pushEvent({ t: "pitch", r: el.dataset.r });
ACT["sk-hbp"] = () => pushEvent({ t: "hbp" });
ACT["sk-undo"] = (el) => {
  const g = W.gameById[el.dataset.id];
  if (g && S.pending[g.id]?.length) {
    S.pending[g.id] = S.pending[g.id].slice(0, -1);
    save();
    render();
    return toast("Undid the last saved play.");
  }
  if (!g || !g.events.length) return;
  const last = g.events[g.events.length - 1];
  const events = g.events.slice(0, -1);
  const rep = E.replay({ setup: g.setup, events }, W.rules, W.names);
  saveGame(g, { events, status: rep.status === "final" ? "final" : "live" });
  if (g.type === "playoff") {
    advancePlayoffs();
    save();
    build();
  }
  render();
  toast(`Undid: ${eventLabel(last)}`);
};

function guessFielders(result, loc) {
  const first = E.nearestFielder(...loc);
  if (result === "GO" || result === "BO" || result === "SAC") return first === 3 ? [3] : [first, 3];
  if (result === "DP") return [first, first === 4 ? 6 : 4, 3];
  if (result === "TP") return first === 5 ? [5, 4, 3] : [first, first === 4 ? 6 : 4, 3];
  if (result === "FC") return [first, first === 6 || first === 5 ? 4 : 6];
  return [first];
}
ACT["sk-result"] = (el) => {

function runnerDefault(s, k) {
  const occ = [3, 2, 1].filter((b) => s.bases[b - 1]);
  const m = {};
  occ.forEach((b) => (m[b] = b));
  if (k === "WP" || k === "PB" || k === "BK") occ.forEach((b) => (m[b] = Math.min(4, b + 1)));
  else if (["CS", "PK", "APP", "LE", "INT"].includes(k)) m[occ[0]] = "X";
  else {
    const lead = occ.find((b) => b === 3 || !s.bases[b]);
    if (lead) m[lead] = lead + 1;
  }
  return m;
}

  D3 = { r: "SS", reach: "WP", fielders: [2], moves: { B: 1 } };
  openSheet(d3Sheet);
};
function d3Sheet() {
  const s = currentGame().rep;
  const allowed = !s.bases[0] || s.outs === 2;
  const out = D3.reach === "out";
  const moves = out ? { ...D3.moves, B: "X" } : { B: 1, ...D3.moves };
  const problem = allowed ? HLL.movesProblem(s.bases, s.outs, moves, true) : null;
  const rows = [];
  [3, 2, 1].forEach((b) => s.bases[b - 1] && rows.push([b, s.bases[b - 1].pid]));
  if (!out) rows.push(["B", s.batter]);
  const dests = [[1, "1st"], [2, "2nd"], [3, "3rd"], [4, "Home"], ["X", "Out"]];
  return `<h2 class="h2">Dropped third strike</h2>
    ${allowed ? "" : '<p class="notice warn" style="margin:8px 0">With a runner on first and fewer than two outs, the batter is out on strike three even if it isn\'t caught. Use the strike buttons instead.</p>'}
    <p class="small bold muted" style="margin-top:10px">STRIKE THREE WAS</p><div class="res-grid" style="margin-top:6px">${[["CS", "Looking"], ["SS", "Swinging"], ["FT", "Foul tip"], ["FB", "Foul bunt"]].map(([k, l]) => `<button class="${D3.r === k ? "hit" : ""}" data-act="d3-set" data-k="r" data-v="${k}">${l}</button>`).join("")}</div>
    <p class="small bold muted" style="margin-top:12px">WHAT HAPPENED</p><div class="res-grid" style="margin-top:6px">${[["WP", "Wild pitch"], ["PB", "Passed ball"], ["E", "Error"], ["FC", "Fielder's choice"], ["out", "Thrown out"]].map(([k, l]) => `<button class="${D3.reach === k ? "hit" : ""}" data-act="d3-set" data-k="reach" data-v="${k}">${l}</button>`).join("")}</div>
    ${D3.reach === "E" || out ? `<p class="small bold muted" style="margin-top:12px">${out ? "FIELDERS, IN ORDER (2 THEN 3 FOR 2-3)" : "ERROR BY"}</p><div class="chips" style="margin-top:6px">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map((n) => `<button class="chip ${D3.fielders.includes(n) ? "on" : ""}" data-act="d3-f" data-n="${n}">${E.posOf(n)}</button>`).join("")}<button class="chip" data-act="d3-fclear">Clear</button></div>` : ""}
    <div class="card pad" style="margin-top:12px;padding-top:4px;padding-bottom:4px">${rows
      .map(([from, pid]) => {
        const cur = moves[from] ?? (from === "B" ? 1 : from);
        const min = from === "B" ? 1 : from;
        return `<div class="runner-row"><div class="row between"><b>${esc(nameOf(pid))}</b><span class="small muted">${from === "B" ? "Batter" : `On ${["", "1st", "2nd", "3rd"][from]}`}</span></div><div class="dest">${dests.map(([d, l]) => `<button data-act="d3-move" data-from="${from}" data-to="${d}" class="${cur === d ? "on" : ""} ${d === "X" ? "out" : d === 4 ? "home" : ""}" ${d !== "X" && d < min ? "disabled" : ""}>${l}</button>`).join("")}</div></div>`;
      })
      .join("")}</div>
    ${problem ? `<p class="notice bad" style="margin-top:10px">${esc(problem)}</p>` : ""}
    <p class="tiny muted" style="margin-top:8px">It's a strikeout for the batter and the pitcher either way${out ? "" : ", but not an out, so a pitcher can strike out four in an inning"}.</p>
    <div class="row" style="margin-top:12px"><button class="btn btn-secondary" data-act="sk-more">Back</button><button class="btn btn-green grow" data-act="d3-save" ${!allowed || problem ? "disabled" : ""}>Save</button></div>`;
}
ACT["d3-set"] = (el) => {
  D3[el.dataset.k] = el.dataset.v;
  if (el.dataset.k === "reach") D3.fielders = el.dataset.v === "out" ? [2, 3] : [2];
  paintSheet();
};
ACT["d3-f"] = (el) => {
  const n = Number(el.dataset.n);
  D3.fielders = D3.reach === "out" ? [...D3.fielders, n] : [n];
  paintSheet();
};
ACT["d3-fclear"] = () => {
  D3.fielders = [];
  paintSheet();
};
ACT["d3-move"] = (el) => {
  const from = el.dataset.from === "B" ? "B" : Number(el.dataset.from);
  D3.moves = { ...D3.moves, [from]: el.dataset.to === "X" ? "X" : Number(el.dataset.to) };
  paintSheet();
};
ACT["d3-save"] = () => {
  const out = D3.reach === "out";
  const m = out ? { ...D3.moves, B: "X" } : { B: 1, ...D3.moves };
  pushEvent({ t: "pitch", r: D3.r, d3: { reach: D3.reach, f: D3.fielders.join("-") || undefined, m } }, "Strikeout recorded.");
};

let CR = null;
ACT["sk-cr"] = () => {

  openSheet(() => {
    const s = currentGame().rep;

    const occ = [1, 2, 3].filter((b) => s.bases[b - 1]);

    return `<h2 class="h2">Pinch or courtesy runner</h2><div class="chips" style="margin:10px 0">${occ.map((b) => `<button class="chip ${CR.base === b ? "on" : ""}" data-act="cr-base" data-b="${b}">${esc(nameOf(s.bases[b - 1].pid))} on ${["", "1st", "2nd", "3rd"][b]}</button>`).join("")}</div>
      ${runner ? `<p class="small bold muted">PINCH RUNNER (A SUBSTITUTION)</p><div class="chips" style="margin:6px 0 12px">${s.bench[t].map((pid) => `<button class="chip" data-act="cr-pinch" data-pid="${pid}" data-slot="${slot}">${esc(nameOf(pid))}</button>`).join("") || '<span class="small muted">Nobody on the bench.</span>'}</div>
        <p class="small bold muted">COURTESY RUNNER (${esc(nameOf(runner.pid))} STAYS IN THE GAME)</p><div class="chips" style="margin-top:6px">${[...s.bench[t], ...others].map((pid) => `<button class="chip" data-act="cr-go" data-pid="${pid}">${esc(nameOf(pid))}</button>`).join("")}</div><p class="tiny muted" style="margin-top:6px">Usually for the pitcher or catcher, so they can get ready for the next inning.</p>` : '<p class="small muted">Pick the runner first.</p>'}
      <button class="btn btn-secondary btn-block" style="margin-top:12px" data-act="sk-more">Back</button>`;

};
ACT["cr-base"] = (el) => {

ACT["cr-pinch"] = (el) => pushEvent({ t: "sub", team: currentGame().rep.half, slot: Number(el.dataset.slot), pid: el.dataset.pid }, "Pinch runner in.");
ACT["cr-go"] = (el) => pushEvent({ t: "cr", base: CR.base, pid: el.dataset.pid }, "Courtesy runner in.");

let RM = null;

ACT["sk-order"] = () =>

// ---- app-fantasy.js
/* ---------------------------------------------------------------- fantasy: the site's rules
 * Points leagues, snake drafts, 9 starters + bench, lineups lock weekly (Monday 12:00 am),
 * free agents, trades, an activity log, and bringing a league back next season with keepers.
 * Points come from HLL.scoreLeague, the same code the site runs.
 */
const OWNERS = ["Dan Russo", "Mike Chen", "Laura Patel", "Chris Walsh", "Jen Morales", "Tony Kim", "Sam Keane", "Rachel Diaz", "Nick Ortiz", "Beth Hale", "Paul Grant"];
const TEAM_NAMES = ["Mile Square Mashers", "Sinatra Sluggers", "Washington St. Wallops", "Path Train Pitchers", "Castle Point Crushers", "Elysian Fielders", "Hudson River Hackers", "Stevens Stealers", "Pier C Popups", "Church Square Chuckers", "Waterfront Whiffers"];
const defaultScoring = () => JSON.parse(JSON.stringify(HLL.DEFAULT_SCORING));
const iso = (t) => new Date(t).toISOString();

function newLeague({ id, name, season, size, myIndex, isPublic, code = null, seed, myTeam, commissioner }) {
  const teams = [];
  for (let i = 0, k = 0; teams.length < size - 1; i++, k++) {
    const nm = TEAM_NAMES[(i + seed) % TEAM_NAMES.length];
    if (nm === myTeam || teams.some((t) => t.name === nm)) continue;
    teams.push({ id: `${id}-t${teams.length + 1}`, name: nm, owner: OWNERS[(k + seed) % OWNERS.length] });
  }
  teams.splice(myIndex, 0, { id: `${id}-me`, name: myTeam, owner: S.account.name, mine: true });
  return { id, name, season, size, public: isPublic, code, seed, teams, commissioner: commissioner || S.account.name, scoring: defaultScoring(), keepers: 0, draft: { status: "pre", order: teams.map((t) => t.id), picks: [], doneAt: null }, rows: [], trades: [], log: [] };
}

/* ---- points */
const lastSeason = (L) => (L.season === NEXT.id ? PAST.id : null);
/** Points so far this season, game by game (the same way team points are counted). */
function seasonPoints(L) {
  // Spring 2026's season came from spreadsheets (only its playoffs were scored on the site), so use its season totals.
  const scored = L.season === PAST.id ? [] : W.scoredBy[L.season] || [];
  if (!scored.length) return new Map(statsOf(L.season).map((s) => [s.player_id, { bat: HLL.points(HLL.fromImportedBat(s), L.scoring.bat), pit: HLL.points(HLL.fromImportedPit(s), L.scoring.pit) }]));
  const out = new Map();
  for (const g of scored) {
    for (const [pid, b] of Object.entries(g.state.bat)) {
      const x = out.get(pid) || { bat: 0, pit: 0 };
      x.bat += HLL.points(HLL.fromBatLine(b), L.scoring.bat);
      out.set(pid, x);
    }
    for (const [pid, q] of Object.entries(g.state.pit)) {
      const x = out.get(pid) || { bat: 0, pit: 0 };
      x.pit += HLL.points(HLL.fromPitLine(q), L.scoring.pit);
      out.set(pid, x);
    }
  }
  return out;
}
function projections(L) {
  const now = seasonPoints(L);
  const last = new Map((lastSeason(L) ? statsOf(lastSeason(L)) : []).map((s) => [s.player_id, { bat: HLL.points(HLL.fromImportedBat(s), L.scoring.bat), pit: HLL.points(HLL.fromImportedPit(s), L.scoring.pit) }]));
  const zero = { bat: 0, pit: 0 };
  const out = new Map();
  for (const p of fantasyPool(L)) {
    const r = { now: now.get(p.id) || zero, last: last.get(p.id) || zero };
    out.set(p.id, { proj: HLL.projectionOf(r), value: HLL.rankValue(r), now: r.now, last: r.last });
  }
  return out;
}
/** Everyone on a team this season. */
const fantasyPool = (L) => W.allPlayers.filter((p) => W.rosterBy[L.season]?.has(p.id));
function leagueScores(L) {
  if (L.season === PAST.id) {
    // Spring 2026 was before the site: season totals from the spreadsheets for each final starter.
    const pts = new Map(statsOf(PAST.id).map((s) => [s.player_id, HLL.points(HLL.fromImportedBat(s), L.scoring.bat) + HLL.points(HLL.fromImportedPit(s), L.scoring.pit)]));
    return new Map(L.teams.map((t) => {
      const players = new Map();
      let total = 0;
      for (const r of L.rows.filter((r) => r.team_id === t.id && r.end_at == null && r.slot_index < HLL.STARTERS)) {
        const v = pts.get(r.player_id) || 0;
        players.set(r.player_id, { playerId: r.player_id, points: v, games: 0 });
        total += v;
      }
      return [t.id, { teamId: t.id, total, players, byWeek: new Map() }];
    }));
  }
  return HLL.scoreLeague(L.teams.map((t) => t.id), L.rows, W.scoredBy[L.season] || [], L.scoring, L.draft.doneAt ? Date.parse(L.draft.doneAt) : null);
}
function fantasyStandings(L) {
  const sc = leagueScores(L);
  return L.teams.map((team) => ({ team, total: sc.get(team.id)?.total || 0, score: sc.get(team.id) })).sort((a, b) => b.total - a.total);
}

/* ---- rosters over time */
const slotsOf = (L) => HLL.slotsFor(L.size);
const rosterNow = (L, teamId) => L.rows.filter((r) => r.team_id === teamId && r.end_at == null).sort((a, b) => a.slot_index - b.slot_index);
const ownerOf = (L, pid) => L.rows.find((r) => r.player_id === pid && r.end_at == null)?.team_id || null;
const teamById = (L, id) => L.teams.find((t) => t.id === id);
const myTeam = (L) => L.teams.find((t) => t.mine);
function setRow(L, teamId, pid, slot, at) {
  L.rows.push({ team_id: teamId, player_id: pid, slot_index: slot, start_at: iso(at), end_at: null });
}
function endRow(L, pid, at) {
  const row = L.rows.find((r) => r.player_id === pid && r.end_at == null);
  if (row) row.end_at = iso(at);
  return row;
}
function logMove(L, at, text) {
  L.log.unshift({ at: iso(at), text });
}
const seasonOver = (L) => (L.season === W.season.id ? W.games.length > 0 && W.games.every((g) => g.status === "final" || g.status === "canceled") && !!champion() : true);

/* ---- draft */
const totalPicks = (L) => L.size * slotsOf(L).length;
/** Lowest pick number nobody has used (keepers already hold theirs). */
function nextPick(L) {
  const used = new Set(L.draft.picks.map((p) => p.n));
  const max = Math.min(totalPicks(L), fantasyPool(L).length);
  for (let n = 0; n < totalPicks(L); n++) if (!used.has(n)) return L.draft.picks.length >= max ? null : n;
  return null;
}
const teamOnClock = (L) => {
  const n = nextPick(L);
  return n == null ? null : L.draft.order[ownerIndex(L, n)];
};
function filledFor(L, teamId) {
  const filled = slotsOf(L).map(() => false);
  for (const p of L.draft.picks.filter((x) => x.team === teamId)) filled[p.slot] = true;
  return filled;
}
function makePick(L, pid, at = Date.now()) {
  const n = nextPick(L);
  const team = L.draft.order[ownerIndex(L, n)];
  const slot = HLL.openSlot(filledFor(L, team), slotsOf(L));
  L.draft.picks.push({ n, team, pid, slot, at: iso(at) });
  L.draft.clockFor = null;
  if (nextPick(L) == null) finishDraft(L, at);
}
function cpuPicks(L, { me = false, at = Date.now() } = {}) {
  const proj = projections(L);
  const projMap = new Map([...proj].map(([id, v]) => [id, v.proj]));
  for (let guard = 0; guard < 500 && L.draft.status === "drafting"; guard++) {
    const team = teamOnClock(L);
    if (team == null) break;
    if (!me && teamById(L, team).mine) break;
    const taken = new Set(L.draft.picks.map((p) => p.pid));
    const avail = fantasyPool(L).filter((p) => !taken.has(p.id));
    const pick = HLL.autopick(avail, filledFor(L, team), slotsOf(L), projMap);
    if (!pick) break;
    makePick(L, pick.id, at);
  }
}
function finishDraft(L, at) {
  L.draft.status = "done";
  L.draft.doneAt = iso(at);
  L.rows = L.draft.picks.map((p) => ({ team_id: p.team, player_id: p.pid, slot_index: p.slot, start_at: iso(at), end_at: null }));
  logMove(L, at, "The draft is done. Set your lineup any time before your players' games start.");
}
function startDraft(L, at = Date.now()) {
  L.draft.status = "drafting";
  // Keepers go in each team's last rounds.
  const slots = slotsOf(L).length;
  for (const [teamId, pids] of Object.entries(L.keeperPicks || {}))
    pids.forEach((pid, k) => {
      const round = slots - pids.length + k;
      const pos = L.draft.order.indexOf(teamId);
      let n = round * L.size;
      while (ownerIndex(L, n) !== pos) n++;
      L.draft.picks.push({ n, team: teamId, pid, slot: -1, keeper: true });
    });
  // Keepers take the last open spots on the roster.
  for (const teamId of L.draft.order) {
    const mine = L.draft.picks.filter((p) => p.team === teamId && p.keeper);
    mine.forEach((p, i) => (p.slot = slots - mine.length + i));
  }
  logMove(L, at, "The draft started.");
}

/* ---- the leagues the demo starts with */
function initialFantasy() {
  const t0 = NOW - 70 * DAY;
  // Hoboken Sluggers: drafted before the season, a few weeks of moves.
  const L1 = newLeague({ id: "L1", name: "Hoboken Sluggers", season: PAST.id, size: 8, myIndex: 3, isPublic: true, seed: 3, myTeam: "Burks Bombers", commissioner: "Dan Russo" });
  L1.draft.order = L1.teams.map((t) => t.id);
  L1.draft.status = "drafting";
  cpuPicks(L1, { me: true, at: t0 });
  seedMoves(L1);
  // Coaches' Pool: you're the commissioner and the draft hasn't started.
  const L2 = newLeague({ id: "L2", name: "Coaches' Pool", season: PAST.id, size: 6, myIndex: 2, isPublic: false, code: "COACH6", seed: 5, myTeam: "Hoboken Heat" });
  return { leagues: [L1, L2], open: [{ id: "O1", name: "Weekend Warriors", size: 8, filled: 5 }, { id: "O2", name: "Bleacher Parents", size: 6, filled: 3 }] };
}

/** A few weeks of moves in Hoboken Sluggers, so the activity log, history and a pending trade have something to show. */
function seedMoves(L) {
  const wk = (n, days) => (W.weeks[n] ? W.weeks[n].start + days * DAY : NOW - (5 - n) * 7 * DAY);
  const me = myTeam(L).id;
  const other = L.teams[1].id;
  const proj = projections(L);
  const val = (pid) => proj.get(pid)?.value || 0;
  // Week 2: a free-agent pickup.
  const free = fantasyPool(L).filter((p) => !ownerOf(L, p.id)).sort((a, b) => val(b.id) - val(a.id));
  const t2 = L.teams[4].id;
  const worst = rosterNow(L, t2).filter((r) => r.slot_index >= HLL.STARTERS).sort((a, b) => val(a.player_id) - val(b.player_id))[0];
  if (free[0] && worst && wk(1, 1) < NOW) {
    const at = wk(1, 1);
    endRow(L, worst.player_id, at);
    setRow(L, t2, free[0].id, worst.slot_index, at);
    logMove(L, at, `${teamById(L, t2).name} added ${nameOf(free[0].id)} and dropped ${nameOf(worst.player_id)}.`);
  }
  // Week 3: you moved a bench player into the lineup.
  const mine = rosterNow(L, me);
  const benchBest = mine.filter((r) => r.slot_index >= HLL.STARTERS).sort((a, b) => val(b.player_id) - val(a.player_id))[0];
  const startWorst = mine.filter((r) => r.slot_index < HLL.STARTERS).sort((a, b) => val(a.player_id) - val(b.player_id))[0];
  if (benchBest && startWorst && wk(2, 2) < NOW) swapRows(L, me, benchBest.player_id, startWorst.player_id, wk(2, 2));
  // Week 4: a trade that went through, and one that was declined.
  const a = rosterNow(L, me).find((r) => r.slot_index === 5);
  const b = rosterNow(L, L.teams[5].id).find((r) => r.slot_index === 6);
  if (a && b && wk(3, 1) < NOW) {
    const tr = { id: "T1", from: me, to: L.teams[5].id, give: [a.player_id], get: [b.player_id], status: "accepted", at: iso(wk(3, 1) - 3600000), decidedAt: iso(wk(3, 1)) };
    L.trades.push(tr);
    applyTrade(L, tr, wk(3, 1));
  }
  const c = rosterNow(L, L.teams[6].id)[0];
  const d = rosterNow(L, me).find((r) => r.slot_index === 2);
  if (c && d) L.trades.push({ id: "T2", from: me, to: L.teams[6].id, give: [d.player_id], get: [c.player_id], status: "declined", at: iso(NOW - 9 * DAY), decidedAt: iso(NOW - 8 * DAY) });
  // An offer waiting for you.
  const theirs = rosterNow(L, other).find((r) => r.slot_index === 4);
  const yours = rosterNow(L, me).find((r) => r.slot_index === 1);
  if (theirs && yours) {
    L.trades.push({ id: "T3", from: other, to: me, give: [theirs.player_id], get: [yours.player_id], status: "pending", at: iso(NOW - 20 * 3600000) });
    logMove(L, NOW - 20 * 3600000, `${teamById(L, other).name} offered ${teamById(L, me).name} a trade.`);
  }
}

function swapRows(L, teamId, a, b, at) {
  const ra = endRow(L, a, at);
  const rb = endRow(L, b, at);
  setRow(L, teamId, a, rb.slot_index, at);
  setRow(L, teamId, b, ra.slot_index, at);
  logMove(L, at, `${teamById(L, teamId).name} moved ${nameOf(a)} to ${rb.slot_index < HLL.STARTERS ? "the lineup" : "the bench"} and ${nameOf(b)} to ${ra.slot_index < HLL.STARTERS ? "the lineup" : "the bench"}.`);
}
function applyTrade(L, tr, at) {
  const slotsA = tr.give.map((pid) => endRow(L, pid, at).slot_index);
  const slotsB = tr.get.map((pid) => endRow(L, pid, at).slot_index);
  tr.get.forEach((pid, i) => setRow(L, tr.from, pid, slotsA[i] ?? freeSlot(L, tr.from), at));
  tr.give.forEach((pid, i) => setRow(L, tr.to, pid, slotsB[i] ?? freeSlot(L, tr.to), at));
  logMove(L, at, `Trade: ${teamById(L, tr.from).name} sent ${tr.give.map(nameOf).join(", ")} to ${teamById(L, tr.to).name} for ${tr.get.map(nameOf).join(", ")}.`);
}
function freeSlot(L, teamId) {
  const used = new Set(rosterNow(L, teamId).map((r) => r.slot_index));
  const slots = slotsOf(L);
  const st = slots.findIndex((s, i) => s === "ST" && !used.has(i));
  return st >= 0 ? st : slots.findIndex((_, i) => !used.has(i));
}

/** A player whose team's game today has already started (or finished). */
function lockedToday(L, pid) {
  const team = teamIdOf(pid, L.season);
  const today = todayKey();
  return (W.gamesBy[L.season] || []).some((g) => (g.home === team || g.away === team) && dayKey(g.date) === today && g.status !== "canceled" && (g.status === "live" || g.status === "final" || Date.parse(g.date) <= Date.now()));
}

const leagueById = (id) => S.fantasy.leagues.find((l) => l.id === id);
const isCommish = (L) => L.commissioner === S.account.name;

      <div class="row"><button class="btn btn-primary grow" data-act="f-create">Create a league</button><button class="btn btn-secondary grow" data-act="f-code">Join with code</button></div>
      <button class="btn btn-secondary btn-block" data-act="f-mock" data-tour="fantasy-mock">Practice with a mock draft</button>
